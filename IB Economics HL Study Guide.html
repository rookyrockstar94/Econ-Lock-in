ta","A physical limit on the quantity (or value) of a good that can be imported."],["Quota rent","The extra revenue earned by importers or foreign firms that hold import licences, because they sell the limited imports at the higher domestic price."]],"topic":"t4-2","html":"<div class=\"dslot\" data-d=\"quota\"><\/div>\n<p><strong>Effects<\/strong>: like a tariff, the domestic price rises, domestic production rises, consumption falls and imports fall. But the <strong>government earns no revenue<\/strong> unless it auctions licences; importers or foreign producers gain the <strong>quota rent<\/strong>.<\/p>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Reading a quota diagram<\/div><p>Domestic producers supply up to Q₃ at the new price Pq; the quota fills the gap between Q₃ and Q₄; total consumption is Q₄. Consumer expenditure = Pq × Q₄. Domestic producers' revenue = Pq × Q₃. Foreign/importer revenue = Pq × quota.<\/p><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Advantages<\/h5><ul><li>Certain limit on imports (useful for strategic goods).<\/li><li>Protects domestic jobs.<\/li><\/ul><\/div><div><h5>Disadvantages<\/h5><ul><li>No government revenue; quota rent may go to foreign firms.<\/li><li>Higher prices for consumers; inefficiency.<\/li><li>Can encourage corruption in issuing licences; retaliation.<\/li><\/ul><\/div><\/div><\/div>","text":"Effects : like a tariff, the domestic price rises, domestic production rises, consumption falls and imports fall. But the government earns no revenue unless it auctions licences; importers or foreign producers gain the quota rent . HL only · Reading a quota diagram Domestic producers supply up to Q₃ at the new price Pq; the quota fills the gap between Q₃ and Q₄; total consumption is Q₄. Consumer expenditure = Pq × Q₄. Domestic producers' revenue = Pq × Q₃. Foreign/importer revenue = Pq × quota. Evaluation Advantages Certain limit on imports (useful for strategic goods). Protects domestic jobs. Disadvantages No government revenue; quota rent may go to foreign firms. Higher prices for consumers; inefficiency. Can encourage corruption in issuing licences; retaliation.","dias":["quota"]},{"id":"e-trade-subsidies","title":"Production and export subsidies","hl":false,"terms":[["Production subsidy","A payment by the government to domestic producers per unit produced, lowering their costs so they can compete with imports."],["Export subsidy","A payment by the government to domestic producers per unit exported."],["Dumping","Selling goods abroad at a price below their cost of production (or below the domestic price), often made possible by subsidies."]],"topic":"t4-2","html":"<div class=\"dslot\" data-d=\"prod-subsidy-trade\"><\/div>\n<div class=\"dslot\" data-d=\"export-subsidy\"><\/div>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Production subsidy calculation<\/div><p>EU truffles: world price €40; a €10 subsidy per unit raises domestic supply from 2,000 to 3,500 units while consumers still pay €40 and buy 6,000.<\/p>\n<ul><li>Imports fall from 4,000 to <strong>2,500<\/strong>.<\/li><li>Cost to the government = 10 × 3,500 = <strong>€35,000<\/strong>.<\/li><li>Producer revenue = (40 + 10) × 3,500 = <strong>€175,000<\/strong> (from 80,000 before).<\/li><\/ul><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Advantages<\/h5><ul><li>Consumers still pay the world price.<\/li><li>Protects domestic jobs and strategic or infant industries.<\/li><\/ul><\/div><div><h5>Disadvantages<\/h5><ul><li>Cost to taxpayers; opportunity cost.<\/li><li>Inefficient firms protected; dependency.<\/li><li>Export subsidies distort world markets: US cotton subsidies depressed world prices, harming farmers in West Africa (Benin, Burkina Faso, Mali, Chad); WTO rules restrict them.<\/li><\/ul><\/div><\/div><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Long-lasting, large subsidies can make a country's producers dominant in world markets. Consider the size and duration of the subsidy when evaluating.<\/p><\/div>","text":"HL only · Production subsidy calculation EU truffles: world price €40; a €10 subsidy per unit raises domestic supply from 2,000 to 3,500 units while consumers still pay €40 and buy 6,000. Imports fall from 4,000 to 2,500 . Cost to the government = 10 × 3,500 = €35,000 . Producer revenue = (40 + 10) × 3,500 = €175,000 (from 80,000 before). Evaluation Advantages Consumers still pay the world price. Protects domestic jobs and strategic or infant industries. Disadvantages Cost to taxpayers; opportunity cost. Inefficient firms protected; dependency. Export subsidies distort world markets: US cotton subsidies depressed world prices, harming farmers in West Africa (Benin, Burkina Faso, Mali, Chad); WTO rules restrict them. Exam tip Long-lasting, large subsidies can make a country's producers dominant in world markets. Consider the size and duration of the subsidy when evaluating.","dias":["prod-subsidy-trade","export-subsidy"]},{"id":"e-admin-barriers","title":"Administrative barriers","hl":false,"terms":[["Administrative barriers","Non-tariff barriers created by rules, regulations and bureaucratic procedures that make importing more difficult or costly."]],"topic":"t4-2","html":"<p>Examples: health and safety standards (EU ban on hormone-treated beef), environmental standards, product labelling rules, customs procedures and paperwork, licensing, technical standards, sanitary rules (China's restrictions on Australian wine, beef and barley 2020–23), public procurement favouring domestic firms (\"Buy American\").<\/p>\n<p><strong>Evaluation<\/strong>: some regulations protect consumers and the environment genuinely; others are disguised protectionism. They are hard to challenge at the WTO, add costs, and fall hardest on small exporters from developing countries.<\/p>","text":"Examples: health and safety standards (EU ban on hormone-treated beef), environmental standards, product labelling rules, customs procedures and paperwork, licensing, technical standards, sanitary rules (China's restrictions on Australian wine, beef and barley 2020–23), public procurement favouring domestic firms (\"Buy American\"). Evaluation : some regulations protect consumers and the environment genuinely; others are disguised protectionism. They are hard to challenge at the WTO, add costs, and fall hardest on small exporters from developing countries.","dias":[]}]},{"id":"t4-3","num":"4.3","title":"Arguments for and against trade protection","level":"SL","blurb":"The case for protection (infant industries, jobs, strategic industries, anti-dumping) and the case against.","entries":[{"id":"e-protection-debate","title":"Arguments for and against trade protection","hl":false,"terms":[["Infant industry","A new industry that needs temporary protection until it can achieve economies of scale and compete internationally."],["Anti-dumping duties","Tariffs imposed on imports sold below their cost of production."],["Retaliation","When a country responds to another's trade barriers by imposing its own, possibly leading to a trade war."]],"topic":"t4-3","html":"<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Arguments for protection<\/h5><ul><li><strong>Protect domestic jobs<\/strong> in import-competing industries.<\/li><li><strong>Infant industry<\/strong>: help new industries grow until they reach economies of scale (South Korea's car and steel industries; many developing countries).<\/li><li><strong>Anti-dumping<\/strong>: prevent unfair competition from subsidised imports.<\/li><li><strong>National security / strategic industries<\/strong>: food, energy, defence, semiconductors.<\/li><li><strong>Health, safety and environmental standards<\/strong>.<\/li><li><strong>Raise government revenue<\/strong> (important for low-income countries with weak tax systems).<\/li><li><strong>Correct a balance of payments deficit<\/strong>.<\/li><li><strong>Diversify the economy<\/strong> away from reliance on one export.<\/li><\/ul><\/div><div><h5>Arguments against<\/h5><ul><li><strong>Higher prices<\/strong> and less choice for consumers.<\/li><li><strong>Inefficiency<\/strong>: protected firms lack incentives to cut costs and innovate.<\/li><li><strong>Misallocation of resources<\/strong> away from comparative advantage; welfare losses.<\/li><li><strong>Retaliation<\/strong> and trade wars (US–China), hurting exporters.<\/li><li><strong>Higher costs for firms<\/strong> that use imported inputs; downstream job losses.<\/li><li>Infant industries may <strong>never grow up<\/strong> and lobby for permanent protection.<\/li><li>Harms <strong>developing countries<\/strong> whose exports are blocked.<\/li><li>Loss of <strong>dynamic gains<\/strong> (competition, ideas, technology transfer).<\/li><\/ul><\/div><\/div><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>A strong judgement depends on context: a <strong>temporary<\/strong>, targeted measure for a genuine infant industry or strategic good is easier to justify than a broad tariff to protect a declining industry.<\/p><\/div>","text":"Evaluation Arguments for protection Protect domestic jobs in import-competing industries. Infant industry : help new industries grow until they reach economies of scale (South Korea's car and steel industries; many developing countries). Anti-dumping : prevent unfair competition from subsidised imports. National security / strategic industries : food, energy, defence, semiconductors. Health, safety and environmental standards . Raise government revenue (important for low-income countries with weak tax systems). Correct a balance of payments deficit . Diversify the economy away from reliance on one export. Arguments against Higher prices and less choice for consumers. Inefficiency : protected firms lack incentives to cut costs and innovate. Misallocation of resources away from comparative advantage; welfare losses. Retaliation and trade wars (US–China), hurting exporters. Higher costs for firms that use imported inputs; downstream job losses. Infant industries may never grow up and lobby for permanent protection. Harms developing countries whose exports are blocked. Loss of dynamic gains (competition, ideas, technology transfer). Exam tip A strong judgement depends on context: a temporary , targeted measure for a genuine infant industry or strategic good is easier to justify than a broad tariff to protect a declining industry.","dias":[]}]},{"id":"t4-4","num":"4.4","title":"Economic integration","level":"SL","blurb":"Trade agreements, the WTO, the types of trading bloc, and monetary union.","entries":[{"id":"e-integration","title":"Trade agreements and the WTO","hl":false,"terms":[["Economic integration","The process by which countries reduce trade barriers and coordinate economic policies, deepening their economic links."],["Preferential trade agreement","An agreement giving lower trade barriers to some countries but not others."],["Bilateral trade agreement","A trade agreement between two countries, e.g. the UK–Australia FTA (2023)."],["Multilateral trade agreement","A trade agreement among many countries, e.g. WTO agreements."],["World Trade Organization (WTO)","The international organisation (founded 1995, 166 members) that sets the rules of world trade, negotiates trade liberalisation and settles trade disputes."],["Most favoured nation (MFN) principle","The WTO rule that a country must offer all WTO members the same trade terms it offers its best trading partner."]],"topic":"t4-4","html":"<h4>The WTO<\/h4>\n<ul><li><strong>Functions<\/strong>: administer trade agreements; forum for negotiations (rounds: Uruguay Round 1986–94; Doha Round 2001–, stalled); settle disputes; monitor trade policies; help developing countries build trade capacity.<\/li><li><strong>Principles<\/strong>: non-discrimination (MFN and national treatment), freer trade, predictability, fair competition.<\/li><li><strong>Limitations<\/strong>: the Appellate Body has been paralysed since 2019 because the USA blocked appointments; decisions need consensus; large economies can ignore rulings; developing countries argue rules favour the rich (agricultural subsidies remain); slow negotiations, so countries turn to regional deals.<\/li><\/ul>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>WTO rulings let the injured country retaliate, but enforcement depends on members' willingness. Larger economies tend to pick which rulings to follow.<\/p><\/div>","text":"The WTO Functions : administer trade agreements; forum for negotiations (rounds: Uruguay Round 1986–94; Doha Round 2001–, stalled); settle disputes; monitor trade policies; help developing countries build trade capacity. Principles : non-discrimination (MFN and national treatment), freer trade, predictability, fair competition. Limitations : the Appellate Body has been paralysed since 2019 because the USA blocked appointments; decisions need consensus; large economies can ignore rulings; developing countries argue rules favour the rich (agricultural subsidies remain); slow negotiations, so countries turn to regional deals. Exam tip WTO rulings let the injured country retaliate, but enforcement depends on members' willingness. Larger economies tend to pick which rulings to follow.","dias":[]},{"id":"e-trading-blocs","title":"Trading blocs and monetary union","hl":false,"terms":[["Trading bloc","A group of countries that agree to reduce or remove trade barriers among themselves."],["Free trade area","A trading bloc in which members remove trade barriers among themselves but keep their own barriers against non-members, e.g. USMCA, AfCFTA."],["Customs union","A free trade area with a common external tariff against non-members, e.g. the EU customs union, Mercosur."],["Common market","A customs union that also allows free movement of factors of production (labour and capital), e.g. the EU single market."],["Monetary union","A common market with a single currency and a common central bank, e.g. the eurozone."],["Trade creation","When joining a trading bloc shifts production from higher-cost domestic producers to lower-cost producers in other member countries."],["Trade diversion","When joining a trading bloc shifts imports from a lower-cost non-member to a higher-cost member, because of the common external tariff."]],"topic":"t4-4","html":"<div class=\"tbl\"><table><thead><tr><th>Stage<\/th><th>Free trade among members<\/th><th>Common external tariff<\/th><th>Free movement of factors<\/th><th>Single currency<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Preferential agreement<\/td><td>Some goods<\/td><td>No<\/td><td>No<\/td><td>No<\/td><td>Many bilateral deals<\/td><\/tr><tr><td><strong>Free trade area<\/strong><\/td><td>Yes<\/td><td>No<\/td><td>No<\/td><td>No<\/td><td>USMCA, ASEAN FTA, AfCFTA (2021)<\/td><\/tr><tr><td><strong>Customs union<\/strong><\/td><td>Yes<\/td><td>Yes<\/td><td>No<\/td><td>No<\/td><td>Mercosur, EU–Turkey customs union<\/td><\/tr><tr><td><strong>Common market<\/strong><\/td><td>Yes<\/td><td>Yes<\/td><td>Yes<\/td><td>No<\/td><td>EU single market, CARICOM<\/td><\/tr><tr><td><strong>Monetary union<\/strong><\/td><td>Yes<\/td><td>Yes<\/td><td>Yes<\/td><td>Yes<\/td><td>Eurozone (21 countries since Bulgaria joined in 2026); West African CFA franc<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Benefits of trading blocs<\/h5><ul><li>Trade creation: cheaper goods, greater choice, competition.<\/li><li>Economies of scale from a larger market; more FDI.<\/li><li>Stronger negotiating power; political cooperation and peace.<\/li><li>Common market: labour and capital move to where they are most productive.<\/li><\/ul><\/div><div><h5>Costs<\/h5><ul><li>Trade diversion: buying from higher-cost members.<\/li><li>Loss of sovereignty over trade policy (and, in a common market, migration).<\/li><li>Structural unemployment in uncompetitive industries.<\/li><li>Blocs may weaken the multilateral WTO system and harm non-members.<\/li><\/ul><\/div><\/div><\/div>\n<h4>Monetary union<\/h4>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Advantages<\/h5><ul><li>No exchange rate risk or currency conversion costs within the union.<\/li><li>Price transparency increases competition.<\/li><li>More trade and investment between members.<\/li><li>Lower interest rates for countries borrowing in a credible currency.<\/li><\/ul><\/div><div><h5>Disadvantages<\/h5><ul><li><strong>One interest rate for all<\/strong>: may suit Germany but not Greece or Spain.<\/li><li><strong>No exchange rate adjustment<\/strong>: uncompetitive members cannot devalue; adjustment must come through falling wages and unemployment (Greece 2010–15).<\/li><li>Limits on fiscal policy (fiscal rules: 3% deficit, 60% debt).<\/li><li>Asymmetric shocks hit members differently.<\/li><\/ul><\/div><\/div><\/div>","text":"Stage Free trade among members Common external tariff Free movement of factors Single currency Example Preferential agreement Some goods No No No Many bilateral deals Free trade area Yes No No No USMCA, ASEAN FTA, AfCFTA (2021) Customs union Yes Yes No No Mercosur, EU–Turkey customs union Common market Yes Yes Yes No EU single market, CARICOM Monetary union Yes Yes Yes Yes Eurozone (21 countries since Bulgaria joined in 2026); West African CFA franc Evaluation Benefits of trading blocs Trade creation: cheaper goods, greater choice, competition. Economies of scale from a larger market; more FDI. Stronger negotiating power; political cooperation and peace. Common market: labour and capital move to where they are most productive. Costs Trade diversion: buying from higher-cost members. Loss of sovereignty over trade policy (and, in a common market, migration). Structural unemployment in uncompetitive industries. Blocs may weaken the multilateral WTO system and harm non-members. Monetary union Evaluation Advantages No exchange rate risk or currency conversion costs within the union. Price transparency increases competition. More trade and investment between members. Lower interest rates for countries borrowing in a credible currency. Disadvantages One interest rate for all : may suit Germany but not Greece or Spain. No exchange rate adjustment : uncompetitive members cannot devalue; adjustment must come through falling wages and unemployment (Greece 2010–15). Limits on fiscal policy (fiscal rules: 3% deficit, 60% debt). Asymmetric shocks hit members differently.","dias":[]}]},{"id":"t4-5","num":"4.5","title":"Exchange rates","level":"SL","blurb":"Floating, fixed and managed systems, what moves exchange rates, the effects of appreciation and depreciation, and (HL) calculations.","entries":[{"id":"e-er-systems","title":"Exchange rate systems","hl":false,"terms":[["Exchange rate","The price of one currency in terms of another."],["Floating exchange rate","An exchange rate determined by the demand for and supply of the currency, with no government intervention."],["Appreciation","A rise in the value of a currency in a floating system."],["Depreciation","A fall in the value of a currency in a floating system."],["Fixed exchange rate","An exchange rate set by the government or central bank against another currency (or basket), maintained by intervention."],["Devaluation","A deliberate reduction in the value of a currency in a fixed exchange rate system."],["Revaluation","A deliberate increase in the value of a currency in a fixed system."],["Managed exchange rate","A floating exchange rate in which the central bank intervenes from time to time to keep the rate within a target range (managed float)."],["Foreign exchange reserves","Holdings of foreign currencies (and gold) by a central bank, used to intervene in currency markets."],["Hot money","Short-term capital that moves between countries in search of the highest interest rate or a quick gain."]],"topic":"t4-5","html":"<div class=\"dslot\" data-d=\"forex\"><\/div>\n<p><strong>Demand for a currency<\/strong> comes from foreigners buying the country's exports, foreign tourists, inward FDI and portfolio investment, foreigners saving in its banks (higher interest rates), speculators, and central banks buying it. <strong>Supply of a currency<\/strong> comes from residents buying imports, travelling abroad, investing abroad, and speculators selling.<\/p>\n<div class=\"dslot\" data-d=\"fixed-er\"><\/div>\n<p><strong>Fixed systems<\/strong> are maintained by buying or selling the currency with foreign reserves and adjusting interest rates. Examples: Hong Kong dollar pegged to the US dollar since 1983 (HK$7.75–7.85), Saudi riyal (SAR 3.75), Danish krone (to the euro), many Gulf states. <strong>Managed floats<\/strong>: the central bank intervenes to limit fluctuations (Singapore manages against a basket; China's yuan trades within a band around a daily fixing; India intervenes to smooth the rupee).<\/p>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Exchange rate calculations<\/div><ul><li><strong>Converting<\/strong>: £1 = €1.10. €200,000 buys 200,000 ÷ 1.10 = <strong>£181,818.18<\/strong>. If the pound appreciates to £1 = €1.20, those pounds convert back to 181,818.18 × 1.20 = <strong>€218,181.82<\/strong>, a profit of €18,181.82.<\/li><li><strong>Price of exports<\/strong>: a UK car costing £30,000 sells for 30,000 × 1.10 = €33,000 in the eurozone; after appreciation to €1.20 it costs <strong>€36,000<\/strong>.<\/li><li><strong>Percentage change<\/strong>: from £1 = €1.10 to €1.20 → (1.20 − 1.10) ÷ 1.10 × 100 = <strong>+9.09%<\/strong> appreciation of the pound; the euro has depreciated: €1 = £0.909 → £0.833, a fall of <strong>8.33%<\/strong>.<\/li><\/ul><\/div>","text":"Demand for a currency comes from foreigners buying the country's exports, foreign tourists, inward FDI and portfolio investment, foreigners saving in its banks (higher interest rates), speculators, and central banks buying it. Supply of a currency comes from residents buying imports, travelling abroad, investing abroad, and speculators selling. Fixed systems are maintained by buying or selling the currency with foreign reserves and adjusting interest rates. Examples: Hong Kong dollar pegged to the US dollar since 1983 (HK$7.75–7.85), Saudi riyal (SAR 3.75), Danish krone (to the euro), many Gulf states. Managed floats : the central bank intervenes to limit fluctuations (Singapore manages against a basket; China's yuan trades within a band around a daily fixing; India intervenes to smooth the rupee). HL only · Exchange rate calculations Converting : £1 = €1.10. €200,000 buys 200,000 ÷ 1.10 = £181,818.18 . If the pound appreciates to £1 = €1.20, those pounds convert back to 181,818.18 × 1.20 = €218,181.82 , a profit of €18,181.82. Price of exports : a UK car costing £30,000 sells for 30,000 × 1.10 = €33,000 in the eurozone; after appreciation to €1.20 it costs €36,000 . Percentage change : from £1 = €1.10 to €1.20 → (1.20 − 1.10) ÷ 1.10 × 100 = +9.09% appreciation of the pound; the euro has depreciated: €1 = £0.909 → £0.833, a fall of 8.33% .","dias":["forex","fixed-er"]},{"id":"e-er-changes","title":"Causes and consequences of exchange rate changes","hl":false,"terms":[["Speculation","Buying or selling a currency in expectation of a future change in its value, to make a profit."],["Expenditure-switching","A change in relative prices (e.g. through depreciation or tariffs) that makes consumers switch from imports to domestic goods."]],"topic":"t4-5","html":"<h4>Causes of a change in a floating rate<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Factor<\/th><th>Appreciation if…<\/th><\/tr><\/thead><tbody><tr><td><strong>Relative interest rates<\/strong><\/td><td>Domestic interest rates rise relative to others (hot money inflows)<\/td><\/tr><tr><td><strong>Relative inflation<\/strong><\/td><td>Domestic inflation is lower than trading partners' (exports more competitive)<\/td><\/tr><tr><td><strong>Foreign demand for exports<\/strong><\/td><td>Foreign incomes rise; tastes shift towards the country's goods<\/td><\/tr><tr><td><strong>Investment flows<\/strong><\/td><td>Inward FDI and portfolio investment increase<\/td><\/tr><tr><td><strong>Speculation and confidence<\/strong><\/td><td>Traders expect appreciation; political stability<\/td><\/tr><tr><td><strong>Remittances<\/strong><\/td><td>Inflows from workers abroad rise<\/td><\/tr><tr><td><strong>Central bank intervention<\/strong><\/td><td>The central bank buys its own currency<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Consequences<\/h4>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th>Depreciation<\/th><th>Appreciation<\/th><\/tr><\/thead><tbody><tr><td><strong>Exports<\/strong><\/td><td>Cheaper abroad → volume rises<\/td><td>Dearer abroad → volume falls<\/td><\/tr><tr><td><strong>Imports<\/strong><\/td><td>Dearer → volume falls; cost-push inflation (imported raw materials, energy)<\/td><td>Cheaper → lower inflation; cheaper inputs<\/td><\/tr><tr><td><strong>Current account<\/strong><\/td><td>Improves (if Marshall–Lerner holds)<\/td><td>Worsens<\/td><\/tr><tr><td><strong>Growth and jobs<\/strong><\/td><td>AD ↑ via (X − M): growth and jobs in export industries<\/td><td>AD ↓; exporters lose jobs<\/td><\/tr><tr><td><strong>Inflation<\/strong><\/td><td>Rises<\/td><td>Falls<\/td><\/tr><tr><td><strong>Living standards<\/strong><\/td><td>Consumers pay more for imports; foreign travel dearer<\/td><td>Consumers' purchasing power abroad rises<\/td><\/tr><tr><td><strong>Foreign debt<\/strong><\/td><td>Debt in foreign currency becomes harder to repay<\/td><td>Easier to repay<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: Pound after the Brexit vote<\/div><p>Sterling fell about 15–20% against the dollar after the 2016 referendum. Import prices and inflation rose (CPI peaked at 3.1% in 2017), squeezing real wages, while exports became cheaper. In 2022 the yen fell to a 30-year low against the dollar as Japan kept rates at zero while the Fed raised them.<\/p><\/div>","text":"Causes of a change in a floating rate Factor Appreciation if… Relative interest rates Domestic interest rates rise relative to others (hot money inflows) Relative inflation Domestic inflation is lower than trading partners' (exports more competitive) Foreign demand for exports Foreign incomes rise; tastes shift towards the country's goods Investment flows Inward FDI and portfolio investment increase Speculation and confidence Traders expect appreciation; political stability Remittances Inflows from workers abroad rise Central bank intervention The central bank buys its own currency Consequences Depreciation Appreciation Exports Cheaper abroad → volume rises Dearer abroad → volume falls Imports Dearer → volume falls; cost-push inflation (imported raw materials, energy) Cheaper → lower inflation; cheaper inputs Current account Improves (if Marshall–Lerner holds) Worsens Growth and jobs AD ↑ via (X − M): growth and jobs in export industries AD ↓; exporters lose jobs Inflation Rises Falls Living standards Consumers pay more for imports; foreign travel dearer Consumers' purchasing power abroad rises Foreign debt Debt in foreign currency becomes harder to repay Easier to repay Real-world example: Pound after the Brexit vote Sterling fell about 15–20% against the dollar after the 2016 referendum. Import prices and inflation rose (CPI peaked at 3.1% in 2017), squeezing real wages, while exports became cheaper. In 2022 the yen fell to a 30-year low against the dollar as Japan kept rates at zero while the Fed raised them.","dias":[]},{"id":"e-fixed-vs-floating","title":"Fixed vs floating exchange rates","hl":false,"terms":[["Currency peg","A fixed exchange rate against another currency or basket of currencies."]],"topic":"t4-5","html":"<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Fixed<\/h5><ul><li>Fixed: <strong>certainty<\/strong> for traders and investors; lower transaction risk.<\/li><li>Fixed: discipline on inflation (a credible peg imports low inflation).<\/li><li>Fixed: less speculation (if credible).<\/li><li>Floating: <strong>automatic adjustment<\/strong> of the current account through depreciation.<\/li><li>Floating: <strong>monetary policy freedom<\/strong>: interest rates can target domestic goals.<\/li><li>Floating: no need for large foreign reserves.<\/li><\/ul><\/div><div><h5>Floating<\/h5><ul><li>Fixed: requires <strong>large reserves<\/strong>; loses independent monetary policy.<\/li><li>Fixed: vulnerable to speculative attack if the peg is not credible (UK 1992 ERM exit; Thailand 1997; Argentina 2001).<\/li><li>Floating: <strong>volatility<\/strong> and uncertainty for trade and investment.<\/li><li>Floating: depreciation can cause imported inflation; speculation can push rates far from fundamentals.<\/li><\/ul><\/div><\/div><\/div>\n<p>Countries change systems: China moved from a fixed peg to a managed float in 2005; Switzerland abandoned its euro cap in 2015; Egypt devalued and floated in 2016 and 2024 under IMF programmes.<\/p>","text":"Evaluation Fixed Fixed: certainty for traders and investors; lower transaction risk. Fixed: discipline on inflation (a credible peg imports low inflation). Fixed: less speculation (if credible). Floating: automatic adjustment of the current account through depreciation. Floating: monetary policy freedom : interest rates can target domestic goals. Floating: no need for large foreign reserves. Floating Fixed: requires large reserves ; loses independent monetary policy. Fixed: vulnerable to speculative attack if the peg is not credible (UK 1992 ERM exit; Thailand 1997; Argentina 2001). Floating: volatility and uncertainty for trade and investment. Floating: depreciation can cause imported inflation; speculation can push rates far from fundamentals. Countries change systems: China moved from a fixed peg to a managed float in 2005; Switzerland abandoned its euro cap in 2015; Egypt devalued and floated in 2016 and 2024 under IMF programmes.","dias":[]}]},{"id":"t4-6","num":"4.6","title":"Balance of payments","level":"SL","blurb":"The current, capital and financial accounts, their link to exchange rates, Marshall–Lerner and the J-curve (HL), and persistent deficits and surpluses.","entries":[{"id":"e-bop-components","title":"Components of the balance of payments","hl":false,"terms":[["Balance of payments (BOP)","A record of all economic transactions between the residents of a country and the rest of the world over a period of time."],["Current account","The part of the BOP recording trade in goods and services, primary income and secondary income."],["Balance of trade in goods","The value of goods exported minus the value of goods imported (visible trade)."],["Balance of trade in services","The value of services exported minus the value of services imported (invisible trade)."],["Primary income","Income flows such as wages, interest, profits and dividends earned on investments abroad, minus those paid to foreigners."],["Secondary income","Transfers between countries with nothing given in return, such as remittances, foreign aid and contributions to international organisations."],["Capital account","The part of the BOP recording capital transfers (e.g. debt forgiveness, migrants' transfers) and the purchase or sale of non-produced, non-financial assets (e.g. patents, land for embassies)."],["Financial account","The part of the BOP recording flows of financial investment: FDI, portfolio investment, other investment and changes in reserve assets."],["Foreign direct investment (FDI)","Long-term investment by a firm in another country that gives it control or a lasting interest (at least 10% of a company), e.g. building a factory."],["Portfolio investment","The purchase of financial assets such as shares and bonds without controlling the firm."],["Current account deficit","When the value of money flowing out on the current account exceeds the value flowing in."]],"topic":"t4-6","html":"<div class=\"tbl\"><table><thead><tr><th>Account<\/th><th>Components<\/th><th>Example of a credit (+)<\/th><\/tr><\/thead><tbody><tr><td><strong>Current<\/strong><\/td><td>Goods balance + services balance + primary income + secondary income<\/td><td>A German firm buys Indian IT services<\/td><\/tr><tr><td><strong>Capital<\/strong><\/td><td>Capital transfers; non-produced non-financial assets<\/td><td>Debt forgiveness received<\/td><\/tr><tr><td><strong>Financial<\/strong><\/td><td>Direct investment, portfolio investment, other investment (loans, deposits), reserve assets<\/td><td>Toyota builds a factory in the UK<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Interdependence<\/h4>\n<p>Current account + capital account + financial account (+ net errors and omissions) = <strong>0<\/strong>. A <strong>current account deficit<\/strong> must be financed by a <strong>financial/capital account surplus<\/strong>: borrowing from abroad or selling assets to foreigners. The USA has run current account deficits for decades, financed by foreigners buying US assets.<\/p>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Current account<\/div><p>Goods balance −40, services +25, primary income −10, secondary income −5 ($bn). Current account = −40 + 25 − 10 − 5 = <strong>−$30bn<\/strong> (a deficit). The financial and capital accounts must show a combined surplus of about $30bn.<\/p><\/div>","text":"Account Components Example of a credit (+) Current Goods balance + services balance + primary income + secondary income A German firm buys Indian IT services Capital Capital transfers; non-produced non-financial assets Debt forgiveness received Financial Direct investment, portfolio investment, other investment (loans, deposits), reserve assets Toyota builds a factory in the UK Interdependence Current account + capital account + financial account (+ net errors and omissions) = 0 . A current account deficit must be financed by a financial/capital account surplus : borrowing from abroad or selling assets to foreigners. The USA has run current account deficits for decades, financed by foreigners buying US assets. Worked example: Current account Goods balance −40, services +25, primary income −10, secondary income −5 ($bn). Current account = −40 + 25 − 10 − 5 = −$30bn (a deficit). The financial and capital accounts must show a combined surplus of about $30bn.","dias":[]},{"id":"e-bop-er","title":"The balance of payments and the exchange rate","hl":false,"terms":[],"topic":"t4-6","html":"<ul><li>A <strong>current account deficit<\/strong> means more supply of the currency (to pay for imports) than demand (from exports), putting <strong>downward pressure<\/strong> on the exchange rate in a floating system.<\/li><li><strong>Financial account inflows<\/strong> (FDI, portfolio, hot money) increase demand for the currency, pushing it <strong>up<\/strong>.<\/li><li>A <strong>depreciation<\/strong> may improve the current account over time; an <strong>appreciation<\/strong> tends to worsen it.<\/li><\/ul>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Marshall–Lerner condition and the J-curve<\/div><p><strong>Marshall–Lerner condition<\/strong>: a depreciation will improve the current account only if the <strong>sum of the price elasticities of demand for exports and imports is greater than 1<\/strong> (|PEDx| + |PEDm| &gt; 1). If demand is inelastic, export revenue barely rises and import spending rises, so the balance worsens.<\/p>\n<div class=\"dslot\" data-d=\"j-curve\"><\/div>\n<p><strong>J-curve<\/strong>: in the short run demand for exports and imports is inelastic (contracts are fixed, habits and supply chains take time to change), so the current account worsens after a depreciation. Over time demand becomes more elastic, the Marshall–Lerner condition is met, and the balance improves.<\/p><\/div>","text":"A current account deficit means more supply of the currency (to pay for imports) than demand (from exports), putting downward pressure on the exchange rate in a floating system. Financial account inflows (FDI, portfolio, hot money) increase demand for the currency, pushing it up . A depreciation may improve the current account over time; an appreciation tends to worsen it. HL only · Marshall–Lerner condition and the J-curve Marshall–Lerner condition : a depreciation will improve the current account only if the sum of the price elasticities of demand for exports and imports is greater than 1 (|PEDx| + |PEDm| > 1). If demand is inelastic, export revenue barely rises and import spending rises, so the balance worsens. J-curve : in the short run demand for exports and imports is inelastic (contracts are fixed, habits and supply chains take time to change), so the current account worsens after a depreciation. Over time demand becomes more elastic, the Marshall–Lerner condition is met, and the balance improves.","dias":["j-curve"]},{"id":"e-ca-deficits","title":"Persistent current account deficits","hl":false,"terms":[["Expenditure-reducing policies","Contractionary fiscal and monetary policies that reduce AD and so reduce spending on imports."],["Expenditure-switching policies","Policies that make imports relatively dearer or exports relatively cheaper, so spending switches to domestic goods, e.g. depreciation, devaluation, protection."]],"topic":"t4-6","html":"<h4>Implications<\/h4>\n<ul><li><strong>Downward pressure on the exchange rate<\/strong> (or loss of reserves under a fixed rate).<\/li><li><strong>Borrowing from abroad<\/strong> and rising foreign debt; selling domestic assets to foreigners.<\/li><li><strong>Higher interest rates<\/strong> may be needed to attract financial inflows, slowing growth.<\/li><li><strong>Credit rating<\/strong> may fall; vulnerability to sudden stops in capital inflows (Sri Lanka 2022, Pakistan 2023).<\/li><li><strong>Lower AD<\/strong> and possibly jobs lost in import-competing industries; but a deficit financed by FDI that raises productive capacity may be harmless.<\/li><\/ul>\n<h4>Correcting a deficit<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Policy<\/th><th>How<\/th><th>Problems<\/th><\/tr><\/thead><tbody><tr><td><strong>Expenditure-switching<\/strong>: depreciation/devaluation<\/td><td>Exports cheaper, imports dearer<\/td><td>Marshall–Lerner, J-curve; imported inflation<\/td><\/tr><tr><td><strong>Expenditure-switching<\/strong>: protection<\/td><td>Tariffs, quotas<\/td><td>Retaliation, inefficiency, WTO rules<\/td><\/tr><tr><td><strong>Expenditure-reducing<\/strong>: contractionary fiscal/monetary policy<\/td><td>Lower incomes reduce imports<\/td><td>Unemployment, lower growth<\/td><\/tr><tr><td><strong>Supply-side policies<\/strong><\/td><td>Raise productivity, quality and competitiveness of exports<\/td><td>Slow; costly<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box warn\"><div class=\"box-h\">Common mistakes<\/div><p>A <strong>current account deficit<\/strong> (trade with the rest of the world) is not a <strong>budget deficit<\/strong> (government spending greater than revenue). They are linked (twin deficits) but different.<\/p><\/div>","text":"Implications Downward pressure on the exchange rate (or loss of reserves under a fixed rate). Borrowing from abroad and rising foreign debt; selling domestic assets to foreigners. Higher interest rates may be needed to attract financial inflows, slowing growth. Credit rating may fall; vulnerability to sudden stops in capital inflows (Sri Lanka 2022, Pakistan 2023). Lower AD and possibly jobs lost in import-competing industries; but a deficit financed by FDI that raises productive capacity may be harmless. Correcting a deficit Policy How Problems Expenditure-switching : depreciation/devaluation Exports cheaper, imports dearer Marshall–Lerner, J-curve; imported inflation Expenditure-switching : protection Tariffs, quotas Retaliation, inefficiency, WTO rules Expenditure-reducing : contractionary fiscal/monetary policy Lower incomes reduce imports Unemployment, lower growth Supply-side policies Raise productivity, quality and competitiveness of exports Slow; costly Common mistakes A current account deficit (trade with the rest of the world) is not a budget deficit (government spending greater than revenue). They are linked (twin deficits) but different.","dias":[]},{"id":"e-ca-surpluses","title":"Persistent current account surpluses","hl":false,"terms":[],"topic":"t4-6","html":"<p>Countries with large persistent surpluses: Germany (around 6–8% of GDP in the 2010s), China, the Netherlands, Switzerland, oil exporters such as Saudi Arabia and Norway.<\/p>\n<h4>Implications<\/h4>\n<ul><li><strong>Lower domestic consumption<\/strong> than possible: living standards today are lower than income would allow (high saving).<\/li><li><strong>Upward pressure on the exchange rate<\/strong>, reducing export competitiveness over time.<\/li><li><strong>Inflationary pressure<\/strong> (strong demand for exports).<\/li><li><strong>Accumulation of foreign assets<\/strong> (sovereign wealth funds: Norway's fund is worth over $1.7tn).<\/li><li><strong>Over-reliance on export demand<\/strong>; vulnerable to recessions abroad.<\/li><li><strong>International tensions<\/strong>: one country's surplus is another's deficit; accusations of currency manipulation; protectionist responses.<\/li><\/ul>","text":"Countries with large persistent surpluses: Germany (around 6–8% of GDP in the 2010s), China, the Netherlands, Switzerland, oil exporters such as Saudi Arabia and Norway. Implications Lower domestic consumption than possible: living standards today are lower than income would allow (high saving). Upward pressure on the exchange rate , reducing export competitiveness over time. Inflationary pressure (strong demand for exports). Accumulation of foreign assets (sovereign wealth funds: Norway's fund is worth over $1.7tn). Over-reliance on export demand ; vulnerable to recessions abroad. International tensions : one country's surplus is another's deficit; accusations of currency manipulation; protectionist responses.","dias":[]}]},{"id":"t4-7","num":"4.7","title":"Sustainable development","level":"SL","blurb":"The meaning of sustainable development, the 17 SDGs, and the link between poverty and sustainability.","entries":[{"id":"e-sustainable-dev","title":"Sustainable development and the SDGs","hl":false,"terms":[["Economic development","A broad improvement in living standards and well-being, including higher incomes, less poverty, better health and education, greater freedom and choice."],["Sustainable development","Development that meets the needs of the present without compromising the ability of future generations to meet their own needs (Brundtland Report, 1987)."],["Sustainable Development Goals (SDGs)","Seventeen goals adopted by all UN members in 2015, with 169 targets to be met by 2030, covering poverty, health, education, equality, the environment and institutions."]],"topic":"t4-7","html":"<h4>The 17 SDGs<\/h4>\n<ol><li>No poverty · 2. Zero hunger · 3. Good health and well-being · 4. Quality education · 5. Gender equality · 6. Clean water and sanitation · 7. Affordable and clean energy · 8. Decent work and economic growth · 9. Industry, innovation and infrastructure · 10. Reduced inequalities · 11. Sustainable cities and communities · 12. Responsible consumption and production · 13. Climate action · 14. Life below water · 15. Life on land · 16. Peace, justice and strong institutions · 17. Partnerships for the goals.<\/li><\/ol>\n<p>Progress has been uneven: by the mid-2020s the UN reported that only around 17% of targets were on track, set back by Covid-19, conflicts and the cost-of-living crisis.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>The SDGs give you a structure for development essays: link each policy to the goals it helps (e.g. microfinance → SDGs 1, 5, 8).<\/p><\/div>","text":"The 17 SDGs No poverty · 2. Zero hunger · 3. Good health and well-being · 4. Quality education · 5. Gender equality · 6. Clean water and sanitation · 7. Affordable and clean energy · 8. Decent work and economic growth · 9. Industry, innovation and infrastructure · 10. Reduced inequalities · 11. Sustainable cities and communities · 12. Responsible consumption and production · 13. Climate action · 14. Life below water · 15. Life on land · 16. Peace, justice and strong institutions · 17. Partnerships for the goals. Progress has been uneven: by the mid-2020s the UN reported that only around 17% of targets were on track, set back by Covid-19, conflicts and the cost-of-living crisis. Exam tip The SDGs give you a structure for development essays: link each policy to the goals it helps (e.g. microfinance → SDGs 1, 5, 8).","dias":[]},{"id":"e-poverty-sustainability","title":"The relationship between sustainability and poverty","hl":false,"terms":[],"topic":"t4-7","html":"<ul><li><strong>Poverty can cause unsustainable resource use<\/strong>: people with few options overuse common resources (cutting forests for fuel and farmland, overgrazing, overfishing) because survival today matters more than tomorrow.<\/li><li><strong>Environmental damage deepens poverty<\/strong>: soil erosion, desertification, pollution and climate change hit the poorest hardest, as they depend most on natural resources and have least protection (floods in Bangladesh and Pakistan, droughts in the Sahel and the Horn of Africa).<\/li><li><strong>Rich countries' consumption<\/strong> causes most historical emissions, while poorer countries bear much of the damage: a question of equity (the \"loss and damage\" fund agreed at COP27, 2022).<\/li><li><strong>Breaking the link<\/strong>: clean energy access (solar mini-grids), secure land rights, sustainable farming, payments for ecosystem services, education (especially of girls), and climate finance.<\/li><\/ul>","text":"Poverty can cause unsustainable resource use : people with few options overuse common resources (cutting forests for fuel and farmland, overgrazing, overfishing) because survival today matters more than tomorrow. Environmental damage deepens poverty : soil erosion, desertification, pollution and climate change hit the poorest hardest, as they depend most on natural resources and have least protection (floods in Bangladesh and Pakistan, droughts in the Sahel and the Horn of Africa). Rich countries' consumption causes most historical emissions, while poorer countries bear much of the damage: a question of equity (the \"loss and damage\" fund agreed at COP27, 2022). Breaking the link : clean energy access (solar mini-grids), secure land rights, sustainable farming, payments for ecosystem services, education (especially of girls), and climate finance.","dias":[]}]},{"id":"t4-8","num":"4.8","title":"Measuring development","level":"SL","blurb":"Single indicators, composite indicators (HDI, IHDI, GII, HPI, MPI), and the relationship between growth and development.","entries":[{"id":"e-single-indicators","title":"Single indicators of development","hl":false,"terms":[["Single indicator","A measure of development that uses one variable, such as GNI per capita, life expectancy or the literacy rate."],["Life expectancy","The average number of years a newborn is expected to live, given current mortality rates."],["Infant mortality rate","The number of babies who die before their first birthday per 1,000 live births."],["Maternal mortality ratio","The number of women who die from pregnancy-related causes per 100,000 live births."]],"topic":"t4-8","html":"<p>Development is <strong>multidimensional<\/strong>: income, health, education, freedom, equality, sustainability.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Category<\/th><th>Indicators<\/th><\/tr><\/thead><tbody><tr><td><strong>Economic<\/strong><\/td><td>GDP/GNI per capita at PPP; share of employment in agriculture; access to electricity; energy consumption per capita<\/td><\/tr><tr><td><strong>Health<\/strong><\/td><td>Life expectancy at birth; infant and under-5 mortality; maternal mortality; access to clean water and sanitation; calorie intake<\/td><\/tr><tr><td><strong>Education<\/strong><\/td><td>Adult literacy; mean and expected years of schooling; enrolment rates; pupil–teacher ratio<\/td><\/tr><tr><td><strong>Other<\/strong><\/td><td>Share of population below the poverty line; Gini coefficient; access to the internet; gender gaps<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>GNI per capita (PPP)<\/strong> is the most common single measure but ignores distribution, non-market activity and quality of life.<\/p>","text":"Development is multidimensional : income, health, education, freedom, equality, sustainability. Category Indicators Economic GDP/GNI per capita at PPP; share of employment in agriculture; access to electricity; energy consumption per capita Health Life expectancy at birth; infant and under-5 mortality; maternal mortality; access to clean water and sanitation; calorie intake Education Adult literacy; mean and expected years of schooling; enrolment rates; pupil–teacher ratio Other Share of population below the poverty line; Gini coefficient; access to the internet; gender gaps GNI per capita (PPP) is the most common single measure but ignores distribution, non-market activity and quality of life.","dias":[]},{"id":"e-composite-indicators","title":"Composite indicators: HDI, IHDI, GII, HPI","hl":false,"terms":[["Composite indicator","A measure of development that combines several indicators into one index."],["Human Development Index (HDI)","A UNDP index combining life expectancy at birth, education (mean and expected years of schooling) and GNI per capita (PPP), from 0 to 1."],["Inequality-adjusted HDI (IHDI)","The HDI adjusted for inequality in each of its three dimensions; the gap between HDI and IHDI shows the loss from inequality."],["Gender Inequality Index (GII)","A UNDP index measuring gender inequality in reproductive health, empowerment and the labour market; higher values mean more inequality."]],"topic":"t4-8","html":"<div class=\"tbl\"><table><thead><tr><th>Index<\/th><th>Dimensions<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td><strong>HDI<\/strong><\/td><td>Health (life expectancy), education (mean years of schooling, expected years of schooling), standard of living (GNI per capita PPP)<\/td><td>0–1; Switzerland, Norway, Iceland ~0.96; South Sudan, Somalia ~0.38<\/td><\/tr><tr><td><strong>IHDI<\/strong><\/td><td>HDI adjusted for inequality within each dimension<\/td><td>Large losses in countries such as South Africa, Brazil<\/td><\/tr><tr><td><strong>GII<\/strong><\/td><td>Maternal mortality and adolescent birth rate; share of parliamentary seats and secondary education; labour force participation<\/td><td>0 = equal; Denmark and Switzerland lowest; Yemen highest<\/td><\/tr><tr><td><strong>HPI<\/strong><\/td><td>Well-being × life expectancy ÷ ecological footprint<\/td><td>Rewards low-consumption, high well-being countries (Costa Rica, Vanuatu)<\/td><\/tr><tr><td><strong>MPI<\/strong><\/td><td>Ten deprivations in health, education and living standards<\/td><td>Measures who is poor and how ([[e-measuring-inequality<\/td><td>3.4]])<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Compare a country's HDI rank with its GNI per capita rank: if HDI rank is much <strong>higher<\/strong> (e.g. Cuba, Sri Lanka), it converts income into health and education well; if much <strong>lower<\/strong> (e.g. oil-rich Equatorial Guinea, Gulf states historically), income is not reaching the population.<\/p><\/div>","text":"Index Dimensions Notes HDI Health (life expectancy), education (mean years of schooling, expected years of schooling), standard of living (GNI per capita PPP) 0–1; Switzerland, Norway, Iceland ~0.96; South Sudan, Somalia ~0.38 IHDI HDI adjusted for inequality within each dimension Large losses in countries such as South Africa, Brazil GII Maternal mortality and adolescent birth rate; share of parliamentary seats and secondary education; labour force participation 0 = equal; Denmark and Switzerland lowest; Yemen highest HPI Well-being × life expectancy ÷ ecological footprint Rewards low-consumption, high well-being countries (Costa Rica, Vanuatu) MPI Ten deprivations in health, education and living standards Measures who is poor and how ([[e-measuring-inequality 3.4]]) Exam tip Compare a country's HDI rank with its GNI per capita rank: if HDI rank is much higher (e.g. Cuba, Sri Lanka), it converts income into health and education well; if much lower (e.g. oil-rich Equatorial Guinea, Gulf states historically), income is not reaching the population.","dias":[]},{"id":"e-growth-vs-development","title":"Evaluating approaches and growth vs development","hl":false,"terms":[],"topic":"t4-8","html":"<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Composite indicators<\/h5><ul><li>Capture several dimensions in one number; easy to compare and rank.<\/li><li>HDI shifts attention from income alone (Sen's capabilities approach).<\/li><li>IHDI, GII and MPI reveal inequality and deprivation hidden by averages.<\/li><\/ul><\/div><div><h5>Limitations<\/h5><ul><li>Weighting is arbitrary; very different situations can give the same score.<\/li><li>Leave out freedom, security, environment (HDI) and happiness.<\/li><li>Data quality and availability in low-income countries; time lags.<\/li><li>Averages still hide regional and group differences.<\/li><\/ul><\/div><\/div><\/div>\n<h4>Growth vs development<\/h4>\n<ul><li>Growth (higher real GDP) <strong>can fund<\/strong> development: health, schools, infrastructure, social safety nets.<\/li><li>But growth is <strong>neither necessary nor sufficient<\/strong>: growth can be concentrated (oil revenues captured by elites; the \"resource curse\"), destroy the environment, or bypass the poor; some countries achieve good health and education at modest incomes (Kerala in India, Costa Rica, Sri Lanka).<\/li><li>Development can also <strong>raise growth<\/strong>: healthier, educated workers are more productive.<\/li><\/ul>","text":"Evaluation Composite indicators Capture several dimensions in one number; easy to compare and rank. HDI shifts attention from income alone (Sen's capabilities approach). IHDI, GII and MPI reveal inequality and deprivation hidden by averages. Limitations Weighting is arbitrary; very different situations can give the same score. Leave out freedom, security, environment (HDI) and happiness. Data quality and availability in low-income countries; time lags. Averages still hide regional and group differences. Growth vs development Growth (higher real GDP) can fund development: health, schools, infrastructure, social safety nets. But growth is neither necessary nor sufficient : growth can be concentrated (oil revenues captured by elites; the \"resource curse\"), destroy the environment, or bypass the poor; some countries achieve good health and education at modest incomes (Kerala in India, Costa Rica, Sri Lanka). Development can also raise growth : healthier, educated workers are more productive.","dias":[]}]},{"id":"t4-9","num":"4.9","title":"Barriers to economic growth and/or economic development","level":"SL","blurb":"Poverty traps, economic barriers (including commodity dependence and debt) and political and social barriers.","entries":[{"id":"e-barriers","title":"Poverty traps and economic barriers","hl":false,"terms":[["Poverty trap (cycle)","A self-reinforcing cycle in which low incomes lead to low savings, low investment and low productivity, which keep incomes low."],["Informal economy","Economic activity outside government regulation and taxation, typically low-productivity and insecure."],["Capital flight","The large-scale movement of money and assets out of a country, often due to political or economic instability."],["Commodity dependence","When a country relies on a small number of primary commodities for most of its export earnings."],["Foreign debt","Money owed by a country's government, firms and households to foreign lenders."]],"topic":"t4-9","html":"<div class=\"dslot\" data-d=\"poverty-cycle\"><\/div>\n<h4>Economic barriers<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Barrier<\/th><th>Why it holds back growth and development<\/th><\/tr><\/thead><tbody><tr><td><strong>Poverty traps<\/strong><\/td><td>Low income → low saving → low investment in physical and human capital → low productivity → low income<\/td><\/tr><tr><td><strong>Low human capital<\/strong><\/td><td>Poor health and education reduce productivity<\/td><\/tr><tr><td><strong>Inadequate infrastructure<\/strong><\/td><td>Poor roads, power and internet raise costs (power cuts in Nigeria and South Africa)<\/td><\/tr><tr><td><strong>Lack of access to credit<\/strong><\/td><td>Farmers and small firms cannot borrow to invest<\/td><\/tr><tr><td><strong>Dependence on primary commodities<\/strong><\/td><td>Volatile prices (low PED and PES), low YED, deteriorating terms of trade over time (Prebisch–Singer hypothesis)<\/td><\/tr><tr><td><strong>Inability to access international markets<\/strong><\/td><td>Rich countries' tariffs and subsidies; landlocked geography<\/td><\/tr><tr><td><strong>Informal economy<\/strong><\/td><td>Low productivity, no tax base, no worker protection<\/td><\/tr><tr><td><strong>Capital flight<\/strong><\/td><td>Savings move abroad instead of being invested at home<\/td><\/tr><tr><td><strong>Indebtedness<\/strong><\/td><td>Debt service crowds out spending on health and education (Zambia, Ghana defaults)<\/td><\/tr><tr><td><strong>Geography<\/strong><\/td><td>Landlocked countries, tropical disease burden, climate vulnerability<\/td><\/tr><tr><td><strong>Inequality<\/strong><\/td><td>Concentrated incomes limit demand, human capital and social cohesion<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box key\"><div class=\"box-h\">Key idea: Terms of trade<\/div><p>The terms of trade (index of export prices ÷ index of import prices × 100) help explain commodity dependence: when commodity prices fall relative to the manufactured goods a country imports, it must export more to buy the same imports.<\/p><\/div>","text":"Economic barriers Barrier Why it holds back growth and development Poverty traps Low income → low saving → low investment in physical and human capital → low productivity → low income Low human capital Poor health and education reduce productivity Inadequate infrastructure Poor roads, power and internet raise costs (power cuts in Nigeria and South Africa) Lack of access to credit Farmers and small firms cannot borrow to invest Dependence on primary commodities Volatile prices (low PED and PES), low YED, deteriorating terms of trade over time (Prebisch–Singer hypothesis) Inability to access international markets Rich countries' tariffs and subsidies; landlocked geography Informal economy Low productivity, no tax base, no worker protection Capital flight Savings move abroad instead of being invested at home Indebtedness Debt service crowds out spending on health and education (Zambia, Ghana defaults) Geography Landlocked countries, tropical disease burden, climate vulnerability Inequality Concentrated incomes limit demand, human capital and social cohesion Key idea: Terms of trade The terms of trade (index of export prices ÷ index of import prices × 100) help explain commodity dependence: when commodity prices fall relative to the manufactured goods a country imports, it must export more to buy the same imports.","dias":["poverty-cycle"]},{"id":"e-political-barriers","title":"Political and social barriers","hl":false,"terms":[["Good governance","Government that is accountable, transparent, effective, follows the rule of law and is free of corruption."],["Corruption","The abuse of public office for private gain, e.g. bribery and embezzlement."],["Property rights","The legal right to own, use and transfer land, assets and intellectual property."],["Rule of law","The principle that everyone, including the government, is subject to fair and consistently enforced laws."]],"topic":"t4-9","html":"<ul><li><strong>Weak institutional framework<\/strong>: ineffective legal systems, poor tax collection, insecure property rights (people cannot use land as collateral; Hernando de Soto's \"dead capital\").<\/li><li><strong>Lack of good governance and corruption<\/strong>: funds diverted, investment deterred (Transparency International's Corruption Perceptions Index).<\/li><li><strong>Unequal political power and status<\/strong>: elites capture resources; minority groups excluded.<\/li><li><strong>Gender inequality<\/strong>: women's lack of education, rights and access to credit and land lowers output and slows development; educating girls is one of the highest-return investments.<\/li><li><strong>Political instability and conflict<\/strong>: destroys capital and human life; displacement (Sudan, Yemen, Syria, Sahel).<\/li><li><strong>Social and cultural factors<\/strong>: discrimination by caste, ethnicity or religion; high population growth.<\/li><\/ul>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>In Paper 2 data on a developing country, read the text looking for barriers (economic, political, social) and link each policy in part (g) to the barrier it tackles.<\/p><\/div>","text":"Weak institutional framework : ineffective legal systems, poor tax collection, insecure property rights (people cannot use land as collateral; Hernando de Soto's \"dead capital\"). Lack of good governance and corruption : funds diverted, investment deterred (Transparency International's Corruption Perceptions Index). Unequal political power and status : elites capture resources; minority groups excluded. Gender inequality : women's lack of education, rights and access to credit and land lowers output and slows development; educating girls is one of the highest-return investments. Political instability and conflict : destroys capital and human life; displacement (Sudan, Yemen, Syria, Sahel). Social and cultural factors : discrimination by caste, ethnicity or religion; high population growth. Exam tip In Paper 2 data on a developing country, read the text looking for barriers (economic, political, social) and link each policy in part (g) to the barrier it tackles.","dias":[]}]},{"id":"t4-10","num":"4.10","title":"Economic growth and/or economic development strategies","level":"SL","blurb":"Trade strategies, diversification, social enterprise, market-based and interventionist policies, FDI, aid, debt relief, institutional change, and evaluating the approaches.","entries":[{"id":"e-trade-strategies","title":"Trade strategies, diversification and social enterprise","hl":false,"terms":[["Import substitution","A strategy of protecting domestic industries from imports so that they grow and replace imported goods (import substitution industrialisation, ISI)."],["Export promotion","A strategy of encouraging industries that produce goods for export, through openness to trade and investment."],["Economic diversification","Broadening the range of goods and services an economy produces and exports, to reduce reliance on a few products."],["Social enterprise","A business with social or environmental objectives that reinvests its profits to pursue them."],["Fair trade","A scheme guaranteeing a minimum price and a social premium to producers in developing countries, certified by organisations such as Fairtrade International."]],"topic":"t4-10","html":"<div class=\"tbl\"><table><thead><tr><th>Strategy<\/th><th>How<\/th><th>Examples<\/th><th>Evaluation<\/th><\/tr><\/thead><tbody><tr><td><strong>Import substitution<\/strong><\/td><td>Tariffs and quotas protect infant industries<\/td><td>Latin America and India (1950s–80s)<\/td><td>Some industrialisation, but inefficiency, debt and slow growth; mostly abandoned<\/td><\/tr><tr><td><strong>Export promotion<\/strong><\/td><td>Open trade, FDI, export zones, competitive exchange rates<\/td><td>East Asian \"tigers\": South Korea, Taiwan, Singapore; China after 1978; Vietnam<\/td><td>Rapid growth; but dependence on world demand, possible exploitation of labour<\/td><\/tr><tr><td><strong>Diversification<\/strong><\/td><td>Move into new products and sectors<\/td><td>Botswana (diamonds → tourism, services); UAE (oil → aviation, finance, tourism); Chile (copper → fruit, wine)<\/td><td>Reduces risk; needs investment and skills<\/td><\/tr><tr><td><strong>Social enterprise<\/strong><\/td><td>Businesses that reinvest profit for social goals<\/td><td>Grameen Bank (Bangladesh); Fairtrade co-operatives<\/td><td>Combines market and social goals; often small scale<\/td><\/tr><\/tbody><\/table><\/div>","text":"Strategy How Examples Evaluation Import substitution Tariffs and quotas protect infant industries Latin America and India (1950s–80s) Some industrialisation, but inefficiency, debt and slow growth; mostly abandoned Export promotion Open trade, FDI, export zones, competitive exchange rates East Asian \"tigers\": South Korea, Taiwan, Singapore; China after 1978; Vietnam Rapid growth; but dependence on world demand, possible exploitation of labour Diversification Move into new products and sectors Botswana (diamonds → tourism, services); UAE (oil → aviation, finance, tourism); Chile (copper → fruit, wine) Reduces risk; needs investment and skills Social enterprise Businesses that reinvest profit for social goals Grameen Bank (Bangladesh); Fairtrade co-operatives Combines market and social goals; often small scale","dias":[]},{"id":"e-market-vs-intervention","title":"Market-based and interventionist policies, merit goods and FDI","hl":false,"terms":[["Trade liberalisation","Reducing trade barriers such as tariffs and quotas."],["Multinational corporation (MNC)","A firm that owns or controls production in more than one country."],["Inward FDI","Investment by foreign firms in productive assets inside a country."]],"topic":"t4-10","html":"<h4>Market-based policies<\/h4>\n<p>Trade liberalisation, privatisation, deregulation, labour market reforms, reducing corruption to attract investment, removing price controls. (Similar to market-based supply-side policies, but evaluated here for their effect on development.)<\/p>\n<h4>Interventionist policies<\/h4>\n<p>Provision of <strong>merit goods<\/strong> (education, healthcare, clean water, sanitation), <strong>infrastructure<\/strong>, <strong>industrial policy<\/strong>, <strong>social safety nets<\/strong> (conditional cash transfers), <strong>land reform<\/strong>.<\/p>\n<h4>Inward FDI and MNCs<\/h4>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Benefits for the host country<\/h5><ul><li>Creates jobs and raises wages.<\/li><li>Brings capital, technology and management skills (spillovers).<\/li><li>Raises exports, tax revenue and foreign exchange (financial account inflow).<\/li><li>Develops infrastructure and supply chains.<\/li><\/ul><\/div><div><h5>Costs<\/h5><ul><li>Profits repatriated (GNI &lt; GDP); limited spillovers if enclaves.<\/li><li>Tax avoidance through transfer pricing; tax breaks given to attract FDI.<\/li><li>Poor labour conditions and environmental damage (Rana Plaza collapse, Bangladesh 2013).<\/li><li>Local firms crowded out; MNCs can lobby or threaten to leave (\"footloose\").<\/li><\/ul><\/div><\/div><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Link every policy to the poverty trap: \"more trade → higher output → more jobs → higher incomes → more saving and investment → higher productivity\". Then evaluate where the chain may break.<\/p><\/div>","text":"Market-based policies Trade liberalisation, privatisation, deregulation, labour market reforms, reducing corruption to attract investment, removing price controls. (Similar to market-based supply-side policies, but evaluated here for their effect on development.) Interventionist policies Provision of merit goods (education, healthcare, clean water, sanitation), infrastructure , industrial policy , social safety nets (conditional cash transfers), land reform . Inward FDI and MNCs Evaluation Benefits for the host country Creates jobs and raises wages. Brings capital, technology and management skills (spillovers). Raises exports, tax revenue and foreign exchange (financial account inflow). Develops infrastructure and supply chains. Costs Profits repatriated (GNI < GDP); limited spillovers if enclaves. Tax avoidance through transfer pricing; tax breaks given to attract FDI. Poor labour conditions and environmental damage (Rana Plaza collapse, Bangladesh 2013). Local firms crowded out; MNCs can lobby or threaten to leave (\"footloose\"). Exam tip Link every policy to the poverty trap: \"more trade → higher output → more jobs → higher incomes → more saving and investment → higher productivity\". Then evaluate where the chain may break.","dias":[]},{"id":"e-aid","title":"Foreign aid, debt relief and multilateral assistance","hl":false,"terms":[["Foreign aid","Assistance given by one country (or organisation) to another, as grants, concessional loans, goods or technical help."],["Humanitarian aid","Emergency help in response to disasters or conflict: food, medicine, shelter."],["Development aid","Longer-term assistance to promote development: funding for schools, health systems, infrastructure."],["Official development assistance (ODA)","Aid from governments of rich countries to developing countries, with the promotion of development as its main aim and at least a minimum grant element; the UN target is 0.7% of donors' GNI."],["Tied aid","Aid that must be spent on goods and services from the donor country."],["Non-governmental organisation (NGO)","A non-profit organisation independent of government, e.g. Oxfam, Médecins Sans Frontières."],["Debt relief","Cancelling or reducing a country's debts, e.g. the HIPC initiative and the Multilateral Debt Relief Initiative."],["International Monetary Fund (IMF)","The international organisation that promotes monetary cooperation and financial stability, lending to countries with balance of payments problems, usually with conditions."],["World Bank","The international organisation that lends to and supports developing countries for development projects and poverty reduction."],["Microfinance","Small loans and other financial services to poor people without access to banks, often without collateral."]],"topic":"t4-10","html":"<div class=\"tbl\"><table><thead><tr><th>Type<\/th><th>Purpose<\/th><th>Evaluation<\/th><\/tr><\/thead><tbody><tr><td><strong>Humanitarian aid<\/strong><\/td><td>Emergencies<\/td><td>Saves lives; may create dependency; distribution problems in conflict<\/td><\/tr><tr><td><strong>Development aid / ODA<\/strong><\/td><td>Long-term projects (health, education, infrastructure)<\/td><td>Can fill savings gaps; risk of corruption, tied aid, donor priorities. Only a handful of donors (Norway, Sweden, Luxembourg, Denmark, Germany) meet 0.7% of GNI<\/td><\/tr><tr><td><strong>NGOs<\/strong><\/td><td>Grassroots projects<\/td><td>Close to communities; small scale; coordination problems<\/td><\/tr><tr><td><strong>Debt relief<\/strong><\/td><td>Frees revenue for social spending<\/td><td>HIPC (1996) and MDRI cut debts of 37 countries; risk of moral hazard and new debt build-up<\/td><\/tr><tr><td><strong>Multilateral: World Bank<\/strong><\/td><td>Project loans and grants (IDA for the poorest)<\/td><td>Large scale; past criticism of conditions and big projects<\/td><\/tr><tr><td><strong>Multilateral: IMF<\/strong><\/td><td>Loans for BOP crises with conditions (austerity, liberalisation)<\/td><td>Stabilises crises; conditions criticised for harming the poor (structural adjustment in the 1980s–90s)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Aid works when…<\/h5><ul><li>It targets proven interventions (vaccines, bed nets, deworming).<\/li><li>Recipients have good governance and own the strategy.<\/li><li>It is untied and predictable.<\/li><\/ul><\/div><div><h5>Aid fails when…<\/h5><ul><li>It is captured by corrupt elites or used for political goals.<\/li><li>It creates dependency or undermines local markets (food aid hurting local farmers).<\/li><li>It funds projects without local maintenance capacity.<\/li><\/ul><\/div><\/div><\/div>","text":"Type Purpose Evaluation Humanitarian aid Emergencies Saves lives; may create dependency; distribution problems in conflict Development aid / ODA Long-term projects (health, education, infrastructure) Can fill savings gaps; risk of corruption, tied aid, donor priorities. Only a handful of donors (Norway, Sweden, Luxembourg, Denmark, Germany) meet 0.7% of GNI NGOs Grassroots projects Close to communities; small scale; coordination problems Debt relief Frees revenue for social spending HIPC (1996) and MDRI cut debts of 37 countries; risk of moral hazard and new debt build-up Multilateral: World Bank Project loans and grants (IDA for the poorest) Large scale; past criticism of conditions and big projects Multilateral: IMF Loans for BOP crises with conditions (austerity, liberalisation) Stabilises crises; conditions criticised for harming the poor (structural adjustment in the 1980s–90s) Evaluation Aid works when… It targets proven interventions (vaccines, bed nets, deworming). Recipients have good governance and own the strategy. It is untied and predictable. Aid fails when… It is captured by corrupt elites or used for political goals. It creates dependency or undermines local markets (food aid hurting local farmers). It funds projects without local maintenance capacity.","dias":[]},{"id":"e-institutional-change","title":"Institutional change","hl":false,"terms":[["Financial inclusion","Access for individuals and businesses to useful, affordable financial services: accounts, payments, credit, insurance."],["Women's empowerment","Increasing women's ability to make choices: education, legal rights, access to work, credit and political voice."]],"topic":"t4-10","html":"<div class=\"tbl\"><table><thead><tr><th>Change<\/th><th>Why it helps<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><strong>Access to credit and banking<\/strong><\/td><td>Lets the poor save, borrow, invest and insure<\/td><td>Microfinance (Grameen Bank, Muhammad Yunus, Nobel Peace Prize 2006); mobile money M-Pesa in Kenya (credited with lifting about 2% of Kenyan households out of poverty)<\/td><\/tr><tr><td><strong>Property and land rights<\/strong><\/td><td>Security encourages investment; land can be used as collateral<\/td><td>Land titling in Peru, Rwanda<\/td><\/tr><tr><td><strong>Women's empowerment<\/strong><\/td><td>Higher productivity, lower fertility, better child health and education<\/td><td>Bangladesh's garment sector employing women; girls' schooling programmes<\/td><\/tr><tr><td><strong>Reducing corruption<\/strong><\/td><td>Attracts investment; public money reaches services<\/td><td>Georgia's police reforms after 2004; Rwanda's anti-corruption drive<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Microfinance strengths<\/h5><ul><li>Reaches people excluded from banks, especially women.<\/li><li>High repayment rates; builds entrepreneurship.<\/li><\/ul><\/div><div><h5>Microfinance limitations<\/h5><ul><li>Interest rates can be very high; over-indebtedness (Andhra Pradesh crisis, 2010).<\/li><li>Loans often fund consumption, not growth; evidence of big poverty reduction is mixed.<\/li><\/ul><\/div><\/div><\/div>","text":"Change Why it helps Example Access to credit and banking Lets the poor save, borrow, invest and insure Microfinance (Grameen Bank, Muhammad Yunus, Nobel Peace Prize 2006); mobile money M-Pesa in Kenya (credited with lifting about 2% of Kenyan households out of poverty) Property and land rights Security encourages investment; land can be used as collateral Land titling in Peru, Rwanda Women's empowerment Higher productivity, lower fertility, better child health and education Bangladesh's garment sector employing women; girls' schooling programmes Reducing corruption Attracts investment; public money reaches services Georgia's police reforms after 2004; Rwanda's anti-corruption drive Evaluation Microfinance strengths Reaches people excluded from banks, especially women. High repayment rates; builds entrepreneurship. Microfinance limitations Interest rates can be very high; over-indebtedness (Andhra Pradesh crisis, 2010). Loans often fund consumption, not growth; evidence of big poverty reduction is mixed.","dias":[]},{"id":"e-strategies-eval","title":"Evaluating market-oriented approaches vs government intervention, and progress on the SDGs","hl":false,"terms":[["Washington Consensus","A set of market-oriented policies promoted by the IMF and World Bank from the 1980s: fiscal discipline, trade liberalisation, privatisation and deregulation."]],"topic":"t4-10","html":"<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Market-oriented approaches<\/h5><ul><li>Market: efficiency, competition, incentives; attracts FDI; East Asian export success.<\/li><li>Market: lower government spending and debt.<\/li><li>Intervention: provides merit goods, infrastructure and safety nets that markets underprovide.<\/li><li>Intervention: industrial policy helped South Korea, Taiwan and China build industries.<\/li><\/ul><\/div><div><h5>Government intervention<\/h5><ul><li>Market: can widen inequality; ignore merit goods and externalities; volatile capital flows; Washington Consensus reforms in Latin America and Africa produced disappointing growth in the 1990s.<\/li><li>Intervention: risk of government failure, corruption, inefficiency, debt.<\/li><\/ul><\/div><\/div><\/div>\n<p><strong>Most successful strategies combine both<\/strong>: market openness with strong state investment in education, health, infrastructure and institutions (East Asia; Botswana; Rwanda; Vietnam's Đổi Mới reforms).<\/p>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: Progress on the SDGs<\/div><p>Vietnam cut extreme poverty from about 50% in the early 1990s to under 2% through export-led growth and land reform. Bangladesh raised life expectancy above India's and Pakistan's with NGO-led health and microfinance and garment exports. Armenia and Ecuador show mixed progress: gains in poverty and education, but challenges in inequality, environment and dependence on commodities and remittances.<\/p><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>For Paper 1 (b) development essays, avoid generic lists. Pick two or three strategies, link each to a specific barrier in a named country, and judge which suits that country's context.<\/p><\/div>","text":"Evaluation Market-oriented approaches Market: efficiency, competition, incentives; attracts FDI; East Asian export success. Market: lower government spending and debt. Intervention: provides merit goods, infrastructure and safety nets that markets underprovide. Intervention: industrial policy helped South Korea, Taiwan and China build industries. Government intervention Market: can widen inequality; ignore merit goods and externalities; volatile capital flows; Washington Consensus reforms in Latin America and Africa produced disappointing growth in the 1990s. Intervention: risk of government failure, corruption, inefficiency, debt. Most successful strategies combine both : market openness with strong state investment in education, health, infrastructure and institutions (East Asia; Botswana; Rwanda; Vietnam's Đổi Mới reforms). Real-wor
