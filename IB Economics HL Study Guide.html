generations to meet their own needs (Brundtland Report, 1987).","e":"e-sustainable-dev","u":"u4","topic":"t4-7","hl":false},{"t":"Sustainable Development Goals (SDGs)","d":"Seventeen goals adopted by all UN members in 2015, with 169 targets to be met by 2030, covering poverty, health, education, equality, the environment and institutions.","e":"e-sustainable-dev","u":"u4","topic":"t4-7","hl":false},{"t":"Tacit collusion","d":"Cooperation without a formal agreement, e.g. price leadership, where firms follow the price set by a dominant firm.","e":"e-oligopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Tariff","d":"A tax on imported goods.","e":"e-tariffs","u":"u4","topic":"t4-2","hl":false},{"t":"Tax incidence","d":"How the burden of a tax is shared between consumers and producers.","e":"e-ped-significance","u":"u2","topic":"t2-5","hl":false},{"t":"Terms of trade (in comparative advantage)","d":"The rate at which one good is exchanged for another in trade between two countries.","e":"e-comparative-advantage","u":"u4","topic":"t4-1","hl":true},{"t":"Tied aid","d":"Aid that must be spent on goods and services from the donor country.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Time lags","d":"Delays between identifying a problem, deciding on a policy, implementing it and the policy having its full effect.","e":"e-fiscal-eval","u":"u3","topic":"t3-6","hl":false},{"t":"Total cost (TC)","d":"All the costs of producing a given output: fixed costs plus variable costs.","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Total revenue (TR)","d":"The total income a firm receives from sales: price × quantity sold.","e":"e-ped-significance","u":"u2","topic":"t2-5","hl":false},{"t":"Tradable permits","d":"Permits issued by a government allowing firms to emit a set quantity of pollution; firms can buy and sell them, so the total pollution is capped (cap and trade).","e":"e-permits","u":"u2","topic":"t2-8","hl":false},{"t":"Trade creation","d":"When joining a trading bloc shifts production from higher-cost domestic producers to lower-cost producers in other member countries.","e":"e-trading-blocs","u":"u4","topic":"t4-4","hl":false},{"t":"Trade diversion","d":"When joining a trading bloc shifts imports from a lower-cost non-member to a higher-cost member, because of the common external tariff.","e":"e-trading-blocs","u":"u4","topic":"t4-4","hl":false},{"t":"Trade liberalisation","d":"Reducing trade barriers such as tariffs and quotas.","e":"e-market-vs-intervention","u":"u4","topic":"t4-10","hl":false},{"t":"Trade protection (protectionism)","d":"Government measures that restrict free trade to protect domestic producers from foreign competition.","e":"e-tariffs","u":"u4","topic":"t4-2","hl":false},{"t":"Trading bloc","d":"A group of countries that agree to reduce or remove trade barriers among themselves.","e":"e-trading-blocs","u":"u4","topic":"t4-4","hl":false},{"t":"Tragedy of the commons","d":"The overuse and depletion of a common pool resource, because each user acts in their own interest without considering the cost to others.","e":"e-common-pool","u":"u2","topic":"t2-8","hl":false},{"t":"Transfer payments","d":"Payments from the government to individuals for which no good or service is produced in return, e.g. pensions, unemployment benefits, child benefits.","e":"e-other-policies","u":"u3","topic":"t3-4","hl":false},{"t":"Underallocation","d":"Producing less than the socially optimal output (MSB &gt; MSC for the missing units).","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Underemployment","d":"When people work fewer hours than they want, or in jobs below their skill level.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Unemployment","d":"People of working age who are without a job, available for work and actively seeking work.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Unemployment rate","d":"The number of unemployed people as a percentage of the labour force.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Unit elastic demand","d":"When the percentage change in quantity demanded equals the percentage change in price (|PED| = 1).","e":"e-ped","u":"u2","topic":"t2-5","hl":false},{"t":"Universal basic income (UBI)","d":"A regular, unconditional cash payment from the government to every adult, regardless of income or employment.","e":"e-other-policies","u":"u3","topic":"t3-4","hl":false},{"t":"Unsustainable resource use","d":"Using resources faster than they can regenerate, harming future generations.","e":"e-common-pool","u":"u2","topic":"t2-8","hl":false},{"t":"Utility","d":"The satisfaction a consumer gains from consuming a good or service.","e":"e-rational-choice","u":"u2","topic":"t2-4","hl":false},{"t":"Value judgement","d":"A view based on opinions or beliefs about what is good or fair.","e":"e-methodology","u":"u1","topic":"t1-2","hl":false},{"t":"Variable costs","d":"Costs that change with output, e.g. raw materials, hourly wages.","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Wants","d":"Things people desire beyond their basic needs; they are unlimited.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Washington Consensus","d":"A set of market-oriented policies promoted by the IMF and World Bank from the 1980s: fiscal discipline, trade liberalisation, privatisation and deregulation.","e":"e-strategies-eval","u":"u4","topic":"t4-10","hl":false},{"t":"Wealth effect","d":"A fall in the price level raises the real value of household wealth, so consumption rises.","e":"e-ad","u":"u3","topic":"t3-2","hl":false},{"t":"Wealth inequality","d":"Unequal distribution of assets (property, shares, savings) among individuals or households; usually greater than income inequality.","e":"e-measuring-inequality","u":"u3","topic":"t3-4","hl":false},{"t":"Wealth tax","d":"A tax on the value of assets owned.","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Welfare loss","d":"A loss of social surplus caused by producing more or less than the allocatively efficient output (also called deadweight loss).","e":"e-surplus","u":"u2","topic":"t2-3","hl":false},{"t":"Women's empowerment","d":"Increasing women's ability to make choices: education, legal rights, access to work, credit and political voice.","e":"e-institutional-change","u":"u4","topic":"t4-10","hl":false},{"t":"World Bank","d":"The international organisation that lends to and supports developing countries for development projects and poverty reduction.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"World Happiness Report","d":"A UN-backed annual survey ranking countries by how people rate their lives.","e":"e-gdp-wellbeing","u":"u3","topic":"t3-1","hl":false},{"t":"World price","d":"The price at which a good is traded on world markets; a small country takes it as given.","e":"e-trade-benefits","u":"u4","topic":"t4-1","hl":false},{"t":"World Trade Organization (WTO)","d":"The international organisation (founded 1995, 166 members) that sets the rules of world trade, negotiates trade liberalisation and settles trade disputes.","e":"e-integration","u":"u4","topic":"t4-4","hl":false},{"t":"Zero lower bound","d":"The limit on cutting nominal interest rates much below zero, which restricts conventional monetary policy in a deep recession.","e":"e-monetary-eval","u":"u3","topic":"t3-5","hl":false}],"dias":[{"id":"ppc","title":"Production possibilities curve (PPC)","topic":"t1-1","hl":false,"steps":["Label the axes with two goods (e.g. Capital goods, Consumer goods), not price and quantity.","Draw a curve bowed out from the origin (concave) meeting both axes.","Mark a point on the curve (efficient), inside it (unemployed or inefficiently used resources) and outside it (unattainable with current resources and technology).","Show a move along the curve with drop lines to read off the opportunity cost."],"explain":"Every point on the PPC uses all resources efficiently. Moving from A to B gains more of good X but costs some of good Y: that sacrifice is the opportunity cost. The bowed-out shape reflects increasing opportunity cost, because resources are not equally suited to producing both goods.","watch":"The curve is concave to the origin, not a straight line, unless the question says opportunity cost is constant. Point C inside the curve shows unemployment or inefficiency, not \"low demand\".","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Good X (e.g. consumer goods)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-k\" d=\"M54.0,54.1 L57.5,54.7 L61.8,55.3 L67.0,56.1 L72.8,56.9 L79.1,57.7 L85.7,58.8 L92.6,59.9 L99.5,61.2 L106.3,62.6 L112.9,64.3 L119.1,66.1 L124.8,68.1 L130.2,70.4 L135.5,72.8 L140.7,75.5 L145.9,78.3 L150.9,81.4 L155.9,84.5 L160.8,87.8 L165.6,91.2 L170.3,94.7 L174.9,98.2 L179.4,101.9 L183.8,105.6 L188.1,109.2 L192.2,112.7 L196.3,116.2 L200.2,119.8 L204.1,123.4 L207.8,127.2 L211.5,131.2 L215.1,135.5 L218.6,140.2 L222.0,145.3 L225.4,150.9 L228.6,157.0 L231.9,164.1 L235.2,172.4 L238.5,181.6 L241.8,191.4 L244.9,201.5 L248.0,211.7 L250.9,221.8 L253.6,231.4 L256.0,240.3 L258.2,248.2 L260.1,254.9 L261.7,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,68.1 L124.8,68.1\"/>\n<path class=\"dg-drop\" d=\"M124.8,68.1 L124.8,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,105.6 L183.8,105.6\"/>\n<path class=\"dg-drop\" d=\"M183.8,105.6 L183.8,260.0\"/>\n<text class=\"dg-lab dg-tk\" x=\"255.7\" y=\"250.0\" text-anchor=\"start\">PPC<\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"124.8\" cy=\"68.1\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"130.8\" y=\"64.1\" text-anchor=\"start\">A<\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"183.8\" cy=\"105.6\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"189.8\" y=\"101.6\" text-anchor=\"start\">B<\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"129.5\" cy=\"166.4\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"137.5\" y=\"174.4\" text-anchor=\"start\">C<\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"242.8\" cy=\"91.5\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"248.8\" y=\"87.5\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"72.1\" text-anchor=\"end\">Y<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"124.8\" y=\"277.0\" text-anchor=\"middle\">X<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"109.6\" text-anchor=\"end\">Y<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"183.8\" y=\"277.0\" text-anchor=\"middle\">X<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-note dg-tk\" x=\"129.5\" y=\"186.8\" text-anchor=\"middle\" font-size=\"11\" font-style=\"italic\">inefficient / unemployment<\/text>\n<text class=\"dg-note dg-tk\" x=\"247.5\" y=\"76.8\" text-anchor=\"middle\" font-size=\"11\" font-style=\"italic\">unattainable<\/text><\/g><\/svg>"},{"id":"ppc-growth","title":"Economic growth on a PPC","topic":"t1-1","hl":false,"steps":["Draw the original PPC (PPC₁).","Draw a second PPC further from the origin (PPC₂) for potential growth.","Show an arrow from a point inside PPC₁ to a point on it for actual growth (using idle resources).","Label both kinds of growth."],"explain":"An outward shift of the whole curve shows an increase in productive capacity (potential growth), caused by more or better factors of production or better technology. A move from inside the curve towards it is actual growth: output rises because unemployed resources are put back to work. An inward shift follows destruction of resources (war, natural disaster, emigration).","watch":"A shift outward only for one good (biased shift) shows a technological change in that industry only; pivot the curve on the other axis.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Capital goods<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Consumer goods<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-k\" d=\"M54.0,96.2 L56.9,96.7 L60.6,97.3 L64.9,97.9 L69.7,98.5 L75.0,99.3 L80.5,100.1 L86.3,101.1 L92.0,102.2 L97.7,103.4 L103.2,104.7 L108.3,106.2 L113.0,107.9 L117.4,109.7 L121.7,111.7 L125.9,113.8 L130.0,116.0 L134.1,118.4 L138.1,120.9 L142.0,123.5 L145.8,126.3 L149.5,129.1 L153.2,132.1 L156.7,135.2 L160.2,138.3 L163.6,141.6 L167.0,144.8 L170.3,148.2 L173.5,151.7 L176.6,155.2 L179.7,158.9 L182.6,162.8 L185.5,166.8 L188.2,171.1 L190.8,175.5 L193.3,180.2 L195.6,185.1 L197.8,190.6 L199.9,196.8 L201.9,203.6 L203.8,210.8 L205.6,218.1 L207.3,225.5 L208.8,232.7 L210.2,239.5 L211.5,245.9 L212.6,251.5 L213.6,256.3 L214.5,260.0\"/>\n<path class=\"dg-ln dg-k\" d=\"M54.0,44.7 L57.7,45.3 L62.4,45.9 L67.9,46.6 L74.1,47.4 L80.8,48.3 L87.9,49.3 L95.2,50.4 L102.6,51.7 L109.9,53.1 L116.9,54.8 L123.5,56.6 L129.5,58.8 L135.2,61.1 L140.7,63.6 L146.2,66.3 L151.5,69.2 L156.8,72.3 L162.0,75.6 L167.0,79.0 L172.0,82.6 L176.9,86.3 L181.6,90.3 L186.3,94.3 L190.9,98.5 L195.4,102.9 L199.8,107.3 L204.1,111.9 L208.4,116.6 L212.5,121.4 L216.5,126.5 L220.5,131.7 L224.3,137.2 L227.9,142.9 L231.5,148.9 L234.9,1 430\" y=\"290.0\" text-anchor=\"middle\">Gov. spending (G)<\/text>\n<path class=\"fl-arr fl-g\" d=\"M130.0,220.0 L130.0,366.0 L570.0,366.0 L570.0,348.0 M573.3,355.3 L570.0,348.0 L566.7,355.3\"/>\n<text class=\"fl-n fl-tg\" x=\"300\" y=\"362.0\" text-anchor=\"middle\">Import spending (M)<\/text>\n<path class=\"fl-arr fl-c\" d=\"M610.0,300.0 L610.0,220.0 M613.3,227.3 L610.0,220.0 L606.7,227.3\"/>\n<text class=\"fl-n fl-tc\" x=\"604\" y=\"262.0\" text-anchor=\"end\">Exports (X)<\/text>\n<text class=\"fl-n fl-tk\" x=\"330\" y=\"120\" text-anchor=\"middle\">leakages (S, T, M)  ·  injections (I, G, X)<\/text><\/svg>"},{"id":"demand-move","title":"Movement along the demand curve","topic":"t2-1","hl":false,"steps":["Label the axes Price (P) and Quantity (Q).","Draw a downward-sloping demand curve D.","Mark the starting point A at P₁, Q₁ with drop lines.","Mark B at a higher price (contraction) and C at a lower price (extension)."],"explain":"A change in the good's own price causes a movement along the curve, never a shift. A rise from P₁ to P₂ causes a contraction in quantity demanded (A→B); a fall to P₃ causes an extension (A→C). The law of demand: ceteris paribus, price and quantity demanded are inversely related.","watch":"Say \"quantity demanded\" changes, not \"demand\", when price changes.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path .2\"/><\/g><\/svg>"},{"id":"demand-shift","title":"Shifts of the demand curve","topic":"t2-1","hl":false,"steps":["Draw the original demand curve D₁.","Draw D₂ to the right (increase in demand) and D₃ to the left (decrease).","Use one price line P₁ to show that more (Q₂) or less (Q₃) is demanded at every price."],"explain":"A change in any non-price determinant shifts the whole curve: income (normal or inferior good), tastes and preferences, prices of related goods (substitutes and complements), the number of consumers, future price expectations, advertising, demographic change. A rightward shift means more is demanded at every price.","watch":"Arrows go horizontally between curves; do not draw a new curve that crosses the old one.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M115.4,49.4 L290.0,222.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M54.0,63.4 L223.9,231.9\"/>\n<path class=\"dg-ln dg-k\" d=\"M54.0,143.0 L209.8,143.0\" stroke-dasharray=\"6 5\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M209.8,143.0 L209.8,260.0\"/>\n<path class=\"dg-drop\" d=\"M134.2,143.0 L134.2,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"294.0\" y=\"226.6\" text-anchor=\"start\">D<tsp s to Q₂."],"explain":"Lower costs or better technology raise supply. At the old price there is a surplus, so price falls, quantity demanded extends and the market settles at a lower price and higher quantity.","watch":"Demand does not shift.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M124.8,236.6 L290.0,72.8\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,166.4 L195.6,166.4\"/>\n<path class=\"dg-drop\" d=\"M195.6,166.4 L195.6,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"294.0\" y=\"76.8\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y
