p>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Pigouvian / carbon taxes<\/h5><ul><li>\"Polluter pays\": fair and internalises the externality.<\/li><li>Market-based: firms choose the cheapest way to cut pollution, giving a continuing incentive to innovate.<\/li><li>Raise revenue that can fund green investment or offset regressive effects.<\/li><\/ul><\/div><div><h5>Problems<\/h5><ul><li>Hard to measure the external cost in money, so the tax may be set wrongly.<\/li><li>Inelastic demand means output may fall little.<\/li><li>Regressive: hurts low-income households most.<\/li><li>Firms may relocate to countries without the tax (carbon leakage); political resistance.<\/li><\/ul><\/div><\/div><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Subsidies<\/h5><ul><li>Increase consumption of merit goods towards the optimum.<\/li><li>Popular and help low-income groups.<\/li><\/ul><\/div><div><h5>Problems<\/h5><ul><li>Opportunity cost for government budgets.<\/li><li>Difficult to calculate the correct amount; risk of firms keeping the subsidy.<\/li><li>Can create dependency; hard to remove later.<\/li><\/ul><\/div><\/div><\/div>\n<h4>Command-and-control and other policies<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Policy<\/th><th>Example<\/th><th>Strengths<\/th><th>Weaknesses<\/th><\/tr><\/thead><tbody><tr><td><strong>Legislation and regulation<\/strong><\/td><td>Bans on smoking in public places; emissions limits; bans on single-use plastics (EU 2021); ULEZ zones<\/td><td>Direct, certain effect; easy to understand<\/td><td>Monitoring and enforcement costs; no incentive to go beyond the standard; black markets<\/td><\/tr><tr><td><strong>Education and awareness<\/strong><\/td><td>Anti-smoking campaigns; health warnings; campaigns on the value of vaccination<\/td><td>Changes preferences in the long run, shifting MPB<\/td><td>Slow; costly; effect uncertain<\/td><\/tr><tr><td><strong>Nudges<\/strong><\/td><td>Opt-out organ donation; calorie labels<\/td><td>Cheap; preserve choice<\/td><td>Small effects ([[e-behavioural<\/td><td>2.4]])<\/td><\/tr><tr><td><strong>Direct provision<\/strong><\/td><td>State-funded schools and hospitals; vaccination programmes<\/td><td>Guarantees access<\/td><td>High cost; possible inefficiency<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>For a 15-mark evaluation, use this frame for each policy: <strong>effectiveness<\/strong> (how far towards Qopt?), <strong>measurement problems<\/strong>, <strong>costs and opportunity cost<\/strong>, <strong>stakeholders<\/strong> (who gains, who loses: equity), <strong>short run vs long run<\/strong>, and <strong>government failure<\/strong> risk. Finish with a context-dependent judgement.<\/p><\/div>","text":"Market-based policies Pigouvian and carbon taxes shift MPC up to MSC (or MPB down to MSB for consumption). Examples: Sweden's carbon tax (around US$120 per tonne, among the world's highest, since 1991) alongside continued GDP growth; the UK sugar levy on soft drinks (2018) which pushed firms to cut sugar content; congestion charges in London, Stockholm, Singapore and New York (2025). Subsidies for merit goods and positive externalities: free or subsidised vaccines, EV purchase grants, solar panel feed-in tariffs, R&D tax credits. Evaluation Pigouvian / carbon taxes \"Polluter pays\": fair and internalises the externality. Market-based: firms choose the cheapest way to cut pollution, giving a continuing incentive to innovate. Raise revenue that can fund green investment or offset regressive effects. Problems Hard to measure the external cost in money, so the tax may be set wrongly. Inelastic demand means output may fall little. Regressive: hurts low-income households most. Firms may relocate to countries without the tax (carbon leakage); political resistance. Evaluation Subsidies Increase consumption of merit goods towards the optimum. Popular and help low-income groups. Problems Opportunity cost for government budgets. Difficult to calculate the correct amount; risk of firms keeping the subsidy. Can create dependency; hard to remove later. Command-and-control and other policies Policy Example Strengths Weaknesses Legislation and regulation Bans on smoking in public places; emissions limits; bans on single-use plastics (EU 2021); ULEZ zones Direct, certain effect; easy to understand Monitoring and enforcement costs; no incentive to go beyond the standard; black markets Education and awareness Anti-smoking campaigns; health warnings; campaigns on the value of vaccination Changes preferences in the long run, shifting MPB Slow; costly; effect uncertain Nudges Opt-out organ donation; calorie labels Cheap; preserve choice Small effects ([[e-behavioural 2.4]]) Direct provision State-funded schools and hospitals; vaccination programmes Guarantees access High cost; possible inefficiency Exam tip For a 15-mark evaluation, use this frame for each policy: effectiveness (how far towards Qopt?), measurement problems , costs and opportunity cost , stakeholders (who gains, who loses: equity), short run vs long run , and government failure risk. Finish with a context-dependent judgement.","dias":["pigou-tax","subsidy-merit"]},{"id":"e-permits","title":"Tradable permits and international agreements","hl":false,"terms":[["Tradable permits","Permits issued by a government allowing firms to emit a set quantity of pollution; firms can buy and sell them, so the total pollution is capped (cap and trade)."],["International agreement","A treaty between countries to tackle a shared problem, such as the Paris Agreement on climate change."]],"topic":"t2-8","html":"<div class=\"dslot\" data-d=\"permits\"><\/div>\n<p>How cap and trade works: the authority sets a <strong>cap<\/strong>; permits are allocated free or auctioned; firms that cut emissions cheaply sell spare permits; others buy them. The market finds the cheapest way to meet the cap. The cap is cut over time.<\/p>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Tradable permits<\/h5><ul><li>Total pollution is certain (the cap), unlike a tax.<\/li><li>Pollution is cut where it is cheapest; incentive to innovate.<\/li><li>Auctions raise revenue.<\/li><\/ul><\/div><div><h5>Problems<\/h5><ul><li>Setting the cap is hard: the EU ETS issued too many permits after 2008 and prices collapsed below €10/tonne; after reforms they rose above €80.<\/li><li>Free allocations to powerful lobbies; windfall profits.<\/li><li>Monitoring and administrative costs; carbon leakage.<\/li><li>Price volatility makes investment planning hard.<\/li><\/ul><\/div><\/div><\/div>\n<p><strong>Carbon tax vs permits<\/strong>: a tax gives certainty over the <strong>price<\/strong> of pollution; permits give certainty over the <strong>quantity<\/strong>.<\/p>\n<h4>International agreements<\/h4>\n<p>Climate change is a <strong>global<\/strong> negative externality, so national policies alone are weak (free-riding by other countries). Examples: the <strong>Montreal Protocol<\/strong> (1987) phased out ozone-destroying CFCs, widely seen as a success; the <strong>Kyoto Protocol<\/strong> (1997); the <strong>Paris Agreement<\/strong> (2015), with nationally determined contributions to keep warming well below 2°C. Weaknesses: no enforcement, countries can withdraw (the USA left Paris twice), conflicts between developed and developing countries over responsibility and finance.<\/p>","text":"How cap and trade works: the authority sets a cap ; permits are allocated free or auctioned; firms that cut emissions cheaply sell spare permits; others buy them. The market finds the cheapest way to meet the cap. The cap is cut over time. Evaluation Tradable permits Total pollution is certain (the cap), unlike a tax. Pollution is cut where it is cheapest; incentive to innovate. Auctions raise revenue. Problems Setting the cap is hard: the EU ETS issued too many permits after 2008 and prices collapsed below €10/tonne; after reforms they rose above €80. Free allocations to powerful lobbies; windfall profits. Monitoring and administrative costs; carbon leakage. Price volatility makes investment planning hard. Carbon tax vs permits : a tax gives certainty over the price of pollution; permits give certainty over the quantity . International agreements Climate change is a global negative externality, so national policies alone are weak (free-riding by other countries). Examples: the Montreal Protocol (1987) phased out ozone-destroying CFCs, widely seen as a success; the Kyoto Protocol (1997); the Paris Agreement (2015), with nationally determined contributions to keep warming well below 2°C. Weaknesses: no enforcement, countries can withdraw (the USA left Paris twice), conflicts between developed and developing countries over responsibility and finance.","dias":["permits"]},{"id":"e-common-pool","title":"Common pool resources and the tragedy of the commons","hl":false,"terms":[["Common pool resource","A natural resource that is rivalrous (one person's use reduces what is left for others) but non-excludable (people cannot easily be prevented from using it), e.g. fish stocks, forests, groundwater."],["Tragedy of the commons","The overuse and depletion of a common pool resource, because each user acts in their own interest without considering the cost to others."],["Rivalrous","When one person's use of a good reduces its availability to others."],["Non-excludable","When it is impossible or very costly to prevent people from using a good."],["Collective self-governance","Communities managing common resources themselves through shared rules and monitoring, as studied by Elinor Ostrom (Nobel Prize 2009)."],["Unsustainable resource use","Using resources faster than they can regenerate, harming future generations."]],"topic":"t2-8","html":"<p>Because no one owns a common pool resource, each user gains the full benefit of using more while the cost (depletion) is shared by all. The result is <strong>overuse<\/strong>: overfishing (Atlantic cod collapse off Newfoundland, 1992), deforestation in the Amazon, depletion of groundwater in India and California, overgrazing, and the atmosphere as a dump for greenhouse gases.<\/p>\n<p>These are threats to <strong>sustainability<\/strong>: today's use reduces what future generations will have.<\/p>\n<h4>Solutions<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Solution<\/th><th>Example<\/th><th>Evaluation<\/th><\/tr><\/thead><tbody><tr><td><strong>Government regulation<\/strong><\/td><td>Fishing quotas (EU Common Fisheries Policy), protected areas, logging bans<\/td><td>Monitoring is costly; illegal activity; quotas can be set too high<\/td><\/tr><tr><td><strong>Tradable quotas / permits<\/strong><\/td><td>Iceland and New Zealand individual transferable fishing quotas<\/td><td>Effective in some fisheries; may concentrate ownership<\/td><\/tr><tr><td><strong>Legal property rights<\/strong><\/td><td>Granting indigenous communities titles to forest land (e.g. Amazon, Darién Gap)<\/td><td>Owners have an incentive to protect; enforcement needed<\/td><\/tr><tr><td><strong>Collective self-governance<\/strong><\/td><td>Swiss alpine pastures, Spanish huerta irrigation, community forests in Nepal<\/td><td>Ostrom showed it can work where communities are small and stable; harder for global resources<\/td><\/tr><tr><td><strong>International agreements<\/strong><\/td><td>UN High Seas Treaty (2023), Paris Agreement<\/td><td>Needed for global commons; weak enforcement<\/td><\/tr><tr><td><strong>Taxes / subsidies<\/strong><\/td><td>Carbon taxes; subsidies for clean technology<\/td><td>Market-based; measurement problems<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Use common pool resources as the bridge to <strong>sustainability<\/strong> and <strong>4.7<\/strong>: the tragedy of the commons, fossil fuel use and climate change are all linked to SDGs 13, 14 and 15.<\/p><\/div>","text":"Because no one owns a common pool resource, each user gains the full benefit of using more while the cost (depletion) is shared by all. The result is overuse : overfishing (Atlantic cod collapse off Newfoundland, 1992), deforestation in the Amazon, depletion of groundwater in India and California, overgrazing, and the atmosphere as a dump for greenhouse gases. These are threats to sustainability : today's use reduces what future generations will have. Solutions Solution Example Evaluation Government regulation Fishing quotas (EU Common Fisheries Policy), protected areas, logging bans Monitoring is costly; illegal activity; quotas can be set too high Tradable quotas / permits Iceland and New Zealand individual transferable fishing quotas Effective in some fisheries; may concentrate ownership Legal property rights Granting indigenous communities titles to forest land (e.g. Amazon, Darién Gap) Owners have an incentive to protect; enforcement needed Collective self-governance Swiss alpine pastures, Spanish huerta irrigation, community forests in Nepal Ostrom showed it can work where communities are small and stable; harder for global resources International agreements UN High Seas Treaty (2023), Paris Agreement Needed for global commons; weak enforcement Taxes / subsidies Carbon taxes; subsidies for clean technology Market-based; measurement problems Exam tip Use common pool resources as the bridge to sustainability and 4.7 : the tragedy of the commons, fossil fuel use and climate change are all linked to SDGs 13, 14 and 15.","dias":[]}]},{"id":"t2-9","num":"2.9","title":"Market failure: public goods","level":"SL","blurb":"Non-rivalry, non-excludability, the free-rider problem and why governments provide public goods.","entries":[{"id":"e-public-goods","title":"Public goods and the free-rider problem","hl":false,"terms":[["Public good","A good that is non-rivalrous and non-excludable, e.g. national defence, street lighting, lighthouses, flood defences."],["Private good","A good that is rivalrous and excludable, e.g. a sandwich."],["Non-rivalrous","When one person's consumption does not reduce the amount available to others."],["Free-rider problem","When people can benefit from a good without paying for it, so private firms cannot make a profit and will not supply it."],["Quasi-public good","A good with some but not all features of a public good, e.g. a toll-free road that can become congested."]],"topic":"t2-9","html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Excludable<\/th><th>Non-excludable<\/th><\/tr><\/thead><tbody><tr><td><strong>Rivalrous<\/strong><\/td><td>Private goods (food, clothes)<\/td><td>Common pool resources (fish stocks)<\/td><\/tr><tr><td><strong>Non-rivalrous<\/strong><\/td><td>Club goods (streaming services, toll roads)<\/td><td><strong>Public goods<\/strong> (defence, street lights)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Because people cannot be excluded, they can <strong>free ride<\/strong>: enjoy the good without paying. Firms cannot charge, so the market provides <strong>none<\/strong> (or far too little): a <strong>missing market<\/strong>, the most extreme form of market failure.<\/p>\n<h4>Government responses<\/h4>\n<ul><li><strong>Direct provision<\/strong> funded by taxation (defence, police, flood barriers like the Thames Barrier).<\/li><li><strong>Contracting out<\/strong>: government pays private firms to supply (street cleaning, road building).<\/li><li><strong>Subsidies<\/strong> to private suppliers.<\/li><\/ul>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Government provision<\/h5><ul><li>Provides goods the market would not supply at all.<\/li><li>Free at the point of use, so access for all, which improves equity.<\/li><\/ul><\/div><div><h5>Problems<\/h5><ul><li>Opportunity cost: tax revenue has other uses.<\/li><li>Government must estimate how much people value the good (hard to measure).<\/li><li>Risk of inefficiency without competition; political priorities may distort spending.<\/li><\/ul><\/div><\/div><\/div>\n<div class=\"box warn\"><div class=\"box-h\">Common mistakes<\/div><p>Do not confuse <strong>public goods<\/strong> with <strong>merit goods<\/strong>. Firms do provide merit goods (private schools, private hospitals) because people can be charged and excluded; the problem is underconsumption. Firms provide no public goods because of the free-rider problem. Also: \"provided by the government\" does not make something a public good.<\/p><\/div>","text":"Excludable Non-excludable Rivalrous Private goods (food, clothes) Common pool resources (fish stocks) Non-rivalrous Club goods (streaming services, toll roads) Public goods (defence, street lights) Because people cannot be excluded, they can free ride : enjoy the good without paying. Firms cannot charge, so the market provides none (or far too little): a missing market , the most extreme form of market failure. Government responses Direct provision funded by taxation (defence, police, flood barriers like the Thames Barrier). Contracting out : government pays private firms to supply (street cleaning, road building). Subsidies to private suppliers. Evaluation Government provision Provides goods the market would not supply at all. Free at the point of use, so access for all, which improves equity. Problems Opportunity cost: tax revenue has other uses. Government must estimate how much people value the good (hard to measure). Risk of inefficiency without competition; political priorities may distort spending. Common mistakes Do not confuse public goods with merit goods . Firms do provide merit goods (private schools, private hospitals) because people can be charged and excluded; the problem is underconsumption. Firms provide no public goods because of the free-rider problem. Also: \"provided by the government\" does not make something a public good.","dias":[]}]},{"id":"t2-10","num":"2.10","title":"Market failure: asymmetric information","level":"HL","blurb":"When one side knows more than the other: adverse selection, moral hazard, and the responses.","entries":[{"id":"e-asym-info","title":"Asymmetric information, adverse selection and moral hazard","hl":true,"terms":[["Asymmetric information","When one party to a transaction has more or better information than the other, leading to market failure."],["Adverse selection","When asymmetric information before a transaction leads to the wrong people being selected into a market, e.g. high-risk people buying more insurance, or sellers of poor-quality used cars driving good cars out (the \"market for lemons\")."],["Moral hazard","When one party takes more risks after a transaction because someone else bears the cost, e.g. insured drivers driving less carefully, or banks taking risks expecting a bailout."],["Signalling","When the better-informed party reveals information to the other, e.g. warranties, qualifications, brand reputation."],["Screening","When the less-informed party gathers information about the other, e.g. health checks before insurance, credit scores, interviews."]],"topic":"t2-10","html":"<h4>Where it happens<\/h4>\n<ul><li><strong>Sellers know more<\/strong>: used cars (Akerlof's \"lemons\"), second-hand goods, financial products, food quality, medical treatment, tradespeople's quality.<\/li><li><strong>Buyers know more<\/strong>: insurance (the customer knows their own health or driving habits), loans (the borrower knows their ability to repay).<\/li><\/ul>\n<h4>Adverse selection vs moral hazard<\/h4>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th>Timing<\/th><th>Example<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td><strong>Adverse selection<\/strong><\/td><td>Before the deal<\/td><td>High-risk people buy health insurance; insurers raise premiums; low-risk people leave<\/td><td>Market shrinks or collapses<\/td><\/tr><tr><td><strong>Moral hazard<\/strong><\/td><td>After the deal<\/td><td>Banks \"too big to fail\" took huge risks before 2008; insured people take less care<\/td><td>Excessive risk, costs pushed onto others<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Responses<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Response<\/th><th>Examples<\/th><th>Limitations<\/th><\/tr><\/thead><tbody><tr><td><strong>Legislation and regulation<\/strong><\/td><td>Consumer protection laws, mandatory disclosure, licensing of doctors, financial regulation after 2008 (Basel III), compulsory insurance<\/td><td>Costs of enforcement; regulatory capture<\/td><\/tr><tr><td><strong>Provision of information by government<\/strong><\/td><td>Food labelling, hygiene ratings, energy-efficiency labels, health campaigns<\/td><td>Consumers may ignore it; costly<\/td><\/tr><tr><td><strong>Signalling (private)<\/strong><\/td><td>Warranties, certified pre-owned cars, degrees, brand reputation, online reviews<\/td><td>Fake reviews; costly to signal<\/td><\/tr><tr><td><strong>Screening (private)<\/strong><\/td><td>Medical checks, credit checks, car inspections, insurance excess (\"deductibles\")<\/td><td>Costly; privacy concerns; may exclude vulnerable people<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Asymmetric information is also a strong evaluation point elsewhere: it explains why merit goods are underconsumed and demerit goods overconsumed, and why financial crises happen.<\/p><\/div>","text":"Where it happens Sellers know more : used cars (Akerlof's \"lemons\"), second-hand goods, financial products, food quality, medical treatment, tradespeople's quality. Buyers know more : insurance (the customer knows their own health or driving habits), loans (the borrower knows their ability to repay). Adverse selection vs moral hazard Timing Example Result Adverse selection Before the deal High-risk people buy health insurance; insurers raise premiums; low-risk people leave Market shrinks or collapses Moral hazard After the deal Banks \"too big to fail\" took huge risks before 2008; insured people take less care Excessive risk, costs pushed onto others Responses Response Examples Limitations Legislation and regulation Consumer protection laws, mandatory disclosure, licensing of doctors, financial regulation after 2008 (Basel III), compulsory insurance Costs of enforcement; regulatory capture Provision of information by government Food labelling, hygiene ratings, energy-efficiency labels, health campaigns Consumers may ignore it; costly Signalling (private) Warranties, certified pre-owned cars, degrees, brand reputation, online reviews Fake reviews; costly to signal Screening (private) Medical checks, credit checks, car inspections, insurance excess (\"deductibles\") Costly; privacy concerns; may exclude vulnerable people Exam tip Asymmetric information is also a strong evaluation point elsewhere: it explains why merit goods are underconsumed and demerit goods overconsumed, and why financial crises happen.","dias":[]}]},{"id":"t2-11","num":"2.11","title":"Market failure: market power","level":"HL","blurb":"Costs and revenues, profit maximisation, the four market structures, efficiency, and how governments control market power.","entries":[{"id":"e-market-structures","title":"Market structures and market power","hl":true,"terms":[["Market structure","The characteristics of a market that determine how firms behave: number and size of firms, type of product, barriers to entry and information."],["Market power","The ability of a firm to influence the price of its product (price maker); also called monopoly power."],["Barriers to entry","Obstacles that make it difficult for new firms to enter a market, e.g. economies of scale, legal barriers, brand loyalty, control of resources, high start-up costs."],["Price taker","A firm that must accept the market price because it is too small to influence it."],["Price maker","A firm with enough market power to set its own price."],["Concentration ratio","The combined market share of the largest firms in an industry, e.g. CR4 = share of the four largest firms."]],"topic":"t2-11","html":"<div class=\"tbl\"><table><thead><tr><th><\/th><th>Perfect competition<\/th><th>Monopolistic competition<\/th><th>Oligopoly<\/th><th>Monopoly<\/th><\/tr><\/thead><tbody><tr><td>Number of firms<\/td><td>Very many<\/td><td>Many<\/td><td>A few dominant<\/td><td>One<\/td><\/tr><tr><td>Product<\/td><td>Homogeneous (identical)<\/td><td>Differentiated<\/td><td>Homogeneous or differentiated<\/td><td>Unique, no close substitutes<\/td><\/tr><tr><td>Barriers to entry<\/td><td>None<\/td><td>Low<\/td><td>High<\/td><td>Very high<\/td><\/tr><tr><td>Price setting<\/td><td>Price taker<\/td><td>Some power<\/td><td>Interdependent price makers<\/td><td>Price maker<\/td><\/tr><tr><td>Long-run profit<\/td><td>Normal<\/td><td>Normal<\/td><td>Can be abnormal<\/td><td>Abnormal<\/td><\/tr><tr><td>Demand curve<\/td><td>Perfectly elastic<\/td><td>Downward, elastic<\/td><td>Downward (kinked?)<\/td><td>Downward, the market demand<\/td><\/tr><tr><td>Examples<\/td><td>Agricultural commodities, foreign exchange (approximations)<\/td><td>Restaurants, hairdressers, clothing<\/td><td>Supermarkets, airlines, smartphones, banks<\/td><td>Water utilities, patented drugs, Google in search<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Barriers to entry<\/h4>\n<ul><li><strong>Economies of scale<\/strong> (natural monopoly): incumbents' low costs undercut entrants.<\/li><li><strong>Legal barriers<\/strong>: patents, copyrights, licences, franchises.<\/li><li><strong>Control of essential resources<\/strong> (De Beers and diamonds historically).<\/li><li><strong>Brand loyalty and advertising<\/strong> (Coca-Cola, Apple).<\/li><li><strong>High sunk costs / start-up costs<\/strong> (aircraft manufacturing: Airbus and Boeing).<\/li><li><strong>Network effects<\/strong> (social media, operating systems).<\/li><li><strong>Anti-competitive behaviour<\/strong>: predatory pricing, exclusive contracts.<\/li><\/ul>","text":"Perfect competition Monopolistic competition Oligopoly Monopoly Number of firms Very many Many A few dominant One Product Homogeneous (identical) Differentiated Homogeneous or differentiated Unique, no close substitutes Barriers to entry None Low High Very high Price setting Price taker Some power Interdependent price makers Price maker Long-run profit Normal Normal Can be abnormal Abnormal Demand curve Perfectly elastic Downward, elastic Downward (kinked?) Downward, the market demand Examples Agricultural commodities, foreign exchange (approximations) Restaurants, hairdressers, clothing Supermarkets, airlines, smartphones, banks Water utilities, patented drugs, Google in search Barriers to entry Economies of scale (natural monopoly): incumbents' low costs undercut entrants. Legal barriers : patents, copyrights, licences, franchises. Control of essential resources (De Beers and diamonds historically). Brand loyalty and advertising (Coca-Cola, Apple). High sunk costs / start-up costs (aircraft manufacturing: Airbus and Boeing). Network effects (social media, operating systems). Anti-competitive behaviour : predatory pricing, exclusive contracts.","dias":[]},{"id":"e-profit-max","title":"Costs, revenues and profit maximisation","hl":true,"terms":[["Total cost (TC)","All the costs of producing a given output: fixed costs plus variable costs."],["Fixed costs","Costs that do not change with output in the short run, e.g. rent, insurance."],["Variable costs","Costs that change with output, e.g. raw materials, hourly wages."],["Average total cost (ATC)","Total cost divided by output."],["Average revenue (AR)","Total revenue divided by quantity sold; equal to price."],["Marginal revenue (MR)","The additional revenue from selling one more unit."],["Normal profit","The minimum profit needed to keep a firm in its current industry; when TR = TC (economic costs include the opportunity cost of the entrepreneur)."],["Abnormal profit","Profit above normal profit (TR > TC); also called supernormal or economic profit."],["Loss","When total revenue is less than total cost (TR < TC)."],["Profit maximisation rule","A firm maximises profit by producing where MC = MR (with MC rising)."]],"topic":"t2-11","html":"<div class=\"dslot\" data-d=\"cost-curves\"><\/div>\n<div class=\"dslot\" data-d=\"revenue-curves\"><\/div>\n<h4>Economic profit<\/h4>\n<p>Economists include <strong>opportunity costs<\/strong> in costs, so <strong>normal profit<\/strong> (TR = TC) is the return just high enough to keep resources in their current use.<\/p>\n<ul><li><strong>Abnormal profit<\/strong>: TR &gt; TC (AR &gt; ATC). Attracts entry if barriers allow.<\/li><li><strong>Normal profit<\/strong>: TR = TC (AR = ATC).<\/li><li><strong>Loss<\/strong>: TR &lt; TC. In the short run, produce if AR ≥ AVC; in the long run, leave if AR &lt; ATC.<\/li><\/ul>\n<h4>Why MC = MR?<\/h4>\n<p>If MR &gt; MC, one more unit adds more to revenue than to cost: profit rises, so expand. If MC &gt; MR, the last unit lost money: cut output. Profit is maximised where <strong>MC = MR<\/strong>.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Output<\/th><th>MR ($)<\/th><th>MC ($)<\/th><th>Change in profit<\/th><\/tr><\/thead><tbody><tr><td>4th unit<\/td><td>20<\/td><td>12<\/td><td>+8 → produce<\/td><\/tr><tr><td>5th unit<\/td><td>18<\/td><td>18<\/td><td>0 → profit-maximising output<\/td><\/tr><tr><td>6th unit<\/td><td>16<\/td><td>24<\/td><td>−8 → do not produce<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"dslot\" data-d=\"lrac\"><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Profit from a diagram or table<\/div><p>Instants PLC produces 3,000 units a month; price $60, ATC $64, AVC $56. TR = 60 × 3,000 = $180,000. TC = 64 × 3,000 = $192,000. <strong>Loss = $12,000<\/strong>. Should it keep producing in the short run? Yes: P ($60) &gt; AVC ($56), so revenue covers variable costs and contributes $4 × 3,000 = $12,000 towards fixed costs of $24,000 (= (64 − 56) × 3,000). Shutting down would lose all $24,000.<\/p><\/div>","text":"Economic profit Economists include opportunity costs in costs, so normal profit (TR = TC) is the return just high enough to keep resources in their current use. Abnormal profit : TR > TC (AR > ATC). Attracts entry if barriers allow. Normal profit : TR = TC (AR = ATC). Loss : TR < TC. In the short run, produce if AR ≥ AVC; in the long run, leave if AR < ATC. Why MC = MR? If MR > MC, one more unit adds more to revenue than to cost: profit rises, so expand. If MC > MR, the last unit lost money: cut output. Profit is maximised where MC = MR . Output MR ($) MC ($) Change in profit 4th unit 20 12 +8 → produce 5th unit 18 18 0 → profit-maximising output 6th unit 16 24 −8 → do not produce Worked example: Profit from a diagram or table Instants PLC produces 3,000 units a month; price $60, ATC $64, AVC $56. TR = 60 × 3,000 = $180,000. TC = 64 × 3,000 = $192,000. Loss = $12,000 . Should it keep producing in the short run? Yes: P ($60) > AVC ($56), so revenue covers variable costs and contributes $4 × 3,000 = $12,000 towards fixed costs of $24,000 (= (64 − 56) × 3,000). Shutting down would lose all $24,000.","dias":["cost-curves","revenue-curves","lrac"]},{"id":"e-perfect-competition","title":"Perfect competition","hl":true,"terms":[["Perfect competition","A market structure with very many small firms selling an identical product, perfect information, and no barriers to entry or exit."],["Productive efficiency (firm)","Producing at the lowest point of the average total cost curve."],["Allocative efficiency (firm)","Producing where price equals marginal cost (P = MC)."],["Shut-down price","The price equal to minimum average variable cost, below which a firm stops producing in the short run."],["Break-even price","The price equal to minimum average total cost, at which a firm earns normal profit."]],"topic":"t2-11","html":"<p><strong>Assumptions<\/strong>: very many buyers and sellers; homogeneous product; perfect information; perfect factor mobility; free entry and exit. Each firm is a <strong>price taker<\/strong>: its demand curve is perfectly elastic at the market price (P = AR = MR).<\/p>\n<div class=\"dslot\" data-d=\"pc-sr-profit\"><\/div>\n<p><strong>Short run → long run (abnormal profit)<\/strong>: profit attracts new firms; industry supply shifts right; the price falls until it reaches minimum ATC and only normal profit remains.<\/p>\n<div class=\"dslot\" data-d=\"pc-sr-loss\"><\/div>\n<p><strong>Short run → long run (losses)<\/strong>: firms leave; supply shifts left; price rises to minimum ATC.<\/p>\n<div class=\"dslot\" data-d=\"pc-lr\"><\/div>\n<div class=\"dslot\" data-d=\"pc-shutdown\"><\/div>\n<h4>Efficiency<\/h4>\n<p>In long-run equilibrium <strong>P = MC<\/strong> (allocatively efficient) and output is at <strong>minimum ATC<\/strong> (productively efficient). This is the benchmark.<\/p>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Strengths<\/h5><ul><li>Allocative and productive efficiency in the long run.<\/li><li>Low prices; no abnormal profit at consumers' expense; consumer sovereignty.<\/li><\/ul><\/div><div><h5>Weaknesses<\/h5><ul><li>Unrealistic assumptions: no real market fits fully (agriculture and forex come close).<\/li><li>Firms are too small for economies of scale; no abnormal profit to fund R&amp;D, so weak dynamic efficiency.<\/li><li>Identical products mean no variety.<\/li><\/ul><\/div><\/div><\/div>","text":"Assumptions : very many buyers and sellers; homogeneous product; perfect information; perfect factor mobility; free entry and exit. Each firm is a price taker : its demand curve is perfectly elastic at the market price (P = AR = MR). Short run → long run (abnormal profit) : profit attracts new firms; industry supply shifts right; the price falls until it reaches minimum ATC and only normal profit remains. Short run → long run (losses) : firms leave; supply shifts left; price rises to minimum ATC. Efficiency In long-run equilibrium P = MC (allocatively efficient) and output is at minimum ATC (productively efficient). This is the benchmark. Evaluation Strengths Allocative and productive efficiency in the long run. Low prices; no abnormal profit at consumers' expense; consumer sovereignty. Weaknesses Unrealistic assumptions: no real market fits fully (agriculture and forex come close). Firms are too small for economies of scale; no abnormal profit to fund R&D, so weak dynamic efficiency. Identical products mean no variety.","dias":["pc-sr-profit","pc-sr-loss","pc-lr","pc-shutdown"]},{"id":"e-monopoly","title":"Monopoly and natural monopoly","hl":true,"terms":[["Monopoly","A market structure with a single seller of a product with no close substitutes, protected by high barriers to entry."],["Natural monopoly","A market where economies of scale are so large that one firm can supply the whole market at a lower average cost than two or more firms."],["Dynamic efficiency","Efficiency over time, through innovation, new products and falling costs."]],"topic":"t2-11","html":"<div class=\"dslot\" data-d=\"monopoly\"><\/div>\n<p>A monopolist faces the market demand curve, so AR slopes down and MR lies below it. It maximises profit at <strong>MC = MR<\/strong> and earns <strong>abnormal profit in the long run<\/strong> because barriers stop entry. (It can also make normal profit or short-run losses if demand is weak.)<\/p>\n<div class=\"dslot\" data-d=\"monopoly-welfare\"><\/div>\n<h4>Costs and benefits<\/h4>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th>Disadvantages<\/th><th>Possible advantages<\/th><\/tr><\/thead><tbody><tr><td>Consumers<\/td><td>Higher prices, less output, less choice; loss of consumer surplus<\/td><td>Abnormal profit may fund innovation (pharmaceuticals); cross-subsidisation<\/td><\/tr><tr><td>Efficiency<\/td><td>Allocatively inefficient (P &gt; MC); not productively efficient; X-inefficiency (lazy management)<\/td><td>Economies of scale may give lower costs than competitive firms<\/td><\/tr><tr><td>Workers and suppliers<\/td><td>Monopsony power over suppliers and workers; fewer employers<\/td><td>Higher wages from profits; large orders for suppliers<\/td><\/tr><tr><td>Economy<\/td><td>Welfare loss; inequality (profits to owners)<\/td><td>Global competitiveness of national champions; dynamic efficiency<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"dslot\" data-d=\"natural-monopoly\"><\/div>\n<p><strong>Natural monopoly<\/strong> (water, rail networks, electricity grids): breaking it up would raise costs, so governments <strong>regulate<\/strong> prices (marginal-cost pricing = efficient but loss-making; average-cost pricing = break-even) or own the firm.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Evaluate monopoly fairly: Amazon and Google became dominant partly by being very good at what they do (low costs, innovation). The question is whether they now abuse that power.<\/p><\/div>","text":"A monopolist faces the market demand curve, so AR slopes down and MR lies below it. It maximises profit at MC = MR and earns abnormal profit in the long run because barriers stop entry. (It can also make normal profit or short-run losses if demand is weak.) Costs and benefits Disadvantages Possible advantages Consumers Higher prices, less output, less choice; loss of consumer surplus Abnormal profit may fund innovation (pharmaceuticals); cross-subsidisation Efficiency Allocatively inefficient (P > MC); not productively efficient; X-inefficiency (lazy management) Economies of scale may give lower costs than competitive firms Workers and suppliers Monopsony power over suppliers and workers; fewer employers Higher wages from profits; large orders for suppliers Economy Welfare loss; inequality (profits to owners) Global competitiveness of national champions; dynamic efficiency Natural monopoly (water, rail networks, electricity grids): breaking it up would raise costs, so governments regulate prices (marginal-cost pricing = efficient but loss-making; average-cost pricing = break-even) or own the firm. Exam tip Evaluate monopoly fairly: Amazon and Google became dominant partly by being very good at what they do (low costs, innovation). The question is whether they now abuse that power.","dias":["monopoly","monopoly-welfare","natural-monopoly"]},{"id":"e-monopolistic-competition","title":"Monopolistic competition","hl":true,"terms":[["Monopolistic competition","A market structure with many firms selling differentiated products, with low barriers to entry."],["Product differentiation","Making a product different from rivals' through branding, quality, design, location or service."],["Excess capacity","When a firm produces below the output that minimises average total cost."],["Non-price competition","Competing through means other than price, such as advertising, branding, quality, loyalty schemes and after-sales service."]],"topic":"t2-11","html":"<div class=\"dslot\" data-d=\"monopolistic-comp\"><\/div>\n<p>Each firm has a little market power from <strong>differentiation<\/strong>, so its demand curve slopes down (but is fairly elastic: many substitutes). <strong>Short run<\/strong>: abnormal profit or loss. <strong>Long run<\/strong>: entry (or exit) shifts each firm's demand until AR is tangent to ATC: <strong>normal profit<\/strong>.<\/p>\n<p><strong>Efficiency<\/strong>: P &gt; MC (allocatively inefficient) and output below minimum ATC (productively inefficient: <strong>excess capacity<\/strong>). But consumers gain <strong>variety and choice<\/strong>, which they value.<\/p>","text":"Each firm has a little market power from differentiation , so its demand curve slopes down (but is fairly elastic: many substitutes). Short run : abnormal profit or loss. Long run : entry (or exit) shifts each firm's demand until AR is tangent to ATC: normal profit . Efficiency : P > MC (allocatively inefficient) and output below minimum ATC (productively inefficient: excess capacity ). But consumers gain variety and choice , which they value.","dias":["monopolistic-comp"]},{"id":"e-oligopoly","title":"Oligopoly, collusion and game theory","hl":true,"terms":[["Oligopoly","A market dominated by a few large, interdependent firms with high barriers to entry."],["Interdependence","Each oligopolist's decisions affect its rivals, so each must consider how rivals will react."],["Collusion","An agreement between firms to limit competition, for example by fixing prices or sharing out markets."],["Cartel","A formal collusive agreement among firms or countries to restrict output and raise prices, e.g. OPEC."],["Tacit collusion","Cooperation without a formal agreement, e.g. price leadership, where firms follow the price set by a dominant firm."],["Game theory","The study of strategic decision-making when the outcome for each player depends on the choices of others."],["Prisoner's dilemma","A game in which both players would gain by cooperating, but each has an incentive to cheat, so both end up worse off."],["Price war","Repeated price cutting by rival firms to gain market share, reducing profits for all."]],"topic":"t2-11","html":"<h4>Concentration ratios<\/h4>\n<p>A <strong>CR4<\/strong> of 74% means the four largest firms have 74% of sales. UK groceries (2022): Tesco 27%, Sainsbury's 15%, Asda 14%, Aldi 9% → CR4 ≈ 65%. A concentration ratio above about 50% for the top four suggests oligopoly.<\/p>\n<h4>Collusive vs non-collusive behaviour<\/h4>\n<p>Firms are tempted to <strong>collude<\/strong> to act like a monopoly and share abnormal profits. Collusion is easier with few firms, similar costs, high barriers, stable demand and weak regulation. <strong>Formal collusion<\/strong> is illegal in most countries (EU trucks cartel fined €2.9bn in 2016; US and EU fines on banks for rigging LIBOR and FX rates). <strong>OPEC+<\/strong> is a legal cartel of oil-producing countries. <strong>Tacit collusion<\/strong>: price leadership, following rivals' prices.<\/p>\n<h4>Game theory<\/h4>\n<div class=\"tbl\"><table><thead><tr><th><\/th><th><strong>Firm B: high price<\/strong><\/th><th><strong>Firm B: low price<\/strong><\/th><\/tr><\/thead><tbody><tr><td><strong>Firm A: high price<\/strong><\/td><td>A $10m, B $10m<\/td><td>A $2m, B $14m<\/td><\/tr><tr><td><strong>Firm A: low price<\/strong><\/td><td>A $14m, B $2m<\/td><td>A $5m, B $5m<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Whatever B does, A earns more by pricing low (14 &gt; 10, 5 &gt; 2), and the same for B. Both choose low and earn $5m: the <strong>Nash equilibrium<\/strong>. Both would be better off at high/high ($10m each) if they could trust each other: the <strong>prisoner's dilemma<\/strong>, which explains both price wars and the incentive to collude (and to cheat on collusion).<\/p>\n<h4>Price and non-price competition<\/h4>\n<p>Price competition is risky (price wars, e.g. budget airlines; UK supermarket price matching). Oligopolists prefer <strong>non-price competition<\/strong>: branding, advertising, loyalty cards, product innovation, sponsorship (Nike, Adidas), packaging, after-sales service, celebrity and influencer endorsement.<\/p>\n<div class=\"dslot\" data-d=\"kinked-demand\"><\/div>\n<div class=\"box key\"><div class=\"box-h\">Key idea: Kinked demand curve<\/div><p>The kinked demand curve is a classic way to explain why oligopoly prices are \"sticky\"; it is a useful extension in essays on oligopoly even though the current guide focuses on game theory.<\/p><\/div>","text":"Concentration ratios A CR4 of 74% means the four largest firms have 74% of sales. UK groceries (2022): Tesco 27%, Sainsbury's 15%, Asda 14%, Aldi 9% → CR4 ≈ 65%. A concentration ratio above about 50% for the top four suggests oligopoly. Collusive vs non-collusive behaviour Firms are tempted to collude to act like a monopoly and share abnormal profits. Collusion is easier with few firms, similar costs, high barriers, stable demand and weak regulation. Formal collusion is illegal in most countries (EU trucks cartel fined €2.9bn in 2016; US and EU fines on banks for rigging LIBOR and FX rates). OPEC+ is a legal cartel of oil-producing countries. Tacit collusion : price leadership, following rivals' prices. Game theory Firm B: high price Firm B: low price Firm A: high price A $10m, B $10m A $2m, B $14m Firm A: low price A $14m, B $2m A $5m, B $5m Whatever B does, A earns more by pricing low (14 > 10, 5 > 2), and the same for B. Both choose low and earn $5m: the Nash equilibrium . Both would be better off at high/high ($10m each) if they could trust each other: the prisoner's dilemma , which explains both price wars and the incentive to collude (and to cheat on collusion). Price and non-price competition Price competition is risky (price wars, e.g. budget airlines; UK supermarket price matching). Oligopolists prefer non-price competition : branding, advertising, loyalty cards, product innovation, sponsorship (Nike, Adidas), packaging, after-sales service, celebrity and influencer endorsement. Key idea: Kinked demand curve The kinked demand curve is a classic way to explain why oligopoly prices are \"sticky\"; it is a useful extension in essays on oligopoly even though the current guide focuses on game theory.","dias":["kinked-demand"]},{"id":"e-market-power-policy","title":"Market power and government intervention","hl":true,"terms":[["Competition policy","Government laws and regulators that promote competition and prevent abuse of market power, e.g. blocking mergers and fining cartels."],["Nationalisation","When the government takes ownership of a private firm or industry."],["Price regulation","Government control of the prices charged by firms with market power, e.g. price caps on utilities."],["Monopsony","A market with a single (or dominant) buyer, which can push down the prices it pays to suppliers or the wages it pays workers."]],"topic":"t2-11","html":"<h4>Is market power good or bad?<\/h4>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Possible benefits<\/h5><ul><li>Economies of scale → lower costs and prices.<\/li><li>Abnormal profits fund R&amp;D and innovation (dynamic efficiency).<\/li><li>Size helps firms compete globally.<\/li><\/ul><\/div><div><h5>Costs<\/h5><ul><li>Higher prices, lower output, welfare loss.<\/li><li>Less choice; less incentive to innovate or control costs (X-inefficiency).<\/li><li>Abuse of dominance: predatory pricing, exclusive deals, monopsony squeezes on suppliers and workers.<\/li><li>Political power and lobbying.<\/li><\/ul><\/div><\/div><\/div>\n<h4>Government responses<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Tool<\/th><th>How it works<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td><strong>Competition law and regulators<\/strong><\/td><td>Ban cartels and abuse of dominance; investigate and block mergers<\/td><td>EU fined Google €2.4bn (2017, shopping) and €4.3bn (2018, Android); UK CMA blocked then cleared revised Microsoft–Activision deal (2023); US v Google search ruling (2024)<\/td><\/tr><tr><td><strong>Fines<\/strong><\/td><td>Penalties large enough to deter<\/td><td>EU Digital Markets Act (2024): fines up to 10% of global turnover<\/td><\/tr><tr><td><strong>Price regulation<\/strong><\/td><td>Caps on prices of natural monopolies<\/td><td>UK water (Ofwat) and energy price cap (Ofgem)<\/td><\/tr><tr><td><strong>Breaking up monopolies<\/strong><\/td><td>Split dominant firms<\/td><td>Standard Oil (1911), AT&amp;T (1984)<\/td><\/tr><tr><td><strong>Nationalisation<\/strong><\/td><td>Government ownership<\/td><td>UK rail franchises returned to public ownership from 2025<\/td><\/tr><tr><td><strong>Protecting suppliers and workers<\/strong><\/td><td>Laws against monopsony abuse, minimum wages<\/td><td>UK Groceries Code Adjudicator<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Government failure applies here too: regulators may lack information, be slow, or suffer <strong>regulatory capture<\/strong> (being influenced by the firms they regulate).<\/p><\/div>","text":"Is market power good or bad? Evaluation Possible benefits Economies of scale → lower costs and prices. Abnormal profits fund R&D and innovation (dynamic efficiency). Size helps firms compete globally. Costs Higher prices, lower output, welfare loss. Less choice; less incentive to innovate or control costs (X-inefficiency). Abuse of dominance: predatory pricing, exclusive deals, monopsony squeezes on suppliers and workers. Political power and lobbying. Government responses Tool How it works Examples Competition law and regulators Ban cartels and abuse of dominance; investigate and block mergers EU fined Google €2.4bn (2017, shopping) and €4.3bn (2018, Android); UK CMA blocked then cleared revised Microsoft–Activision deal (2023); US v Google search ruling (2024) Fines Penalties large enough to deter EU Digital Markets Act (2024): fines up to 10% of global turnover Price regulation Caps on prices of natural monopolies UK water (Ofwat) and energy price cap (Ofgem) Breaking up monopolies Split dominant firms Standard Oil (1911), AT&T (1984) Nationalisation Government ownership UK rail franchises returned to public ownership from 2025 Protecting suppliers and workers Laws against monopsony abuse, minimum wages UK Groceries Code Adjudicator Exam tip Government failure applies here too: regulators may lack information, be slow, or suffer regulatory capture (being influenced by the firms they regulate).","dias":[]}]},{"id":"t2-12","num":"2.12","title":"The market's inability to achieve equity","level":"SL","blurb":"Why free markets can produce unequal outcomes, and how this links to Unit 3's inequality policies.","entries":[{"id":"e-equity","title":"Markets and inequality","hl":false,"terms":[["Equality","Everyone having the same income, wealth or opportunities; a positive (measurable) idea."],["Inequity","Unfairness in the distribution of income, wealth or opportunity; a normative judgement."],["Factor endowments","The quantity and quality of factors of production a person or country owns."]],"topic":"t2-12","html":"<p>Free markets reward people according to the <strong>factors of production they own<\/strong> and how scarce those factors are. People with valuable skills, capital or land earn high incomes; those with little to sell earn little. There is no mechanism in the market that ensures a fair outcome.<\/p>\n<h4>Why markets create inequality<\/h4>\n<ul><li><strong>Unequal ownership of factors<\/strong>: wealth and capital are concentrated; returns to capital can grow faster than wages (Piketty's r &gt; g argument).<\/li><li><strong>Differences in human capital<\/strong>: education and skills command high wages.<\/li><li><strong>Inheritance<\/strong>: wealth passes between generations.<\/li><li><strong>Market power<\/strong>: monopolists and powerful employers capture income.<\/li><li><strong>Discrimination<\/strong>: by gender, ethnicity, caste or disability.<\/li><li><strong>Technological change<\/strong>: rewards high-skilled workers and replaces routine jobs.<\/li><li><strong>Unequal access to merit goods<\/strong>: low-income families cannot afford good education or healthcare, so inequality persists across generations.<\/li><\/ul>\n<h4>The circular flow view<\/h4>\n<p>Households receive factor incomes in proportion to what they own; government can redistribute by <strong>taxing<\/strong> (leakage) higher incomes and making <strong>transfer payments<\/strong> and providing <strong>public services<\/strong> (injection), which reduces inequality (<a class=\"xref\" href=\"#t3-4\">3.4<\/a>).<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Equity is a normative concept: what counts as \"fair\" is a value judgement. In essays, say whose idea of fairness you are using (equality of outcome vs equality of opportunity).<\/p><\/div>","text":"Free markets reward people according to the factors of production they own and how scarce those factors are. People with valuable skills, capital or land earn high incomes; those with little to sell earn little. There is no mechanism in the market that ensures a fair outcome. Why markets create inequality Unequal ownership of factors : wealth and capital are concentrated; returns to capital can grow faster than wages (Piketty's r > g argument). Differences in human capital : education and skills command high wages. Inheritance : wealth passes between generations. Market power : monopolists and powerful employers capture income. Discrimination : by gender, ethnicity, caste or disability. Technological change : rewards high-skilled workers and replaces routine jobs. Unequal access to merit goods : low-income families cannot afford good education or healthcare, so inequality persists across generations. The circular flow view Households receive factor incomes in proportion to what they own; government can redistribute by taxing (leakage) higher incomes and making transfer payments and providing public services (injection), which reduces inequality ( 3.4 ). Exam tip Equity is a normative concept: what counts as \"fair\" is a value judgement. In essays, say whose idea of fairness you are using (equality of outcome vs equality of opportunity).","dias":[]}]}]},{"id":"u3","title":"Macroeconomics","blurb":"The economy as a whole: measuring output, AD–AS, growth, unemployment, inflation, inequality, and the policies governments use.","topics":[{"id":"t3-1","num":"3.1","title":"Measuring economic activity and illustrating its variations","level":"SL","blurb":"GDP and GNI, real vs nominal, per capita and PPP, GDP as a measure of well-being, and the business cycle.","entries":[{"id":"e-measuring-output","title":"The circular flow and three ways to measure national income","hl":false,"terms":[["Gross domestic product (GDP)","The total value of all final goods and services produced within a country in a given period, usually a year."],["National income","The total income earned in an economy; output = income = expenditure in the circular flow."],["Output approach","Measuring GDP by adding the value of output (value added) produced by every industry."],["Income approach","Measuring GDP by adding all incomes earned: wages, rent, interest and profit."],["Expenditure approach","Measuring GDP by adding all spending on final goods and services: C + I + G + (X − M)."],["Consumption (C)","Spending by households on goods and services."],["Investment (I)","Spending by firms on capital goods, such as machinery, buildings and stocks."],["Government spending (G)","Spending by the government on goods and services (not transfer payments)."],["Net exports (X − M)","The value of exports minus the value of imports."]],"topic":"t3-1","html":"<div class=\"dslot\" data-d=\"circular-flow\"><\/div>\n<p>Because every dollar spent is a dollar of income for someone and corresponds to a dollar of output, <strong>national output = national income = national expenditure<\/strong>. Three methods should give the same answer (differences arise from measurement errors).<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Approach<\/th><th>Adds up<\/th><th>Watch out for<\/th><\/tr><\/thead><tbody><tr><td><strong>Output<\/strong><\/td><td>Value added by each industry (agriculture, manufacturing, services)<\/td><td>Count only value added to avoid <strong>double counting<\/strong> of intermediate goods<\/td><\/tr><tr><td><strong>Income<\/strong><\/td><td>Wages + rent + interest + profit<\/td><td>Exclude transfer payments (pensions, benefits): no output is produced<\/td><\/tr><tr><td><strong>Expenditure<\/strong><\/td><td>C + I + G + (X − M)<\/td><td>Exclude second-hand sales and financial transactions<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Expenditure method<\/div><p>Vietnam (illustrative, US$bn): C = 180, I = 70, G = 17, X = 280, M = 260. GDP = 180 + 70 + 17 + (280 − 260) = <strong>$287bn<\/strong>.<\/p><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Injections &gt; leakages → national income rises. Always consider the <strong>size<\/strong> of each change: a big rise in G can outweigh higher savings and imports together.<\/p><\/div>","text":"Because every dollar spent is a dollar of income for someone and corresponds to a dollar of output, national output = national income = national expenditure . Three methods should give the same answer (differences arise from measurement errors). Approach Adds up Watch out for Output Value added by each industry (agriculture, manufacturing, services) Count only value added to avoid double counting of intermediate goods Income Wages + rent + interest + profit Exclude transfer payments (pensions, benefits): no output is produced Expenditure C + I + G + (X − M) Exclude second-hand sales and financial transactions Worked example: Expenditure method Vietnam (illustrative, US$bn): C = 180, I = 70, G = 17, X = 280, M = 260. GDP = 180 + 70 + 17 + (280 − 260) = $287bn . Exam tip Injections > leakages → national income rises. Always consider the size of each change: a big rise in G can outweigh higher savings and imports together.","dias":["circular-flow"]},{"id":"e-ni-terms","title":"GDP, GNI, real vs nominal, per capita and PPP","hl":false,"terms":[["Gross national income (GNI)","GDP plus net income from abroad (income earned by nationals abroad minus income earned by foreigners in the country)."],["Nominal GDP","GDP measured at current prices, not adjusted for inflation."],["Real GDP","GDP adjusted for inflation, measured at constant (base-year) prices."],["GDP deflator","A price index used to convert nominal GDP into real GDP."],["GDP per capita","GDP divided by the population; a measure of average output or income per person."],["Purchasing power parity (PPP)","An exchange rate that equalises the purchasing power of different currencies, so that the same basket of goods costs the same in each country."]],"topic":"t3-1","html":"<h4>GDP vs GNI<\/h4>\n<p><strong>GNI = GDP + net income from abroad<\/strong> (profits, interest and wages flowing in minus those flowing out). Countries with large foreign-owned multinationals have <strong>GNI &lt; GDP<\/strong> (Ireland: GNI is about 25% below GDP; many resource-exporting developing countries where foreign mining firms repatriate profits). Countries receiving large remittances or overseas investment income may have <strong>GNI &gt; GDP<\/strong> (e.g. Bangladesh, Philippines, Japan).<\/p>\n<h4>Nominal vs real<\/h4>\n<p>Nominal GDP can rise just because prices rise. <strong>Real GDP<\/strong> removes inflation, so it shows the change in actual output.<\/p>\n<div class=\"box formula\"><div class=\"box-h\">Converting nominal to real<\/div><div class=\"fx\"><div class=\"fx-eq\">Real GDP = <span class=\"fr\"><span>nominal GDP<\/span><span>GDP deflator<\/span><\/span> × 100<\/div><\/div><div class=\"fx\"><div class=\"fx-eq\">GNI = GDP + net income from abroad<\/div><\/div><div class=\"fx\"><div class=\"fx-eq\">GDP per capita = <span class=\"fr\"><span>GDP<\/span><span>population<\/span><\/span><\/div><\/div><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Real GDP<\/div><p>Nominal GDP in 2021 = $840bn; GDP deflator = 105 (base year 2020 = 100). Real GDP = 840 ÷ 105 × 100 = <strong>$800bn<\/strong>. If real GDP in 2020 was $780bn, real growth = (800 − 780) ÷ 780 × 100 = <strong>2.56%<\/strong>.<\/p><\/div>\n<h4>Per capita and PPP<\/h4>\n<p>Comparing <strong>totals<\/strong> is misleading for countries with very different populations (India's GDP is larger than the UK's but its GDP per capita is about 1/20th). <strong>Per capita<\/strong> adjusts for population. Market exchange rates do not reflect what money buys locally. <strong>PPP<\/strong> adjusts for differences in the cost of living, so GDP per capita at PPP is the best measure for comparing living standards across countries (India's GDP per capita is about $2,700 at market rates but around $10,000 at PPP).<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>\"At constant prices\" means <strong>real<\/strong>; \"at current prices\" means <strong>nominal<\/strong>. For international comparisons of living standards, use <strong>real GDP/GNI per capita at PPP<\/strong>.<\/p><\/div>","text":"GDP vs GNI GNI = GDP + net income from abroad (profits, interest and wages flowing in minus those flowing out). Countries with large foreign-owned multinationals have GNI < GDP (Ireland: GNI is about 25% below GDP; many resource-exporting developing countries where foreign mining firms repatriate profits). Countries receiving large remittances or overseas investment income may have GNI > GDP (e.g. Bangladesh, Philippines, Japan). Nominal vs real Nominal GDP can rise just because prices rise. Real GDP removes inflation, so it shows the change in actual output. Converting nominal to real Real GDP = nominal GDP GDP deflator × 100 GNI = GDP + net income from abroad GDP per capita = GDP population Worked example: Real GDP Nominal GDP in 2021 = $840bn; GDP deflator = 105 (base year 2020 = 100). Real GDP = 840 ÷ 105 × 100 = $800bn . If real GDP in 2020 was $780bn, real growth = (800 − 780) ÷ 780 × 100 = 2.56% . Per capita and PPP Comparing totals is misleading for countries with very different populations (India's GDP is larger than the UK's but its GDP per capita is about 1/20th). Per capita adjusts for population. Market exchange rates do not reflect what money buys locally. PPP adjusts for differences in the cost of living, so GDP per capita at PPP is the best measure for comparing living standards across countries (India's GDP per capita is about $2,700 at market rates but around $10,000 at PPP). Exam tip \"At constant prices\" means real ; \"at current prices\" means nominal . For international comparisons of living standards, use real GDP/GNI per capita at PPP .","dias":[]},{"id":"e-gdp-wellbeing","title":"GDP as a measure of well-being and alternative measures","hl":false,"terms":[["Informal economy","Economic activity that is not recorded or taxed, e.g. cash-in-hand work and street vending."],["OECD Better Life Index","An index comparing well-being across countries using 11 dimensions, such as housing, income, jobs, health, environment and life satisfaction."],["Happy Planet Index","An index that measures how efficiently countries turn ecological resources into long, happy lives (well-being × life expectancy ÷ ecological footprint)."],["World Happiness Report","A UN-backed annual survey ranking countries by how people rate their lives."]],"topic":"t3-1","html":"<h4>Limitations of GDP/GNI as a measure of well-being<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Limitation<\/th><th>Explanation<\/th><\/tr><\/thead><tbody><tr><td><strong>Non-market output<\/strong><\/td><td>Unpaid work (childcare, housework, volunteering) is excluded<\/td><\/tr><tr><td><strong>Informal economy<\/strong><\/td><td>Unrecorded activity, very large in developing countries (often 30–60% of activity)<\/td><\/tr><tr><td><strong>Quality of life<\/strong><\/td><td>Leisure, working hours, health, safety and freedom are excluded<\/td><\/tr><tr><td><strong>Composition of output<\/strong><\/td><td>Spending on defence, prisons or pollution clean-up raises GDP but not well-being<\/td><\/tr><tr><td><strong>Distribution<\/strong><\/td><td>GDP per capita is an average; it hides inequality<\/td><\/tr><tr><td><strong>Environment<\/strong><\/td><td>Depletion of resources and pollution are not subtracted<\/td><\/tr><tr><td><strong>Quality improvements<\/strong><\/td><td>Better products at the same price are under-counted<\/td><\/tr><tr><td><strong>Data accuracy<\/strong><\/td><td>Measurement errors; revisions; differences in methods between countries<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Alternative measures<\/h4>\n<ul><li><strong>OECD Better Life Index<\/strong>: 11 dimensions (housing, income, jobs, community, education, environment, civic engagement, health, life satisfaction, safety, work–life balance); users can weight them.<\/li><li><strong>Happy Planet Index<\/strong>: well-being and life expectancy relative to ecological footprint; Costa Rica and Vanuatu score high; rich high-consumption countries score low.<\/li><li><strong>World Happiness Report<\/strong>: life-evaluation surveys (Finland has ranked first every year since 2018).<\/li><li><strong>Human Development Index (HDI)<\/strong> and other composite indicators are covered in <a class=\"xref\" href=\"#t4-8\">4.8<\/a>.<\/li><\/ul>","text":"Limitations of GDP/GNI as a measure of well-being Limitation Explanation Non-market output Unpaid work (childcare, housework, volunteering) is excluded Informal economy Unrecorded activity, very large in developing countries (often 30–60% of activity) Quality of life Leisure, working hours, health, safety and freedom are excluded Composition of output Spending on defence, prisons or pollution clean-up raises GDP but not well-being Distribution GDP per capita is an average; it hides inequality Environment Depletion of resources and pollution are not subtracted Quality improvements Better products at the same price are under-counted Data accuracy Measurement errors; revisions; differences in methods between countries Alternative measures OECD Better Life Index : 11 dimensions (housing, income, jobs, community, education, environment, civic engagement, health, life satisfaction, safety, work–life balance); users can weight them. Happy Planet Index : well-being and life expectancy relative to ecological footprint; Costa Rica and Vanuatu score high; rich high-consumption countries score low. World Happiness Report : life-evaluation surveys (Finland has ranked first every year since 2018). Human Development Index (HDI) and other composite indicators are covered in 4.8 .","dias":[]},{"id":"e-business-cycle","title":"The business cycle","hl":false,"terms":[["Business cycle","The fluctuations of real GDP around its long-term trend, through phases of expansion, peak, contraction and trough."],["Recession","A fall in real GDP for two consecutive quarters."],["Potential output","The level of real GDP the economy can produce when all resources are fully employed; the long-term trend."],["Output gap","The difference between actual and potential real GDP; positive (inflationary) when actual is above potential, negative (recessionary) when below."]],"topic":"t3-1","html":"<div class=\"dslot\" data-d=\"business-cycle\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Phase<\/th><th>Real GDP<\/th><th>Unemployment<\/th><th>Inflation<\/th><\/tr><\/thead><tbody><tr><td><strong>Expansion (recovery)<\/strong><\/td><td>Rising<\/td><td>Falling<\/td><td>Starting to rise<\/td><\/tr><tr><td><strong>Peak (boom)<\/strong><\/td><td>Above trend, growth slows<\/td><td>Lowest, below natural rate<\/td><td>High; shortages of labour and materials<\/td><\/tr><tr><td><strong>Contraction (recession)<\/strong><\/td><td>Falling<\/td><td>Rising<\/td><td>Falling<\/td><\/tr><tr><td><strong>Trough<\/strong><\/td><td>Lowest point, below trend<\/td><td>Highest<\/td><td>Low; possible deflation<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Real-world cycles are irregular: the 2008–09 financial crisis, the 2020 Covid recession (UK GDP fell about 10% in 2020) and the rapid rebound in 2021.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Evaluate the model: phases are not regular or predictable, components of AD do not move together (consumption often recovers before investment), and a long recession can permanently lower the trend (<strong>hysteresis<\/strong>).<\/p><\/div>","text":"Phase Real GDP Unemployment Inflation Expansion (recovery) Rising Falling Starting to rise Peak (boom) Above trend, growth slows Lowest, below natural rate High; shortages of labour and materials Contraction (recession) Falling Rising Falling Trough Lowest point, below trend Highest Low; possible deflation Real-world cycles are irregular: the 2008–09 financial crisis, the 2020 Covid recession (UK GDP fell about 10% in 2020) and the rapid rebound in 2021. Exam tip Evaluate the model: phases are not regular or predictable, components of AD do not move together (consumption often recovers before investment), and a long recession can permanently lower the trend ( hysteresis ).","dias":["business-cycle"]}]},{"id":"t3-2","num":"3.2","title":"Variations in economic activity: aggregate demand and aggregate supply","level":"SL","blurb":"AD, SRAS, the new classical and Keynesian models of AS, equilibrium, output gaps and long-run growth.","entries":[{"id":"e-ad","title":"Aggregate demand (AD)","hl":false,"terms":[["Aggregate demand (AD)","The total planned spending on an economy's goods and services at each price level in a given period: C + I + G + (X − M)."],["Wealth effect","A fall in the price level raises the real value of household wealth, so consumption rises."],["Interest rate effect","A fall in the price level reduces demand for money, lowering interest rates and raising consumption and investment."],["International trade effect","A fall in the price level makes domestic goods cheaper relative to foreign goods, raising exports and reducing imports."],["Consumer confidence","How optimistic households are about their future incomes and the economy."],["Business confidence","How optimistic firms are about future sales and profits, a key driver of investment."]],"topic":"t3-2","html":"<div class=\"dslot\" data-d=\"ad-curve\"><\/div>\n<p><strong>Why AD slopes down<\/strong>: the wealth effect, the interest rate effect and the international trade effect.<\/p>\n<h4>Determinants of each component (shift AD)<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Component<\/th><th>Typical share<\/th><th>Increases when…<\/th><\/tr><\/thead><tbody><tr><td><strong>C<\/strong> (consumption)<\/td><td>50–70%<\/td><td>Consumer confidence rises; wealth rises (house and share prices); interest rates fall; income taxes fall; household debt is low; expectations of future price rises<\/td><\/tr><tr><td><strong>I<\/strong> (investment)<\/td><td>15–25%<\/td><td>Interest rates fall; business confidence rises; technology creates opportunities; corporate taxes fall; demand for output grows (accelerator); credit is easier to get<\/td><\/tr><tr><td><strong>G<\/strong> (government spending)<\/td><td>15–25%<\/td><td>Political priorities; expansionary fiscal policy; recession (automatic stabilisers)<\/td><\/tr><tr><td><strong>X − M<\/strong> (net exports)<\/td><td>±<\/td><td>Foreign incomes rise; the currency depreciates; trade barriers abroad fall; domestic incomes fall (fewer imports)<\/td><\/tr><\/tbody><\/table><\/div>","text":"Why AD slopes down : the wealth effect, the interest rate effect and the international trade effect. Determinants of each component (shift AD) Component Typical share Increases when… C (consumption) 50–70% Consumer confidence rises; wealth rises (house and share prices); interest rates fall; income taxes fall; household debt is low; expectations of future price rises I (investment) 15–25% Interest rates fall; business confidence rises; technology creates opportunities; corporate taxes fall; demand for output grows (accelerator); credit is easier to get G (government spending) 15–25% Political priorities; expansionary fiscal policy; recession (automatic stabilisers) X − M (net exports) ± Foreign incomes rise; the currency depreciates; trade barriers abroad fall; domestic incomes fall (fewer imports)","dias":["ad-curve"]},{"id":"e-sras","title":"Short-run aggregate supply (SRAS)","hl":false,"terms":[["Aggregate supply (AS)","The total output that firms in an economy plan to produce at each price level in a given period."],["Short-run aggregate supply (SRAS)","Aggregate supply in the period when wages and other resource prices are fixed; slopes upward."],["Supply shock","An unexpected event that shifts SRAS, such as a sudden rise in oil prices or a natural disaster."]],"topic":"t3-2","html":"<div class=\"dslot\" data-d=\"sras\"><\/div>\n<p>In the short run, money wages and other input prices are fixed by contracts, so a rise in the price level raises firms' profits and they expand output: <strong>SRAS slopes up<\/strong>.<\/p>\n<p><strong>Shifts of SRAS<\/strong> (changes in costs of production):<\/p>\n<ul><li><strong>Wages<\/strong> (union bargaining, minimum wage rises)<\/li><li><strong>Prices of raw materials and energy<\/strong> (oil shocks in 1973, 1979, 2022)<\/li><li><strong>Import prices<\/strong> (a depreciation raises the cost of imported inputs)<\/li><li><strong>Indirect taxes and business taxes<\/strong> (VAT rises shift SRAS left), <strong>subsidies<\/strong> (shift right)<\/li><li><strong>Supply shocks<\/strong> (war, pandemics, extreme weather, supply chain disruptions such as Covid-era shipping delays)<\/li><\/ul>","text":"In the short run, money wages and other input prices are fixed by contracts, so a rise in the price level raises firms' profits and they expand output: SRAS slopes up . Shifts of SRAS (changes in costs of production): Wages (union bargaining, minimum wage rises) Prices of raw materials and energy (oil shocks in 1973, 1979, 2022) Import prices (a depreciation raises the cost of imported inputs) Indirect taxes and business taxes (VAT rises shift SRAS left), subsidies (shift right) Supply shocks (war, pandemics, extreme weather, supply chain disruptions such as Covid-era shipping delays)","dias":["sras"]},{"id":"e-as-models","title":"Long-run aggregate supply: new classical and Keynesian views","hl":false,"terms":[["Long-run aggregate supply (LRAS)","Aggregate supply when all wages and prices are fully flexible; vertical at potential output in the new classical model."],["Full employment level of output (Yf)","The output produced when unemployment is at its natural rate; potential output."],["Keynesian AS curve","An aggregate supply curve that is horizontal at low output (spare capacity), upward-sloping as the economy nears full employment, and vertical at full employment."]],"topic":"t3-2","html":"<h4>New classical (monetarist) view<\/h4>\n<div class=\"dslot\" data-d=\"nc-lras\"><\/div>\n<p>In the long run, wages and prices adjust fully, so output returns to <strong>Yf<\/strong> whatever the level of AD. LRAS is <strong>vertical<\/strong>: potential output depends only on the quantity and quality of factors of production and technology.<\/p>\n<h4>Keynesian view<\/h4>\n<div class=\"dslot\" data-d=\"keynes-as\"><\/div>\n<p>Wages and prices are <strong>sticky downward<\/strong>, so the economy can be stuck below full employment for a long time. With large spare capacity, more AD raises output without raising prices (horizontal section). Near full capacity, bottlenecks push prices up. At Yf, more AD only raises prices.<\/p>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>New classical implications<\/h5><ul><li>The economy self-corrects; policy should avoid disturbing it.<\/li><li>Demand-side policy only changes the price level in the long run.<\/li><li>Focus on supply-side policies to raise Yf.<\/li><\/ul><\/div><div><h5>Keynesian implications<\/h5><ul><li>Recessions can last a long time (the Great Depression, the 2010s in Europe).<\/li><li>Expansionary demand-side policy raises output and employment when there is spare capacity.<\/li><li>\"In the long run we are all dead\" (Keynes): waiting for self-correction is costly.<\/li><\/ul><\/div><\/div><\/div>","text":"New classical (monetarist) view In the long run, wages and prices adjust fully, so output returns to Yf whatever the level of AD. LRAS is vertical : potential output depends only on the quantity and quality of factors of production and technology. Keynesian view Wages and prices are sticky downward , so the economy can be stuck below full employment for a long time. With large spare capacity, more AD raises output without raising prices (horizontal section). Near full capacity, bottlenecks push prices up. At Yf, more AD only raises prices. Evaluation New classical implications The economy self-corrects; policy should avoid disturbing it. Demand-side policy only changes the price level in the long run. Focus on supply-side policies to raise Yf. Keynesian implications Recessions can last a long time (the Great Depression, the 2010s in Europe). Expansionary demand-side policy raises output and employment when there is spare capacity. \"In the long run we are all dead\" (Keynes): waiting for self-correction is costly.","dias":["nc-lras","keynes-as"]},{"id":"e-macro-equilibrium","title":"Macroeconomic equilibrium and output gaps","hl":false,"terms":[["Short-run equilibrium","The output and price level where AD = SRAS."],["Long-run equilibrium","When AD, SRAS and LRAS all intersect at potential output."],["Recessionary (deflationary) gap","When equilibrium real GDP is below potential output, with cyclical unemployment."],["Inflationary gap","When equilibrium real GDP is above potential output, putting upward pressure on prices."]],"topic":"t3-2","html":"<div class=\"dslot\" data-d=\"nc-gaps\"><\/div>\n<h4>New classical self-correction<\/h4>\n<ul><li><strong>From a recessionary gap<\/strong>: unemployment pushes money wages down → costs fall → SRAS shifts right → output returns to Yf at a lower price level.<\/li><li><strong>From an inflationary gap<\/strong>: labour shortages push wages up → SRAS shifts left → output returns to Yf at a higher price level.<\/li><\/ul>\n<h4>Keynesian equilibrium<\/h4>\n<p>The economy can settle at any output on the AS curve. A recessionary gap persists because wages do not fall easily (contracts, unions, minimum wages, morale) and falling incomes reduce spending further. The solution is to <strong>raise AD<\/strong>.<\/p>\n<div class=\"box warn\"><div class=\"box-h\">Common mistakes<\/div><p>An <strong>inflationary gap<\/strong> is about <strong>output<\/strong> being above potential; it is not the same as inflation itself. Say what happens to real GDP and to unemployment as well as the price level.<\/p><\/div>","text":"New classical self-correction From a recessionary gap : unemployment pushes money wages down → costs fall → SRAS shifts right → output returns to Yf at a lower price level. From an inflationary gap : labour shortages push wages up → SRAS shifts left → output returns to Yf at a higher price level. Keynesian equilibrium The economy can settle at any output on the AS curve. A recessionary gap persists because wages do not fall easily (contracts, unions, minimum wages, morale) and falling incomes reduce spending further. The solution is to raise AD . Common mistakes An inflationary gap is about output being above potential; it is not the same as inflation itself. Say what happens to real GDP and to unemployment as well as the price level.","dias":["nc-gaps"]},{"id":"e-lras-shifts","title":"Long-term growth: factors that shift LRAS","hl":false,"terms":[["Productivity","Output per unit of input, e.g. output per worker per hour."],["Institutional change","Changes in the rules of the economy, such as property rights, the legal system and the reduction of corruption."]],"topic":"t3-2","html":"<div class=\"dslot\" data-d=\"lras-shift\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Factor<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><strong>Quantity of factors<\/strong><\/td><td>Immigration, higher labour force participation (more women in work), discovery of resources, investment in capital<\/td><\/tr><tr><td><strong>Quality of factors<\/strong><\/td><td>Education and training (human capital), better health, better capital equipment<\/td><\/tr><tr><td><strong>Technology<\/strong><\/td><td>Automation, AI, the internet, improvements in agriculture<\/td><\/tr><tr><td><strong>Efficiency and institutio
