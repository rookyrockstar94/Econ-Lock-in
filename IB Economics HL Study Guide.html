>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D = MB<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S = MC<\/text>\n<text class=\"dg-alab\" x=\"101.2\" y=\"109.6\" text-anchor=\"middle\">CS<\/text>\n<text class=\"dg-alab\" x=\"101.2\" y=\"184.4\" text-anchor=\"middle\">PS<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/><\/g><\/svg>"},{"id":"ped-compare","title":"Price elastic vs price inelastic demand","topic":"t2-5","hl":false,"steps":["Draw two panels with the same price change from P₁ to P₂.","Left: a flatter demand curve, so quantity changes a lot (elastic, PED > 1).","Right: a steep curve, so quantity barely changes (inelastic, PED < 1)."],"explain":"With elastic demand the proportionate change in quantity is greater than the proportionate change in price; with inelastic demand it is smaller. Determinants: number and closeness of substitutes, necessity vs luxury, proportion of income spent, time to adjust, addictiveness, and how broadly the product is defined.","watch":"Slope and elasticity are not the same thing; compare them only from the same starting point and scale.","svg":"<svg class=\"dg\" viewBox=\"0 0 618 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Elastic demand (PED &gt; 1)<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M54.0,106.0 L230.0,194.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,132.4 L106.8,132.4\"/>\n<path class=\"dg-drop\" d=\"M106.8,132.4 L106.8,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,167.6 L177.2,167.6\"/>\n<path class=\"dg-drop\" d=\"M177.2,167.6 L177.2,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"222.0\" y=\"186.0\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"136.4\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"106.8\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"171.6\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"177.2\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"106.8\" cy=\"132.4\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"177.2\" cy=\"167.6\" r=\"3.6\"/><\/g>\n<g transform=\"translate(318,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Inelastic demand (PED &lt; 1)<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M124.4,51.0 L159.6,249.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,125.8 L137.7,125.8\"/>\n<path class=\"dg-drop\" d=\"M137.7,125.8 L137.7,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,174.2 L146.3,174.2\"/>\n<path class=\"dg-drop\" d=\"M146.3,174.2 L146.3,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"163.6\" y=\"253.0\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"129.8\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"137.7\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"178.2\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"146.3\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"137.7\" cy=\"125.8\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"146.3\" cy=\"174.2\" r=\"3.6\"/><\/g><\/svg>"},{"id":"ped-linear","title":"PED varies along a straight-line demand curve","topic":"t2-5","hl":true,"steps":["Draw a straight-line demand curve meeting both axes.","Mark its midpoint: PED = 1 (unit elastic) and total revenue is maximised.","Label the upper half \"elastic (PED > 1)\" and the lower half \"inelastic (PED < 1)\".","Optionally draw a total revenue curve below, peaking at the midpoint quantity."],"explain":"On a linear demand curve the slope is constant, but PED = (ΔQ/ΔP) × (P/Q) changes because P/Q changes. At high prices and low quantities the percentage change in Q is large relative to the percentage change in P, so demand is elastic; at low prices it is inelastic. Firms facing elastic demand raise revenue by cutting price; firms facing inelastic demand raise revenue by raising price.","watch":"This is why a single \"flat = elastic\" rule is unreliable; a constant slope does not mean constant PED.","svg":"<svg class=\"dg\" viewBox=\"0 0 638 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><text class=\"dg-ptitle\" x=\"147.0\" y=\"18\" text-anchor=\"middle\">Demand<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L246.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M242.0,256.0 L248.0,260.0 L242.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"248.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M54.0,62.0 L221.4,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,161.0 L137.7,161.0\"/>\n<path class=\"dg-drop\" d=\"M137.7,161.0 L137.7,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"211.4\" y=\"254.0\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"165.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"137.7\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"137.7\" cy=\"161.0\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"145.7\" y=\"159.0\" text-anchor=\"start\">PED = 1<\/text>\n<text class=\"dg-note dg-tk\" x=\"102.4\" y=\"101.2\" text-anchor=\"start\" font-size=\"11\">PED &gt; 1 (elastic)<\/text>\n<text class=\"dg-note dg-tk\" x=\"165.6\" y=\"224.4\" text-anchor=\"start\" font-size=\"11\">PED &lt; 1<\/text>\n<text class=\"dg-note dg-tk\" x=\"184.2\" y=\"79.2\" text-anchor=\"middle\" font-size=\"10\" font-style=\"italic\">PED = ∞ at top<\/text>\n<text class=\"dg-note dg-tk\" x=\"199.1\" y=\"246.4\" text-anchor=\"middle\" font-size=\"10\" font-style=\"italic\">PED = 0<\/text><\/g>\n<g transform=\"translate(328,0)\"><text class=\"dg-ptitle\" x=\"147.0\" y=\"18\" text-anchor=\"middle\">Total revenue<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L246.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M242.0,256.0 L248.0,260.0 L242.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Total revenue<\/text>\n<text class=\"dg-axlab\" x=\"248.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-g\" d=\"M54.0,260.0 L55.8,253.4 L57.9,244.9 L60.5,234.7 L63.3,223.3 L66.4,211.0 L69.7,198.1 L73.2,185.0 L76.7,172.0 L80.4,159.5 L84.0,147.7 L87.7,137.1 L91.2,128.0 L94.7,119.8 L98.4,111.7 L102.2,103.8 L106.0,96.2 L109.9,89.1 L113.9,82.6 L117.9,76.8 L121.9,71.8 L125.9,67.7 L129.8,64.6 L133.8,62.7 L137.7,62.0 L141.6,62.7 L145.6,64.6 L149.5,67.7 L153.5,71.8 L157.5,76.8 L161.5,82.6 L165.5,89.1 L169.4,96.2 L173.2,103.8 L177.0,111.7 L180.7,119.8 L184.2,128.0 L187.7,137.1 L191.4,147.7 L195.0,159.5 L198.7,172.0 L202.2,185.0 L205.7,198.1 L209.0,211.0 L212.1,223.3 L214.9,234.7 L217.5,244.9 L219.6,253.4 L221.4,260.0\"/>\n<path class=\"dg-drop\" d=\"M137.7,62.0 L137.7,260.0\"/>\n<text class=\"dg-lab dg-tg\" x=\"197.4\" y=\"254.0\" text-anchor=\"start\">TR<\/text>\n<text class=\"dg-tick\" x=\"137.7\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"66.0\" text-anchor=\"end\">max<\/text><\/g><\/svg>"},{"id":"ped-special","title":"Special cases of PED","topic":"t2-5","hl":false,"steps":["Perfectly inelastic: a vertical line (PED = 0).","Perfectly elastic: a horizontal line (PED = ∞).","Unit elastic: a rectangular hyperbola (PED = 1), where every price × quantity rectangle has the same area."],"explain":"Perfectly inelastic demand means quantity does not respond at all to price (an approximation for life-saving drugs). Perfectly elastic demand means any rise in price loses all sales (an individual firm in perfect competition). Along a unit elastic curve, total revenue is the same at every price.","watch":"The unit elastic case is a curve, not a 45° line.","svg":"<svg class=\"dg\" viewBox=\"0 0 640 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><text class=\"dg-ptitle\" x=\"120.0\" y=\"18\" text-anchor=\"middle\">PED = 0<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L192.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M188.0,256.0 L194.0,260.0 L188.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"194.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M120.0,249.0 L120.0,51.0\"/>\n<text class=\"dg-lab dg-td\" x=\"124.0\" y=\"55.0\" text-anchor=\"start\">D<\/text><\/g>\n<g transform=\"translate(210,0)\"><text class=\"dg-ptitle\" x=\"120.0\" y=\"18\" text-anchor=\"middle\">PED = ∞<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L192.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M188.0,256.0 L194.0,260.0 L188.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"194.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M60.6,150.0 L179.4,150.0\"/>\n<text class=\"dg-lab dg-td\" x=\"165.4\" y=\"142.0\" text-anchor=\"start\">D<\/text><\/g>\n<g transform=\"translate(420,0)\"><text class=\"dg-ptitle\" x=\"130.0\" y=\"18\" text-anchor=\"middle\">PED = 1<\/text>\n<polygon class=\"dg-a dg-agov\" points=\"54.0,260.0 54.0,176.4 99.6,176.4 99.6,260.0\"/>\n<polygon class=\"dg-a dg-acs\" points=\"54.0,260.0 54.0,221.5 152.8,221.5 152.8,260.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L212.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M208.0,256.0 L214.0,260.0 L208.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"214.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M72.2,51.0 L72.8,55.2 L73.5,60.6 L74.4,67.0 L75.3,74.2 L76.3,82.0 L77.4,90.2 L78.5,98.5 L79.7,106.7 L80.9,114.7 L82.1,122.1 L83.2,128.8 L84.4,134.6 L85.5,139.6 L86.7,144.1 L87.8,148.3 L89.0,152.1 L90.1,155.7 L91.3,159.0 L92.6,162.1 L93.9,165.0 L95.2,167.9 L96.6,170.7 L98.1,173.5 L99.6,176.4 L101.2,179.2 L102.9,182.0 L104.6,184.6 L106.4,187.1 L108.2,189.6 L110.0,191.9 L112.0,194.2 L114.0,196.3 L116.0,198.4 L118.1,200.5 L120.2,202.4 L122.4,204.3 L124.6,206.2 L126.9,207.9 L129.1,209.5 L131.4,211.0 L133.8,212.5 L136.2,213.9 L138.7,215.3 L141.3,216.6 L144.0,217.8 L146.8,219.1 L149.7,220.3 L152.8,221.5 L156.2,222.7 L160.0,223.9 L164.2,225.2 L168.6,226.4 L173.0,227.5 L177.5,228.6 L181.9,229.7 L186.0,230.7 L189.8,231.5 L193.3,232.3 L196.1,233.0 L198.4,233.6\"/>\n<text class=\"dg-lab dg-td\" x=\"188.4\" y=\"225.6\" text-anchor=\"start\">D<\/text><\/g><\/svg>"},{"id":"ped-tr","title":"Price change, PED and total revenue","topic":"t2-5","hl":false,"steps":["Draw a steep (inelastic) demand curve.","Show a price rise from P₁ to P₂ and the fall in quantity from Q₁ to Q₂.","Shade the revenue gained (P₂−P₁)×Q₂ and the revenue lost (Q₁−Q₂)×P₁."],"explain":"When demand is price inelastic, a rise in price increases total revenue because the revenue gained from the higher price on units still sold is larger than the revenue lost on units no longer sold. When demand is elastic the opposite holds, so firms gain by cutting prices. This is why governments tax goods with inelastic demand (tobacco, fuel) to raise revenue.","watch":"TR = P × Q, the rectangle under the point on the demand curve.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-aprof\" points=\"54.0,166.4 54.0,107.9 160.2,107.9 160.2,166.4\"/>\n<polygon class=\"dg-a dg-aloss\" points=\"160.2,260.0 160.2,166.4 179.9,166.4 179.9,260.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M136.6,37.7 L207.4,248.3\"/>\n<path class=\"dg-drop\" d=\"M54.0,166.4 L179.9,166.4\"/>\n<path class=\"dg-drop\" d=\"M179.9,166.4 L179.9,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,107.9 L160.2,107.9\"/>\n<path class=\"dg-drop\" d=\"M160.2,107.9 L160.2,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"211.4\" y=\"252.3\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-alab\" x=\"105.9\" y=\"141.2\" text-anchor=\"middle\">gain<\/text>\n<text class=\"dg-note dg-tk\" x=\"165.4\" y=\"282.7\" text-anchor=\"middle\" font-size=\"10\"><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"170.4\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"179.9\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"111.9\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"160.2\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"179.9\" cy=\"166.4\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"160.2\" cy=\"107.9\" r=\"3.6\"/>\n<text class=\"dg-note dg-tk\" x=\"242.8\" y=\"205.5\" text-anchor=\"middle\" font-size=\"11\">loss = (Q₁−Q₂)×P₁ (small)<\/text>\n<path class=\"dg-arr dg-k\" d=\"M219.2,210.9 L164.9,227.2 M170.1,222.5 L164.9,227.2 L171.8,228.3\"/><\/g><\/svg>"},{"id":"pes-range","title":"Price elasticity of supply (PES)","topic":"t2-6","hl":false,"steps":["A straight supply curve that starts on the price axis is elastic (PES > 1).","One that starts at the origin is unit elastic (PES = 1) whatever its slope.","One that starts on the quantity axis is inelastic (PES < 1).","Vertical = perfectly inelastic; horizontal = perfectly elastic."],"explain":"PES measures how responsive quantity supplied is to a change in price. It is higher when firms have spare capacity, hold stocks, can move factors of production easily (factor mobility), have a longer time period to adjust, and produce manufactured goods rather than agricultural or mineral goods (which take time to grow or extract).","watch":"For straight lines, where the line meets an axis decides PES, not how steep it is.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M54.0,189.8 L219.2,28.3\"/>\n<path class=\"dg-ln dg-s\" d=\"M54.0,260.0 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M124.8,260.0 L278.2,96.2\"/>\n<path class=\"dg-ln dg-k\" d=\"M89.4,248.3 L89.4,44.7\" stroke-dasharray=\"6 5\"/>\n<path class=\"dg-ln dg-k\" d=\"M65.8,224.9 L278.2,224.9\" stroke-dasharray=\"6 5\"/>\n<text class=\"dg-lab dg-ts\" x=\"223.2\" y=\"32.3\" text-anchor=\"start\">PES &gt; 1<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"57.4\" text-anchor=\"start\">PES = 1<\/text>\n<text class=\"dg-lab dg-ts\" x=\"258.2\" y=\"88.2\" text-anchor=\"start\">PES &lt; 1<\/text>\n<text class=\"dg-lab dg-tk\" x=\"73.4\" y=\"40.7\" text-anchor=\"start\">PES = 0<\/text>\n<text class=\"dg-lab dg-tk\" x=\"232.2\" y=\"218.9\" text-anchor=\"start\">PES = ∞<\/text><\/g><\/svg>"},{"id":"price-ceiling","title":"Maximum price (price ceiling)","topic":"t2-7","hl":false,"steps":["Draw D and S with equilibrium Pe, Qe.","Draw a horizontal line Pmax below Pe.","Read off Qs (on S) and Qd (on D) at Pmax: the gap is the shortage.","HL: shade the welfare changes (consumer surplus, producer surplus, welfare loss)."],"explain":"A maximum price is set below equilibrium to make a necessity affordable (rent controls, food staples, fuel). Quantity supplied contracts to Qs and quantity demanded extends to Qd, causing a shortage (Qd − Qs). Consequences: queues and waiting lists, non-price rationing (first come first served, favouritism), parallel (black) markets, lower quality, and underallocation of resources. HL: consumers who still buy gain area from producers, producer surplus falls, and the units between Qs and Qe are lost entirely: a welfare (deadweight) loss.","watch":"A ceiling above equilibrium has no effect; it must be below Pe to bind.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-adwl\" points=\"129.5,185.1 129.5,100.9 172.0,143.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-ln dg-g\" d=\"M54.0,185.1 L280.6,185.1\"/>\n<path class=\"dg-drop\" d=\"M129.5,185.1 L129.5,260.0\"/>\n<path class=\"dg-drop\" d=\"M214.5,185.1 L214.5,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,100.9 L129.5,100.9\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-alab\" x=\"142.5\" y=\"147.0\" text-anchor=\"middle\">WL<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-tg\" x=\"246.6\" y=\"179.1\" text-anchor=\"start\">P<tspan dy=\"0.32em\" font-size=\"72%\">max<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<text class=\"dg-tick\" x=\"129.5\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">s<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"214.5\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">d<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-brace\" d=\"M129.5,185.1 l0,5 L214.5,190.1 l0,-5\"/>\n<text class=\"dg-note\" x=\"172.0\" y=\"205.1\" text-anchor=\"middle\">shortage<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"104.9\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">b<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text><\/g><\/svg>"},{"id":"price-floor","title":"Minimum price (price floor) with government buying the surplus","topic":"t2-7","hl":false,"steps":["Draw D and S with equilibrium Pe, Qe.","Draw Pmin above Pe.","Quantity demanded contracts to Qd and quantity supplied extends to Qs: the gap is the surplus.","HL: if the government buys the surplus, its spending is Pmin × (Qs − Qd), the shaded rectangle."],"explain":"Minimum prices protect producers' incomes (agricultural price supports such as the EU's former intervention buying) or reduce consumption of a demerit good (minimum unit pricing of alcohol in Scotland). They create a surplus. The government may buy and store or destroy it (opportunity cost of public funds), sell it abroad (dumping, which hurts farmers in other countries), or pay farmers to produce less. Consumers pay more and buy less; inefficient producers are protected, reducing the incentive to cut costs.","watch":"Floor above equilibrium. Without government purchase the surplus is unsold stock.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-agov\" points=\"129.5,260.0 129.5,100.9 214.5,100.9 214.5,260.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-ln dg-g\" d=\"M54.0,100.9 L280.6,100.9\"/>\n<path class=\"dg-drop\" d=\"M129.5,100.9 L129.5,260.0\"/>\n<path class=\"dg-drop\" d=\"M214.5,100.9 L214.5,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-alab\" x=\"172.0\" y=\"212.5\" text-anchor=\"middle\">gov. spending<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-tg\" x=\"246.6\" y=\"94.9\" text-anchor=\"start\">P<tspan dy=\"0.32em\" font-size=\"72%\">min<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<text class=\"dg-tick\" x=\"129.5\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">d<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"214.5\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">s<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-brace\" d=\"M129.5,100.9 l0,-5 L214.5,95.9 l0,5\"/>\n<text class=\"dg-note\" x=\"172.0\" y=\"88.9\" text-anchor=\"middle\">surplus<\/text><\/g><\/svg>"},{"id":"min-wage","title":"National minimum wage in the labour market","topic":"t2-7","hl":false,"steps":["Label axes Wage rate (W) and Quantity of labour (L).","Draw labour demand (DL, from firms) and labour supply (SL, from workers).","Draw Wmin above the equilibrium wage.","Show labour supplied (Ls) and demanded (Ld) at Wmin; the gap is unemployment (surplus of labour)."],"explain":"A minimum wage raises the incomes of low-paid workers who keep their jobs and can reduce poverty and in-work benefits, but at the higher wage firms employ fewer workers (Ld) while more people want to work (Ls). The surplus of labour is unemployment. Its size depends on the wage elasticity of labour demand and supply. In a market where firms have buying power (monopsony), a minimum wage may raise both pay and employment.","watch":"The supply of labour comes from households, the demand from firms; do not swap them.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Wage rate<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity of labour<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-ln dg-g\" d=\"M54.0,105.6 L280.6,105.6\"/>\n<path class=\"dg-drop\" d=\"M134.2,105.6 L134.2,260.0\"/>\n<path class=\"dg-drop\" d=\"M209.8,105.6 L209.8,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">L<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">L<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">W<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">L<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-tg\" x=\"244.6\" y=\"99.6\" text-anchor=\"start\">W<tspan dy=\"0.32em\" font-size=\"72%\">min<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<text class=\"dg-tick\" x=\"134.2\" y=\"277.0\" text-anchor=\"middle\">L<tspan dy=\"0.32em\" font-size=\"72%\">d<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"209.8\" y=\"277.0\" text-anchor=\"middle\">L<tspan dy=\"0.32em\" font-size=\"72%\">s<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-brace\" d=\"M134.2,105.6 l0,-5 L209.8,100.6 l0,5\"/>\n<text class=\"dg-note\" x=\"172.0\" y=\"93.6\" text-anchor=\"middle\">unemployment<\/text><\/g><\/svg>"},{"id":"tax-specific","title":"Specific (per-unit) indirect tax: incidence and welfare","topic":"t2-7","hl":false,"steps":["Draw D and S (= MC) with equilibrium P₁, Q₁.","Shift supply up by the amount of the tax to S + tax, parallel to S.","New equilibrium at Pc (price paid by consumers) and Q₂; drop down to S to find Pp (price received by producers).","Shade the tax revenue (Pc − Pp) × Q₂, split into the consumer and producer burden; shade the welfare loss triangle."],"explain":"A specific tax is a fixed amount per unit (e.g. $2 per pack). The supply curve shifts vertically up by the tax. Consumers pay more (Pc > P₁), producers receive less (Pp < P₁), and quantity falls to Q₂. The government earns (Pc − Pp) × Q₂. Consumer burden = (Pc − P₁) × Q₂; producer burden = (P₁ − Pp) × Q₂. The units between Q₂ and Q₁ are no longer traded: a loss of social surplus (welfare loss) if there were no externalities to correct.","watch":"The vertical distance between S and S + tax is the tax per unit and stays constant. The burden falls more on whichever side is less price elastic.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-acs\" points=\"54.0,143.0 54.0,114.9 143.7,114.9 143.7,143.0\"/>\n<polygon class=\"dg-a dg-aps\" points=\"54.0,171.1 54.0,143.0 143.7,143.0 143.7,171.1\"/>\n<polygon class=\"dg-a dg-adwl\" points=\"143.7,114.9 143.7,171.1 172.0,143.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,180.4 L233.4,26.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,114.9 L143.7,114.9\"/>\n<path class=\"dg-drop\" d=\"M143.7,114.9 L143.7,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,171.1 L143.7,171.1\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-lab dg-ts\" x=\"183.4\" y=\"36.0\" text-anchor=\"start\">S + tax<\/text>\n<text class=\"dg-alab\" x=\"98.8\" y=\"133.0\" text-anchor=\"middle\">consumer burden<\/text>\n<text class=\"dg-alab\" x=\"98.8\" y=\"161.0\" text-anchor=\"middle\">producer burden<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"118.9\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">c<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"143.7\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"175.1\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">p<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"143.7\" cy=\"114.9\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"143.7\" cy=\"171.1\" r=\"3.6\"/>\n<text class=\"dg-note dg-tk\" x=\"219.2\" y=\"156.4\" text-anchor=\"middle\" font-size=\"11\">welfare loss<\/text>\n<path class=\"dg-arr dg-k\" d=\"M205.0,150.0 L167.3,143.0 M174.0,141.2 L167.3,143.0 L172.9,147.1\"/><\/g><\/svg>"},{"id":"tax-adval","title":"Ad valorem (percentage) tax","topic":"t2-7","hl":false,"steps":["Draw S and D.","Draw S + tax diverging from S: the gap widens as price rises because the tax is a percentage of the price.","Mark the new equilibrium and the price received by producers as for a specific tax."],"explain":"An ad valorem tax, such as VAT or GST, is a percentage of the price, so the tax per unit is larger at higher prices. The new supply curve pivots upward rather than shifting in parallel. Analysis of incidence, revenue and welfare loss is the same as for a specific tax.","watch":"The curves start together near the origin and spread apart.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M54.0,248.3 L266.4,61.1\"/>\n<path class=\"dg-ln dg-s\" d=\"M54.0,246.0 L209.8,28.3\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.7 L172.7,143.7\"/>\n<path class=\"dg-drop\" d=\"M172.7,143.7 L172.7,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,117.3 L146.1,117.3\"/>\n<path class=\"dg-drop\" d=\"M146.1,117.3 L146.1,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,167.1 L146.1,167.1\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"65.1\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-lab dg-ts\" x=\"157.8\" y=\"36.3\" text-anchor=\"start\">S + tax<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.7\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.7\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"121.3\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">c<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"146.1\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"171.1\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">p<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.7\" cy=\"143.7\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"146.1\" cy=\"117.3\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"146.1\" cy=\"167.1\" r=\"3.6\"/><\/g><\/svg>"},{"id":"tax-incidence","title":"Tax incidence depends on PED and PES","topic":"t2-7","hl":true,"steps":["Draw two panels with the same tax per unit.","Left: inelastic (steep) demand — consumer burden is large.","Right: elastic (flat) demand — producer burden is large."],"explain":"When demand is more price inelastic than supply, firms can pass most of the tax on to consumers in higher prices (tobacco, petrol, alcohol). When demand is more elastic than supply, consumers switch away, so producers absorb most of the tax. The more inelastic side of the market always bears the larger share. Taxing inelastic goods raises more revenue but does less to cut consumption.","watch":"Use the same vertical tax gap in both panels so the comparison is fair.","svg":"<svg class=\"dg\" viewBox=\"0 0 618 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Inelastic demand<\/text>\n<polygon class=\"dg-a dg-acs\" points=\"54.0,157.3 54.0,113.7 134.3,113.7 134.3,157.3\"/>\n<polygon class=\"dg-a dg-aps\" points=\"54.0,166.5 54.0,157.3 134.3,157.3 134.3,166.5\"/>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M120.9,51.0 L163.1,249.0\"/>\n<path class=\"dg-ln dg-s\" d=\"M62.8,238.0 L221.2,79.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M62.8,185.2 L203.6,44.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,113.7 L134.3,113.7\"/>\n<path class=\"dg-drop\" d=\"M134.3,113.7 L134.3,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,166.5 L134.3,166.5\"/>\n<path class=\"dg-drop\" d=\"M54.0,157.3 L143.5,157.3\"/>\n<text class=\"dg-lab dg-td\" x=\"167.1\" y=\"253.0\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"225.2\" y=\"83.6\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-lab dg-ts\" x=\"169.6\" y=\"50.4\" text-anchor=\"start\">S+t<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"117.7\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">c<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"134.3\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"170.5\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">p<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"161.3\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"143.5\" cy=\"157.3\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"134.3\" cy=\"113.7\" r=\"3.6\"/><\/g>\n<g transform=\"translate(318,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Elastic demand<\/text>\n<polygon class=\"dg-a dg-acs\" points=\"54.0,149.4 54.0,134.3 113.7,134.3 113.7,149.4\"/>\n<polygon class=\"dg-a dg-aps\" points=\"54.0,187.1 54.0,149.4 113.7,149.4 113.7,187.1\"/>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M54.0,110.4 L230.0,180.8\"/>\n<path class=\"dg-ln dg-s\" d=\"M62.8,238.0 L221.2,79.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M62.8,185.2 L203.6,44.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,134.3 L113.7,134.3\"/>\n<path class=\"dg-drop\" d=\"M113.7,134.3 L113.7,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,187.1 L113.7,187.1\"/>\n<path class=\"dg-drop\" d=\"M54.0,149.4 L151.4,149.4\"/>\n<text class=\"dg-lab dg-td\" x=\"224.0\" y=\"172.8\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"225.2\" y=\"83.6\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-lab dg-ts\" x=\"169.6\" y=\"50.4\" text-anchor=\"start\">S+t<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"138.3\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">c<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"113.7\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"191.1\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">p<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"153.4\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"151.4\" cy=\"149.4\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"113.7\" cy=\"134.3\" r=\"3.6\"/><\/g><\/svg>"},{"id":"subsidy","title":"Producer subsidy: effects and welfare","topic":"t2-7","hl":false,"steps":["Draw D and S with equilibrium P₁, Q₁.","Shift supply down by the subsidy per unit to S − subsidy.","New equilibrium: consumers pay Pc, quantity Q₂; producers receive Pp (read off the original S at Q₂).","Shade government spending (Pp − Pc) × Q₂ and the welfare loss triangle from overallocation."],"explain":"A subsidy is a payment from the government to producers per unit of output. It lowers costs, shifting S down by the subsidy. Consumers pay less (Pc), producers receive more (Pp), and output rises from Q₁ to Q₂. Government cost = subsidy per unit × Q₂. Used to make necessities cheaper, support farmers' incomes, help firms compete internationally, or encourage goods with positive externalities (solar panels, EVs). Without an externality the extra output beyond Q₁ is overallocation, creating a welfare loss.","watch":"Producers receive Pp, which is above P₁; the gap Pp − Pc is the subsidy.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-agov\" points=\"54.0,171.1 54.0,114.9 200.3,114.9 200.3,171.1\"/>\n<polygon class=\"dg-a dg-adwl\" points=\"172.0,143.0 200.3,114.9 200.3,171.1\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M134.2,236.6 L290.0,82.2\"/>\n<path class=\"dg-drop\" d=\"M54.0,114.9 L200.3,114.9\"/>\n<path class=\"dg-drop\" d=\"M54.0,171.1 L200.3,171.1\"/>\n<path class=\"dg-drop\" d=\"M200.3,171.1 L200.3,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-lab dg-ts\" x=\"214.0\" y=\"98.2\" text-anchor=\"start\">S − subsidy<\/text>\n<text class=\"dg-alab\" x=\"127.2\" y=\"147.0\" text-anchor=\"middle\">government spending<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"118.9\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">p<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"175.1\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">c<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"200.3\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"200.3\" cy=\"171.1\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"200.3\" cy=\"114.9\" r=\"3.6\"/><\/g><\/svg>"},{"id":"ext-neg-prod","title":"Negative production externality","topic":"t2-8","hl":false,"steps":["Draw D = MPB = MSB and S = MPC.","Draw MSC above MPC: the vertical gap is the external cost per unit.","Mark the market outcome Qm (MPB = MPC) and the social optimum Qopt (MSB = MSC).","Shade the welfare loss triangle between MSC and MSB from Qopt to Qm."],"explain":"Producers ignore the costs they impose on third parties (pollution from factories, power stations, intensive farming), so MSC > MPC. The market produces Qm, more than the socially optimal Qopt, at too low a price: overallocation of resources. For each unit between Qopt and Qm, MSC > MSB, so society loses the shaded welfare loss. Solutions: Pigouvian (carbon) taxes, tradable permits, regulation, and international agreements.","watch":"The welfare loss triangle points towards Qopt and has its vertical side at Qm.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-adwl\" points=\"146.0,117.3 172.0,91.5 172.0,143.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M54.0,208.5 L228.6,35.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,117.3 L146.0,117.3\"/>\n<path class=\"dg-drop\" d=\"M146.0,117.3 L146.0,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D = MPB = MSB<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S = MPC<\/text>\n<text class=\"dg-lab dg-ts\" x=\"222.6\" y=\"29.4\" text-anchor=\"start\">MSC<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"121.3\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"146.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"146.0\" cy=\"117.3\" r=\"3.6\"/>\n<text class=\"dg-note dg-tk\" x=\"233.4\" y=\"100.2\" text-anchor=\"middle\" font-size=\"11\">welfare loss<\/text>\n<path class=\"dg-arr dg-k\" d=\"M219.2,105.6 L176.7,124.3 M181.3,119.0 L176.7,124.3 L183.7,124.5\"/><\/g><\/svg>"},{"id":"ext-neg-cons","title":"Negative consumption externality","topic":"t2-8","hl":false,"steps":["Draw S = MPC = MSC and MPB.","Draw MSB below MPB: the gap is the external cost of consumption.","Mark Qm (MPB = MPC) and Qopt (MSB = MSC).","Shade the welfare loss between MSC and MSB from Qopt to Qm."],"explain":"Consumption that harms others (smoking, alcohol, driving in congestion, loud music) means MSB < MPB. Consumers buy Qm, more than the optimum Qopt: overconsumption. Demerit goods are often analysed this way, combined with imperfect information about personal harm. Policies: indirect taxes, legislation and bans, advertising restrictions, education, nudges.","watch":"It is the demand-side curve that splits; supply is MPC = MSC.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-adwl\" points=\"146.0,168.7 172.0,194.5 172.0,143.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M54.0,77.5 L238.1,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,168.7 L146.0,168.7\"/>\n<path class=\"dg-drop\" d=\"M146.0,168.7 L146.0,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S = MPC = MSC<\/text>\n<text class=\"dg-lab dg-td\" x=\"258.4\" y=\"228.6\" text-anchor=\"start\">MPB<\/text>\n<text class=\"dg-lab dg-td\" x=\"232.1\" y=\"276.0\" text-anchor=\"start\">MSB<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"172.7\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"146.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"146.0\" cy=\"168.7\" r=\"3.6\"/>\n<text class=\"dg-note dg-tk\" x=\"233.4\" y=\"189.1\" text-anchor=\"middle\" font-size=\"11\">welfare loss<\/text>\n<path class=\"dg-arr dg-k\" d=\"M219.2,180.4 L176.7,157.0 M183.7,157.4 L176.7,157.0 L180.8,162.7\"/><\/g><\/svg>"},{"id":"ext-pos-prod","title":"Positive production externality","topic":"t2-8","hl":false,"steps":["Draw D = MPB = MSB and S = MPC.","Draw MSC below MPC: the gap is the external benefit of production.","Mark Qm and Qopt (larger).","Shade the welfare loss triangle between Qm and Qopt."],"explain":"Production that benefits third parties (firm training that workers take elsewhere, R&D spillovers, bees from a honey farm pollinating orchards) means MSC < MPC. The market produces too little (Qm < Qopt): underallocation. Policies: subsidies, direct provision, tax credits for R&D.","watch":"The welfare loss lies to the right of Qm.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-adwl\" points=\"172.0,143.0 172.0,194.5 198.0,168.7\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M105.9,260.0 L280.6,86.8\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,168.7 L198.0,168.7\"/>\n<path class=\"dg-drop\" d=\"M198.0,168.7 L198.0,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D = MPB = MSB<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S = MPC<\/text>\n<text class=\"dg-lab dg-ts\" x=\"274.6\" y=\"102.8\" text-anchor=\"start\">MSC<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"172.7\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"198.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"198.0\" cy=\"168.7\" r=\"3.6\"/>\n<text class=\"dg-note dg-tk\" x=\"242.8\" y=\"189.1\" text-anchor=\"middle\" font-size=\"11\">welfare loss<\/text>\n<path class=\"dg-arr dg-k\" d=\"M228.6,180.4 L186.2,166.4 M193.1,165.5 L186.2,166.4 L191.2,171.3\"/><\/g><\/svg>"},{"id":"ext-pos-cons","title":"Positive consumption externality (merit goods)","topic":"t2-8","hl":false,"steps":["Draw S = MPC = MSC and D = MPB.","Draw MSB above MPB: the gap is the external benefit of consumption.","Mark Qm and Qopt.","Shade the welfare loss between Qm and Qopt."],"explain":"Education, vaccinations and healthcare benefit people other than the consumer (a more productive workforce, herd immunity), so MSB > MPB. Consumers also often underestimate private benefits (imperfect information). The market under-consumes: Qm < Qopt. Policies: subsidies, direct government provision, legislation (compulsory schooling), advertising and nudges.","watch":"Merit goods are under-consumed because of positive externalities and imperfect information, not only because they are expensive.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-adwl\" points=\"172.0,143.0 172.0,91.5 198.0,117.3\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M105.9,26.0 L290.0,208.5\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,117.3 L198.0,117.3\"/>\n<path class=\"dg-drop\" d=\"M198.0,117.3 L198.0,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S = MPC = MSC<\/text>\n<text class=\"dg-lab dg-td\" x=\"260.4\" y=\"252.6\" text-anchor=\"start\">MPB<\/text>\n<text class=\"dg-lab dg-td\" x=\"284.0\" y=\"200.5\" text-anchor=\"start\">MSB<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"121.3\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"198.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"198.0\" cy=\"117.3\" r=\"3.6\"/>\n<text class=\"dg-note dg-tk\" x=\"252.2\" y=\"184.4\" text-anchor=\"middle\" font-size=\"11\">welfare loss<\/text>\n<path class=\"dg-arr dg-k\" d=\"M238.1,171.1 L190.9,143.0 M197.9,143.6 L190.9,143.0 L194.7,148.8\"/><\/g><\/svg>"},{"id":"pigou-tax","title":"Pigouvian (carbon) tax on a negative production externality","topic":"t2-8","hl":false,"steps":["Draw MPB = MSB, MPC and MSC with Qm > Qopt.","Set the tax equal to the external cost per unit, so MPC + tax = MSC.","Output falls to Qopt; price rises to Popt; the welfare loss is eliminated."],"explain":"A tax equal to the marginal external cost internalises the externality: firms now pay the full social cost. Advantages: market-based, raises revenue, gives an incentive to cut pollution in the cheapest way. Problems: measuring the external cost in money is hard; demand for many polluting goods is price inelastic so output may fall little; regressive effects on low-income households; firms may relocate (carbon leakage); political resistance.","watch":"The tax shifts MPC up to MSC; draw it on the same curve.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M54.0,208.5 L228.6,35.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,117.3 L146.0,117.3\"/>\n<path class=\"dg-drop\" d=\"M146.0,117.3 L146.0,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">MPB = MSB<\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">MPC<\/text>\n<text class=\"dg-lab dg-ts\" x=\"168.6\" y=\"27.4\" text-anchor=\"start\">MSC = MPC + tax<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"121.3\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"146.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"146.0\" cy=\"117.3\" r=\"3.6\"/>\n<path class=\"dg-arr dg-k\" d=\"M172.0,129.0 L172.0,100.9 M175.0,107.2 L172.0,100.9 L169.0,107.2\"/>\n<text class=\"dg-note dg-tk\" x=\"195.6\" y=\"116.6\" text-anchor=\"middle\" font-size=\"11\">tax<\/text><\/g><\/svg>"},{"id":"subsidy-merit","title":"Subsidy to correct a positive consumption externality","topic":"t2-8","hl":false,"steps":["Draw MPB, MSB (above) and S = MPC.","Draw S − subsidy shifted down by the external benefit.","The new equilibrium is at Qopt, where MPB meets S − subsidy."],"explain":"Subsidising a merit good (vaccines, solar panels, public transport fares) lowers its price and raises consumption to the social optimum. The government must fund the subsidy (opportunity cost), choose the right size (external benefits are hard to measure), and may find that firms simply keep the subsidy if supply is inelastic.","watch":"Quantity rises to Qopt; the price consumers pay falls.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M105.9,26.0 L290.0,208.5\"/>\n<path class=\"dg-ln dg-s\" d=\"M105.9,260.0 L290.0,77.5\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,168.7 L198.0,168.7\"/>\n<path class=\"dg-drop\" d=\"M198.0,168.7 L198.0,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S = MPC<\/text>\n<text class=\"dg-lab dg-td\" x=\"260.4\" y=\"252.6\" text-anchor=\"start\">MPB<\/text>\n<text class=\"dg-lab dg-td\" x=\"284.0\" y=\"200.5\" text-anchor=\"start\">MSB<\/text>\n<text class=\"dg-lab dg-ts\" x=\"228.0\" y=\"95.5\" text-anchor=\"start\">S − subsidy<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"172.7\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">c<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"198.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">opt<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"198.0\" cy=\"168.7\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"198.0\" cy=\"117.3\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"118.0\" y=\"113.3\" text-anchor=\"start\">MSB = MSC<\/text><\/g><\/svg>"},{"id":"permits","title":"Tradable permits (cap and trade)","topic":"t2-8","hl":false,"steps":["Label axes Price of permits and Quantity of permits (or pollution).","Draw a vertical supply of permits S fixed by the government (the cap).","Draw the demand for permits D₁; show demand rising to D₂ as the economy grows, raising the permit price.","Show the government reducing the cap from S₁ to S₂ over time."],"explain":"The authority sets a cap on total emissions and issues (or auctions) permits; firms that cut pollution cheaply sell spare permits to firms for which cutting is costly. The pollution target is met at the lowest total cost, and the permit price gives a continuing incentive to invest in clean technology. The EU Emissions Trading System is the largest example. Problems: setting the cap too high (permit prices collapsed after 2008), lobbying for free allocations, monitoring costs, carbon leakage.","watch":"Supply of permits is perfectly inelastic: it is a policy choice, not a market response.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price of permits<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity of permits<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M195.6,248.3 L195.6,37.7\"/>\n<path class=\"dg-ln dg-s\" d=\"M153.1,248.3 L153.1,37.7\" stroke-dasharray=\"6 5\"/>\n<path class=\"dg-ln dg-d\" d=\"M54.0,96.2 L290.0,236.6\"/>\n<path class ; the gap between them is AFC, which narrows as output rises.","Make sure MC cuts AVC and then ATC at their lowest points."],"explain":"In the short run at least one factor is fixed. MC first falls because of increasing marginal returns, then rises because of the law of diminishing marginal returns: adding more of a variable factor to a fixed factor eventually adds less and less output. When MC is below an average it pulls the average down; when above, it pulls it up. So MC passes through the minimum of AVC and ATC. AFC = FC/Q falls continuously as fixed costs are spread over more units.","watch":"The most common slip is MC crossing ATC away from its minimum point.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Costs<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Output (Q)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-c\" d=\"M72.9,172.3 L74.1,175.1 L75.2,177.9 L76.4,180.6 L77.6,183.2 L78.8,185.8 L80.0,188.4 L81.1,190.9 L82.3,193.3 L83.5,195.7 L84.7,198.0 L85.9,200.2 L87.0,202.4 L88.2,204.6 L89.4,206.6 L90.6,208.7 L91.8,210.7 L92.9,212.6 L94.1,214.4 L95.3,216.2 L96.5,218.0 L97.7,219.7 L98.8,221.3 L100.0,222.9 L101.2,224.4 L102.4,225.9 L103.6,227.3 L104.7,228.7 L105.9,230.0 L107.1,231.2 L108.3,232.4 L109.5,233.5 L110.6,234.6 L111.8,235.6 L113.0,236.6 L114.2,237.5 L115.4,238.4 L116.5,239.2 L117.7,239.9 L118.9,240.6 L120.1,241.2 L121.3,241.8 L122.4,242.3 L123.6,242.7 L124.8,243.2 L126.0,243.5 L127.2,243.8 L128.3,244.0 L129.5,244.2 L130.7,244.3 L131.9,244.4 L133.1,244.4 L134.2,244.4 L135.4,244.2 L136.6,244.1 L137.8,243.9 L139.0,243.6 L140.1,2 arket price, so every extra unit adds the same revenue: P = AR = MR. A firm with market power must cut price to sell more, so MR is below AR. With linear demand, MR falls twice as fast. Total revenue is maximised where MR = 0, which is where PED = 1 on the demand curve.","watch":"MR crosses the quantity axis at half the quantity where AR does.","svg":"<svg class=\"dg\" viewBox=\"0 0 618 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Perfect competition<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Output<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M54.0,150.0 L194.8,150.0\"/>\n<text class=\"dg-lab dg-td\" x=\"154.8\" y=\"142.0\" text-anchor=\"start\">P = AR = MR<\/text><\/g>\n<g transform=\"translate(318,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Imperfect competition<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Output<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M54.0,62.0 L212.4,260.0\"/>\n<path class=\"dg-ln dg-m\" d=\"M54.0,62.0 L133.2,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"176.4\" y=\"256.0\" text-anchor=\"start\">AR = D<\/text>\n<text class=\"dg-lab dg-tm\" x=\"135.2\" y=\"258.  means real GDP is falling, not just growing slowly. Growth can be positive while the economy is below trend.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Real GDP<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Time<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-k\" d=\"M54.0,208.5 L290.0,91.5\" stroke-dasharray=\"6 5\"/>\n<path class=\"dg-ln dg-d\" d=\"M54.0,229.8 L55.2,227.7 L56.4,225.6 L57.5,223.4 L58.7,221.2 L59.9,218.8 L61.1,216.5 L62.3,214.1 L63.4,211.6 L64.6,209.1 L65.8,206.6 L67.0,204.0 L68.2,201.5 L69.3,199.0 L70.5,196.4 L71.7,193.9 L72.9,191.4 L74.1,188.9 L75.2,186.5 L76.4,184.2 L77.6,181.8 L78.8,179.6 L80.0,177.4 L81.1,175.3 L82.3,173.2 L83.5,171.3 L84.7,169.5 L85.9,167.7 L87.0,166.1 L88.2,164.5 L89.4,163.1 L90.6,161.8 L91.8,160.6 L92.9,159.5 L94.1,158.6 L95.3,157.7 L96.5,157.0 L97.7,156.5 L98.8,156.0 L100.0,155.7 L101.2,155.5 L102.4,155.4 L103.6,155.5 L104.7,155.7 L105.9,155.9 L107.1,156.3 L108.3,156.8 L109.5,157.4 L110.6,158.1 L111.8,158.9 L113.0,159.8 L114.2,160.8 L115.4,161.8 L116.5,162.9 L117.7,164.1 L118.9,165.3 L120.1,166.5 L121.3,167.8 L122.4,169.2 L123.6,170.5 L124.8,171.9 L126.0,173.3 L127.2,174.6 L128.3,176.0 L129.5,177.3 L130.7,178.7 L131.9,179.9 L133.1,181.2 L134.2,182.4 L135.4,183.5 L136.6,184.6 L137.8,185.6 L139.0,186.5 L140.1,187.4 L141.3,188.1 L142.5,188.8 L143.7,189.3 L144.9,189.8 L146.0,190.1 L147.2,190.4 L148.4,190.5 L149.6,190.5 L150.8,190.3 L151.9,190.1 L153.1,189.7 L154.3,189.2 L155.5,188.6 L156.7,187.8 L157.8,187.0 L159.0,186.0 L160.2,184.8 L161.4,183.6 L162.6,182.2 L163.7,180.7 L164.9,179.2 L166.1,177.5
