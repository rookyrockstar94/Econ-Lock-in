ld example: Progress on the SDGs Vietnam cut extreme poverty from about 50% in the early 1990s to under 2% through export-led growth and land reform. Bangladesh raised life expectancy above India's and Pakistan's with NGO-led health and microfinance and garment exports. Armenia and Ecuador show mixed progress: gains in poverty and education, but challenges in inequality, environment and dependence on commodities and remittances. Exam tip For Paper 1 (b) development essays, avoid generic lists. Pick two or three strategies, link each to a specific barrier in a named country, and judge which suits that country's context.","dias":[]}]}]}],"exam":[],"formulas":[],"glossary":[{"t":"Abnormal profit","d":"Profit above normal profit (TR &gt; TC); also called supernormal or economic profit.","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Absolute advantage","d":"When a country can produce more of a good than another country with the same resources (or the same output with fewer resources).","e":"e-comparative-advantage","u":"u4","topic":"t4-1","hl":true},{"t":"Absolute poverty","d":"Income below the level needed to meet basic needs; the World Bank's international poverty line is $3.00 a day (2021 PPP, updated in 2025).","e":"e-measuring-inequality","u":"u3","topic":"t3-4","hl":false},{"t":"Actual growth","d":"An increase in real output, shown by a movement from inside the PPC towards it.","e":"e-ppc","u":"u1","topic":"t1-1","hl":false},{"t":"Administrative barriers","d":"Non-tariff barriers created by rules, regulations and bureaucratic procedures that make importing more difficult or costly.","e":"e-admin-barriers","u":"u4","topic":"t4-2","hl":false},{"t":"Ad valorem tax","d":"A tax that is a percentage of the price of a good, e.g. 20% VAT.","e":"e-indirect-taxes","u":"u2","topic":"t2-7","hl":false},{"t":"Adverse selection","d":"When asymmetric information before a transaction leads to the wrong people being selected into a market, e.g. high-risk people buying more insurance, or sellers of poor-quality used cars driving good cars out (the \"market for lemons\").","e":"e-asym-info","u":"u2","topic":"t2-10","hl":true},{"t":"Aggregate demand (AD)","d":"The total planned spending on an economy's goods and services at each price level in a given period: C + I + G + (X − M).","e":"e-ad","u":"u3","topic":"t3-2","hl":false},{"t":"Aggregate supply (AS)","d":"The total output that firms in an economy plan to produce at each price level in a given period.","e":"e-sras","u":"u3","topic":"t3-2","hl":false},{"t":"Allocative efficiency","d":"Producing the combination of goods society values most, where marginal social benefit equals marginal social cost.","e":"e-ppc","u":"u1","topic":"t1-1","hl":false},{"t":"Allocative efficiency (firm)","d":"Producing where price equals marginal cost (P = MC).","e":"e-perfect-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Anti-dumping duties","d":"Tariffs imposed on imports sold below their cost of production.","e":"e-protection-debate","u":"u4","topic":"t4-3","hl":false},{"t":"Appreciation","d":"A rise in the value of a currency in a floating system.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Asymmetric information","d":"When one party to a transaction has more or better information than the other, leading to market failure.","e":"e-asym-info","u":"u2","topic":"t2-10","hl":true},{"t":"Austerity","d":"Sustained cuts in government spending and/or tax increases to reduce a budget deficit.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Automatic stabilisers","d":"Changes in tax revenue and government spending that happen automatically with the business cycle and reduce its fluctuations, e.g. rising unemployment benefits and falling tax revenue in a recession.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Average revenue (AR)","d":"Total revenue divided by quantity sold; equal to price.","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Average tax rate","d":"Total tax paid divided by total income.","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Average total cost (ATC)","d":"Total cost divided by output.","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Balance of payments (BOP)","d":"A record of all economic transactions between the residents of a country and the rest of the world over a period of time.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Balance of trade in goods","d":"The value of goods exported minus the value of goods imported (visible trade).","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Balance of trade in services","d":"The value of services exported minus the value of services imported (invisible trade).","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Barriers to entry","d":"Obstacles that make it difficult for new firms to enter a market, e.g. economies of scale, legal barriers, brand loyalty, control of resources, high start-up costs.","e":"e-market-structures","u":"u2","topic":"t2-11","hl":true},{"t":"Base rate (policy rate)","d":"The interest rate the central bank charges commercial banks on loans, which influences all other interest rates.","e":"e-monetary-tools","u":"u3","topic":"t3-5","hl":false},{"t":"Behavioural economics","d":"A branch of economics that uses insights from psychology to explain why people do not always act rationally.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Biases","d":"Systematic errors in decision-making, such as rules of thumb, anchoring and framing, availability and loss aversion.","e":"e-rational-choice","u":"u2","topic":"t2-4","hl":false},{"t":"Bilateral trade agreement","d":"A trade agreement between two countries, e.g. the UK–Australia FTA (2023).","e":"e-integration","u":"u4","topic":"t4-4","hl":false},{"t":"Bounded rationality","d":"The idea that people make decisions that are \"good enough\" because they have limited information, time and mental capacity.","e":"e-rational-choice","u":"u2","topic":"t2-4","hl":false},{"t":"Bounded self-control","d":"People's limited willpower, which makes them act against their own long-term interests (e.g. overeating, undersaving).","e":"e-rational-choice","u":"u2","topic":"t2-4","hl":false},{"t":"Bounded selfishness","d":"The idea that people care about others and fairness, not only about themselves (e.g. charity, volunteering).","e":"e-rational-choice","u":"u2","topic":"t2-4","hl":false},{"t":"Break-even price","d":"The price equal to minimum average total cost, at which a firm earns normal profit.","e":"e-perfect-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Budget deficit","d":"When government spending is greater than government revenue in a year.","e":"e-govt-debt","u":"u3","topic":"t3-3","hl":false},{"t":"Budget surplus","d":"When government revenue is greater than government spending in a year.","e":"e-govt-debt","u":"u3","topic":"t3-3","hl":false},{"t":"Buffer stock","d":"A stock of a commodity bought by an authority when prices are low and sold when prices are high, to stabilise prices.","e":"e-price-floors","u":"u2","topic":"t2-7","hl":false},{"t":"Business confidence","d":"How optimistic firms are about future sales and profits, a key driver of investment.","e":"e-ad","u":"u3","topic":"t3-2","hl":false},{"t":"Business cycle","d":"The fluctuations of real GDP around its long-term trend, through phases of expansion, peak, contraction and trough.","e":"e-business-cycle","u":"u3","topic":"t3-1","hl":false},{"t":"Capital","d":"Man-made resources used to produce other goods and services, such as machines, tools, buildings and infrastructure; its reward is interest.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Capital account","d":"The part of the BOP recording capital transfers (e.g. debt forgiveness, migrants' transfers) and the purchase or sale of non-produced, non-financial assets (e.g. patents, land for embassies).","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Capital expenditure","d":"Government spending on long-term investment, such as roads, schools and hospitals.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Capital flight","d":"The large-scale movement of money and assets out of a country, often due to political or economic instability.","e":"e-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Capital gains tax","d":"A tax on the profit from selling an asset that has risen in value.","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Capital goods","d":"Goods used to produce other goods, such as machinery and buildings.","e":"e-ppc","u":"u1","topic":"t1-1","hl":false},{"t":"Carbon tax","d":"A tax on the carbon content of fossil fuels, to make polluters pay for the external cost of CO₂ emissions.","e":"e-externality-policy","u":"u2","topic":"t2-8","hl":false},{"t":"Cartel","d":"A formal collusive agreement among firms or countries to restrict output and raise prices, e.g. OPEC.","e":"e-oligopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Central bank","d":"The institution responsible for a country's monetary policy, e.g. the Federal Reserve, the European Central Bank, the Bank of England.","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Central bank independence","d":"When the central bank sets monetary policy free from political control.","e":"e-monetary-eval","u":"u3","topic":"t3-5","hl":false},{"t":"Ceteris paribus","d":"\"All other things being equal\": holding all other variables constant to isolate the effect of one change.","e":"e-methodology","u":"u1","topic":"t1-2","hl":false},{"t":"Choice architecture","d":"The design of the way choices are presented to people, which influences the decisions they make.","e":"e-behavioural","u":"u2","topic":"t2-4","hl":false},{"t":"Circular economy","d":"An economic system that eliminates waste, keeps products and materials in use and regenerates natural systems.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Circular flow of income","d":"A model showing how money flows between households and firms (and government, financial sector and the rest of the world) in exchange for factors and goods.","e":"e-circular-flow-intro","u":"u1","topic":"t1-1","hl":false},{"t":"Collective self-governance","d":"Communities managing common resources themselves through shared rules and monitoring, as studied by Elinor Ostrom (Nobel Prize 2009).","e":"e-common-pool","u":"u2","topic":"t2-8","hl":false},{"t":"Collusion","d":"An agreement between firms to limit competition, for example by fixing prices or sharing out markets.","e":"e-oligopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Commercial bank","d":"A private bank that accepts deposits and makes loans.","e":"e-monetary-tools","u":"u3","topic":"t3-5","hl":false},{"t":"Commodity dependence","d":"When a country relies on a small number of primary commodities for most of its export earnings.","e":"e-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Common market","d":"A customs union that also allows free movement of factors of production (labour and capital), e.g. the EU single market.","e":"e-trading-blocs","u":"u4","topic":"t4-4","hl":false},{"t":"Common pool resource","d":"A natural resource that is rivalrous (one person's use reduces what is left for others) but non-excludable (people cannot easily be prevented from using it), e.g. fish stocks, forests, groundwater.","e":"e-common-pool","u":"u2","topic":"t2-8","hl":false},{"t":"Comparative advantage","d":"When a country can produce a good at a lower opportunity cost than another country.","e":"e-comparative-advantage","u":"u4","topic":"t4-1","hl":true},{"t":"Competition policy","d":"Government laws and regulators that promote competition and prevent abuse of market power, e.g. blocking mergers and fining cartels.","e":"e-market-power-policy","u":"u2","topic":"t2-11","hl":true},{"t":"Competitive market","d":"A market with many buyers and sellers, none of whom can influence the price.","e":"e-equilibrium","u":"u2","topic":"t2-3","hl":false},{"t":"Competitive supply","d":"When resources used to produce one good could produce another instead, e.g. a farmer choosing wheat or barley.","e":"e-supply-determinants","u":"u2","topic":"t2-2","hl":false},{"t":"Complements","d":"Goods used together; a rise in the price of one decreases demand for the other.","e":"e-demand-determinants","u":"u2","topic":"t2-1","hl":false},{"t":"Composite indicator","d":"A measure of development that combines several indicators into one index.","e":"e-composite-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Concentration ratio","d":"The combined market share of the largest firms in an industry, e.g. CR4 = share of the four largest firms.","e":"e-market-structures","u":"u2","topic":"t2-11","hl":true},{"t":"Conditional cash transfer","d":"Cash given to poor households on condition that they meet requirements, such as keeping children in school or attending health check-ups.","e":"e-other-policies","u":"u3","topic":"t3-4","hl":false},{"t":"Consumer burden","d":"The part of an indirect tax paid by consumers through higher prices.","e":"e-indirect-taxes","u":"u2","topic":"t2-7","hl":false},{"t":"Consumer confidence","d":"How optimistic households are about their future incomes and the economy.","e":"e-ad","u":"u3","topic":"t3-2","hl":false},{"t":"Consumer goods","d":"Goods bought by households for final consumption.","e":"e-ppc","u":"u1","topic":"t1-1","hl":false},{"t":"Consumer price index (CPI)","d":"An index of the average prices of a representative basket of goods and services bought by a typical household, weighted by their share in spending.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Consumer surplus","d":"The difference between the highest price consumers are willing to pay and the price they actually pay; the area below the demand curve and above the price.","e":"e-surplus","u":"u2","topic":"t2-3","hl":false},{"t":"Consumption (C)","d":"Spending by households on goods and services.","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Contractionary fiscal policy","d":"Cutting government spending and/or raising taxes to reduce AD.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Contractionary monetary policy","d":"Raising interest rates or reducing the money supply to reduce AD (also called tight monetary policy).","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Contraction in demand","d":"A decrease in quantity demanded caused by a rise in the good's own price: a movement up the demand curve.","e":"e-demand-law","u":"u2","topic":"t2-1","hl":false},{"t":"Contraction in supply","d":"A fall in quantity supplied caused by a fall in the good's own price.","e":"e-supply-law","u":"u2","topic":"t2-2","hl":false},{"t":"Core inflation","d":"An inflation measure that excludes volatile items such as food and energy.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Corporate social responsibility (CSR)","d":"A firm acting ethically and in the interests of society and the environment, beyond what the law requires.","e":"e-business-objectives","u":"u2","topic":"t2-4","hl":false},{"t":"Corruption","d":"The abuse of public office for private gain, e.g. bribery and embezzlement.","e":"e-political-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Cost-push inflation","d":"Inflation caused by rising costs of production shifting SRAS left.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Credit rating","d":"An assessment by agencies (S&amp;P, Moody's, Fitch) of a borrower's ability to repay; a lower rating raises borrowing costs.","e":"e-govt-debt","u":"u3","topic":"t3-3","hl":false},{"t":"Crowding out","d":"When increased government borrowing raises interest rates and reduces private sector investment and consumption.","e":"e-fiscal-eval","u":"u3","topic":"t3-6","hl":false},{"t":"Currency peg","d":"A fixed exchange rate against another currency or basket of currencies.","e":"e-fixed-vs-floating","u":"u4","topic":"t4-5","hl":false},{"t":"Current account","d":"The part of the BOP recording trade in goods and services, primary income and secondary income.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Current account deficit","d":"When the value of money flowing out on the current account exceeds the value flowing in.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Current expenditure","d":"Government spending on day-to-day items, such as wages of public sector workers and supplies.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Customs union","d":"A free trade area with a common external tariff against non-members, e.g. the EU customs union, Mercosur.","e":"e-trading-blocs","u":"u4","topic":"t4-4","hl":false},{"t":"Cyclical unemployment","d":"Unemployment caused by a fall in aggregate demand during a downturn (demand-deficient unemployment).","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Debt relief","d":"Cancelling or reducing a country's debts, e.g. the HIPC initiative and the Multilateral Debt Relief Initiative.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Debt servicing","d":"The interest payments a government must make on its debt.","e":"e-govt-debt","u":"u3","topic":"t3-3","hl":false},{"t":"Debt-to-GDP ratio","d":"Government debt as a percentage of GDP; a measure of the sustainability of debt.","e":"e-govt-debt","u":"u3","topic":"t3-3","hl":false},{"t":"Default choice","d":"An option that applies automatically unless the person actively chooses otherwise.","e":"e-behavioural","u":"u2","topic":"t2-4","hl":false},{"t":"Deflation","d":"A sustained decrease in the average price level in an economy.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Demand","d":"The quantity of a good or service that consumers are willing and able to buy at each possible price, in a given time period, ceteris paribus.","e":"e-demand-law","u":"u2","topic":"t2-1","hl":false},{"t":"Demand-pull inflation","d":"Inflation caused by aggregate demand growing faster than aggregate supply.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Demerit good","d":"A good that is harmful to consumers and society, overconsumed in a free market because of negative externalities and imperfect information (e.g. cigarettes, alcohol, sugary drinks).","e":"e-neg-externalities","u":"u2","topic":"t2-8","hl":false},{"t":"Depreciation","d":"A fall in the value of a currency in a floating system.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Deregulation","d":"The removal of rules and regulations, to increase competition and reduce costs.","e":"e-supply-side","u":"u3","topic":"t3-7","hl":false},{"t":"Devaluation","d":"A deliberate reduction in the value of a currency in a fixed exchange rate system.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Development aid","d":"Longer-term assistance to promote development: funding for schools, health systems, infrastructure.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Direct provision","d":"When the government itself supplies a good or service, funded through taxation, e.g. state schools, hospitals, roads.","e":"e-direct-provision","u":"u2","topic":"t2-7","hl":false},{"t":"Direct tax","d":"A tax on income or wealth paid directly to the government by the person or firm, e.g. income tax, corporation tax, wealth tax.","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Discretionary fiscal policy","d":"Deliberate changes in government spending or tax rates.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Disinflation","d":"A fall in the rate of inflation: prices are still rising, but more slowly.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Doughnut economics","d":"Kate Raworth's model in which economies should meet everyone's basic needs (the social foundation) without exceeding the planet's ecological limits (the ecological ceiling).","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Dumping","d":"Selling goods abroad at a price below their cost of production (or below the domestic price), often made possible by subsidies.","e":"e-trade-subsidies","u":"u4","topic":"t4-2","hl":false},{"t":"Dynamic efficiency","d":"Efficiency over time, through innovation, new products and falling costs.","e":"e-monopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Economic development","d":"A broad improvement in living standards and well-being, including higher incomes, less poverty, better health and education, greater freedom and choice.","e":"e-sustainable-dev","u":"u4","topic":"t4-7","hl":false},{"t":"Economic diversification","d":"Broadening the range of goods and services an economy produces and exports, to reduce reliance on a few products.","e":"e-trade-strategies","u":"u4","topic":"t4-10","hl":false},{"t":"Economic good","d":"A good that is scarce, so producing or consuming it has an opportunity cost.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Economic growth","d":"An increase in real GDP (or real GDP per capita) over time, usually measured as an annual percentage change.","e":"e-growth","u":"u3","topic":"t3-3","hl":false},{"t":"Economic integration","d":"The process by which countries reduce trade barriers and coordinate economic policies, deepening their economic links.","e":"e-integration","u":"u4","topic":"t4-4","hl":false},{"t":"Economic model","d":"A simplified representation of reality, built on assumptions, used to explain and predict economic behaviour.","e":"e-social-science","u":"u1","topic":"t1-1","hl":false},{"t":"Economics","d":"The study of how individuals, firms and societies allocate scarce resources to satisfy unlimited needs and wants.","e":"e-social-science","u":"u1","topic":"t1-1","hl":false},{"t":"Economic well-being","d":"A multidimensional idea of prosperity and quality of life: financial security, meeting basic needs, the ability to make choices and to maintain an adequate income over time.","e":"e-key-concepts","u":"u1","topic":"t1-1","hl":false},{"t":"Effective demand","d":"Desire for a good backed by the ability to pay for it.","e":"e-demand-law","u":"u2","topic":"t2-1","hl":false},{"t":"Empirical evidence","d":"Information gathered by observation and measurement, used to test hypotheses.","e":"e-methodology","u":"u1","topic":"t1-2","hl":false},{"t":"Entrepreneurship","d":"The organising and risk-taking factor that combines the other factors to produce goods and services; its reward is profit.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Equality","d":"Everyone having the same income, wealth or opportunities; a positive (measurable) idea.","e":"e-equity","u":"u2","topic":"t2-12","hl":false},{"t":"Equilibrium","d":"A situation in which quantity demanded equals quantity supplied, so there is no tendency for price to change.","e":"e-equilibrium","u":"u2","topic":"t2-3","hl":false},{"t":"Equity","d":"Fairness in the distribution of income, wealth or opportunities; a normative concept, distinct from equality.","e":"e-key-concepts","u":"u1","topic":"t1-1","hl":false},{"t":"Excess capacity","d":"When a firm produces below the output that minimises average total cost.","e":"e-monopolistic-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Excess demand (shortage)","d":"When quantity demanded is greater than quantity supplied at the current price.","e":"e-equilibrium","u":"u2","topic":"t2-3","hl":false},{"t":"Excess supply (surplus)","d":"When quantity supplied is greater than quantity demanded at the current price.","e":"e-equilibrium","u":"u2","topic":"t2-3","hl":false},{"t":"Exchange rate","d":"The price of one currency in terms of another.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Excise tax","d":"An indirect tax on a specific good such as tobacco, alcohol or fuel.","e":"e-indirect-taxes","u":"u2","topic":"t2-7","hl":false},{"t":"Expansionary fiscal policy","d":"Increasing government spending and/or cutting taxes to raise AD.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Expansionary monetary policy","d":"Lowering interest rates or increasing the money supply to raise AD (also called loose monetary policy).","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Expectations-augmented Phillips curve","d":"The idea that the SRPC shifts up when people expect higher inflation, so attempts to keep unemployment below the NRU only raise inflation.","e":"e-conflicts","u":"u3","topic":"t3-3","hl":false},{"t":"Expenditure approach","d":"Measuring GDP by adding all spending on final goods and services: C + I + G + (X − M).","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Expenditure-reducing policies","d":"Contractionary fiscal and monetary policies that reduce AD and so reduce spending on imports.","e":"e-ca-deficits","u":"u4","topic":"t4-6","hl":false},{"t":"Expenditure-switching","d":"A change in relative prices (e.g. through depreciation or tariffs) that makes consumers switch from imports to domestic goods.","e":"e-er-changes","u":"u4","topic":"t4-5","hl":false},{"t":"Expenditure-switching policies","d":"Policies that make imports relatively dearer or exports relatively cheaper, so spending switches to domestic goods, e.g. depreciation, devaluation, protection.","e":"e-ca-deficits","u":"u4","topic":"t4-6","hl":false},{"t":"Export promotion","d":"A strategy of encouraging industries that produce goods for export, through openness to trade and investment.","e":"e-trade-strategies","u":"u4","topic":"t4-10","hl":false},{"t":"Export subsidy","d":"A payment by the government to domestic producers per unit exported.","e":"e-trade-subsidies","u":"u4","topic":"t4-2","hl":false},{"t":"Extension in demand","d":"An increase in quantity demanded caused by a fall in the good's own price: a movement down the demand curve.","e":"e-demand-law","u":"u2","topic":"t2-1","hl":false},{"t":"Extension in supply","d":"A rise in quantity supplied caused by a rise in the good's own price.","e":"e-supply-law","u":"u2","topic":"t2-2","hl":false},{"t":"Externality","d":"A cost or benefit of production or consumption that falls on third parties not involved in the transaction, and is not reflected in the market price.","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Factor endowments","d":"The quantity and quality of factors of production a person or country owns.","e":"e-equity","u":"u2","topic":"t2-12","hl":false},{"t":"Factors of production","d":"The resources used to produce goods and services: land, labour, capital and entrepreneurship.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Fair trade","d":"A scheme guaranteeing a minimum price and a social premium to producers in developing countries, certified by organisations such as Fairtrade International.","e":"e-trade-strategies","u":"u4","topic":"t4-10","hl":false},{"t":"Financial account","d":"The part of the BOP recording flows of financial investment: FDI, portfolio investment, other investment and changes in reserve assets.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Financial inclusion","d":"Access for individuals and businesses to useful, affordable financial services: accounts, payments, credit, insurance.","e":"e-institutional-change","u":"u4","topic":"t4-10","hl":false},{"t":"Fiscal policy","d":"The use of government spending and taxation to influence aggregate demand and achieve macroeconomic objectives.","e":"e-fiscal-overview","u":"u3","topic":"t3-6","hl":false},{"t":"Fixed costs","d":"Costs that do not change with output in the short run, e.g. rent, insurance.","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Fixed exchange rate","d":"An exchange rate set by the government or central bank against another currency (or basket), maintained by intervention.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Floating exchange rate","d":"An exchange rate determined by the demand for and supply of the currency, with no government intervention.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Foreign aid","d":"Assistance given by one country (or organisation) to another, as grants, concessional loans, goods or technical help.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Foreign debt","d":"Money owed by a country's government, firms and households to foreign lenders.","e":"e-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Foreign direct investment (FDI)","d":"Long-term investment by a firm in another country that gives it control or a lasting interest (at least 10% of a company), e.g. building a factory.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Foreign exchange reserves","d":"Holdings of foreign currencies (and gold) by a central bank, used to intervene in currency markets.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Fractional reserve banking","d":"A system in which banks keep only a fraction of deposits as reserves and lend out the rest, creating new money.","e":"e-monetary-tools","u":"u3","topic":"t3-5","hl":false},{"t":"Free good","d":"A good that is not scarce, so it has no opportunity cost (e.g. air, sunlight).","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Free market economy","d":"An economy in which resources are privately owned and allocated by the price mechanism, with minimal government intervention.","e":"e-econ-questions","u":"u1","topic":"t1-1","hl":false},{"t":"Free-rider problem","d":"When people can benefit from a good without paying for it, so private firms cannot make a profit and will not supply it.","e":"e-public-goods","u":"u2","topic":"t2-9","hl":false},{"t":"Free trade","d":"International trade without government restrictions such as tariffs, quotas or subsidies.","e":"e-trade-benefits","u":"u4","topic":"t4-1","hl":false},{"t":"Free trade area","d":"A trading bloc in which members remove trade barriers among themselves but keep their own barriers against non-members, e.g. USMCA, AfCFTA.","e":"e-trading-blocs","u":"u4","topic":"t4-4","hl":false},{"t":"Frictional unemployment","d":"Short-term unemployment of people between jobs.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Full employment level of output (Yf)","d":"The output produced when unemployment is at its natural rate; potential output.","e":"e-as-models","u":"u3","topic":"t3-2","hl":false},{"t":"Game theory","d":"The study of strategic decision-making when the outcome for each player depends on the choices of others.","e":"e-oligopoly","u":"u2","topic":"t2-11","hl":true},{"t":"GDP deflator","d":"A price index used to convert nominal GDP into real GDP.","e":"e-ni-terms","u":"u3","topic":"t3-1","hl":false},{"t":"GDP per capita","d":"GDP divided by the population; a measure of average output or income per person.","e":"e-ni-terms","u":"u3","topic":"t3-1","hl":false},{"t":"Gender Inequality Index (GII)","d":"A UNDP index measuring gender inequality in reproductive health, empowerment and the labour market; higher values mean more inequality.","e":"e-composite-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Gini coefficient","d":"A measure of inequality from 0 (perfect equality) to 1 (perfect inequality), equal to the area between the line of equality and the Lorenz curve divided by the total area under the line of equality.","e":"e-measuring-inequality","u":"u3","topic":"t3-4","hl":false},{"t":"Globalisation","d":"The growing integration and interdependence of the world's economies through trade, investment, migration, technology and culture.","e":"e-trade-benefits","u":"u4","topic":"t4-1","hl":false},{"t":"Good governance","d":"Government that is accountable, transparent, effective, follows the rule of law and is free of corruption.","e":"e-political-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Government (national) debt","d":"The total amount the government owes: the accumulation of past budget deficits minus surpluses.","e":"e-govt-debt","u":"u3","topic":"t3-3","hl":false},{"t":"Government spending (G)","d":"Spending by the government on goods and services (not transfer payments).","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Gross domestic product (GDP)","d":"The total value of all final goods and services produced within a country in a given period, usually a year.","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Gross national income (GNI)","d":"GDP plus net income from abroad (income earned by nationals abroad minus income earned by foreigners in the country).","e":"e-ni-terms","u":"u3","topic":"t3-1","hl":false},{"t":"Growth maximisation","d":"Aiming to make the firm as large as possible, measured by sales, output, market share or assets.","e":"e-business-objectives","u":"u2","topic":"t2-4","hl":false},{"t":"Happy Planet Index","d":"An index that measures how efficiently countries turn ecological resources into long, happy lives (well-being × life expectancy ÷ ecological footprint).","e":"e-gdp-wellbeing","u":"u3","topic":"t3-1","hl":false},{"t":"Hidden unemployment","d":"People who want work but are not counted as unemployed, e.g. discouraged workers who have stopped looking or people on disability benefits.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Hot money","d":"Short-term capital that moves between countries in search of the highest interest rate or a quick gain.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Human Development Index (HDI)","d":"A UNDP index combining life expectancy at birth, education (mean and expected years of schooling) and GNI per capita (PPP), from 0 to 1.","e":"e-composite-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Humanitarian aid","d":"Emergency help in response to disasters or conflict: food, medicine, shelter.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Hypothesis","d":"A testable statement about the relationship between variables.","e":"e-methodology","u":"u1","topic":"t1-2","hl":false},{"t":"Imperfect information","d":"When buyers or sellers lack full knowledge of prices, quality or consequences, so they cannot make fully informed choices.","e":"e-rational-choice","u":"u2","topic":"t2-4","hl":false},{"t":"Import substitution","d":"A strategy of protecting domestic industries from imports so that they grow and replace imported goods (import substitution industrialisation, ISI).","e":"e-trade-strategies","u":"u4","topic":"t4-10","hl":false},{"t":"Incentive function","d":"Higher prices motivate firms to produce more (higher profits) and lower prices motivate consumers to buy more.","e":"e-price-mechanism","u":"u2","topic":"t2-3","hl":false},{"t":"Income approach","d":"Measuring GDP by adding all incomes earned: wages, rent, interest and profit.","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Income effect","d":"When a good's price falls, consumers' real income (purchasing power) rises, so they can buy more of it.","e":"e-demand-hl","u":"u2","topic":"t2-1","hl":true},{"t":"Income elasticity of demand (YED)","d":"A measure of the responsiveness of demand for a good to a change in consumers' income: %ΔQd ÷ %ΔY.","e":"e-yed","u":"u2","topic":"t2-5","hl":false},{"t":"Income elastic (luxury) good","d":"A normal good with YED &gt; 1: demand rises more than proportionately with income.","e":"e-yed","u":"u2","topic":"t2-5","hl":false},{"t":"Income inelastic (necessity) good","d":"A normal good with YED between 0 and 1.","e":"e-yed","u":"u2","topic":"t2-5","hl":false},{"t":"Income inequality","d":"Unequal distribution of income among individuals or households.","e":"e-measuring-inequality","u":"u3","topic":"t3-4","hl":false},{"t":"Indirect tax","d":"A tax on spending on goods and services, paid to the government by producers, who pass some of it on to consumers.","e":"e-indirect-taxes","u":"u2","topic":"t2-7","hl":false},{"t":"Industrial policy","d":"Government policies to support particular industries, e.g. subsidies, tax credits and targeted investment.","e":"e-supply-side","u":"u3","topic":"t3-7","hl":false},{"t":"Inequality-adjusted HDI (IHDI)","d":"The HDI adjusted for inequality in each of its three dimensions; the gap between HDI and IHDI shows the loss from inequality.","e":"e-composite-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Inequity","d":"Unfairness in the distribution of income, wealth or opportunity; a normative judgement.","e":"e-equity","u":"u2","topic":"t2-12","hl":false},{"t":"Infant industry","d":"A new industry that needs temporary protection until it can achieve economies of scale and compete internationally.","e":"e-protection-debate","u":"u4","topic":"t4-3","hl":false},{"t":"Infant mortality rate","d":"The number of babies who die before their first birthday per 1,000 live births.","e":"e-single-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Inferior good","d":"A good for which demand falls when income rises (negative YED), e.g. bus travel, discount supermarket brands.","e":"e-demand-determinants","u":"u2","topic":"t2-1","hl":false},{"t":"Inflation","d":"A sustained increase in the average price level in an economy over a period of time.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Inflationary gap","d":"When equilibrium real GDP is above potential output, putting upward pressure on prices.","e":"e-macro-equilibrium","u":"u3","topic":"t3-2","hl":false},{"t":"Inflation targeting","d":"A policy in which the central bank publicly commits to keeping inflation at a target rate, usually around 2%.","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Informal economy","d":"Economic activity that is not recorded or taxed, e.g. cash-in-hand work and street vending.","e":"e-gdp-wellbeing","u":"u3","topic":"t3-1","hl":false},{"t":"Injections","d":"Additions to the circular flow from outside the household-firm loop: investment (I), government spending (G) and exports (X).","e":"e-circular-flow-intro","u":"u1","topic":"t1-1","hl":false},{"t":"Institutional change","d":"Changes in the rules of the economy, such as property rights, the legal system and the reduction of corruption.","e":"e-lras-shifts","u":"u3","topic":"t3-2","hl":false},{"t":"Interdependence","d":"The way economic agents and countries rely on each other through trade, finance and markets.","e":"e-key-concepts","u":"u1","topic":"t1-1","hl":false},{"t":"Interest rate effect","d":"A fall in the price level reduces demand for money, lowering interest rates and raising consumption and investment.","e":"e-ad","u":"u3","topic":"t3-2","hl":false},{"t":"Intergenerational poverty","d":"Poverty passed from one generation to the next.","e":"e-inequality-causes","u":"u3","topic":"t3-4","hl":false},{"t":"Internalising an externality","d":"Making the producer or consumer pay for (or receive) the external cost (or benefit), so that it enters their decision.","e":"e-externality-policy","u":"u2","topic":"t2-8","hl":false},{"t":"International agreement","d":"A treaty between countries to tackle a shared problem, such as the Paris Agreement on climate change.","e":"e-permits","u":"u2","topic":"t2-8","hl":false},{"t":"International Monetary Fund (IMF)","d":"The international organisation that promotes monetary cooperation and financial stability, lending to countries with balance of payments problems, usually with conditions.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"International trade","d":"The exchange of goods and services between countries.","e":"e-trade-benefits","u":"u4","topic":"t4-1","hl":false},{"t":"International trade effect","d":"A fall in the price level makes domestic goods cheaper relative to foreign goods, raising exports and reducing imports.","e":"e-ad","u":"u3","topic":"t3-2","hl":false},{"t":"Intervention","d":"Government involvement in the workings of markets.","e":"e-key-concepts","u":"u1","topic":"t1-1","hl":false},{"t":"Interventionist supply-side policies","d":"Policies in which the government actively invests or intervenes to raise potential output, e.g. education, healthcare, infrastructure, R&amp;D and industrial policy.","e":"e-supply-side","u":"u3","topic":"t3-7","hl":false},{"t":"Investment (I)","d":"Spending by firms on capital goods, such as machinery, buildings and stocks.","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Invisible hand","d":"Adam Smith's idea that individuals pursuing self-interest in free markets unintentionally promote the good of society.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Inward FDI","d":"Investment by foreign firms in productive assets inside a country.","e":"e-market-vs-intervention","u":"u4","topic":"t4-10","hl":false},{"t":"Joint supply","d":"When producing one good automatically produces another, e.g. beef and leather.","e":"e-supply-determinants","u":"u2","topic":"t2-2","hl":false},{"t":"Keynesian AS curve","d":"An aggregate supply curve that is horizontal at low output (spare capacity), upward-sloping as the economy nears full employment, and vertical at full employment.","e":"e-as-models","u":"u3","topic":"t3-2","hl":false},{"t":"Keynesian economics","d":"The view that markets can stay in recession for long periods and that governments should manage aggregate demand, especially through fiscal policy.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Labour","d":"The physical and mental effort of people in production; its reward is wages.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Labour force","d":"All people of working age who are either employed or unemployed (actively seeking work).","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Labour market flexibility","d":"The ease with which employers can hire, fire and change working conditions, and with which wages adjust.","e":"e-supply-side","u":"u3","topic":"t3-7","hl":false},{"t":"Laissez-faire","d":"The idea that governments should leave markets alone, with minimal intervention.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Land","d":"All natural resources used in production, including minerals, forests, water and the land itself; its reward is rent.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Law of demand","d":"There is an inverse relationship between the price of a good and the quantity demanded, ceteris paribus.","e":"e-demand-law","u":"u2","topic":"t2-1","hl":false},{"t":"Law of diminishing marginal returns","d":"In the short run, as more units of a variable factor (e.g. labour) are added to a fixed factor (e.g. capital), the extra output from each additional unit of the variable factor eventually falls.","e":"e-supply-hl","u":"u2","topic":"t2-2","hl":true},{"t":"Law of diminishing marginal utility","d":"As a person consumes more units of a good, the extra satisfaction from each additional unit falls.","e":"e-demand-hl","u":"u2","topic":"t2-1","hl":true},{"t":"Law of supply","d":"There is a positive relationship between the price of a good and the quantity supplied, ceteris paribus.","e":"e-supply-law","u":"u2","topic":"t2-2","hl":false},{"t":"Leakages","d":"Withdrawals from the circular flow: saving (S), taxes (T) and import spending (M).","e":"e-circular-flow-intro","u":"u1","topic":"t1-1","hl":false},{"t":"Life expectancy","d":"The average number of years a newborn is expected to live, given current mortality rates.","e":"e-single-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Linear demand function","d":"An equation of the form Qd = a − bP, where a is the quantity demanded at a price of zero and b shows how much Qd changes for each $1 change in price.","e":"e-demand-hl","u":"u2","topic":"t2-1","hl":true},{"t":"Linear supply function","d":"An equation of the form Qs = c + dP, where c is the quantity supplied at a price of zero and d shows how much Qs changes for each $1 change in price.","e":"e-supply-hl","u":"u2","topic":"t2-2","hl":true},{"t":"Liquidity trap","d":"A situation where interest rates are so low that further cuts or increases in the money supply fail to raise spending.","e":"e-monetary-eval","u":"u3","topic":"t3-5","hl":false},{"t":"Long-run aggregate supply (LRAS)","d":"Aggregate supply when all wages and prices are fully flexible; vertical at potential output in the new classical model.","e":"e-as-models","u":"u3","topic":"t3-2","hl":false},{"t":"Long-run equilibrium","d":"When AD, SRAS and LRAS all intersect at potential output.","e":"e-macro-equilibrium","u":"u3","topic":"t3-2","hl":false},{"t":"Long-run Phillips curve (LRPC)","d":"A vertical line at the natural rate of unemployment, showing no long-run trade-off between inflation and unemployment.","e":"e-conflicts","u":"u3","topic":"t3-3","hl":false},{"t":"Long-term growth","d":"Growth in potential output, caused by an increase in the quantity or quality of factors of production; an outward shift of the PPC and LRAS.","e":"e-growth","u":"u3","topic":"t3-3","hl":false},{"t":"Lorenz curve","d":"A graph showing the cumulative percentage of income earned by the cumulative percentage of the population, ranked from poorest to richest.","e":"e-measuring-inequality","u":"u3","topic":"t3-4","hl":false},{"t":"Loss","d":"When total revenue is less than total cost (TR &lt; TC).","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Macroeconomics","d":"The study of the economy as a whole: total output, the average price level, unemployment, growth and the role of government policy.","e":"e-social-science","u":"u1","topic":"t1-1","hl":false},{"t":"Managed exchange rate","d":"A floating exchange rate in which the central bank intervenes from time to time to keep the rate within a target range (managed float).","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Mandated choice","d":"Requiring people to make an active decision (e.g. stating whether they want to be an organ donor when applying for a licence).","e":"e-behavioural","u":"u2","topic":"t2-4","hl":false},{"t":"Marginal benefit (MB)","d":"The extra benefit from consuming one more unit; shown by the demand curve.","e":"e-surplus","u":"u2","topic":"t2-3","hl":false},{"t":"Marginal cost (MC)","d":"The additional cost of producing one more unit of output.","e":"e-supply-hl","u":"u2","topic":"t2-2","hl":true},{"t":"Marginalism","d":"Analysing decisions at the margin, i.e. the extra benefit and extra cost of one more unit.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Marginal private benefit (MPB)","d":"The extra benefit to the consumer of consuming one more unit; the market demand curve.","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Marginal private cost (MPC)","d":"The extra cost to the producer of producing one more unit; the market supply curve.","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Marginal propensity to consume (MPC)","d":"The proportion of an extra dollar of income that is spent on consumption.","e":"e-multiplier","u":"u3","topic":"t3-6","hl":true},{"t":"Marginal propensity to import (MPM)","d":"The proportion of an extra dollar of income that is spent on imports.","e":"e-multiplier","u":"u3","topic":"t3-6","hl":true},{"t":"Marginal propensity to save (MPS)","d":"The proportion of an extra dollar of income that is saved.","e":"e-multiplier","u":"u3","topic":"t3-6","hl":true},{"t":"Marginal propensity to tax (MPT)","d":"The proportion of an extra dollar of income that is paid in tax.","e":"e-multiplier","u":"u3","topic":"t3-6","hl":true},{"t":"Marginal propensity to withdraw (MPW)","d":"MPS + MPT + MPM: the proportion of extra income that leaks out of the circular flow.","e":"e-multiplier","u":"u3","topic":"t3-6","hl":true},{"t":"Marginal revenue (MR)","d":"The additional revenue from selling one more unit.","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Marginal social benefit (MSB)","d":"The extra benefit to society of one more unit: MPB plus any marginal external benefit.","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Marginal social cost (MSC)","d":"The extra cost to society of one more unit: MPC plus any marginal external cost.","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Marginal tax rate","d":"The tax rate paid on the last (extra) dollar of income.","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Marginal utility","d":"The additional satisfaction gained from consuming one more unit of a good.","e":"e-demand-hl","u":"u2","topic":"t2-1","hl":true},{"t":"Market","d":"Any arrangement that brings buyers and sellers together to trade, physical or online.","e":"e-equilibrium","u":"u2","topic":"t2-3","hl":false},{"t":"Market-based supply-side policies","d":"Policies that reduce government intervention and increase competition and incentives, e.g. deregulation, privatisation, tax cuts, labour market reforms.","e":"e-supply-side","u":"u3","topic":"t3-7","hl":false},{"t":"Market-clearing price","d":"The price at which Qd = Qs; found by setting the demand and supply functions equal.","e":"e-eq-hl","u":"u2","topic":"t2-3","hl":true},{"t":"Market demand","d":"The sum of all individual consumers' demand for a good at each price (horizontal summation).","e":"e-demand-law","u":"u2","topic":"t2-1","hl":false},{"t":"Market failure","d":"When the free market fails to allocate resources efficiently, so that the socially optimal output is not produced.","e":"e-why-intervene","u":"u2","topic":"t2-7","hl":false},{"t":"Market power","d":"The ability of a firm to influence the price of its product (price maker); also called monopoly power.","e":"e-market-structures","u":"u2","topic":"t2-11","hl":true},{"t":"Market share","d":"A firm's sales as a percentage of total sales in its market.","e":"e-business-objectives","u":"u2","topic":"t2-4","hl":false},{"t":"Market structure","d":"The characteristics of a market that determine how firms behave: number and size of firms, type of product, barriers to entry and information.","e":"e-market-structures","u":"u2","topic":"t2-11","hl":true},{"t":"Market supply","d":"The sum of all individual firms' supply at each price.","e":"e-supply-law","u":"u2","topic":"t2-2","hl":false},{"t":"Maternal mortality ratio","d":"The number of women who die from pregnancy-related causes per 100,000 live births.","e":"e-single-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Means-tested benefit","d":"A benefit paid only to people whose income or wealth is below a certain level.","e":"e-other-policies","u":"u3","topic":"t3-4","hl":false},{"t":"Mercantilism","d":"The 16th–18th century view that national wealth came from accumulating gold through exports and restricting imports.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Merit good","d":"A good that benefits the consumer and society, underconsumed in a free market because of positive externalities and imperfect information (e.g. education, healthcare, vaccines).","e":"e-pos-externalities","u":"u2","topic":"t2-8","hl":false},{"t":"Microeconomics","d":"The study of individual decision-makers (consumers, firms, workers) and of individual markets.","e":"e-social-science","u":"u1","topic":"t1-1","hl":false},{"t":"Microfinance","d":"Small loans and other financial services to poor people without access to banks, often without collateral.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Minimum wage","d":"A legal minimum hourly wage that employers must pay workers, a price floor in the labour market.","e":"e-price-floors","u":"u2","topic":"t2-7","hl":false},{"t":"Mixed economy","d":"An economy in which both the market and the government allocate resources; all modern economies are mixed.","e":"e-econ-questions","u":"u1","topic":"t1-1","hl":false},{"t":"Monetarism","d":"The view, led by Milton Friedman, that inflation is caused by excessive growth of the money supply and that governments should keep monetary growth steady.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Monetary policy","d":"The use of interest rates, the money supply and credit conditions by a central bank to influence aggregate demand and achieve macroeconomic objectives.","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Monetary union","d":"A common market with a single currency and a common central bank, e.g. the eurozone.","e":"e-trading-blocs","u":"u4","topic":"t4-4","hl":false},{"t":"Money supply","d":"The total amount of money (cash and bank deposits) in an economy.","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Monopolistic competition","d":"A market structure with many firms selling differentiated products, with low barriers to entry.","e":"e-monopolistic-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Monopoly","d":"A market structure with a single seller of a product with no close substitutes, protected by high barriers to entry.","e":"e-monopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Monopsony","d":"A market with a single (or dominant) buyer, which can push down the prices it pays to suppliers or the wages it pays workers.","e":"e-market-power-policy","u":"u2","topic":"t2-11","hl":true},{"t":"Moral hazard","d":"When one party takes more risks after a transaction because someone else bears the cost, e.g. insured drivers driving less carefully, or banks taking risks expecting a bailout.","e":"e-asym-info","u":"u2","topic":"t2-10","hl":true},{"t":"Most favoured nation (MFN) principle","d":"The WTO rule that a country must offer all WTO members the same trade terms it offers its best trading partner.","e":"e-integration","u":"u4","topic":"t4-4","hl":false},{"t":"Multidimensional Poverty Index (MPI)","d":"A UNDP/Oxford measure of poverty using ten indicators across health, education and living standards.","e":"e-measuring-inequality","u":"u3","topic":"t3-4","hl":false},{"t":"Multilateral trade agreement","d":"A trade agreement among many countries, e.g. WTO agreements.","e":"e-integration","u":"u4","topic":"t4-4","hl":false},{"t":"Multinational corporation (MNC)","d":"A firm that owns or controls production in more than one country.","e":"e-market-vs-intervention","u":"u4","topic":"t4-10","hl":false},{"t":"Multiplier","d":"The ratio of the final change in real GDP to the initial change in an injection: an injection causes a larger final change in national income.","e":"e-multiplier","u":"u3","topic":"t3-6","hl":true},{"t":"National income","d":"The total income earned in an economy; output = income = expenditure in the circular flow.","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Nationalisation","d":"When the government takes ownership of a private firm or industry.","e":"e-market-power-policy","u":"u2","topic":"t2-11","hl":true},{"t":"Natural monopoly","d":"A market where economies of scale are so large that one firm can supply the whole market at a lower average cost than two or more firms.","e":"e-monopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Natural rate of unemployment (NRU)","d":"The rate of unemployment when the economy is at full employment: frictional + structural + seasonal unemployment.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Needs","d":"Things essential for survival, such as food, water, shelter and clothing.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Negative externality of consumption","d":"An external cost created when consuming a good, so MSB &lt; MPB (e.g. passive smoking).","e":"e-neg-externalities","u":"u2","topic":"t2-8","hl":false},{"t":"Negative externality of production","d":"An external cost created when producing a good, so MSC &gt; MPC (e.g. factory pollution).","e":"e-neg-externalities","u":"u2","topic":"t2-8","hl":false},{"t":"Net exports (X − M)","d":"The value of exports minus the value of imports.","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Nominal GDP","d":"GDP measured at current prices, not adjusted for inflation.","e":"e-ni-terms","u":"u3","topic":"t3-1","hl":false},{"t":"Nominal interest rate","d":"The interest rate stated on a loan or deposit, not adjusted for inflation.","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Non-excludable","d":"When it is impossible or very costly to prevent people from using a good.","e":"e-common-pool","u":"u2","topic":"t2-8","hl":false},{"t":"Non-governmental organisation (NGO)","d":"A non-profit organisation independent of government, e.g. Oxfam, Médecins Sans Frontières.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Non-price competition","d":"Competing through means other than price, such as advertising, branding, quality, loyalty schemes and after-sales service.","e":"e-monopolistic-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Non-price rationing","d":"Allocating goods by methods other than price, such as queues, lotteries, coupons or favouritism.","e":"e-price-ceilings","u":"u2","topic":"t2-7","hl":false},{"t":"Non-rivalrous","d":"When one person's consumption does not reduce the amount available to others.","e":"e-public-goods","u":"u2","topic":"t2-9","hl":false},{"t":"Normal good","d":"A good for which demand rises when income rises (positive YED).","e":"e-demand-determinants","u":"u2","topic":"t2-1","hl":false},{"t":"Normal profit","d":"The minimum profit needed to keep a firm in its current industry; when TR = TC (economic costs include the opportunity cost of the entrepreneur).","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Normative economics","d":"Statements based on value judgements about what ought to be, which cannot be tested.","e":"e-methodology","u":"u1","topic":"t1-2","hl":false},{"t":"Nudge theory","d":"The idea that small, low-cost changes in how choices are presented can steer people towards better decisions without removing any option or changing incentives much.","e":"e-behavioural","u":"u2","topic":"t2-4","hl":false},{"t":"OECD Better Life Index","d":"An index comparing well-being across countries using 11 dimensions, such as housing, income, jobs, health, environment and life satisfaction.","e":"e-gdp-wellbeing","u":"u3","topic":"t3-1","hl":false},{"t":"Official development assistance (ODA)","d":"Aid from governments of rich countries to developing countries, with the promotion of development as its main aim and at least a minimum grant element; the UN target is 0.7% of donors' GNI.","e":"e-aid","u":"u4","topic":"t4-10","hl":false},{"t":"Oligopoly","d":"A market dominated by a few large, interdependent firms with high barriers to entry.","e":"e-oligopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Open market operations","d":"The buying and selling of government bonds by the central bank to change the money supply and interest rates.","e":"e-monetary-tools","u":"u3","topic":"t3-5","hl":false},{"t":"Opportunity cost","d":"The value of the next best alternative given up when a choice is made.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Output approach","d":"Measuring GDP by adding the value of output (value added) produced by every industry.","e":"e-measuring-output","u":"u3","topic":"t3-1","hl":false},{"t":"Output gap","d":"The difference between actual and potential real GDP; positive (inflationary) when actual is above potential, negative (recessionary) when below.","e":"e-business-cycle","u":"u3","topic":"t3-1","hl":false},{"t":"Overallocation","d":"Producing more than the socially optimal output (MSC &gt; MSB for the extra units).","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Parallel market","d":"An illegal (black) market where goods are sold above the legal maximum price.","e":"e-price-ceilings","u":"u2","topic":"t2-7","hl":false},{"t":"Perfect competition","d":"A market structure with very many small firms selling an identical product, perfect information, and no barriers to entry or exit.","e":"e-perfect-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Perfectly elastic demand","d":"When any rise in price causes quantity demanded to fall to zero (PED = ∞).","e":"e-ped","u":"u2","topic":"t2-5","hl":false},{"t":"Perfectly inelastic demand","d":"When quantity demanded does not change at all as price changes (PED = 0).","e":"e-ped","u":"u2","topic":"t2-5","hl":false},{"t":"Phillips curve","d":"A curve showing an inverse relationship between the inflation rate and the unemployment rate in the short run.","e":"e-conflicts","u":"u3","topic":"t3-3","hl":false},{"t":"Pigouvian tax","d":"A tax set equal to the marginal external cost, to internalise a negative externality and bring output to the social optimum.","e":"e-externality-policy","u":"u2","topic":"t2-8","hl":false},{"t":"Planned economy","d":"An economy in which the government owns most resources and decides what, how and for whom to produce (also called a command economy).","e":"e-econ-questions","u":"u1","topic":"t1-1","hl":false},{"t":"Portfolio investment","d":"The purchase of financial assets such as shares and bonds without controlling the firm.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Positive economics","d":"Statements about what is, was or will be, which can be tested against evidence.","e":"e-methodology","u":"u1","topic":"t1-2","hl":false},{"t":"Positive externality of consumption","d":"An external benefit created when consuming a good, so MSB &gt; MPB (e.g. vaccinations).","e":"e-pos-externalities","u":"u2","topic":"t2-8","hl":false},{"t":"Positive externality of production","d":"An external benefit created when producing a good, so MSC &lt; MPC (e.g. firms training workers, R&amp;D spillovers).","e":"e-pos-externalities","u":"u2","topic":"t2-8","hl":false},{"t":"Potential growth","d":"An increase in an economy's productive capacity, shown by an outward shift of the PPC.","e":"e-ppc","u":"u1","topic":"t1-1","hl":false},{"t":"Potential output","d":"The level of real GDP the economy can produce when all resources are fully employed; the long-term trend.","e":"e-business-cycle","u":"u3","topic":"t3-1","hl":false},{"t":"Poverty trap (cycle)","d":"A self-reinforcing cycle in which low incomes lead to low savings, low investment and low productivity, which keep incomes low.","e":"e-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Preferential trade agreement","d":"An agreement giving lower trade barriers to some countries but not others.","e":"e-integration","u":"u4","topic":"t4-4","hl":false},{"t":"Price ceiling","d":"A legal maximum price set by the government below the equilibrium price.","e":"e-price-ceilings","u":"u2","topic":"t2-7","hl":false},{"t":"Price elastic demand","d":"When the percentage change in quantity demanded is greater than the percentage change in price (|PED| &gt; 1).","e":"e-ped","u":"u2","topic":"t2-5","hl":false},{"t":"Price elasticity of demand (PED)","d":"A measure of the responsiveness of quantity demanded to a change in the good's own price: %ΔQd ÷ %ΔP.","e":"e-ped","u":"u2","topic":"t2-5","hl":false},{"t":"Price elasticity of supply (PES)","d":"A measure of the responsiveness of quantity supplied to a change in the good's price: %ΔQs ÷ %ΔP.","e":"e-pes","u":"u2","topic":"t2-6","hl":false},{"t":"Price elastic supply","d":"When the percentage change in quantity supplied is greater than the percentage change in price (PES &gt; 1).","e":"e-pes","u":"u2","topic":"t2-6","hl":false},{"t":"Price floor","d":"A legal minimum price set above the equilibrium price.","e":"e-price-floors","u":"u2","topic":"t2-7","hl":false},{"t":"Price inelastic demand","d":"When the percentage change in quantity demanded is less than the percentage change in price (|PED| &lt; 1).","e":"e-ped","u":"u2","topic":"t2-5","hl":false},{"t":"Price inelastic supply","d":"When the percentage change in quantity supplied is less than the percentage change in price (PES &lt; 1).","e":"e-pes","u":"u2","topic":"t2-6","hl":false},{"t":"Price maker","d":"A firm with enough market power to set its own price.","e":"e-market-structures","u":"u2","topic":"t2-11","hl":true},{"t":"Price mechanism","d":"The system in which changes in prices, determined by demand and supply, signal and ration resources and give incentives to buyers and sellers.","e":"e-econ-questions","u":"u1","topic":"t1-1","hl":false},{"t":"Price regulation","d":"Government control of the prices charged by firms with market power, e.g. price caps on utilities.","e":"e-market-power-policy","u":"u2","topic":"t2-11","hl":true},{"t":"Price taker","d":"A firm that must accept the market price because it is too small to influence it.","e":"e-market-structures","u":"u2","topic":"t2-11","hl":true},{"t":"Price war","d":"Repeated price cutting by rival firms to gain market share, reducing profits for all.","e":"e-oligopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Primary commodities","d":"Raw materials and agricultural goods, such as oil, copper, coffee and wheat.","e":"e-ped-significance","u":"u2","topic":"t2-5","hl":false},{"t":"Primary income","d":"Income flows such as wages, interest, profits and dividends earned on investments abroad, minus those paid to foreigners.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Prisoner's dilemma","d":"A game in which both players would gain by cooperating, but each has an incentive to cheat, so both end up worse off.","e":"e-oligopoly","u":"u2","topic":"t2-11","hl":true},{"t":"Private good","d":"A good that is rivalrous and excludable, e.g. a sandwich.","e":"e-public-goods","u":"u2","topic":"t2-9","hl":false},{"t":"Privatisation","d":"The transfer of ownership of a firm or industry from the public sector to the private sector.","e":"e-supply-side","u":"u3","topic":"t3-7","hl":false},{"t":"Producer burden","d":"The part of an indirect tax paid by producers through a lower price received.","e":"e-indirect-taxes","u":"u2","topic":"t2-7","hl":false},{"t":"Producer price index (PPI)","d":"An index measuring changes in the prices firms pay for inputs or receive for output; an early signal of consumer price inflation.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Producer surplus","d":"The difference between the price producers receive and the lowest price they would accept; the area above the supply curve and below the price.","e":"e-surplus","u":"u2","topic":"t2-3","hl":false},{"t":"Product differentiation","d":"Making a product different from rivals' through branding, quality, design, location or service.","e":"e-monopolistic-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Production possibilities curve (PPC)","d":"A curve showing the maximum combinations of two goods an economy can produce when all its resources are fully and efficiently employed, with given technology.","e":"e-ppc","u":"u1","topic":"t1-1","hl":false},{"t":"Production subsidy","d":"A payment by the government to domestic producers per unit produced, lowering their costs so they can compete with imports.","e":"e-trade-subsidies","u":"u4","topic":"t4-2","hl":false},{"t":"Productive efficiency","d":"Producing at the lowest possible cost, i.e. on the PPC (in micro: at the minimum of average total cost).","e":"e-ppc","u":"u1","topic":"t1-1","hl":false},{"t":"Productive efficiency (firm)","d":"Producing at the lowest point of the average total cost curve.","e":"e-perfect-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Productivity","d":"Output per unit of input, e.g. output per worker per hour.","e":"e-lras-shifts","u":"u3","topic":"t3-2","hl":false},{"t":"Productivity gap","d":"The difference in output per worker or per hour between countries or regions.","e":"e-supply-side-eval","u":"u3","topic":"t3-7","hl":false},{"t":"Profit maximisation","d":"Producing the output where marginal revenue equals marginal cost (MR = MC), so total revenue minus total cost is as large as possible.","e":"e-business-objectives","u":"u2","topic":"t2-4","hl":false},{"t":"Profit maximisation rule","d":"A firm maximises profit by producing where MC = MR (with MC rising).","e":"e-profit-max","u":"u2","topic":"t2-11","hl":true},{"t":"Progressive tax","d":"A tax where the average tax rate rises as income rises, so higher earners pay a larger proportion of their income.","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Property rights","d":"The legal right to own, use and transfer land, assets and intellectual property.","e":"e-political-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Proportional tax","d":"A tax where the average tax rate is the same at all incomes (a flat tax).","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Public good","d":"A good that is non-rivalrous and non-excludable, e.g. national defence, street lighting, lighthouses, flood defences.","e":"e-public-goods","u":"u2","topic":"t2-9","hl":false},{"t":"Purchasing power parity (PPP)","d":"An exchange rate that equalises the purchasing power of different currencies, so that the same basket of goods costs the same in each country.","e":"e-ni-terms","u":"u3","topic":"t3-1","hl":false},{"t":"Quantitative easing (QE)","d":"When a central bank creates new money electronically to buy large quantities of financial assets, such as government bonds, to increase the money supply and lower long-term interest rates.","e":"e-monetary-tools","u":"u3","topic":"t3-5","hl":false},{"t":"Quantity demanded","d":"The amount consumers will buy at one particular price.","e":"e-demand-law","u":"u2","topic":"t2-1","hl":false},{"t":"Quasi-public good","d":"A good with some but not all features of a public good, e.g. a toll-free road that can become congested.","e":"e-public-goods","u":"u2","topic":"t2-9","hl":false},{"t":"Quota","d":"A physical limit on the quantity (or value) of a good that can be imported.","e":"e-quotas","u":"u4","topic":"t4-2","hl":false},{"t":"Quota rent","d":"The extra revenue earned by importers or foreign firms that hold import licences, because they sell the limited imports at the higher domestic price.","e":"e-quotas","u":"u4","topic":"t4-2","hl":false},{"t":"Rational consumer choice","d":"The assumption that consumers have perfect information, consistent preferences and choose so as to maximise their utility.","e":"e-rational-choice","u":"u2","topic":"t2-4","hl":false},{"t":"Rationing function","d":"Prices ration scarce goods to those willing and able to pay the most.","e":"e-price-mechanism","u":"u2","topic":"t2-3","hl":false},{"t":"Real GDP","d":"GDP adjusted for inflation, measured at constant (base-year) prices.","e":"e-ni-terms","u":"u3","topic":"t3-1","hl":false},{"t":"Real interest rate","d":"The nominal interest rate minus the rate of inflation.","e":"e-monetary-overview","u":"u3","topic":"t3-5","hl":false},{"t":"Recession","d":"A fall in real GDP for two consecutive quarters.","e":"e-business-cycle","u":"u3","topic":"t3-1","hl":false},{"t":"Recessionary (deflationary) gap","d":"When equilibrium real GDP is below potential output, with cyclical unemployment.","e":"e-macro-equilibrium","u":"u3","topic":"t3-2","hl":false},{"t":"Refutation","d":"Showing that a hypothesis is false by testing it against evidence; theories can be refuted but never finally proven.","e":"e-methodology","u":"u1","topic":"t1-2","hl":false},{"t":"Regressive tax","d":"A tax where the average tax rate falls as income rises, so lower earners pay a larger proportion of their income.","e":"e-tax-policy","u":"u3","topic":"t3-4","hl":false},{"t":"Regulation","d":"Rules and laws set by government to control the behaviour of firms or consumers, e.g. bans, standards, licences.","e":"e-direct-provision","u":"u2","topic":"t2-7","hl":false},{"t":"Relative poverty","d":"Income below a set proportion of the typical income in a country, e.g. below 60% of median income.","e":"e-measuring-inequality","u":"u3","topic":"t3-4","hl":false},{"t":"Reserve requirement","d":"The minimum percentage of deposits a commercial bank must hold as reserves with the central bank.","e":"e-monetary-tools","u":"u3","topic":"t3-5","hl":false},{"t":"Resource allocation","d":"How scarce factors of production are distributed between different uses.","e":"e-price-mechanism","u":"u2","topic":"t2-3","hl":false},{"t":"Restricted choice","d":"Limiting the number of options so people are not overwhelmed (e.g. a limited set of pension funds).","e":"e-behavioural","u":"u2","topic":"t2-4","hl":false},{"t":"Retaliation","d":"When a country responds to another's trade barriers by imposing its own, possibly leading to a trade war.","e":"e-protection-debate","u":"u4","topic":"t4-3","hl":false},{"t":"Revaluation","d":"A deliberate increase in the value of a currency in a fixed system.","e":"e-er-systems","u":"u4","topic":"t4-5","hl":false},{"t":"Revenue maximisation","d":"Producing where marginal revenue is zero, so total revenue is as large as possible.","e":"e-business-objectives","u":"u2","topic":"t2-4","hl":false},{"t":"Rivalrous","d":"When one person's use of a good reduces its availability to others.","e":"e-common-pool","u":"u2","topic":"t2-8","hl":false},{"t":"Rule of law","d":"The principle that everyone, including the government, is subject to fair and consistently enforced laws.","e":"e-political-barriers","u":"u4","topic":"t4-9","hl":false},{"t":"Satisficing","d":"Aiming for a satisfactory level of profit rather than the maximum, often to balance the interests of different stakeholders.","e":"e-business-objectives","u":"u2","topic":"t2-4","hl":false},{"t":"Say's law","d":"\"Supply creates its own demand\": production generates the income needed to buy that output.","e":"e-thought","u":"u1","topic":"t1-2","hl":false},{"t":"Scarcity","d":"The basic economic problem: resources are finite but human needs and wants are unlimited, so choices must be made.","e":"e-scarcity","u":"u1","topic":"t1-1","hl":false},{"t":"Screening","d":"When the less-informed party gathers information about the other, e.g. health checks before insurance, credit scores, interviews.","e":"e-asym-info","u":"u2","topic":"t2-10","hl":true},{"t":"Seasonal unemployment","d":"Unemployment caused by seasonal changes in demand, e.g. ski instructors in summer.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Secondary income","d":"Transfers between countries with nothing given in return, such as remittances, foreign aid and contributions to international organisations.","e":"e-bop-components","u":"u4","topic":"t4-6","hl":false},{"t":"Sectoral change","d":"The shift of an economy's output and employment from the primary sector to the secondary and then the tertiary sector as incomes rise.","e":"e-yed","u":"u2","topic":"t2-5","hl":false},{"t":"Short-run aggregate supply (SRAS)","d":"Aggregate supply in the period when wages and other resource prices are fixed; slopes upward.","e":"e-sras","u":"u3","topic":"t3-2","hl":false},{"t":"Short-run equilibrium","d":"The output and price level where AD = SRAS.","e":"e-macro-equilibrium","u":"u3","topic":"t3-2","hl":false},{"t":"Short-run Phillips curve (SRPC)","d":"A downward-sloping curve showing a trade-off between inflation and unemployment for a given level of expected inflation.","e":"e-conflicts","u":"u3","topic":"t3-3","hl":false},{"t":"Short-term growth","d":"Growth from using existing resources more fully, caused by higher AD; a move towards the PPC.","e":"e-growth","u":"u3","topic":"t3-3","hl":false},{"t":"Shut-down price","d":"The price equal to minimum average variable cost, below which a firm stops producing in the short run.","e":"e-perfect-competition","u":"u2","topic":"t2-11","hl":true},{"t":"Signalling","d":"When the better-informed party reveals information to the other, e.g. warranties, qualifications, brand reputation.","e":"e-asym-info","u":"u2","topic":"t2-10","hl":true},{"t":"Signalling function","d":"Prices transmit information: rising prices tell producers that consumers want more of a good; falling prices that they want less.","e":"e-price-mechanism","u":"u2","topic":"t2-3","hl":false},{"t":"Single indicator","d":"A measure of development that uses one variable, such as GNI per capita, life expectancy or the literacy rate.","e":"e-single-indicators","u":"u4","topic":"t4-8","hl":false},{"t":"Social enterprise","d":"A business with social or environmental objectives that reinvests its profits to pursue them.","e":"e-trade-strategies","u":"u4","topic":"t4-10","hl":false},{"t":"Socially optimal output","d":"The output where MSB = MSC, at which social welfare is maximised (allocative efficiency from society's view).","e":"e-market-failure","u":"u2","topic":"t2-8","hl":false},{"t":"Social mobility","d":"The ability of people to move between social or income groups, e.g. children earning more than their parents.","e":"e-inequality-causes","u":"u3","topic":"t3-4","hl":false},{"t":"Social science","d":"A discipline that studies human behaviour in society; because people are unpredictable, its findings are less certain than those of the natural sciences.","e":"e-social-science","u":"u1","topic":"t1-1","hl":false},{"t":"Social surplus","d":"Consumer surplus plus producer surplus (also called community surplus); maximised at the competitive equilibrium when there is no market failure.","e":"e-surplus","u":"u2","topic":"t2-3","hl":false},{"t":"Specialisation","d":"Concentrating production on a narrow range of goods in which a country (or person) has a comparative advantage.","e":"e-comparative-advantage","u":"u4","topic":"t4-1","hl":true},{"t":"Specific tax","d":"A fixed amount of tax per unit of a good, e.g. $1 per litre.","e":"e-indirect-taxes","u":"u2","topic":"t2-7","hl":false},{"t":"Speculation","d":"Buying or selling a currency in expectation of a future change in its value, to make a profit.","e":"e-er-changes","u":"u4","topic":"t4-5","hl":false},{"t":"Stagflation","d":"Rising inflation combined with stagnant or falling output and rising unemployment.","e":"e-inflation","u":"u3","topic":"t3-3","hl":false},{"t":"Stakeholder","d":"Any person or group affected by a decision, e.g. consumers, producers, workers, the government, the wider community.","e":"e-why-intervene","u":"u2","topic":"t2-7","hl":false},{"t":"Structural unemployment","d":"Long-term unemployment caused by changes in the structure of the economy (demand, technology, location), leaving workers with the wrong skills or in the wrong place.","e":"e-unemployment","u":"u3","topic":"t3-3","hl":false},{"t":"Subsidy","d":"A payment by the government to producers (or consumers) per unit, to lower costs and prices and increase output and consumption.","e":"e-subsidies","u":"u2","topic":"t2-7","hl":false},{"t":"Substitutes","d":"Goods that can be used in place of each other; a rise in the price of one increases demand for the other.","e":"e-demand-determinants","u":"u2","topic":"t2-1","hl":false},{"t":"Substitution effect","d":"When a good's price falls it becomes cheaper relative to substitutes, so consumers switch towards it.","e":"e-demand-hl","u":"u2","topic":"t2-1","hl":true},{"t":"Supply","d":"The quantity of a good or service that producers are willing and able to offer for sale at each price, in a given time period, ceteris paribus.","e":"e-supply-law","u":"u2","topic":"t2-2","hl":false},{"t":"Supply shock","d":"A sudden, unexpected change in supply, e.g. a drought or war.","e":"e-supply-determinants","u":"u2","topic":"t2-2","hl":false},{"t":"Supply-side policies","d":"Policies designed to increase the productive capacity (potential output) of the economy by improving the quantity and quality of factors of production and the efficiency of markets.","e":"e-supply-side","u":"u3","topic":"t3-7","hl":false},{"t":"Sustainability","d":"Meeting the needs of the present generation without compromising the ability of future generations to meet their own needs.","e":"e-key-concepts","u":"u1","topic":"t1-1","hl":false},{"t":"Sustainable development","d":"Development that meets the needs of the present without compromising the ability of future
