period, ceteris paribus."],["Law of supply","There is a positive relationship between the price of a good and the quantity supplied, ceteris paribus."],["Market supply","The sum of all individual firms' supply at each price."],["Extension in supply","A rise in quantity supplied caused by a rise in the good's own price."],["Contraction in supply","A fall in quantity supplied caused by a fall in the good's own price."]],"topic":"t2-2","html":"<p>A higher price makes production more profitable and lets firms cover the higher costs of producing extra units, so quantity supplied rises. Market supply is the horizontal sum of all firms' supply.<\/p>\n<div class=\"dslot\" data-d=\"supply-move\"><\/div>","text":"A higher price makes production more profitable and lets firms cover the higher costs of producing extra units, so quantity supplied rises. Market supply is the horizontal sum of all firms' supply.","dias":["supply-move"]},{"id":"e-supply-determinants","title":"Non-price determinants of supply","hl":false,"terms":[["Joint supply","When producing one good automatically produces another, e.g. beef and leather."],["Competitive supply","When resources used to produce one good could produce another instead, e.g. a farmer choosing wheat or barley."],["Supply shock","A sudden, unexpected change in supply, e.g. a drought or war."]],"topic":"t2-2","html":"<div class=\"dslot\" data-d=\"supply-shift\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Determinant<\/th><th>Supply increases (shift right) when…<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><strong>Costs of factors of production<\/strong><\/td><td>Wages, raw material or energy costs fall<\/td><td>Falling global cotton prices raise T-shirt supply<\/td><\/tr><tr><td><strong>Technology<\/strong><\/td><td>Better technology raises productivity<\/td><td>Automation in car plants; drip irrigation<\/td><\/tr><tr><td><strong>Indirect taxes<\/strong><\/td><td>Taxes are cut (taxes shift S left)<\/td><td>A fuel duty rise shifts fuel supply left<\/td><\/tr><tr><td><strong>Subsidies<\/strong><\/td><td>Subsidies are introduced (shift S right)<\/td><td>Subsidies for solar panels<\/td><\/tr><tr><td><strong>Prices of related goods<\/strong><\/td><td>Joint supply: the other good's price rises. Competitive supply: the other good's price falls<\/td><td>Higher beef prices raise leather supply<\/td><\/tr><tr><td><strong>Number of firms<\/strong><\/td><td>New firms enter<\/td><td>More cafés open in a city<\/td><\/tr><tr><td><strong>Expectations<\/strong><\/td><td>Firms expect future prices to fall (sell now)<\/td><td>Oil producers releasing stock before an expected fall<\/td><\/tr><tr><td><strong>Shocks<\/strong><\/td><td>Good harvests; absence of disasters<\/td><td>Drought in Brazil cuts coffee supply; war in Ukraine cut wheat exports in 2022<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box warn\"><div class=\"box-h\">Common mistakes<\/div><p>A subsidy to producers shifts <strong>supply<\/strong> right, not demand. A tax on producers shifts <strong>supply<\/strong> left.<\/p><\/div>","text":"Determinant Supply increases (shift right) when… Example Costs of factors of production Wages, raw material or energy costs fall Falling global cotton prices raise T-shirt supply Technology Better technology raises productivity Automation in car plants; drip irrigation Indirect taxes Taxes are cut (taxes shift S left) A fuel duty rise shifts fuel supply left Subsidies Subsidies are introduced (shift S right) Subsidies for solar panels Prices of related goods Joint supply: the other good's price rises. Competitive supply: the other good's price falls Higher beef prices raise leather supply Number of firms New firms enter More cafés open in a city Expectations Firms expect future prices to fall (sell now) Oil producers releasing stock before an expected fall Shocks Good harvests; absence of disasters Drought in Brazil cuts coffee supply; war in Ukraine cut wheat exports in 2022 Common mistakes A subsidy to producers shifts supply right, not demand. A tax on producers shifts supply left.","dias":["supply-shift"]},{"id":"e-supply-hl","title":"Marginal cost and linear supply functions","hl":true,"terms":[["Law of diminishing marginal returns","In the short run, as more units of a variable factor (e.g. labour) are added to a fixed factor (e.g. capital), the extra output from each additional unit of the variable factor eventually falls."],["Marginal cost (MC)","The additional cost of producing one more unit of output."],["Linear supply function","An equation of the form Qs = c + dP, where c is the quantity supplied at a price of zero and d shows how much Qs changes for each $1 change in price."]],"topic":"t2-2","html":"<h4>Why supply slopes upward<\/h4>\n<p>In the short run firms have fixed factors (a factory of a given size). Adding more workers eventually adds less and less output each (<strong>diminishing marginal returns<\/strong>), so each extra unit costs more to make (<strong>increasing marginal cost<\/strong>). Firms will only supply extra units if the price rises enough to cover that higher MC. The supply curve is the firm's <strong>MC curve<\/strong> (above minimum AVC; see <a class=\"xref\" href=\"#e-perfect-competition\">2.11<\/a>).<\/p>\n<h4>Linear supply functions: Qs = c + dP<\/h4>\n<ul><li><strong>c<\/strong> is the Q-intercept. If c is negative, the curve meets the price axis above the origin (at P = −c ÷ d). A change in a non-price determinant changes <strong>c<\/strong> (shift).<\/li><li><strong>d<\/strong> is the slope parameter: each $1 rise in price raises Qs by d units. A change in d <strong>pivots<\/strong> the curve.<\/li><\/ul>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Plotting Qs = −20 + 5P<\/div><p>At P = 4, Qs = 0 (price intercept $4). At P = 10, Qs = 30. At P = 16, Qs = 60. A technological improvement that makes the function Qs = 10 + 5P shifts supply right by 30 units at every price.<\/p><\/div>","text":"Why supply slopes upward In the short run firms have fixed factors (a factory of a given size). Adding more workers eventually adds less and less output each ( diminishing marginal returns ), so each extra unit costs more to make ( increasing marginal cost ). Firms will only supply extra units if the price rises enough to cover that higher MC. The supply curve is the firm's MC curve (above minimum AVC; see 2.11 ). Linear supply functions: Qs = c + dP c is the Q-intercept. If c is negative, the curve meets the price axis above the origin (at P = −c ÷ d). A change in a non-price determinant changes c (shift). d is the slope parameter: each $1 rise in price raises Qs by d units. A change in d pivots the curve. Worked example: Plotting Qs = −20 + 5P At P = 4, Qs = 0 (price intercept $4). At P = 10, Qs = 30. At P = 16, Qs = 60. A technological improvement that makes the function Qs = 10 + 5P shifts supply right by 30 units at every price.","dias":[]}]},{"id":"t2-3","num":"2.3","title":"Competitive market equilibrium","level":"SL","blurb":"How the market clears, the price mechanism, consumer and producer surplus, and allocative efficiency.","entries":[{"id":"e-equilibrium","title":"Equilibrium and disequilibrium","hl":false,"terms":[["Market","Any arrangement that brings buyers and sellers together to trade, physical or online."],["Equilibrium","A situation in which quantity demanded equals quantity supplied, so there is no tendency for price to change."],["Excess demand (shortage)","When quantity demanded is greater than quantity supplied at the current price."],["Excess supply (surplus)","When quantity supplied is greater than quantity demanded at the current price."],["Competitive market","A market with many buyers and sellers, none of whom can influence the price."]],"topic":"t2-3","html":"<div class=\"dslot\" data-d=\"equilibrium\"><\/div>\n<ul><li><strong>Above equilibrium<\/strong> (P₁): a surplus; unsold stock builds up, firms cut prices, quantity demanded extends and quantity supplied contracts until Qd = Qs.<\/li><li><strong>Below equilibrium<\/strong> (P₂): a shortage; buyers bid prices up, quantity supplied extends and quantity demanded contracts.<\/li><\/ul>\n<h4>Changes in equilibrium<\/h4>\n<div class=\"dslot\" data-d=\"eq-demand-up\"><\/div>\n<div class=\"dslot\" data-d=\"eq-supply-up\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Change<\/th><th>Price<\/th><th>Quantity<\/th><\/tr><\/thead><tbody><tr><td>Demand ↑<\/td><td>↑<\/td><td>↑<\/td><\/tr><tr><td>Demand ↓<\/td><td>↓<\/td><td>↓<\/td><\/tr><tr><td>Supply ↑<\/td><td>↓<\/td><td>↑<\/td><\/tr><tr><td>Supply ↓<\/td><td>↑<\/td><td>↓<\/td><\/tr><tr><td>Both ↑<\/td><td>? (depends on size)<\/td><td>↑<\/td><\/tr><tr><td>Demand ↑, supply ↓<\/td><td>↑<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: Global markets in action<\/div><p>In 2022, Russia's invasion of Ukraine cut the supply of wheat, sunflower oil and natural gas: prices jumped and quantities fell. In the same years, falling battery costs and subsidies increased the supply of electric vehicles, lowering prices and raising sales.<\/p><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Some markets clear in minutes (shares, currencies), others in years (housing, where supply takes time to build). The speed of adjustment is a useful evaluation point.<\/p><\/div>","text":"Above equilibrium (P₁): a surplus; unsold stock builds up, firms cut prices, quantity demanded extends and quantity supplied contracts until Qd = Qs. Below equilibrium (P₂): a shortage; buyers bid prices up, quantity supplied extends and quantity demanded contracts. Changes in equilibrium Change Price Quantity Demand ↑ ↑ ↑ Demand ↓ ↓ ↓ Supply ↑ ↓ ↑ Supply ↓ ↑ ↓ Both ↑ ? (depends on size) ↑ Demand ↑, supply ↓ ↑ ? Real-world example: Global markets in action In 2022, Russia's invasion of Ukraine cut the supply of wheat, sunflower oil and natural gas: prices jumped and quantities fell. In the same years, falling battery costs and subsidies increased the supply of electric vehicles, lowering prices and raising sales. Exam tip Some markets clear in minutes (shares, currencies), others in years (housing, where supply takes time to build). The speed of adjustment is a useful evaluation point.","dias":["equilibrium","eq-demand-up","eq-supply-up"]},{"id":"e-price-mechanism","title":"The functions of the price mechanism","hl":false,"terms":[["Signalling function","Prices transmit information: rising prices tell producers that consumers want more of a good; falling prices that they want less."],["Incentive function","Higher prices motivate firms to produce more (higher profits) and lower prices motivate consumers to buy more."],["Rationing function","Prices ration scarce goods to those willing and able to pay the most."],["Resource allocation","How scarce factors of production are distributed between different uses."]],"topic":"t2-3","html":"<p>Adam Smith's <strong>invisible hand<\/strong>: prices coordinate millions of decisions without anyone planning them.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Function<\/th><th>What happens when demand for honey rises<\/th><\/tr><\/thead><tbody><tr><td><strong>Signalling<\/strong><\/td><td>The rising price tells beekeepers and potential entrants that consumers want more honey<\/td><\/tr><tr><td><strong>Incentive<\/strong><\/td><td>Higher profits encourage producers to keep more hives and new firms to enter<\/td><\/tr><tr><td><strong>Rationing<\/strong><\/td><td>The higher price rations the limited honey to those who value it most<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Resources move <strong>out<\/strong> of markets with falling prices and <strong>into<\/strong> markets with rising prices: this is <strong>resource allocation<\/strong> through the price mechanism.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>One way to keep the functions apart: a <strong>shift<\/strong> in a curve sends the <strong>signal<\/strong>; the resulting <strong>movement along<\/strong> the other curve is the <strong>incentive<\/strong> response; the new price <strong>rations<\/strong> the good.<\/p><\/div>","text":"Adam Smith's invisible hand : prices coordinate millions of decisions without anyone planning them. Function What happens when demand for honey rises Signalling The rising price tells beekeepers and potential entrants that consumers want more honey Incentive Higher profits encourage producers to keep more hives and new firms to enter Rationing The higher price rations the limited honey to those who value it most Resources move out of markets with falling prices and into markets with rising prices: this is resource allocation through the price mechanism. Exam tip One way to keep the functions apart: a shift in a curve sends the signal ; the resulting movement along the other curve is the incentive response; the new price rations the good.","dias":[]},{"id":"e-surplus","title":"Consumer surplus, producer surplus and allocative efficiency","hl":false,"terms":[["Consumer surplus","The difference between the highest price consumers are willing to pay and the price they actually pay; the area below the demand curve and above the price."],["Producer surplus","The difference between the price producers receive and the lowest price they would accept; the area above the supply curve and below the price."],["Social surplus","Consumer surplus plus producer surplus (also called community surplus); maximised at the competitive equilibrium when there is no market failure."],["Marginal benefit (MB)","The extra benefit from consuming one more unit; shown by the demand curve."],["Welfare loss","A loss of social surplus caused by producing more or less than the allocatively efficient output (also called deadweight loss)."]],"topic":"t2-3","html":"<div class=\"dslot\" data-d=\"surplus\"><\/div>\n<ul><li>The demand curve shows <strong>marginal benefit<\/strong> (what consumers would pay for each extra unit). The supply curve shows <strong>marginal cost<\/strong>.<\/li><li>At equilibrium <strong>MB = MC<\/strong>: every unit worth more to consumers than it costs to produce is made, and none worth less. Social surplus is maximised: <strong>allocative efficiency<\/strong>.<\/li><li>Any output other than Qe loses some surplus: a <strong>welfare loss<\/strong>.<\/li><\/ul>\n<p>When supply or demand increases, both CS and PS typically increase; government interventions such as taxes, subsidies and price controls redistribute surplus and create welfare losses (<a class=\"xref\" href=\"#t2-7\">2.7<\/a>).<\/p>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Measuring surplus from a diagram<\/div><p>Demand meets the price axis at $20, supply at $4, equilibrium P = $12, Q = 400. CS = ½ × (20 − 12) × 400 = <strong>$1,600<\/strong>. PS = ½ × (12 − 4) × 400 = <strong>$1,600<\/strong>. Social surplus = <strong>$3,200<\/strong>.<\/p><\/div>","text":"The demand curve shows marginal benefit (what consumers would pay for each extra unit). The supply curve shows marginal cost . At equilibrium MB = MC : every unit worth more to consumers than it costs to produce is made, and none worth less. Social surplus is maximised: allocative efficiency . Any output other than Qe loses some surplus: a welfare loss . When supply or demand increases, both CS and PS typically increase; government interventions such as taxes, subsidies and price controls redistribute surplus and create welfare losses ( 2.7 ). Worked example: Measuring surplus from a diagram Demand meets the price axis at $20, supply at $4, equilibrium P = $12, Q = 400. CS = ½ × (20 − 12) × 400 = $1,600 . PS = ½ × (12 − 4) × 400 = $1,600 . Social surplus = $3,200 .","dias":["surplus"]},{"id":"e-eq-hl","title":"Equilibrium and surplus from linear functions","hl":true,"terms":[["Market-clearing price","The price at which Qd = Qs; found by setting the demand and supply functions equal."]],"topic":"t2-3","html":"<p>To find equilibrium, set <strong>Qd = Qs<\/strong> and solve for P, then substitute back for Q.<\/p>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Equilibrium from functions<\/div><p>Qd = 120 − 4P and Qs = −30 + 6P. 120 − 4P = −30 + 6P → 150 = 10P → <strong>P = $15<\/strong>. Q = 120 − 4(15) = <strong>60 units<\/strong>. Excess demand at P = $10: Qd = 80, Qs = 30 → <strong>shortage of 50<\/strong>. Consumer surplus: demand meets the price axis where 120 − 4P = 0, P = $30. CS = ½ × (30 − 15) × 60 = <strong>$450<\/strong>. Producer surplus: supply meets the price axis where −30 + 6P = 0, P = $5. PS = ½ × (15 − 5) × 60 = <strong>$300<\/strong>.<\/p><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Check your answer by substituting P into <strong>both<\/strong> functions; they must give the same Q. Keep two decimal places in intermediate steps on Paper 3.<\/p><\/div>","text":"To find equilibrium, set Qd = Qs and solve for P, then substitute back for Q. Worked example: Equilibrium from functions Qd = 120 − 4P and Qs = −30 + 6P. 120 − 4P = −30 + 6P → 150 = 10P → P = $15 . Q = 120 − 4(15) = 60 units . Excess demand at P = $10: Qd = 80, Qs = 30 → shortage of 50 . Consumer surplus: demand meets the price axis where 120 − 4P = 0, P = $30. CS = ½ × (30 − 15) × 60 = $450 . Producer surplus: supply meets the price axis where −30 + 6P = 0, P = $5. PS = ½ × (15 − 5) × 60 = $300 . Exam tip Check your answer by substituting P into both functions; they must give the same Q. Keep two decimal places in intermediate steps on Paper 3.","dias":[]}]},{"id":"t2-4","num":"2.4","title":"Critique of the maximizing behaviour of consumers and producers","level":"SL","blurb":"Rational choice and its limits, behavioural economics and nudges, and the objectives firms really pursue.","entries":[{"id":"e-rational-choice","title":"Rational consumer choice and its limits","hl":false,"terms":[["Rational consumer choice","The assumption that consumers have perfect information, consistent preferences and choose so as to maximise their utility."],["Utility","The satisfaction a consumer gains from consuming a good or service."],["Bounded rationality","The idea that people make decisions that are \"good enough\" because they have limited information, time and mental capacity."],["Bounded self-control","People's limited willpower, which makes them act against their own long-term interests (e.g. overeating, undersaving)."],["Bounded selfishness","The idea that people care about others and fairness, not only about themselves (e.g. charity, volunteering)."],["Imperfect information","When buyers or sellers lack full knowledge of prices, quality or consequences, so they cannot make fully informed choices."],["Biases","Systematic errors in decision-making, such as rules of thumb, anchoring and framing, availability and loss aversion."]],"topic":"t2-4","html":"<p>Standard theory assumes consumers are <strong>rational<\/strong>, <strong>maximise utility<\/strong> and have <strong>perfect information<\/strong>. Behavioural economics shows these assumptions often fail.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Limitation<\/th><th>What it means<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><strong>Rule of thumb<\/strong><\/td><td>Shortcuts instead of careful calculation<\/td><td>Always buying the same brand; \"spend 10% on rent…\"<\/td><\/tr><tr><td><strong>Anchoring and framing<\/strong><\/td><td>Decisions depend on a reference point or on how options are presented<\/td><td>\"Was $99, now $49\"; \"90% fat free\" vs \"10% fat\"<\/td><\/tr><tr><td><strong>Availability bias<\/strong><\/td><td>Judging likelihood by how easily examples come to mind<\/td><td>Fear of flying after a news story about a crash<\/td><\/tr><tr><td><strong>Loss aversion<\/strong><\/td><td>Losses feel worse than equal gains feel good<\/td><td>Holding on to falling shares<\/td><\/tr><tr><td><strong>Bounded rationality<\/strong><\/td><td>Limited time and information, so people \"satisfice\"<\/td><td>Choosing a phone plan without comparing all 50 options<\/td><\/tr><tr><td><strong>Bounded self-control<\/strong><\/td><td>Limited willpower<\/td><td>Gym memberships unused; undersaving for retirement<\/td><\/tr><tr><td><strong>Bounded selfishness<\/strong><\/td><td>People also care about others<\/td><td>Donations, fair-trade purchases<\/td><\/tr><tr><td><strong>Imperfect information<\/strong><\/td><td>Consumers cannot judge quality or consequences<\/td><td>Health risks of vaping; quality of a used car<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>These limitations are ready-made evaluation for any question that assumes rational behaviour, e.g. \"a tax will reduce consumption\" (addiction and bounded self-control weaken the effect).<\/p><\/div>","text":"Standard theory assumes consumers are rational , maximise utility and have perfect information . Behavioural economics shows these assumptions often fail. Limitation What it means Example Rule of thumb Shortcuts instead of careful calculation Always buying the same brand; \"spend 10% on rent…\" Anchoring and framing Decisions depend on a reference point or on how options are presented \"Was $99, now $49\"; \"90% fat free\" vs \"10% fat\" Availability bias Judging likelihood by how easily examples come to mind Fear of flying after a news story about a crash Loss aversion Losses feel worse than equal gains feel good Holding on to falling shares Bounded rationality Limited time and information, so people \"satisfice\" Choosing a phone plan without comparing all 50 options Bounded self-control Limited willpower Gym memberships unused; undersaving for retirement Bounded selfishness People also care about others Donations, fair-trade purchases Imperfect information Consumers cannot judge quality or consequences Health risks of vaping; quality of a used car Exam tip These limitations are ready-made evaluation for any question that assumes rational behaviour, e.g. \"a tax will reduce consumption\" (addiction and bounded self-control weaken the effect).","dias":[]},{"id":"e-behavioural","title":"Behavioural economics: choice architecture and nudges","hl":false,"terms":[["Choice architecture","The design of the way choices are presented to people, which influences the decisions they make."],["Default choice","An option that applies automatically unless the person actively chooses otherwise."],["Restricted choice","Limiting the number of options so people are not overwhelmed (e.g. a limited set of pension funds)."],["Mandated choice","Requiring people to make an active decision (e.g. stating whether they want to be an organ donor when applying for a licence)."],["Nudge theory","The idea that small, low-cost changes in how choices are presented can steer people towards better decisions without removing any option or changing incentives much."]],"topic":"t2-4","html":"<h4>Choice architecture<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Type<\/th><th>How it works<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><strong>Default<\/strong><\/td><td>The preferred option is pre-selected; most people never change it<\/td><td>UK workplace pensions auto-enrolment (opt-out); opt-out organ donation in Spain, Wales, England<\/td><\/tr><tr><td><strong>Restricted<\/strong><\/td><td>Fewer, simpler options reduce confusion<\/td><td>Sweden's pension system limits the menu of funds<\/td><\/tr><tr><td><strong>Mandated<\/strong><\/td><td>People must actively choose<\/td><td>Organ donor question on a driving licence form in many US states<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Nudges<\/h4>\n<ul><li>Placing fruit at eye level and sweets out of reach in school canteens.<\/li><li>Sending letters saying \"9 out of 10 people in your town pay their tax on time\" (UK tax authority's Behavioural Insights Team raised payment rates).<\/li><li>Graphic warnings and plain packaging on cigarettes.<\/li><li>Showing households how their energy use compares with neighbours'.<\/li><li>Painted flies in airport urinals (Amsterdam Schiphol) to reduce spillage.<\/li><\/ul>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Advantages<\/h5><ul><li>Cheap compared with taxes, subsidies or regulation.<\/li><li>Preserve freedom of choice: nothing is banned.<\/li><li>Can be very effective at scale (pension auto-enrolment raised participation from around 60% to over 85% in the UK).<\/li><\/ul><\/div><div><h5>Disadvantages<\/h5><ul><li>Effects can be small or fade over time.<\/li><li>Ethical concerns: manipulation; who decides what is \"good\"?<\/li><li>Firms also use nudges against consumers' interests (dark patterns, default subscriptions).<\/li><li>Hard to measure effects; works better for some groups than others.<\/li><\/ul><\/div><\/div><\/div>","text":"Choice architecture Type How it works Example Default The preferred option is pre-selected; most people never change it UK workplace pensions auto-enrolment (opt-out); opt-out organ donation in Spain, Wales, England Restricted Fewer, simpler options reduce confusion Sweden's pension system limits the menu of funds Mandated People must actively choose Organ donor question on a driving licence form in many US states Nudges Placing fruit at eye level and sweets out of reach in school canteens. Sending letters saying \"9 out of 10 people in your town pay their tax on time\" (UK tax authority's Behavioural Insights Team raised payment rates). Graphic warnings and plain packaging on cigarettes. Showing households how their energy use compares with neighbours'. Painted flies in airport urinals (Amsterdam Schiphol) to reduce spillage. Evaluation Advantages Cheap compared with taxes, subsidies or regulation. Preserve freedom of choice: nothing is banned. Can be very effective at scale (pension auto-enrolment raised participation from around 60% to over 85% in the UK). Disadvantages Effects can be small or fade over time. Ethical concerns: manipulation; who decides what is \"good\"? Firms also use nudges against consumers' interests (dark patterns, default subscriptions). Hard to measure effects; works better for some groups than others.","dias":[]},{"id":"e-business-objectives","title":"Business objectives","hl":false,"terms":[["Profit maximisation","Producing the output where marginal revenue equals marginal cost (MR = MC), so total revenue minus total cost is as large as possible."],["Corporate social responsibility (CSR)","A firm acting ethically and in the interests of society and the environment, beyond what the law requires."],["Market share","A firm's sales as a percentage of total sales in its market."],["Satisficing","Aiming for a satisfactory level of profit rather than the maximum, often to balance the interests of different stakeholders."],["Revenue maximisation","Producing where marginal revenue is zero, so total revenue is as large as possible."],["Growth maximisation","Aiming to make the firm as large as possible, measured by sales, output, market share or assets."]],"topic":"t2-4","html":"<p>Standard theory assumes firms <strong>maximise profit<\/strong>. In reality they pursue several objectives:<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Objective<\/th><th>Why a firm pursues it<\/th><th>Evaluation<\/th><\/tr><\/thead><tbody><tr><td><strong>Profit maximisation<\/strong> (MR = MC)<\/td><td>Rewards shareholders; funds investment and R&amp;D<\/td><td>Firms rarely know their exact MR and MC; may harm reputation or stakeholders<\/td><\/tr><tr><td><strong>Corporate social responsibility<\/strong><\/td><td>Brand image, customer loyalty, attracting staff and investors, ethical owners<\/td><td>Higher costs; risk of \"greenwashing\" (e.g. Volkswagen's emissions scandal 2015)<\/td><\/tr><tr><td><strong>Market share / growth<\/strong><\/td><td>Economies of scale, market power, security against takeover<\/td><td>May involve low prices and lower profit in the short run (e.g. Amazon's early years)<\/td><\/tr><tr><td><strong>Revenue maximisation<\/strong> (MR = 0)<\/td><td>Managers' pay or status linked to sales<\/td><td>Output higher and price lower than with profit maximisation<\/td><\/tr><tr><td><strong>Satisficing<\/strong><\/td><td>Separation of ownership and control: managers balance stakeholders; profit \"good enough\"<\/td><td>Common in large firms and family businesses; less efficient?<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: CSR in practice<\/div><p>Patagonia gives 1% of sales to environmental causes and in 2022 transferred ownership to a trust so that profits fund climate action. Unilever and Ben &amp; Jerry's pursue social objectives alongside profit.<\/p><\/div>","text":"Standard theory assumes firms maximise profit . In reality they pursue several objectives: Objective Why a firm pursues it Evaluation Profit maximisation (MR = MC) Rewards shareholders; funds investment and R&D Firms rarely know their exact MR and MC; may harm reputation or stakeholders Corporate social responsibility Brand image, customer loyalty, attracting staff and investors, ethical owners Higher costs; risk of \"greenwashing\" (e.g. Volkswagen's emissions scandal 2015) Market share / growth Economies of scale, market power, security against takeover May involve low prices and lower profit in the short run (e.g. Amazon's early years) Revenue maximisation (MR = 0) Managers' pay or status linked to sales Output higher and price lower than with profit maximisation Satisficing Separation of ownership and control: managers balance stakeholders; profit \"good enough\" Common in large firms and family businesses; less efficient? Real-world example: CSR in practice Patagonia gives 1% of sales to environmental causes and in 2022 transferred ownership to a trust so that profits fund climate action. Unilever and Ben & Jerry's pursue social objectives alongside profit.","dias":[]}]},{"id":"t2-5","num":"2.5","title":"Elasticities of demand","level":"SL","blurb":"PED and YED: calculation, interpretation, determinants, and why they matter for firms, governments and development.","entries":[{"id":"e-ped","title":"Price elasticity of demand (PED)","hl":false,"terms":[["Price elasticity of demand (PED)","A measure of the responsiveness of quantity demanded to a change in the good's own price: %ΔQd ÷ %ΔP."],["Price elastic demand","When the percentage change in quantity demanded is greater than the percentage change in price (|PED| > 1)."],["Price inelastic demand","When the percentage change in quantity demanded is less than the percentage change in price (|PED| < 1)."],["Unit elastic demand","When the percentage change in quantity demanded equals the percentage change in price (|PED| = 1)."],["Perfectly inelastic demand","When quantity demanded does not change at all as price changes (PED = 0)."],["Perfectly elastic demand","When any rise in price causes quantity demanded to fall to zero (PED = ∞)."]],"topic":"t2-5","html":"<div class=\"box formula\"><div class=\"box-h\">PED<\/div><div class=\"fx\"><div class=\"fx-eq\">PED = <span class=\"fr\"><span>%ΔQd<\/span><span>%ΔP<\/span><\/span><\/div><div class=\"fx-n\">always negative for normal demand curves; interpret using the absolute value<\/div><\/div><div class=\"fx\"><div class=\"fx-eq\">%Δ = <span class=\"fr\"><span>new − old<\/span><span>old<\/span><\/span> × 100<\/div><\/div><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: PED<\/div><p>A firm raises its price from $10 to $15 and sales fall from 100 to 40 a day. %ΔQd = (40 − 100) ÷ 100 × 100 = −60%. %ΔP = (15 − 10) ÷ 10 × 100 = +50%. PED = −60 ÷ 50 = <strong>−1.2<\/strong> → price elastic: the % fall in sales is larger than the % rise in price. Rearranging: if PED = −0.4 and price rises 10%, %ΔQd = −0.4 × 10 = <strong>−4%<\/strong>.<\/p><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Value (absolute)<\/th><th>Description<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>Perfectly inelastic<\/td><td>Insulin for diabetics (approximately)<\/td><\/tr><tr><td>0 – 1<\/td><td>Inelastic<\/td><td>Petrol, cigarettes, salt, electricity<\/td><\/tr><tr><td>1<\/td><td>Unit elastic<\/td><td><\/td><\/tr><tr><td>1 – ∞<\/td><td>Elastic<\/td><td>A particular brand of jeans, restaurant meals, holidays<\/td><\/tr><tr><td>∞<\/td><td>Perfectly elastic<\/td><td>One farmer's wheat in a world market<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"dslot\" data-d=\"ped-compare\"><\/div>\n<div class=\"dslot\" data-d=\"ped-special\"><\/div>\n<h4>Determinants of PED<\/h4>\n<ul><li><strong>Substitutes<\/strong>: more and closer substitutes → more elastic (one brand of coffee vs coffee in general).<\/li><li><strong>Proportion of income<\/strong>: goods that take a big share of income → more elastic (cars vs matches).<\/li><li><strong>Necessity vs luxury<\/strong>: necessities are inelastic.<\/li><li><strong>Addictiveness / habit<\/strong>: addictive goods are inelastic (tobacco, alcohol).<\/li><li><strong>Time<\/strong>: demand becomes more elastic over time as consumers find alternatives (petrol: switching to EVs or public transport takes years).<\/li><li><strong>Breadth of definition<\/strong>: \"food\" is inelastic; \"Heinz baked beans\" is elastic.<\/li><\/ul>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>State the negative sign in your calculation, then interpret using the absolute value. Never write PED as a percentage.<\/p><\/div>","text":"PED PED = %ΔQd %ΔP always negative for normal demand curves; interpret using the absolute value %Δ = new − old old × 100 Worked example: PED A firm raises its price from $10 to $15 and sales fall from 100 to 40 a day. %ΔQd = (40 − 100) ÷ 100 × 100 = −60%. %ΔP = (15 − 10) ÷ 10 × 100 = +50%. PED = −60 ÷ 50 = −1.2 → price elastic: the % fall in sales is larger than the % rise in price. Rearranging: if PED = −0.4 and price rises 10%, %ΔQd = −0.4 × 10 = −4% . Value (absolute) Description Example 0 Perfectly inelastic Insulin for diabetics (approximately) 0 – 1 Inelastic Petrol, cigarettes, salt, electricity 1 Unit elastic 1 – ∞ Elastic A particular brand of jeans, restaurant meals, holidays ∞ Perfectly elastic One farmer's wheat in a world market Determinants of PED Substitutes : more and closer substitutes → more elastic (one brand of coffee vs coffee in general). Proportion of income : goods that take a big share of income → more elastic (cars vs matches). Necessity vs luxury : necessities are inelastic. Addictiveness / habit : addictive goods are inelastic (tobacco, alcohol). Time : demand becomes more elastic over time as consumers find alternatives (petrol: switching to EVs or public transport takes years). Breadth of definition : \"food\" is inelastic; \"Heinz baked beans\" is elastic. Exam tip State the negative sign in your calculation, then interpret using the absolute value. Never write PED as a percentage.","dias":["ped-compare","ped-special"]},{"id":"e-ped-significance","title":"Significance of PED: revenue, firms, governments and commodities","hl":false,"terms":[["Total revenue (TR)","The total income a firm receives from sales: price × quantity sold."],["Primary commodities","Raw materials and agricultural goods, such as oil, copper, coffee and wheat."],["Tax incidence","How the burden of a tax is shared between consumers and producers."]],"topic":"t2-5","html":"<h4>PED and total revenue<\/h4>\n<div class=\"dslot\" data-d=\"ped-tr\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>PED<\/th><th>Price rise<\/th><th>Price cut<\/th><\/tr><\/thead><tbody><tr><td>Inelastic (&lt; 1)<\/td><td>TR <strong>rises<\/strong><\/td><td>TR falls<\/td><\/tr><tr><td>Elastic (&gt; 1)<\/td><td>TR falls<\/td><td>TR <strong>rises<\/strong><\/td><\/tr><tr><td>Unit elastic<\/td><td>TR unchanged<\/td><td>TR unchanged<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · PED varies along a straight-line demand curve<\/div><div class=\"dslot\" data-d=\"ped-linear\"><\/div>\n<p>On a linear demand curve the slope is constant, but PED = (ΔQ ÷ ΔP) × (P ÷ Q) changes because P ÷ Q changes. Demand is elastic at high prices, unit elastic at the midpoint and inelastic at low prices. <strong>TR is maximised at the midpoint<\/strong>, where PED = 1 and MR = 0. So a single straight-line demand curve does not have \"a\" PED.<\/p><\/div>\n<h4>Why PED matters<\/h4>\n<ul><li><strong>Firms<\/strong>: pricing decisions. Firms facing inelastic demand (with market power) can raise prices and revenue; those facing elastic demand compete on price. Airlines charge business travellers (inelastic) more than leisure travellers.<\/li><li><strong>Governments<\/strong>: tax revenue and tax incidence. Indirect taxes on goods with inelastic demand (fuel, tobacco, alcohol) raise a lot of revenue but reduce consumption only a little, and most of the tax is passed on to consumers (<a class=\"xref\" href=\"#e-indirect-taxes\">2.7<\/a>).<\/li><li><strong>Primary commodities vs manufactured goods<\/strong>: primary commodities generally have <strong>low PED<\/strong> (few substitutes, necessities), so a small change in supply causes a big change in price. Combined with low PES, this makes commodity prices volatile and farmers' and commodity exporters' incomes unstable (a key development issue, <a class=\"xref\" href=\"#t4-9\">4.9<\/a>). Manufactured goods have more substitutes and more elastic demand.<\/li><\/ul>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: Coffee price swings<\/div><p>Frost and drought in Brazil in 2021 cut coffee supply; with inelastic demand, arabica prices roughly doubled within a year. Producer countries such as Ethiopia and Uganda, which rely on coffee exports, see export revenue swing sharply.<\/p><\/div>","text":"PED and total revenue PED Price rise Price cut Inelastic (< 1) TR rises TR falls Elastic (> 1) TR falls TR rises Unit elastic TR unchanged TR unchanged HL only · PED varies along a straight-line demand curve On a linear demand curve the slope is constant, but PED = (ΔQ ÷ ΔP) × (P ÷ Q) changes because P ÷ Q changes. Demand is elastic at high prices, unit elastic at the midpoint and inelastic at low prices. TR is maximised at the midpoint , where PED = 1 and MR = 0. So a single straight-line demand curve does not have \"a\" PED. Why PED matters Firms : pricing decisions. Firms facing inelastic demand (with market power) can raise prices and revenue; those facing elastic demand compete on price. Airlines charge business travellers (inelastic) more than leisure travellers. Governments : tax revenue and tax incidence. Indirect taxes on goods with inelastic demand (fuel, tobacco, alcohol) raise a lot of revenue but reduce consumption only a little, and most of the tax is passed on to consumers ( 2.7 ). Primary commodities vs manufactured goods : primary commodities generally have low PED (few substitutes, necessities), so a small change in supply causes a big change in price. Combined with low PES, this makes commodity prices volatile and farmers' and commodity exporters' incomes unstable (a key development issue, 4.9 ). Manufactured goods have more substitutes and more elastic demand. Real-world example: Coffee price swings Frost and drought in Brazil in 2021 cut coffee supply; with inelastic demand, arabica prices roughly doubled within a year. Producer countries such as Ethiopia and Uganda, which rely on coffee exports, see export revenue swing sharply.","dias":["ped-tr","ped-linear"]},{"id":"e-yed","title":"Income elasticity of demand (YED)","hl":false,"terms":[["Income elasticity of demand (YED)","A measure of the responsiveness of demand for a good to a change in consumers' income: %ΔQd ÷ %ΔY."],["Income elastic (luxury) good","A normal good with YED > 1: demand rises more than proportionately with income."],["Income inelastic (necessity) good","A normal good with YED between 0 and 1."],["Sectoral change","The shift of an economy's output and employment from the primary sector to the secondary and then the tertiary sector as incomes rise."]],"topic":"t2-5","html":"<div class=\"box formula\"><div class=\"box-h\">YED<\/div><div class=\"fx\"><div class=\"fx-eq\">YED = <span class=\"fr\"><span>%ΔQd<\/span><span>%ΔY<\/span><\/span><\/div><div class=\"fx-n\">the sign matters: positive = normal, negative = inferior<\/div><\/div><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: YED<\/div><p>Weekly income rises from S$100 to S$125 (+25%) and bubble tea purchases rise from 12 to 15 (+25%). YED = 25 ÷ 25 = <strong>+1<\/strong> (normal good, unit income elastic).<\/p><\/div>\n<div class=\"tbl\"><table><thead><tr><th>YED<\/th><th>Type of good<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>&gt; 1<\/td><td>Normal, income elastic (luxury)<\/td><td>Foreign holidays, sports cars, fine dining<\/td><\/tr><tr><td>0 – 1<\/td><td>Normal, income inelastic (necessity)<\/td><td>Bread, toothpaste, electricity<\/td><\/tr><tr><td>&lt; 0<\/td><td>Inferior<\/td><td>Bus travel, instant noodles, second-hand clothes<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Why YED matters<\/h4>\n<ul><li><strong>Firms<\/strong>: in a boom, demand for luxury goods grows fastest; in a recession, discount retailers (inferior goods) may gain. Firms diversify product ranges to manage this risk.<\/li><li><strong>Sectoral change<\/strong>: primary products (food) have low YED, manufactured goods higher, services highest. As economies grow, spending and employment move from agriculture to manufacturing to services. Countries exporting primary commodities gain less from world income growth than exporters of manufactured goods and services: a reason for developing economies to <strong>diversify<\/strong>.<\/li><\/ul>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>For YED the sign is essential: always state whether the good is normal or inferior.<\/p><\/div>\n<div class=\"box key\"><div class=\"box-h\">Key idea: Cross elasticity (XED)<\/div><p>XED (%ΔQd of A ÷ %ΔP of B) was removed from the current guide, but the idea of substitutes (positive) and complements (negative) still appears in the determinants of demand. You will not be asked to calculate XED.<\/p><\/div>","text":"YED YED = %ΔQd %ΔY the sign matters: positive = normal, negative = inferior Worked example: YED Weekly income rises from S$100 to S$125 (+25%) and bubble tea purchases rise from 12 to 15 (+25%). YED = 25 ÷ 25 = +1 (normal good, unit income elastic). YED Type of good Examples > 1 Normal, income elastic (luxury) Foreign holidays, sports cars, fine dining 0 – 1 Normal, income inelastic (necessity) Bread, toothpaste, electricity < 0 Inferior Bus travel, instant noodles, second-hand clothes Why YED matters Firms : in a boom, demand for luxury goods grows fastest; in a recession, discount retailers (inferior goods) may gain. Firms diversify product ranges to manage this risk. Sectoral change : primary products (food) have low YED, manufactured goods higher, services highest. As economies grow, spending and employment move from agriculture to manufacturing to services. Countries exporting primary commodities gain less from world income growth than exporters of manufactured goods and services: a reason for developing economies to diversify . Exam tip For YED the sign is essential: always state whether the good is normal or inferior. Key idea: Cross elasticity (XED) XED (%ΔQd of A ÷ %ΔP of B) was removed from the current guide, but the idea of substitutes (positive) and complements (negative) still appears in the determinants of demand. You will not be asked to calculate XED.","dias":[]}]},{"id":"t2-6","num":"2.6","title":"Elasticity of supply","level":"SL","blurb":"PES: calculation, determinants, and why commodity supply is so inelastic.","entries":[{"id":"e-pes","title":"Price elasticity of supply (PES)","hl":false,"terms":[["Price elasticity of supply (PES)","A measure of the responsiveness of quantity supplied to a change in the good's price: %ΔQs ÷ %ΔP."],["Price elastic supply","When the percentage change in quantity supplied is greater than the percentage change in price (PES > 1)."],["Price inelastic supply","When the percentage change in quantity supplied is less than the percentage change in price (PES < 1)."]],"topic":"t2-6","html":"<div class=\"box formula\"><div class=\"box-h\">PES<\/div><div class=\"fx\"><div class=\"fx-eq\">PES = <span class=\"fr\"><span>%ΔQs<\/span><span>%ΔP<\/span><\/span><\/div><div class=\"fx-n\">positive, because supply curves slope upward<\/div><\/div><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: PES<\/div><p>Avocado prices rise from AU$0.90 to AU$1.45 (+61.11%). A farm shop raises its weekly supply from 110 to 120 (+9.09%). PES = 9.09 ÷ 61.11 = <strong>0.15<\/strong> → very inelastic: the farm cannot grow more avocados quickly.<\/p><\/div>\n<div class=\"dslot\" data-d=\"pes-range\"><\/div>\n<h4>Determinants of PES<\/h4>\n<ul><li><strong>Time period<\/strong>: the most important. Momentary (fixed), short run (only variable factors change), long run (all factors can change). PES rises over time.<\/li><li><strong>Spare capacity<\/strong>: firms with idle machines and workers can raise output quickly.<\/li><li><strong>Stocks<\/strong>: firms with inventories can supply more immediately; perishables cannot be stored.<\/li><li><strong>Mobility of factors<\/strong>: if resources can be switched easily between uses, supply is more elastic.<\/li><li><strong>Complexity of production / rate of cost increase<\/strong>: if costs rise sharply as output expands, supply is inelastic.<\/li><\/ul>\n<h4>Primary commodities vs manufactured goods<\/h4>\n<p>Agricultural goods take a growing season to respond (coffee bushes take 3–4 years to mature; a new copper mine 10+ years), so their supply is <strong>price inelastic<\/strong>. Manufactured goods can usually be scaled up by adding shifts or using spare capacity, so supply is <strong>more elastic<\/strong>. Inelastic supply plus inelastic demand → <strong>highly volatile commodity prices<\/strong>.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Think like a producer: PES is about how easily firms can change output, not how consumers react. PES is never expressed as a percentage.<\/p><\/div>","text":"PES PES = %ΔQs %ΔP positive, because supply curves slope upward Worked example: PES Avocado prices rise from AU$0.90 to AU$1.45 (+61.11%). A farm shop raises its weekly supply from 110 to 120 (+9.09%). PES = 9.09 ÷ 61.11 = 0.15 → very inelastic: the farm cannot grow more avocados quickly. Determinants of PES Time period : the most important. Momentary (fixed), short run (only variable factors change), long run (all factors can change). PES rises over time. Spare capacity : firms with idle machines and workers can raise output quickly. Stocks : firms with inventories can supply more immediately; perishables cannot be stored. Mobility of factors : if resources can be switched easily between uses, supply is more elastic. Complexity of production / rate of cost increase : if costs rise sharply as output expands, supply is inelastic. Primary commodities vs manufactured goods Agricultural goods take a growing season to respond (coffee bushes take 3–4 years to mature; a new copper mine 10+ years), so their supply is price inelastic . Manufactured goods can usually be scaled up by adding shifts or using spare capacity, so supply is more elastic . Inelastic supply plus inelastic demand → highly volatile commodity prices . Exam tip Think like a producer: PES is about how easily firms can change output, not how consumers react. PES is never expressed as a percentage.","dias":["pes-range"]}]},{"id":"t2-7","num":"2.7","title":"Role of government in microeconomics","level":"SL","blurb":"Why governments intervene and how: indirect taxes, subsidies, price controls, direct provision, regulation and nudges, with HL welfare calculations.","entries":[{"id":"e-why-intervene","title":"Reasons for government intervention","hl":false,"terms":[["Market failure","When the free market fails to allocate resources efficiently, so that the socially optimal output is not produced."],["Stakeholder","Any person or group affected by a decision, e.g. consumers, producers, workers, the government, the wider community."]],"topic":"t2-7","html":"<p>Governments intervene in markets to:<\/p>\n<ol><li><strong>Earn revenue<\/strong> (indirect taxes on goods with inelastic demand).<\/li><li><strong>Support firms<\/strong> (subsidies to infant industries, farmers or strategic sectors).<\/li><li><strong>Support low-income households<\/strong> (price ceilings on necessities, subsidies on food and fuel, minimum wages).<\/li><li><strong>Influence production and consumption<\/strong> (discourage demerit goods, encourage merit goods).<\/li><li><strong>Correct market failure<\/strong> (externalities, public goods, asymmetric information, market power: <a class=\"xref\" href=\"#t2-8\">2.8<\/a>–<a class=\"xref\" href=\"#t2-11\">2.11<\/a>).<\/li><li><strong>Promote equity<\/strong> (<a class=\"xref\" href=\"#t2-12\">2.12<\/a>).<\/li><\/ol>\n<p>The tools: <strong>indirect taxes, subsidies, price controls, direct provision, regulation and legislation, and consumer nudges<\/strong>. For each, analyse effects on <strong>stakeholders<\/strong>: consumers, producers, workers, the government and society.<\/p>","text":"Governments intervene in markets to: Earn revenue (indirect taxes on goods with inelastic demand). Support firms (subsidies to infant industries, farmers or strategic sectors). Support low-income households (price ceilings on necessities, subsidies on food and fuel, minimum wages). Influence production and consumption (discourage demerit goods, encourage merit goods). Correct market failure (externalities, public goods, asymmetric information, market power: 2.8 – 2.11 ). Promote equity ( 2.12 ). The tools: indirect taxes, subsidies, price controls, direct provision, regulation and legislation, and consumer nudges . For each, analyse effects on stakeholders : consumers, producers, workers, the government and society.","dias":[]},{"id":"e-indirect-taxes","title":"Indirect taxes","hl":false,"terms":[["Indirect tax","A tax on spending on goods and services, paid to the government by producers, who pass some of it on to consumers."],["Specific tax","A fixed amount of tax per unit of a good, e.g. $1 per litre."],["Ad valorem tax","A tax that is a percentage of the price of a good, e.g. 20% VAT."],["Excise tax","An indirect tax on a specific good such as tobacco, alcohol or fuel."],["Consumer burden","The part of an indirect tax paid by consumers through higher prices."],["Producer burden","The part of an indirect tax paid by producers through a lower price received."]],"topic":"t2-7","html":"<div class=\"dslot\" data-d=\"tax-specific\"><\/div>\n<div class=\"dslot\" data-d=\"tax-adval\"><\/div>\n<h4>Effects on stakeholders<\/h4>\n<ul><li><strong>Consumers<\/strong>: pay a higher price (Pc), buy less; lose consumer surplus.<\/li><li><strong>Producers<\/strong>: receive a lower price (Pp), sell less; lose producer surplus; may cut jobs.<\/li><li><strong>Government<\/strong>: gains revenue (Pc − Pp) × Q₂, which may fund public services.<\/li><li><strong>Society<\/strong>: a welfare loss if there was no externality; a welfare <strong>gain<\/strong> if the tax corrects a negative externality (<a class=\"xref\" href=\"#e-externality-policy\">2.8<\/a>).<\/li><\/ul>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Tax incidence, PED and welfare calculations<\/div><div class=\"dslot\" data-d=\"tax-incidence\"><\/div>\n<p>The burden falls mostly on whichever side of the market is <strong>less elastic<\/strong>. With inelastic demand (petrol, tobacco), consumers pay most of the tax and quantity falls only a little: good for revenue, weak for changing behaviour. <strong>Calculating from a diagram<\/strong>: P₁ = $10, Q₁ = 500; tax = $4; after the tax Pc = $13, Pp = $9, Q₂ = 400.<\/p>\n<ul><li>Tax revenue = 4 × 400 = <strong>$1,600<\/strong><\/li><li>Consumer burden = (13 − 10) × 400 = <strong>$1,200<\/strong>; producer burden = (10 − 9) × 400 = <strong>$400<\/strong><\/li><li>Welfare loss = ½ × 4 × (500 − 400) = <strong>$200<\/strong><\/li><li>Change in CS = −[(13 − 10) × 400 + ½ × 3 × 100] = <strong>−$1,350<\/strong><\/li><\/ul><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Advantages<\/h5><ul><li>Raise revenue for public spending.<\/li><li>Discourage consumption of harmful goods; can correct negative externalities.<\/li><li>Market-based: consumers still choose.<\/li><\/ul><\/div><div><h5>Disadvantages<\/h5><ul><li>Regressive: low-income households spend a larger share of income on taxed goods.<\/li><li>If demand is inelastic, consumption falls only slightly.<\/li><li>Encourage smuggling and black markets if very high (e.g. tobacco in Australia).<\/li><li>Hard to set the \"right\" rate; political unpopularity (France's \"gilets jaunes\" protests against fuel tax rises, 2018).<\/li><\/ul><\/div><\/div><\/div>","text":"Effects on stakeholders Consumers : pay a higher price (Pc), buy less; lose consumer surplus. Producers : receive a lower price (Pp), sell less; lose producer surplus; may cut jobs. Government : gains revenue (Pc − Pp) × Q₂, which may fund public services. Society : a welfare loss if there was no externality; a welfare gain if the tax corrects a negative externality ( 2.8 ). HL only · Tax incidence, PED and welfare calculations The burden falls mostly on whichever side of the market is less elastic . With inelastic demand (petrol, tobacco), consumers pay most of the tax and quantity falls only a little: good for revenue, weak for changing behaviour. Calculating from a diagram : P₁ = $10, Q₁ = 500; tax = $4; after the tax Pc = $13, Pp = $9, Q₂ = 400. Tax revenue = 4 × 400 = $1,600 Consumer burden = (13 − 10) × 400 = $1,200 ; producer burden = (10 − 9) × 400 = $400 Welfare loss = ½ × 4 × (500 − 400) = $200 Change in CS = −[(13 − 10) × 400 + ½ × 3 × 100] = −$1,350 Evaluation Advantages Raise revenue for public spending. Discourage consumption of harmful goods; can correct negative externalities. Market-based: consumers still choose. Disadvantages Regressive: low-income households spend a larger share of income on taxed goods. If demand is inelastic, consumption falls only slightly. Encourage smuggling and black markets if very high (e.g. tobacco in Australia). Hard to set the \"right\" rate; political unpopularity (France's \"gilets jaunes\" protests against fuel tax rises, 2018).","dias":["tax-specific","tax-adval","tax-incidence"]},{"id":"e-subsidies","title":"Subsidies","hl":false,"terms":[["Subsidy","A payment by the government to producers (or consumers) per unit, to lower costs and prices and increase output and consumption."]],"topic":"t2-7","html":"<div class=\"dslot\" data-d=\"subsidy\"><\/div>\n<p>Governments subsidise to make necessities affordable (food, fuel), support farmers and strategic industries, encourage merit goods and positive externalities (education, renewable energy, EVs), and help domestic firms compete internationally.<\/p>\n<h4>Effects on stakeholders<\/h4>\n<ul><li><strong>Consumers<\/strong>: lower price (Pc), consume more.<\/li><li><strong>Producers<\/strong>: receive more per unit (Pp), produce more; incomes rise.<\/li><li><strong>Workers<\/strong>: more jobs in the subsidised industry.<\/li><li><strong>Government<\/strong>: pays (Pp − Pc) × Q₂; opportunity cost of that spending.<\/li><li><strong>Foreign producers<\/strong>: face unfair competition (subsidised exports can be dumped).<\/li><li><strong>Society<\/strong>: welfare loss from overallocation if there is no positive externality.<\/li><\/ul>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Subsidy calculation<\/div><p>P₁ = $20, Q₁ = 1,000; a subsidy of $6 per unit; new Pc = $17, Pp = $23, Q₂ = 1,300.<\/p>\n<ul><li>Government spending = subsidy × Q₂ = 6 × 1,300 = <strong>$7,800<\/strong><\/li><li>Gain in consumer surplus = trapezium between P₁ and Pc = (20 − 17) × (1,000 + 1,300) ÷ 2 = <strong>$3,450<\/strong><\/li><li>Gain in producer surplus = trapezium between Pp and P₁ = (23 − 20) × (1,000 + 1,300) ÷ 2 = <strong>$3,450<\/strong><\/li><li>Welfare loss = ½ × subsidy × (Q₂ − Q₁) = ½ × 6 × 300 = <strong>$900<\/strong><\/li><li>Check: spending = ΔCS + ΔPS + welfare loss → 7,800 = 3,450 + 3,450 + 900 ✓<\/li><\/ul><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Advantages<\/h5><ul><li>Lower prices for consumers; helps low-income households.<\/li><li>Raise output and employment; support strategic industries.<\/li><li>Correct positive externalities (vaccines, renewable energy).<\/li><\/ul><\/div><div><h5>Disadvantages<\/h5><ul><li>Opportunity cost for government budgets.<\/li><li>Firms may become inefficient and dependent; hard to remove (fuel subsidies in Nigeria, ended 2023 amid protests).<\/li><li>Overproduction and dumping (EU and US farm subsidies hurt farmers in developing countries).<\/li><li>Hard to target and to measure the right size.<\/li><\/ul><\/div><\/div><\/div>","text":"Governments subsidise to make necessities affordable (food, fuel), support farmers and strategic industries, encourage merit goods and positive externalities (education, renewable energy, EVs), and help domestic firms compete internationally. Effects on stakeholders Consumers : lower price (Pc), consume more. Producers : receive more per unit (Pp), produce more; incomes rise. Workers : more jobs in the subsidised industry. Government : pays (Pp − Pc) × Q₂; opportunity cost of that spending. Foreign producers : face unfair competition (subsidised exports can be dumped). Society : welfare loss from overallocation if there is no positive externality. HL only · Subsidy calculation P₁ = $20, Q₁ = 1,000; a subsidy of $6 per unit; new Pc = $17, Pp = $23, Q₂ = 1,300. Government spending = subsidy × Q₂ = 6 × 1,300 = $7,800 Gain in consumer surplus = trapezium between P₁ and Pc = (20 − 17) × (1,000 + 1,300) ÷ 2 = $3,450 Gain in producer surplus = trapezium between Pp and P₁ = (23 − 20) × (1,000 + 1,300) ÷ 2 = $3,450 Welfare loss = ½ × subsidy × (Q₂ − Q₁) = ½ × 6 × 300 = $900 Check: spending = ΔCS + ΔPS + welfare loss → 7,800 = 3,450 + 3,450 + 900 ✓ Evaluation Advantages Lower prices for consumers; helps low-income households. Raise output and employment; support strategic industries. Correct positive externalities (vaccines, renewable energy). Disadvantages Opportunity cost for government budgets. Firms may become inefficient and dependent; hard to remove (fuel subsidies in Nigeria, ended 2023 amid protests). Overproduction and dumping (EU and US farm subsidies hurt farmers in developing countries). Hard to target and to measure the right size.","dias":["subsidy"]},{"id":"e-price-ceilings","title":"Price ceilings (maximum prices)","hl":false,"terms":[["Price ceiling","A legal maximum price set by the government below the equilibrium price."],["Parallel market","An illegal (black) market where goods are sold above the legal maximum price."],["Non-price rationing","Allocating goods by methods other than price, such as queues, lotteries, coupons or favouritism."]],"topic":"t2-7","html":"<div class=\"dslot\" data-d=\"price-ceiling\"><\/div>\n<p>Used for necessities (food staples, rent, fuel) to make them affordable. Examples: rent controls in Berlin (2020, later struck down), Stockholm and San Francisco; bread and fuel price caps in Egypt, Venezuela, Hungary (2021–23 on fuel and food).<\/p>\n<h4>Consequences<\/h4>\n<ul><li><strong>Shortage<\/strong> (Qd − Qs): queues, waiting lists, first come first served, rationing.<\/li><li><strong>Parallel markets<\/strong>: goods resold at Pb (the black-market price).<\/li><li><strong>Lower quality<\/strong> and less maintenance (landlords neglect rent-controlled housing).<\/li><li><strong>Underallocation of resources<\/strong> and welfare loss.<\/li><\/ul>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Welfare effects of a price ceiling<\/div><p>Consumers who still buy gain the rectangle (Pe − Pmax) × Qs from producers; consumers lose the triangle of units no longer sold. Producer surplus falls by the rectangle plus its own triangle. The two triangles between Qs and Qe are the <strong>welfare loss<\/strong>. Example: Pe = $8, Qe = 600; Pmax = $5, Qs = 450, Qd = 750; the demand curve at Qs = 450 shows willingness to pay of $11. Shortage = <strong>300<\/strong>. Welfare loss = ½ × (11 − 5) × (600 − 450) = <strong>$450<\/strong>.<\/p><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>For<\/h5><ul><li>Makes necessities affordable for low-income consumers who can buy.<\/li><li>Can be justified in emergencies (festive periods, wartime).<\/li><\/ul><\/div><div><h5>Against<\/h5><ul><li>Shortages: some consumers get nothing.<\/li><li>Black markets, lower quality, less investment (fewer new rental homes built).<\/li><li>Firms may leave the market; government may need to subsidise or supply directly.<\/li><li>Long-run supply is more elastic, so shortages grow over time.<\/li><\/ul><\/div><\/div><\/div>","text":"Used for necessities (food staples, rent, fuel) to make them affordable. Examples: rent controls in Berlin (2020, later struck down), Stockholm and San Francisco; bread and fuel price caps in Egypt, Venezuela, Hungary (2021–23 on fuel and food). Consequences Shortage (Qd − Qs): queues, waiting lists, first come first served, rationing. Parallel markets : goods resold at Pb (the black-market price). Lower quality and less maintenance (landlords neglect rent-controlled housing). Underallocation of resources and welfare loss. HL only · Welfare effects of a price ceiling Consumers who still buy gain the rectangle (Pe − Pmax) × Qs from producers; consumers lose the triangle of units no longer sold. Producer surplus falls by the rectangle plus its own triangle. The two triangles between Qs and Qe are the welfare loss . Example: Pe = $8, Qe = 600; Pmax = $5, Qs = 450, Qd = 750; the demand curve at Qs = 450 shows willingness to pay of $11. Shortage = 300 . Welfare loss = ½ × (11 − 5) × (600 − 450) = $450 . Evaluation For Makes necessities affordable for low-income consumers who can buy. Can be justified in emergencies (festive periods, wartime). Against Shortages: some consumers get nothing. Black markets, lower quality, less investment (fewer new rental homes built). Firms may leave the market; government may need to subsidise or supply directly. Long-run supply is more elastic, so shortages grow over time.","dias":["price-ceiling"]},{"id":"e-price-floors","title":"Price floors (minimum prices) and minimum wages","hl":false,"terms":[["Price floor","A legal minimum price set above the equilibrium price."],["Minimum wage","A legal minimum hourly wage that employers must pay workers, a price floor in the labour market."],["Buffer stock","A stock of a commodity bought by an authority when prices are low and sold when prices are high, to stabilise prices."]],"topic":"t2-7","html":"<div class=\"dslot\" data-d=\"price-floor\"><\/div>\n<p>Price floors protect producers' incomes (agriculture), or discourage consumption (minimum unit pricing for alcohol in Scotland, 2018, at 50p then 65p per unit).<\/p>\n<h4>Consequences<\/h4>\n<ul><li><strong>Surplus<\/strong> (Qs − Qd). The government may buy it (cost Pmin × surplus), store it, destroy it, export it (dumping), or pay farmers to produce less.<\/li><li><strong>Consumers<\/strong> pay more and buy less; <strong>efficient producers<\/strong> earn more; <strong>inefficient producers<\/strong> are protected; <strong>taxpayers<\/strong> fund the purchases (EU \"butter mountains\" and \"wine lakes\" in the 1980s).<\/li><li><strong>Overallocation<\/strong> of resources and welfare loss.<\/li><\/ul>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Welfare and cost of a price floor<\/div><p>Example: Pe = $4, Qe = 1,000; Pmin = $6, Qd = 800, Qs = 1,400. Surplus = <strong>600 units<\/strong>. If the government buys the surplus: cost = 6 × 600 = <strong>$3,600<\/strong>. Consumer surplus falls by (6 − 4) × 800 plus the small triangle; producers gain the rectangle and extra sales. The welfare loss includes the cost of producing units no one consumes.<\/p><\/div>\n<h4>Minimum wages<\/h4>\n<div class=\"dslot\" data-d=\"min-wage\"><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Benefits<\/h5><ul><li>Raises incomes of low-paid workers; reduces poverty and in-work benefit spending.<\/li><li>May raise productivity and morale (efficiency wages); reduces exploitation.<\/li><li>In monopsony labour markets, can raise wages and employment.<\/li><\/ul><\/div><div><h5>Costs<\/h5><ul><li>Unemployment if Wmin is well above equilibrium, especially for young and unskilled workers.<\/li><li>Higher costs may be passed on as higher prices; firms may automate.<\/li><li>Encourages informal (black-market) employment in developing countries.<\/li><li>Evidence is mixed: the UK National Living Wage has caused little measurable job loss so far.<\/li><\/ul><\/div><\/div><\/div>","text":"Price floors protect producers' incomes (agriculture), or discourage consumption (minimum unit pricing for alcohol in Scotland, 2018, at 50p then 65p per unit). Consequences Surplus (Qs − Qd). The government may buy it (cost Pmin × surplus), store it, destroy it, export it (dumping), or pay farmers to produce less. Consumers pay more and buy less; efficient producers earn more; inefficient producers are protected; taxpayers fund the purchases (EU \"butter mountains\" and \"wine lakes\" in the 1980s). Overallocation of resources and welfare loss. HL only · Welfare and cost of a price floor Example: Pe = $4, Qe = 1,000; Pmin = $6, Qd = 800, Qs = 1,400. Surplus = 600 units . If the government buys the surplus: cost = 6 × 600 = $3,600 . Consumer surplus falls by (6 − 4) × 800 plus the small triangle; producers gain the rectangle and extra sales. The welfare loss includes the cost of producing units no one consumes. Minimum wages Evaluation Benefits Raises incomes of low-paid workers; reduces poverty and in-work benefit spending. May raise productivity and morale (efficiency wages); reduces exploitation. In monopsony labour markets, can raise wages and employment. Costs Unemployment if Wmin is well above equilibrium, especially for young and unskilled workers. Higher costs may be passed on as higher prices; firms may automate. Encourages informal (black-market) employment in developing countries. Evidence is mixed: the UK National Living Wage has caused little measurable job loss so far.","dias":["price-floor","min-wage"]},{"id":"e-direct-provision","title":"Direct provision, regulation and nudges","hl":false,"terms":[["Direct provision","When the government itself supplies a good or service, funded through taxation, e.g. state schools, hospitals, roads."],["Regulation","Rules and laws set by government to control the behaviour of firms or consumers, e.g. bans, standards, licences."]],"topic":"t2-7","html":"<div class=\"tbl\"><table><thead><tr><th>Tool<\/th><th>Examples<\/th><th>Strengths<\/th><th>Weaknesses<\/th><\/tr><\/thead><tbody><tr><td><strong>Direct provision<\/strong><\/td><td>State schools and hospitals, street lighting, national defence, public housing<\/td><td>Ensures access for all, especially low-income groups; corrects underprovision of merit and public goods<\/td><td>High opportunity cost; can be inefficient without competition; quality may suffer<\/td><\/tr><tr><td><strong>Regulation and legislation<\/strong><\/td><td>Bans on smoking indoors, age limits on alcohol, emissions standards, food safety laws, plastic bag bans<\/td><td>Clear and direct; easy to understand<\/td><td>Enforcement and monitoring costs; black markets; firms may lobby or evade<\/td><\/tr><tr><td><strong>Consumer nudges<\/strong><\/td><td>Default options, calorie labels, graphic warnings<\/td><td>Cheap; keep freedom of choice<\/td><td>Effects uncertain and may be small ([[e-behavioural<\/td><td>2.4]])<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>In any intervention essay, compare at least two tools and name the <strong>stakeholders<\/strong> who gain and lose. Conclude with a judgement that depends on the <strong>context<\/strong>: PED, how big the external cost is, the government's budget, and the risk of government failure.<\/p><\/div>","text":"Tool Examples Strengths Weaknesses Direct provision State schools and hospitals, street lighting, national defence, public housing Ensures access for all, especially low-income groups; corrects underprovision of merit and public goods High opportunity cost; can be inefficient without competition; quality may suffer Regulation and legislation Bans on smoking indoors, age limits on alcohol, emissions standards, food safety laws, plastic bag bans Clear and direct; easy to understand Enforcement and monitoring costs; black markets; firms may lobby or evade Consumer nudges Default options, calorie labels, graphic warnings Cheap; keep freedom of choice Effects uncertain and may be small ([[e-behavioural 2.4]]) Exam tip In any intervention essay, compare at least two tools and name the stakeholders who gain and lose. Conclude with a judgement that depends on the context : PED, how big the external cost is, the government's budget, and the risk of government failure.","dias":[]}]},{"id":"t2-8","num":"2.8","title":"Market failure: externalities and common pool resources","level":"SL","blurb":"Why free markets over- or under-produce, the four externality diagrams, policies to fix them, and the tragedy of the commons.","entries":[{"id":"e-market-failure","title":"Market failure and the socially optimal output","hl":false,"terms":[["Marginal private benefit (MPB)","The extra benefit to the consumer of consuming one more unit; the market demand curve."],["Marginal private cost (MPC)","The extra cost to the producer of producing one more unit; the market supply curve."],["Marginal social benefit (MSB)","The extra benefit to society of one more unit: MPB plus any marginal external benefit."],["Marginal social cost (MSC)","The extra cost to society of one more unit: MPC plus any marginal external cost."],["Externality","A cost or benefit of production or consumption that falls on third parties not involved in the transaction, and is not reflected in the market price."],["Socially optimal output","The output where MSB = MSC, at which social welfare is maximised (allocative efficiency from society's view)."],["Overallocation","Producing more than the socially optimal output (MSC > MSB for the extra units)."],["Underallocation","Producing less than the socially optimal output (MSB > MSC for the missing units)."]],"topic":"t2-8","html":"<p>Free markets reach <strong>MPB = MPC<\/strong>. Society is best off at <strong>MSB = MSC<\/strong>. When the two differ, the market <strong>fails<\/strong>: it allocates too many or too few resources to the good, and a <strong>welfare loss<\/strong> results.<\/p>\n<p>Types of market failure in the course:<\/p>\n<ol><li><strong>Externalities<\/strong> (negative and positive) and <strong>common pool resources<\/strong> (this topic)<\/li><li><strong>Public goods<\/strong> (<a class=\"xref\" href=\"#t2-9\">2.9<\/a>)<\/li><li><strong>Asymmetric information<\/strong> (<a class=\"xref\" href=\"#t2-10\">2.10<\/a>, HL)<\/li><li><strong>Market power<\/strong> (<a class=\"xref\" href=\"#t2-11\">2.11<\/a>, HL)<\/li><li><strong>Inequity<\/strong> (<a class=\"xref\" href=\"#t2-12\">2.12<\/a>)<\/li><\/ol>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Market failure is about the <strong>quantity<\/strong> produced relative to the social optimum, not about prices being \"too high\". Explain using MSB, MSC and the welfare loss triangle.<\/p><\/div>","text":"Free markets reach MPB = MPC . Society is best off at MSB = MSC . When the two differ, the market fails : it allocates too many or too few resources to the good, and a welfare loss results. Types of market failure in the course: Externalities (negative and positive) and common pool resources (this topic) Public goods ( 2.9 ) Asymmetric information ( 2.10 , HL) Market power ( 2.11 , HL) Inequity ( 2.12 ) Exam tip Market failure is about the quantity produced relative to the social optimum, not about prices being \"too high\". Explain using MSB, MSC and the welfare loss triangle.","dias":[]},{"id":"e-neg-externalities","title":"Negative externalities and demerit goods","hl":false,"terms":[["Negative externality of production","An external cost created when producing a good, so MSC > MPC (e.g. factory pollution)."],["Negative externality of consumption","An external cost created when consuming a good, so MSB < MPB (e.g. passive smoking)."],["Demerit good","A good that is harmful to consumers and society, overconsumed in a free market because of negative externalities and imperfect information (e.g. cigarettes, alcohol, sugary drinks)."]],"topic":"t2-8","html":"<div class=\"dslot\" data-d=\"ext-neg-prod\"><\/div>\n<p><strong>Examples<\/strong>: CO₂ from coal power stations (climate change), chemical run-off from farms polluting rivers, noise from airports, deforestation for palm oil. The market produces Qm &gt; Qopt and the price is too low because it does not include the external cost.<\/p>\n<div class=\"dslot\" data-d=\"ext-neg-cons\"><\/div>\n<p><strong>Examples<\/strong>: smoking (passive smoking, healthcare costs), alcohol (accidents, violence), traffic congestion, single-use plastics littering, antibiotic overuse (resistance).<\/p>\n<h4>Demerit goods<\/h4>\n<p>Overconsumed because of <strong>negative consumption externalities<\/strong> and because consumers underestimate the harm to themselves (imperfect information, addiction, bounded self-control). Governments respond with taxes, bans, age limits, advertising restrictions and education.<\/p>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Calculating the welfare loss<\/div><p>The welfare loss is the triangle between MSC and MSB from Qopt to Qm: <strong>½ × base × height<\/strong>, where the base is the vertical gap between the social curve and the private curve at Qm, and the height is (Qm − Qopt). Example: at Qm = 800 the gap between MSC and MSB is $30; Qopt = 600. Welfare loss = ½ × 30 × (800 − 600) = <strong>$3,000<\/strong>.<\/p><\/div>","text":"Examples : CO₂ from coal power stations (climate change), chemical run-off from farms polluting rivers, noise from airports, deforestation for palm oil. The market produces Qm > Qopt and the price is too low because it does not include the external cost. Examples : smoking (passive smoking, healthcare costs), alcohol (accidents, violence), traffic congestion, single-use plastics littering, antibiotic overuse (resistance). Demerit goods Overconsumed because of negative consumption externalities and because consumers underestimate the harm to themselves (imperfect information, addiction, bounded self-control). Governments respond with taxes, bans, age limits, advertising restrictions and education. HL only · Calculating the welfare loss The welfare loss is the triangle between MSC and MSB from Qopt to Qm: ½ × base × height , where the base is the vertical gap between the social curve and the private curve at Qm, and the height is (Qm − Qopt). Example: at Qm = 800 the gap between MSC and MSB is $30; Qopt = 600. Welfare loss = ½ × 30 × (800 − 600) = $3,000 .","dias":["ext-neg-prod","ext-neg-cons"]},{"id":"e-pos-externalities","title":"Positive externalities and merit goods","hl":false,"terms":[["Positive externality of production","An external benefit created when producing a good, so MSC < MPC (e.g. firms training workers, R&D spillovers)."],["Positive externality of consumption","An external benefit created when consuming a good, so MSB > MPB (e.g. vaccinations)."],["Merit good","A good that benefits the consumer and society, underconsumed in a free market because of positive externalities and imperfect information (e.g. education, healthcare, vaccines)."]],"topic":"t2-8","html":"<div class=\"dslot\" data-d=\"ext-pos-prod\"><\/div>\n<p><strong>Examples<\/strong>: a firm's training of workers who later move to other firms; R&amp;D that other firms can build on; a beekeeper's bees pollinating nearby orchards; a company restoring a historic building that improves the area.<\/p>\n<div class=\"dslot\" data-d=\"ext-pos-cons\"><\/div>\n<p><strong>Examples<\/strong>: vaccinations (herd immunity), education (a more productive workforce, lower crime, better-informed voters), healthcare, using public transport instead of cars, installing solar panels.<\/p>\n<h4>Merit goods<\/h4>\n<p>Underconsumed because the market ignores external benefits, consumers underestimate private benefits (they may not see the long-term returns to education), and low-income households cannot afford them. Responses: subsidies, direct provision (free state schools and healthcare), legislation (compulsory schooling, vaccination requirements), information campaigns and nudges.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Two supply curves → the externality is on the <strong>production<\/strong> side. Two demand curves → it is on the <strong>consumption<\/strong> side. Draw the right pair and label MSC/MPC or MSB/MPB exactly.<\/p><\/div>","text":"Examples : a firm's training of workers who later move to other firms; R&D that other firms can build on; a beekeeper's bees pollinating nearby orchards; a company restoring a historic building that improves the area. Examples : vaccinations (herd immunity), education (a more productive workforce, lower crime, better-informed voters), healthcare, using public transport instead of cars, installing solar panels. Merit goods Underconsumed because the market ignores external benefits, consumers underestimate private benefits (they may not see the long-term returns to education), and low-income households cannot afford them. Responses: subsidies, direct provision (free state schools and healthcare), legislation (compulsory schooling, vaccination requirements), information campaigns and nudges. Exam tip Two supply curves → the externality is on the production side. Two demand curves → it is on the consumption side. Draw the right pair and label MSC/MPC or MSB/MPB exactly.","dias":["ext-pos-prod","ext-pos-cons"]},{"id":"e-externality-policy","title":"Policies to correct externalities","hl":false,"terms":[["Pigouvian tax","A tax set equal to the marginal external cost, to internalise a negative externality and bring output to the social optimum."],["Carbon tax","A tax on the carbon content of fossil fuels, to make polluters pay for the external cost of CO₂ emissions."],["Internalising an externality","Making the producer or consumer pay for (or receive) the external cost (or benefit), so that it enters their decision."]],"topic":"t2-8","html":"<h4>Market-based policies<\/h4>\n<div class=\"dslot\" data-d=\"pigou-tax\"><\/div>\n<p><strong>Pigouvian and carbon taxes<\/strong> shift MPC up to MSC (or MPB down to MSB for consumption). Examples: Sweden's carbon tax (around US$120 per tonne, among the world's highest, since 1991) alongside continued GDP growth; the UK sugar levy on soft drinks (2018) which pushed firms to cut sugar content; congestion charges in London, Stockholm, Singapore and New York (2025).<\/p>\n<div class=\"dslot\" data-d=\"subsidy-merit\"><\/div>\n<p><strong>Subsidies<\/strong> for merit goods and positive externalities: free or subsidised vaccines, EV purchase grants, solar panel feed-in tariffs, R&amp;D tax credits.<\/
