<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Econ Lock-In</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('econ-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* Layout: a field notebook on graph paper. Sticky contents rail on the left, one topic per page on the right;
   curves in every diagram keep one colour code: demand-side blue, supply-side red, costs green, government amber, MR violet. */
:root{
  --paper:#EEF2F0; --sheet:#FBFCFB; --ink:#132027; --ink-2:#4A5A61; --rule:#D3DCD8; --rule-2:#E3E9E6; --grid:rgba(19,32,39,.045);
  --accent:#0E6B58; --accent-2:#0A5747; --accent-soft:#D9EDE6; --hl:#6A3D9A; --hl-soft:#EEE6F6; --mark:#B4492F; --mark-soft:#F6E3DC;
  --tip:#9A6A12; --tip-soft:#F7EEDA; --ok:#2A7A4A; --ok-soft:#DDEFE3; --bad:#B23A2A; --bad-soft:#F6DFDA; --hlt:#F1E39A; --hlt-ink:#132027;
  --c-d:#2456A6; --c-s:#C0432C; --c-c:#1F7A4D; --c-g:#B07316; --c-m:#7A45B3; --c-k:#1C2A31;
  --a-cs:rgba(36,86,166,.18); --a-ps:rgba(192,67,44,.17); --a-dwl:rgba(60,70,75,.26); --a-gov:rgba(176,115,22,.24); --a-prof:rgba(31,122,77,.22); --a-loss:rgba(192,67,44,.24);
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif; --font-body:"Literata",Georgia,"Times New Roman",serif; --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail:296px; --shadow-1:0 1px 2px rgba(19,32,39,.06),0 1px 1px rgba(19,32,39,.04); --shadow-2:0 12px 30px -10px rgba(19,32,39,.28),0 2px 6px rgba(19,32,39,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1416; --sheet:#141E21; --ink:#E1E8E5; --ink-2:#9DADAA; --rule:#27363A; --rule-2:#1D2A2D; --grid:rgba(225,232,229,.04);
  --accent:#5DC2A6; --accent-2:#7AD3BA; --accent-soft:#16332C; --hl:#C29BEB; --hl-soft:#2A2138; --mark:#EC8C72; --mark-soft:#3A2420;
  --tip:#E2B55A; --tip-soft:#332814; --ok:#79CB96; --ok-soft:#163222; --bad:#F08A78; --bad-soft:#3B201C; --hlt:#5C4E16; --hlt-ink:#F5EDCF;
  --c-d:#7EA8EC; --c-s:#F08C73; --c-c:#64C48F; --c-g:#E3B45C; --c-m:#BB95EC; --c-k:#DCE4E1;
  --a-cs:rgba(126,168,236,.22); --a-ps:rgba(240,140,115,.2); --a-dwl:rgba(200,210,214,.24); --a-gov:rgba(227,180,92,.22); --a-prof:rgba(100,196,143,.22); --a-loss:rgba(240,140,115,.26);
  --shadow-1:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 14px 34px -10px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1416; --sheet:#141E21; --ink:#E1E8E5; --ink-2:#9DADAA; --rule:#27363A; --rule-2:#1D2A2D; --grid:rgba(225,232,229,.04);
  --accent:#5DC2A6; --accent-2:#7AD3BA; --accent-soft:#16332C; --hl:#C29BEB; --hl-soft:#2A2138; --mark:#EC8C72; --mark-soft:#3A2420;
  --tip:#E2B55A; --tip-soft:#332814; --ok:#79CB96; --ok-soft:#163222; --bad:#F08A78; --bad-soft:#3B201C; --hlt:#5C4E16; --hlt-ink:#F5EDCF;
  --c-d:#7EA8EC; --c-s:#F08C73; --c-c:#64C48F; --c-g:#E3B45C; --c-m:#BB95EC; --c-k:#DCE4E1;
  --a-cs:rgba(126,168,236,.22); --a-ps:rgba(240,140,115,.2); --a-dwl:rgba(200,210,214,.24); --a-gov:rgba(227,180,92,.22); --a-prof:rgba(100,196,143,.22); --a-loss:rgba(240,140,115,.26);
  --shadow-1:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 14px 34px -10px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
strong{font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4,h5{font-family:var(--font-display);font-stretch:88%;text-wrap:balance;line-height:1.15;margin:0}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:100dvh;overflow:auto;border-right:1px solid var(--rule);
  background:var(--paper);padding-block:20px 28px;padding-inline:18px;display:flex;flex-direction:column;gap:16px;z-index:30}
.rail>*{flex-shrink:0}
.brand{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--font-display);font-weight:800;font-stretch:75%;font-size:30px;letter-spacing:.01em;text-transform:uppercase;line-height:.95}
.brand span{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.search{position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:15px var(--font-body)}
.search input::placeholder{color:var(--ink-2)}
.results{display:flex;flex-direction:column;gap:2px;margin-top:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:4px}
.results a{display:block;padding:6px 8px;border-radius:5px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.35}
.results a:hover,.results a:focus-visible,.results a.on{background:var(--accent-soft)}
.results small{display:block;font-family:var(--font-mono);font-size:10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.results .none{font-size:14px;color:var(--ink-2);padding:6px 8px}
.results a.all{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border-top:1px solid var(--rule);border-radius:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 4px 8px}
.nav a{display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.3}
.nav a:hover{background:var(--rule-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav a .num{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);min-width:26px}
.nav a .n{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.nav .sub{display:flex;flex-direction:column;margin:2px 0 6px 18px;border-left:1px solid var(--rule);padding-left:6px}
.nav .sub a{font-size:14px;padding:4px 8px}
.nav .sub a .num{min-width:30px}
.nav .sub .toc a{font-size:13px;color:var(--ink-2);padding:3px 8px 3px 14px}
.nav .sub .toc a.cur{color:var(--accent);font-weight:600}
.pbar{height:3px;border-radius:2px;background:var(--rule);overflow:hidden;margin:2px 8px 0 42px}
.pbar i{display:block;height:100%;background:var(--accent)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--rule)}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{flex:1;border:0;background:none;padding:6px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}
.sync{font-size:12px;color:var(--ink-2);margin:0;font-family:var(--font-mono);letter-spacing:.02em}
.topbar{display:none}

/* ---------- main ---------- */
main{min-width:0;outline:none}
.view{max-width:860px;margin:0 auto;padding-block:36px 120px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow a{color:inherit;text-decoration:none}.eyebrow a:hover{color:var(--accent)}
.phead{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.phead h1{font-size:clamp(34px,5.4vw,52px);font-weight:800;font-stretch:78%;letter-spacing:-.005em}
.phead h1 .tn{color:var(--accent);margin-right:.25em;font-stretch:75%}
.lede{font-size:18.5px;color:var(--ink-2);margin:0;max-width:62ch}
.badge{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--rule);color:var(--ink-2);background:var(--sheet);vertical-align:middle;white-space:nowrap}
.badge.hl{border-color:var(--hl);color:var(--hl);background:var(--hl-soft)}
.badge.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sec-h{font-size:14px;font-family:var(--font-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:34px 0 12px;font-stretch:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{font-size:14px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;line-height:1.3}
.chips a:hover{border-color:var(--accent);color:var(--accent)}
.chips a.done{border-color:var(--ok);background:var(--ok-soft)}

/* entries */
.entry{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:26px 30px 24px;margin-bottom:22px;box-shadow:var(--shadow-1)}
.entry>header{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 14px;margin-bottom:12px}
.entry>header h2{font-size:28px;font-weight:700;flex:1 1 320px}
.learnt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:none;border-radius:999px;padding:4px 12px 4px 8px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.learnt::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor}
.learnt[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.learnt[aria-pressed="true"]::before{background:var(--ok);box-shadow:inset 0 0 0 2px var(--ok-soft)}
.entry p{margin:0 0 12px;max-width:68ch}
.entry ul,.entry ol{margin:0 0 12px;padding-left:22px;max-width:68ch}
.entry li{margin:3px 0}
.entry li>ul,.entry li>ol{margin:3px 0}
.entry h4{font-size:19px;font-weight:700;margin:20px 0 8px;color:var(--ink)}
.terms{margin:0 0 16px;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.terms .th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:7px 14px;background:var(--accent-soft)}
.terms dl{margin:0}
.terms div.t{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:4px 16px;padding:8px 14px;border-top:1px solid var(--rule-2)}
.terms dt{font-family:var(--font-display);font-weight:700;font-stretch:90%;font-size:16px}
.terms dd{margin:0;font-size:15.5px}
.box{border-radius:8px;padding:12px 16px 4px;margin:0 0 14px;border:1px solid var(--rule);background:var(--paper)}
.box-h{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:6px;color:var(--ink-2)}
.box p,.box ul,.box ol{font-size:16px}
.box.hlbox{border-color:var(--hl);background:var(--hl-soft)}.box.hlbox>.box-h{color:var(--hl)}
.box.tip{border-color:var(--tip);background:var(--tip-soft)}.box.tip>.box-h{color:var(--tip)}
.box.ex{border-left:4px solid var(--c-d);background:var(--sheet)}.box.ex>.box-h{color:var(--c-d)}
.box.calc,.box.model,.box.plan{background:var(--sheet);border-style:dashed}.box.calc>.box-h{color:var(--accent)}
.box.warn{border-color:var(--mark);background:var(--mark-soft)}.box.warn>.box-h{color:var(--mark)}
.box.key{border-color:var(--accent);background:var(--accent-soft)}.box.key>.box-h{color:var(--accent)}
.box.formula{background:var(--sheet);padding-bottom:10px}
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding:6px 0;border-top:1px dashed var(--rule)}
.fx:first-of-type{border-top:0}
.fx-eq{font-family:var(--font-mono);font-size:15px;font-weight:500}
.fx-n{font-size:14.5px;color:var(--ink-2)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.92em}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 4px}
.fr>span:last-child{padding:0 4px}
.eval{background:var(--sheet)}
.evcols{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.evcols h5{font-size:15px;font-weight:700;margin:2px 0 4px}
.evcols>div:first-child h5{color:var(--ok)}.evcols>div:last-child h5{color:var(--mark)}
.evcols ul{padding-left:18px;margin-bottom:8px}
.evcols li{font-size:15.5px}
.evnote p{font-size:15.5px}
.tbl{overflow-x:auto;margin:0 0 14px;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{font-family:var(--font-display);font-stretch:90%;font-weight:700;background:var(--paper);font-size:15px}
tr:last-child td{border-bottom:0}
.xref{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.pnav a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;max-width:48%}
.pnav a small{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pnav a.nx{margin-left:auto;text-align:right}

/* diagrams */
figure.fig{margin:6px 0 16px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 14px 10px}
figure.fig .svgwrap{overflow-x:auto}
figure.fig .svgwrap svg{display:block;margin:0 auto;max-width:440px;width:100%;height:auto}
figure.fig.wide .svgwrap svg{max-width:720px;min-width:520px}
figure.fig figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-family:var(--font-display);font-stretch:90%;font-weight:700;font-size:16px;margin-top:8px}
figure.fig figcaption a{font-family:var(--font-mono);font-weight:400;font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-left:auto}
figure.fig details{margin-top:6px;border-top:1px dashed var(--rule);padding-top:6px}
figure.fig summary{cursor:pointer;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
figure.fig details ol{font-size:15px;margin:8px 0}
figure.fig .watch{font-size:15px;color:var(--mark);margin:6px 0}
svg.dg{font-family:var(--font-display);font-stretch:92%}
.dg-ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dg-d{stroke:var(--c-d)}.dg-s{stroke:var(--c-s)}.dg-k{stroke:var(--c-k)}.dg-c{stroke:var(--c-c)}.dg-g{stroke:var(--c-g)}.dg-m{stroke:var(--c-m)}
.dg-td{fill:var(--c-d)}.dg-ts{fill:var(--c-s)}.dg-tk{fill:var(--c-k)}.dg-tc{fill:var(--c-c)}.dg-tg{fill:var(--c-g)}.dg-tm{fill:var(--c-m)}
.dg-lab{font-size:13.5px;font-weight:700}
.dg-tick,.dg-note,.dg-alab,.dg-axlab{font-size:12.5px;fill:var(--ink-2)}
.dg-alab{fill:var(--ink);font-weight:600}
.dg-axlab{fill:var(--ink);font-weight:600}
.dg-ptitle{font-size:14px;font-weight:700;fill:var(--ink)}
.dg-axis{stroke:var(--c-k);fill:none;stroke-width:1.5}
.dg-drop{stroke:var(--ink-2);stroke-dasharray:4 4;fill:none;stroke-width:1;opacity:.8}
.dg-dot{fill:var(--c-k)}
.dg-a{stroke:none}.dg-acs{fill:var(--a-cs)}.dg-aps{fill:var(--a-ps)}.dg-adwl{fill:var(--a-dwl)}.dg-agov{fill:var(--a-gov)}.dg-aprof{fill:var(--a-prof)}.dg-aloss{fill:var(--a-loss)}
.dg-arr{fill:none;stroke-width:1.7;stroke-linecap:round}
.dg-brace{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.fl-box{fill:var(--paper);stroke:var(--c-k);stroke-width:1.4}.fl-box.fl-d{stroke:var(--c-d)}.fl-box.fl-s{stroke:var(--c-s)}
.fl-t{font-size:14.5px;font-weight:700;fill:var(--ink)}
.fl-arr{fill:none;stroke:var(--c-k);stroke-width:1.6}.fl-arr.fl-d{stroke:var(--c-d)}.fl-arr.fl-s{stroke:var(--c-s)}.fl-arr.fl-g{stroke:var(--c-g)}.fl-arr.fl-c{stroke:var(--c-c)}
.fl-n{font-size:12.5px;fill:var(--ink-2)}.fl-td{fill:var(--c-d)}.fl-ts{fill:var(--c-s)}.fl-tg{fill:var(--c-g)}.fl-tc{fill:var(--c-c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);margin:-8px 0 20px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dcard{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 12px;text-decoration:none;color:var(--ink);min-width:0}
.dcard:hover{border-color:var(--accent);box-shadow:var(--shadow-1)}
.dcard .th{height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dcard .th svg{max-height:150px;width:100%;height:auto}
.dcard b{font-family:var(--font-display);font-stretch:90%;font-size:15.5px;line-height:1.25}
.dcard small{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.ddetail{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:22px 26px}
.ddetail .svgwrap{overflow-x:auto}.ddetail svg{display:block;margin:0 auto 10px;width:100%;max-width:560px;height:auto}
.ddetail.wide svg{max-width:780px;min-width:540px}
.ddetail h2{font-size:21px;margin:18px 0 8px}
.ddetail ol{padding-left:22px}

/* home and hubs */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px;align-items:center;margin-bottom:10px}
.hero h1{font-size:clamp(44px,7vw,78px);font-weight:800;font-stretch:68%;line-height:.92;text-transform:uppercase;letter-spacing:-.005em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .art{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px;box-shadow:var(--shadow-1)}
.hero .art svg{width:100%;height:auto;display:block}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--font-mono);font-size:12px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.stats b{color:var(--ink);font-weight:500;font-size:15px;margin-right:4px}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ucard{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;text-decoration:none;color:var(--ink);min-width:0;position:relative}
.ucard:hover{border-color:var(--accent);box-shadow:var(--shadow-2)}
.ucard .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ucard h3{font-size:24px;font-weight:800;font-stretch:80%}
.ucard p{margin:0;font-size:15px;color:var(--ink-2)}
.ucard .meter{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-2);margin-top:auto}
.ucard .meter .pbar{flex:1;margin:0}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.resume{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;text-decoration:none;color:var(--ink);margin-top:6px;max-width:520px}
.resume small{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:4px 16px;align-items:start;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.trow:hover{border-color:var(--accent)}
.trow .tn{font-family:var(--font-display);font-weight:800;font-stretch:75%;font-size:28px;color:var(--accent);line-height:1}
.trow h3{font-size:20px;font-weight:700}
.trow p{grid-column:2;margin:2px 0 0;font-size:14.5px;color:var(--ink-2)}
.trow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.trow .side .pbar{width:70px;margin:0}

/* glossary */
.gtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.gtools input{flex:1 1 220px;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:15px var(--font-body)}
.letters{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:14px}
.letters a{font-family:var(--font-mono);font-size:12px;text-decoration:none;padding:3px 7px;border-radius:4px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule)}
.gl{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.gl h3{font-size:15px;font-family:var(--font-mono);font-weight:500;color:var(--accent);padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.gi{display:grid;grid-template-columns:minmax(130px,220px) minmax(0,1fr);gap:4px 18px;padding:10px 16px;border-bottom:1px solid var(--rule-2)}
.gi dt{font-family:var(--font-display);font-weight:700;font-stretch:90%;font-size:16.5px}
.gi dd{margin:0;font-size:15.5px}
.gi dd .src{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.gi dd .src a{color:var(--ink-2)}
.gi.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--hlt)}100%{background:transparent}}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* practice */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--sheet);border-radius:6px;padding:8px 16px;font-family:var(--font-display);font-stretch:90%;font-weight:700;font-size:15.5px;cursor:pointer}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.45;cursor:default}
.pcard{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:24px 26px;box-shadow:var(--shadow-1)}
.flash-card{min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;cursor:pointer;user-select:none}
.flash-card .ft{font-family:var(--font-display);font-weight:800;font-stretch:80%;font-size:clamp(28px,4.6vw,40px);line-height:1.1}
.flash-card .fd{font-size:18px;max-width:58ch;margin:0 auto}
.flash-card .fh{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.prow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.prow .sp{flex:1}
.boxes{display:flex;gap:4px;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.boxes span{padding:3px 8px;border-radius:4px;background:var(--paper);border:1px solid var(--rule)}
.qopts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.qopts button{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:10px 14px;cursor:pointer;font-size:16px;line-height:1.4;color:var(--ink)}
.qopts button:hover:not([disabled]){border-color:var(--accent)}
.qopts button.right{border-color:var(--ok);background:var(--ok-soft)}
.qopts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopts button[disabled]{cursor:default}
.qq{font-size:19px;font-weight:600;line-height:1.45}
.qx{margin-top:14px;font-size:16px;border-top:1px dashed var(--rule);padding-top:12px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.calc-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.calc-in input{width:180px;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:16px var(--font-mono)}
.verdict{font-family:var(--font-display);font-weight:700;font-size:18px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.work{margin-top:12px;background:var(--paper);border:1px dashed var(--rule);border-radius:8px;padding:12px 16px;font-size:15.5px}
.work p{margin:0 0 6px}
.work code,.mono{font-family:var(--font-mono);font-size:14.5px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.score{font-family:var(--font-display);font-weight:800;font-stretch:75%;font-size:64px;line-height:1;color:var(--accent)}
.essay{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 20px;margin-bottom:12px}
.essay .eq{font-size:17.5px;font-weight:600}
.essay details{margin-top:8px}
.essay summary{cursor:pointer;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.essay .plan{margin-top:10px}
.essay .plan p,.essay .plan li{font-size:15.5px}
.timer{font-family:var(--font-mono);font-size:22px;font-variant-numeric:tabular-nums}

/* missing */
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:8px 16px;font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;box-shadow:var(--shadow-2);cursor:pointer}
.mcount:not(:empty){display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--mark);color:var(--sheet);font-size:11px;text-align:center}
.mpanel{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);z-index:41;width:min(380px,calc(100vw - 36px));background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:10px}
.mpanel h2{font-size:20px}
.mctx{margin:0;font-size:14px;color:var(--ink-2)}
.kinds{display:flex;flex-wrap:wrap;gap:5px}
.kinds button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.kinds button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.mpanel textarea{width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:15px var(--font-body);padding:8px 10px;resize:vertical}
.mstat{margin:0;font-size:12.5px;color:var(--ink-2);font-family:var(--font-mono)}
.mstat.err{color:var(--bad)}
.mrow{display:flex;align-items:center;gap:8px}.mrow .sp{flex:1}.mrow a{font-size:14px}
.note{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.note p{margin:0}
.note small{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.note.done p{text-decoration:line-through;color:var(--ink-2)}
.note .acts{display:flex;gap:6px}
.note .acts button{border:1px solid var(--rule);background:none;border-radius:5px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:50;background:var(--ink);color:var(--sheet);padding:8px 16px;border-radius:6px;font-size:14px;box-shadow:var(--shadow-2)}
mark{background:var(--hlt);color:var(--hlt-ink);border-radius:2px;padding:0 1px}
.sres{display:block;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.sres:hover{border-color:var(--accent)}
.sres small{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.sres p{margin:2px 0 0;font-size:14.5px;color:var(--ink-2)}
.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:10px;padding:22px;color:var(--ink-2)}

/* SL view hides HL-only material */
body.sl .box.hlbox, body.sl .entry.hlonly, body.sl .chips a.hlonly, body.sl .dcard.hlonly, body.sl .hl-only{display:none!important}
.entry.flashme{animation:flash 1.6s ease}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:35;background:var(--paper);border-bottom:1px solid var(--rule);
    padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:36;background:var(--paper)}
  .tb-brand{font-family:var(--font-display);font-weight:800;font-stretch:75%;font-size:22px;text-transform:uppercase;text-decoration:none;color:var(--ink);flex:1}
  .iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow-2);
    padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-left:max(18px,env(safe-area-inset-left,0px));height:auto}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:29}
  .view{padding-block:22px 110px}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .entry{padding:18px 16px 16px;border-radius:8px}
  .entry>header h2{font-size:24px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hub,.tools{grid-template-columns:minmax(0,1fr)}
  .evcols{grid-template-columns:minmax(0,1fr)}
  .terms div.t,.gi{grid-template-columns:minmax(0,1fr)}
  .trow{grid-template-columns:44px minmax(0,1fr)}
  .trow .side{display:none}
  .trow .tn{font-size:22px}
  .pnav a{max-width:100%}
  .pnav{flex-direction:column}
  .pcard{padding:18px 16px}
  figure.fig.wide .svgwrap svg{min-width:480px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script id="data" type="application/json">{"units":[{"id":"u1","title":"Introduction to economics","blurb":"Scarcity, choice, models and the history of economic ideas: the toolkit every other unit uses.","topics":[{"id":"t1-1","num":"1.1","title":"What is economics?","level":"SL","blurb":"Economics as a social science, scarcity and choice, the PPC and the circular flow of income.","entries":[{"id":"e-social-science","title":"Economics as a social science","hl":false,"terms":[["Economics","The study of how individuals, firms and societies allocate scarce resources to satisfy unlimited needs and wants."],["Social science","A discipline that studies human behaviour in society; because people are unpredictable, its findings are less certain than those of the natural sciences."],["Microeconomics","The study of individual decision-makers (consumers, firms, workers) and of individual markets."],["Macroeconomics","The study of the economy as a whole: total output, the average price level, unemployment, growth and the role of government policy."],["Economic model","A simplified representation of reality, built on assumptions, used to explain and predict economic behaviour."]],"topic":"t1-1","html":"<p>Economics is a <strong>social science<\/strong>: it studies people and how they interact, which makes it messier than physics or chemistry. People change their minds, react to news and copy each other, and it is impossible to run controlled experiments on a whole country. Economists therefore rely on <strong>models<\/strong>, simplified pictures of reality that keep a few variables and hold everything else constant.<\/p>\n<h4>Micro vs macro<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Microeconomics<\/th><th>Macroeconomics<\/th><\/tr><\/thead><tbody><tr><td>One market, e.g. coffee or rental housing<\/td><td>The whole economy, e.g. Singapore<\/td><\/tr><tr><td>The price of a single good<\/td><td>The average price level (inflation, deflation)<\/td><\/tr><tr><td>Demand by consumers of one good<\/td><td>Aggregate demand: total spending in the economy<\/td><\/tr><tr><td>Supply by firms in an industry<\/td><td>Aggregate supply: total output<\/td><\/tr><tr><td>A tax on cigarettes<\/td><td>Income tax rates, interest rates, the budget<\/td><\/tr><tr><td>Why wages differ between jobs<\/td><td>Unemployment across the economy<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Thinking like an economist<\/h4>\n<ul><li>Choose which variables matter, and which can be ignored for now.<\/li><li>Distinguish <strong>correlation<\/strong> from <strong>causation<\/strong>: ice-cream sales and car thefts both rise in summer, but one does not cause the other.<\/li><li>Two economists can study the same data and reach different conclusions because they focus on different variables or hold different value judgements. That is a normal feature of a social science, not a failure.<\/li><\/ul>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>In any Paper 1 (b) or Paper 2 (g) answer, questioning a model's <strong>assumptions<\/strong> (rational consumers, perfect information, ceteris paribus) is one of the quickest routes into evaluation.<\/p><\/div>","text":"Economics is a social science : it studies people and how they interact, which makes it messier than physics or chemistry. People change their minds, react to news and copy each other, and it is impossible to run controlled experiments on a whole country. Economists therefore rely on models , simplified pictures of reality that keep a few variables and hold everything else constant. Micro vs macro Microeconomics Macroeconomics One market, e.g. coffee or rental housing The whole economy, e.g. Singapore The price of a single good The average price level (inflation, deflation) Demand by consumers of one good Aggregate demand: total spending in the economy Supply by firms in an industry Aggregate supply: total output A tax on cigarettes Income tax rates, interest rates, the budget Why wages differ between jobs Unemployment across the economy Thinking like an economist Choose which variables matter, and which can be ignored for now. Distinguish correlation from causation : ice-cream sales and car thefts both rise in summer, but one does not cause the other. Two economists can study the same data and reach different conclusions because they focus on different variables or hold different value judgements. That is a normal feature of a social science, not a failure. Exam tip In any Paper 1 (b) or Paper 2 (g) answer, questioning a model's assumptions (rational consumers, perfect information, ceteris paribus) is one of the quickest routes into evaluation.","dias":[]},{"id":"e-scarcity","title":"Scarcity, choice and opportunity cost","hl":false,"terms":[["Scarcity","The basic economic problem: resources are finite but human needs and wants are unlimited, so choices must be made."],["Factors of production","The resources used to produce goods and services: land, labour, capital and entrepreneurship."],["Land","All natural resources used in production, including minerals, forests, water and the land itself; its reward is rent."],["Labour","The physical and mental effort of people in production; its reward is wages."],["Capital","Man-made resources used to produce other goods and services, such as machines, tools, buildings and infrastructure; its reward is interest."],["Entrepreneurship","The organising and risk-taking factor that combines the other factors to produce goods and services; its reward is profit."],["Opportunity cost","The value of the next best alternative given up when a choice is made."],["Free good","A good that is not scarce, so it has no opportunity cost (e.g. air, sunlight)."],["Economic good","A good that is scarce, so producing or consuming it has an opportunity cost."],["Needs","Things essential for survival, such as food, water, shelter and clothing."],["Wants","Things people desire beyond their basic needs; they are unlimited."]],"topic":"t1-1","html":"<p><strong>Scarcity<\/strong> is why economics exists. Because resources (the <strong>factors of production<\/strong>) are limited while wants are not, every decision to use resources one way means not using them another way. That sacrifice is the <strong>opportunity cost<\/strong>.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Factor<\/th><th>What it is<\/th><th>Factor income<\/th><\/tr><\/thead><tbody><tr><td>Land<\/td><td>Natural resources: oil, timber, fish stocks, farmland<\/td><td>Rent<\/td><\/tr><tr><td>Labour<\/td><td>Human effort, skilled and unskilled<\/td><td>Wages<\/td><\/tr><tr><td>Capital<\/td><td>Man-made aids to production: machines, factories, roads, computers<\/td><td>Interest<\/td><\/tr><tr><td>Entrepreneurship<\/td><td>Organising the other factors and bearing risk<\/td><td>Profit<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Human capital<\/strong> is the skills, knowledge and health of workers; investment in education and health raises it. <strong>Physical capital<\/strong> is machinery and infrastructure.<\/p>\n<h4>Opportunity cost in practice<\/h4>\n<ul><li>A student who spends Saturday working a $90 shift gives up revising for the economics test. If revising was the next best option, the opportunity cost is the lost revision, not the $90.<\/li><li>A government that spends $2bn on a new airport cannot spend that $2bn on hospitals.<\/li><li>Opportunity cost is not just money: it includes time, effort and alternative uses of resources.<\/li><\/ul>\n<h4>Free goods and economic goods<\/h4>\n<p>Free goods have zero opportunity cost (air, sunlight, seawater). Most goods are economic goods. Goods can change category: clean drinking water was once free in many places but has become an economic good as populations grew and rivers were polluted.<\/p>\n<div class=\"box warn\"><div class=\"box-h\">Common mistakes<\/div><ul><li>Writing \"opportunity cost is the cost of the product\". It is the <strong>next best alternative forgone<\/strong>, one option only, not all options.<\/li><li>Treating money as a factor of production. Money is a means of buying factors; capital means physical capital.<\/li><\/ul><\/div>","text":"Scarcity is why economics exists. Because resources (the factors of production ) are limited while wants are not, every decision to use resources one way means not using them another way. That sacrifice is the opportunity cost . Factor What it is Factor income Land Natural resources: oil, timber, fish stocks, farmland Rent Labour Human effort, skilled and unskilled Wages Capital Man-made aids to production: machines, factories, roads, computers Interest Entrepreneurship Organising the other factors and bearing risk Profit Human capital is the skills, knowledge and health of workers; investment in education and health raises it. Physical capital is machinery and infrastructure. Opportunity cost in practice A student who spends Saturday working a $90 shift gives up revising for the economics test. If revising was the next best option, the opportunity cost is the lost revision, not the $90. A government that spends $2bn on a new airport cannot spend that $2bn on hospitals. Opportunity cost is not just money: it includes time, effort and alternative uses of resources. Free goods and economic goods Free goods have zero opportunity cost (air, sunlight, seawater). Most goods are economic goods. Goods can change category: clean drinking water was once free in many places but has become an economic good as populations grew and rivers were polluted. Common mistakes Writing \"opportunity cost is the cost of the product\". It is the next best alternative forgone , one option only, not all options. Treating money as a factor of production. Money is a means of buying factors; capital means physical capital.","dias":[]},{"id":"e-econ-questions","title":"The basic economic questions and economic systems","hl":false,"terms":[["Free market economy","An economy in which resources are privately owned and allocated by the price mechanism, with minimal government intervention."],["Planned economy","An economy in which the government owns most resources and decides what, how and for whom to produce (also called a command economy)."],["Mixed economy","An economy in which both the market and the government allocate resources; all modern economies are mixed."],["Price mechanism","The system in which changes in prices, determined by demand and supply, signal and ration resources and give incentives to buyers and sellers."]],"topic":"t1-1","html":"<p>Every society must answer three questions:<\/p>\n<ol><li><strong>What to produce?<\/strong> Which goods and services, and in what quantities?<\/li><li><strong>How to produce?<\/strong> Which methods: labour-intensive or capital-intensive? Which technology?<\/li><li><strong>For whom to produce?<\/strong> How is output distributed among people?<\/li><\/ol>\n<div class=\"tbl\"><table><thead><tr><th>System<\/th><th>What?<\/th><th>How?<\/th><th>For whom?<\/th><th>Examples<\/th><\/tr><\/thead><tbody><tr><td>Free market<\/td><td>Consumer demand via prices<\/td><td>The most profitable (least cost) method<\/td><td>Those willing and able to pay<\/td><td>Hong Kong comes closest<\/td><\/tr><tr><td>Planned (command)<\/td><td>Government plan<\/td><td>Government directives, often to maximise jobs<\/td><td>Government decides; often more equal<\/td><td>Former USSR, North Korea, Cuba<\/td><\/tr><tr><td>Mixed<\/td><td>Markets plus government<\/td><td>Mainly firms, with regulation<\/td><td>Market income plus welfare state, public services<\/td><td>Almost every country today: USA, UK, France, China, India<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Free markets<\/h5><ul><li>Price signals allocate resources efficiently and quickly.<\/li><li>Profit motive drives innovation and choice.<\/li><li>No large bureaucracy needed to coordinate.<\/li><\/ul><\/div><div><h5>Planned systems<\/h5><ul><li>Planned: shortages and surpluses because planners lack information.<\/li><li>Planned: weak incentives to work hard or innovate.<\/li><li>Planned: can guarantee basic needs and reduce inequality.<\/li><\/ul><\/div><\/div><div class=\"evnote\"><p>Free markets also fail: they ignore externalities, underprovide public and merit goods, and can create large inequality. That is the case for a <strong>mixed economy<\/strong>, and the subject of most of <a class=\"xref\" href=\"#t2-8\">Unit 2's market failure topics<\/a>.<\/p><\/div><\/div>","text":"Every society must answer three questions: What to produce? Which goods and services, and in what quantities? How to produce? Which methods: labour-intensive or capital-intensive? Which technology? For whom to produce? How is output distributed among people? System What? How? For whom? Examples Free market Consumer demand via prices The most profitable (least cost) method Those willing and able to pay Hong Kong comes closest Planned (command) Government plan Government directives, often to maximise jobs Government decides; often more equal Former USSR, North Korea, Cuba Mixed Markets plus government Mainly firms, with regulation Market income plus welfare state, public services Almost every country today: USA, UK, France, China, India Evaluation Free markets Price signals allocate resources efficiently and quickly. Profit motive drives innovation and choice. No large bureaucracy needed to coordinate. Planned systems Planned: shortages and surpluses because planners lack information. Planned: weak incentives to work hard or innovate. Planned: can guarantee basic needs and reduce inequality. Free markets also fail: they ignore externalities, underprovide public and merit goods, and can create large inequality. That is the case for a mixed economy , and the subject of most of Unit 2's market failure topics .","dias":[]},{"id":"e-ppc","title":"The production possibilities curve (PPC)","hl":false,"terms":[["Production possibilities curve (PPC)","A curve showing the maximum combinations of two goods an economy can produce when all its resources are fully and efficiently employed, with given technology."],["Productive efficiency","Producing at the lowest possible cost, i.e. on the PPC (in micro: at the minimum of average total cost)."],["Allocative efficiency","Producing the combination of goods society values most, where marginal social benefit equals marginal social cost."],["Actual growth","An increase in real output, shown by a movement from inside the PPC towards it."],["Potential growth","An increase in an economy's productive capacity, shown by an outward shift of the PPC."],["Capital goods","Goods used to produce other goods, such as machinery and buildings."],["Consumer goods","Goods bought by households for final consumption."]],"topic":"t1-1","html":"<p>The PPC is the first model in the course and illustrates <strong>scarcity, choice, opportunity cost, efficiency, unemployment and growth<\/strong> all at once.<\/p>\n<div class=\"dslot\" data-d=\"ppc\"><\/div>\n<h4>What the PPC shows<\/h4>\n<ul><li><strong>Scarcity<\/strong>: points outside the curve are unattainable with current resources and technology.<\/li><li><strong>Choice<\/strong>: society must pick one point on or inside the curve.<\/li><li><strong>Opportunity cost<\/strong>: moving along the curve means giving up some of one good to get more of the other.<\/li><li><strong>Efficiency<\/strong>: points on the curve are productively efficient; points inside involve <strong>unemployment or inefficient use of resources<\/strong>.<\/li><\/ul>\n<h4>Shape: increasing vs constant opportunity cost<\/h4>\n<p>A <strong>concave (bowed-out)<\/strong> PPC shows increasing opportunity cost: resources are not equally good at producing both goods, so as more of one is made, ever more of the other must be given up. A <strong>straight-line<\/strong> PPC shows constant opportunity cost, where resources are perfectly transferable (e.g. a farm switching between two similar crops).<\/p>\n<h4>Shifts of the PPC<\/h4>\n<div class=\"dslot\" data-d=\"ppc-growth\"><\/div>\n<ul><li><strong>Outward shift (potential growth)<\/strong>: more or better factors of production (immigration, investment in capital, education and training, discovery of resources) or better technology.<\/li><li><strong>Inward shift<\/strong>: natural disasters (Japan's 2011 earthquake and tsunami), war (Ukraine since 2022), large-scale emigration, depletion of resources.<\/li><li><strong>Biased shift<\/strong>: technology improves in one industry only, so the curve pivots out on that good's axis.<\/li><\/ul>\n<h4>Capital goods vs consumer goods<\/h4>\n<div class=\"dslot\" data-d=\"ppc-cap-cons\"><\/div>\n<p>An economy choosing more capital goods today (and fewer consumer goods) will have a larger PPC tomorrow. This is a key idea for growth and development: poor countries struggle to sacrifice current consumption to invest.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Label PPC axes with two named goods (or capital and consumer goods), <strong>never<\/strong> price and quantity. In Paper 1 (a) questions on scarcity or opportunity cost, the PPC is often the expected diagram.<\/p><\/div>","text":"The PPC is the first model in the course and illustrates scarcity, choice, opportunity cost, efficiency, unemployment and growth all at once. What the PPC shows Scarcity : points outside the curve are unattainable with current resources and technology. Choice : society must pick one point on or inside the curve. Opportunity cost : moving along the curve means giving up some of one good to get more of the other. Efficiency : points on the curve are productively efficient; points inside involve unemployment or inefficient use of resources . Shape: increasing vs constant opportunity cost A concave (bowed-out) PPC shows increasing opportunity cost: resources are not equally good at producing both goods, so as more of one is made, ever more of the other must be given up. A straight-line PPC shows constant opportunity cost, where resources are perfectly transferable (e.g. a farm switching between two similar crops). Shifts of the PPC Outward shift (potential growth) : more or better factors of production (immigration, investment in capital, education and training, discovery of resources) or better technology. Inward shift : natural disasters (Japan's 2011 earthquake and tsunami), war (Ukraine since 2022), large-scale emigration, depletion of resources. Biased shift : technology improves in one industry only, so the curve pivots out on that good's axis. Capital goods vs consumer goods An economy choosing more capital goods today (and fewer consumer goods) will have a larger PPC tomorrow. This is a key idea for growth and development: poor countries struggle to sacrifice current consumption to invest. Exam tip Label PPC axes with two named goods (or capital and consumer goods), never price and quantity. In Paper 1 (a) questions on scarcity or opportunity cost, the PPC is often the expected diagram.","dias":["ppc","ppc-growth","ppc-cap-cons"]},{"id":"e-circular-flow-intro","title":"The circular flow of income model","hl":false,"terms":[["Circular flow of income","A model showing how money flows between households and firms (and government, financial sector and the rest of the world) in exchange for factors and goods."],["Injections","Additions to the circular flow from outside the household-firm loop: investment (I), government spending (G) and exports (X)."],["Leakages","Withdrawals from the circular flow: saving (S), taxes (T) and import spending (M)."]],"topic":"t1-1","html":"<p>The simplest model has two sectors: <strong>households<\/strong> sell factors of production to <strong>firms<\/strong> and receive incomes; households spend those incomes on firms' goods and services. Money flows one way, real goods and factors the other.<\/p>\n<div class=\"dslot\" data-d=\"circular-flow\"><\/div>\n<ul><li><strong>Leakages (withdrawals)<\/strong>: saving (S), taxes (T), imports (M) take money out of the flow.<\/li><li><strong>Injections<\/strong>: investment (I), government spending (G), exports (X) add money.<\/li><li>If <strong>injections &gt; leakages<\/strong> the economy expands; if <strong>leakages &gt; injections<\/strong> it contracts. Equilibrium: I + G + X = S + T + M.<\/li><li>The model shows <strong>interdependence<\/strong>: households, firms, the government, banks and other countries all depend on each other's spending.<\/li><\/ul>\n<p>The full analysis, including the three ways of measuring national income, is in <a class=\"xref\" href=\"#e-measuring-output\">3.1 Measuring economic activity<\/a>.<\/p>","text":"The simplest model has two sectors: households sell factors of production to firms and receive incomes; households spend those incomes on firms' goods and services. Money flows one way, real goods and factors the other. Leakages (withdrawals) : saving (S), taxes (T), imports (M) take money out of the flow. Injections : investment (I), government spending (G), exports (X) add money. If injections > leakages the economy expands; if leakages > injections it contracts. Equilibrium: I + G + X = S + T + M. The model shows interdependence : households, firms, the government, banks and other countries all depend on each other's spending. The full analysis, including the three ways of measuring national income, is in 3.1 Measuring economic activity .","dias":["circular-flow"]},{"id":"e-key-concepts","title":"The nine key concepts","hl":false,"terms":[["Sustainability","Meeting the needs of the present generation without compromising the ability of future generations to meet their own needs."],["Equity","Fairness in the distribution of income, wealth or opportunities; a normative concept, distinct from equality."],["Interdependence","The way economic agents and countries rely on each other through trade, finance and markets."],["Economic well-being","A multidimensional idea of prosperity and quality of life: financial security, meeting basic needs, the ability to make choices and to maintain an adequate income over time."],["Intervention","Government involvement in the workings of markets."]],"topic":"t1-1","html":"<p>The IB guide is built around nine concepts. Every Internal Assessment commentary must use a <strong>different<\/strong> key concept, and strong Paper 1 and 2 answers use them to frame evaluation.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Concept<\/th><th>What it means<\/th><th>Where it bites<\/th><\/tr><\/thead><tbody><tr><td>Scarcity<\/td><td>Limited resources vs unlimited wants<\/td><td>PPC, opportunity cost, common pool resources<\/td><\/tr><tr><td>Choice<\/td><td>Scarcity forces choices with opportunity costs<\/td><td>Consumer choice, government budgets<\/td><\/tr><tr><td>Efficiency<\/td><td>Getting the most useful output from inputs; allocative and productive efficiency<\/td><td>Market structures, market failure, trade<\/td><\/tr><tr><td>Equity<\/td><td>Fairness; differs from equality<\/td><td>Taxes, price controls, poverty, development<\/td><\/tr><tr><td>Economic well-being<\/td><td>Living standards and quality of life, now and in future<\/td><td>GDP vs well-being, HDI, development<\/td><\/tr><tr><td>Sustainability<\/td><td>Meeting today's needs without harming future generations<\/td><td>Externalities, SDGs, climate policy<\/td><\/tr><tr><td>Change<\/td><td>Economies are always changing; economics studies change<\/td><td>Shifts in curves, growth, structural change<\/td><\/tr><tr><td>Interdependence<\/td><td>Agents and countries rely on one another<\/td><td>Circular flow, trade, exchange rates, globalisation<\/td><\/tr><tr><td>Intervention<\/td><td>Government involvement in markets<\/td><td>Taxes, subsidies, regulation, policy debates<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>When you mention a concept in an essay, use it: \"the tax raises <strong>efficiency<\/strong> by internalising the externality, but harms <strong>equity<\/strong> because it is regressive\" is evaluation; just naming \"equity\" is not.<\/p><\/div>","text":"The IB guide is built around nine concepts. Every Internal Assessment commentary must use a different key concept, and strong Paper 1 and 2 answers use them to frame evaluation. Concept What it means Where it bites Scarcity Limited resources vs unlimited wants PPC, opportunity cost, common pool resources Choice Scarcity forces choices with opportunity costs Consumer choice, government budgets Efficiency Getting the most useful output from inputs; allocative and productive efficiency Market structures, market failure, trade Equity Fairness; differs from equality Taxes, price controls, poverty, development Economic well-being Living standards and quality of life, now and in future GDP vs well-being, HDI, development Sustainability Meeting today's needs without harming future generations Externalities, SDGs, climate policy Change Economies are always changing; economics studies change Shifts in curves, growth, structural change Interdependence Agents and countries rely on one another Circular flow, trade, exchange rates, globalisation Intervention Government involvement in markets Taxes, subsidies, regulation, policy debates Exam tip When you mention a concept in an essay, use it: \"the tax raises efficiency by internalising the externality, but harms equity because it is regressive\" is evaluation; just naming \"equity\" is not.","dias":[]}]},{"id":"t1-2","num":"1.2","title":"How do economists approach the world?","level":"SL","blurb":"The social scientific method, positive vs normative economics, and how economic thinking has changed since Adam Smith.","entries":[{"id":"e-methodology","title":"Positive vs normative economics and the scientific method","hl":false,"terms":[["Positive economics","Statements about what is, was or will be, which can be tested against evidence."],["Normative economics","Statements based on value judgements about what ought to be, which cannot be tested."],["Ceteris paribus","\"All other things being equal\": holding all other variables constant to isolate the effect of one change."],["Hypothesis","A testable statement about the relationship between variables."],["Empirical evidence","Information gathered by observation and measurement, used to test hypotheses."],["Refutation","Showing that a hypothesis is false by testing it against evidence; theories can be refuted but never finally proven."],["Value judgement","A view based on opinions or beliefs about what is good or fair."]],"topic":"t1-2","html":"<h4>Positive vs normative<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Positive<\/th><th>Normative<\/th><\/tr><\/thead><tbody><tr><td>Can be tested with evidence<\/td><td>Based on value judgements<\/td><\/tr><tr><td>\"UK unemployment rose to 4.8% in 2025.\"<\/td><td>\"The government should cut unemployment before it worries about inflation.\"<\/td><\/tr><tr><td>\"A higher tobacco tax reduces smoking among teenagers.\"<\/td><td>\"Smoking should be banned in all public places.\"<\/td><\/tr><tr><td>\"Raising the minimum wage reduced wage inequality.\"<\/td><td>\"The minimum wage is too low to live on and is unfair.\"<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A positive statement can be <strong>wrong<\/strong>; it is still positive if it can be tested. Normative statements often contain \"should\", \"ought\", \"fair\", \"too much\".<\/p>\n<h4>The social scientific method<\/h4>\n<ol><li>Observe a pattern and form a <strong>hypothesis<\/strong> (e.g. \"higher interest rates reduce consumer spending\").<\/li><li>Gather <strong>empirical<\/strong> data: statistics, surveys, natural experiments.<\/li><li>Test the hypothesis, holding other variables constant (<strong>ceteris paribus<\/strong>) as far as possible.<\/li><li>Accept it provisionally or <strong>refute<\/strong> it. A theory that survives repeated testing becomes part of an economic model.<\/li><\/ol>\n<p>Economists cannot run controlled laboratory experiments on economies, so they use <strong>ceteris paribus<\/strong> in models, statistical techniques on real data, and increasingly randomised controlled trials (e.g. Duflo and Banerjee's development research, Nobel Prize 2019) and behavioural experiments.<\/p>\n<h4>Rational economic decision-making<\/h4>\n<p>Standard models assume agents are <strong>rational<\/strong>: consumers maximise <strong>utility<\/strong>, firms maximise <strong>profit<\/strong>, workers balance pay and conditions, and governments maximise social welfare. Behavioural economics challenges these assumptions (see <a class=\"xref\" href=\"#e-behavioural\">2.4<\/a>).<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>In a 2-mark \"distinguish\" question, give one example of each and say why: \"positive: can be tested with data; normative: contains a value judgement.\"<\/p><\/div>","text":"Positive vs normative Positive Normative Can be tested with evidence Based on value judgements \"UK unemployment rose to 4.8% in 2025.\" \"The government should cut unemployment before it worries about inflation.\" \"A higher tobacco tax reduces smoking among teenagers.\" \"Smoking should be banned in all public places.\" \"Raising the minimum wage reduced wage inequality.\" \"The minimum wage is too low to live on and is unfair.\" A positive statement can be wrong ; it is still positive if it can be tested. Normative statements often contain \"should\", \"ought\", \"fair\", \"too much\". The social scientific method Observe a pattern and form a hypothesis (e.g. \"higher interest rates reduce consumer spending\"). Gather empirical data: statistics, surveys, natural experiments. Test the hypothesis, holding other variables constant ( ceteris paribus ) as far as possible. Accept it provisionally or refute it. A theory that survives repeated testing becomes part of an economic model. Economists cannot run controlled laboratory experiments on economies, so they use ceteris paribus in models, statistical techniques on real data, and increasingly randomised controlled trials (e.g. Duflo and Banerjee's development research, Nobel Prize 2019) and behavioural experiments. Rational economic decision-making Standard models assume agents are rational : consumers maximise utility , firms maximise profit , workers balance pay and conditions, and governments maximise social welfare. Behavioural economics challenges these assumptions (see 2.4 ). Exam tip In a 2-mark \"distinguish\" question, give one example of each and say why: \"positive: can be tested with data; normative: contains a value judgement.\"","dias":[]},{"id":"e-thought","title":"The history of economic thought","hl":false,"terms":[["Mercantilism","The 16th–18th century view that national wealth came from accumulating gold through exports and restricting imports."],["Laissez-faire","The idea that governments should leave markets alone, with minimal intervention."],["Invisible hand","Adam Smith's idea that individuals pursuing self-interest in free markets unintentionally promote the good of society."],["Say's law","\"Supply creates its own demand\": production generates the income needed to buy that output."],["Marginalism","Analysing decisions at the margin, i.e. the extra benefit and extra cost of one more unit."],["Keynesian economics","The view that markets can stay in recession for long periods and that governments should manage aggregate demand, especially through fiscal policy."],["Monetarism","The view, led by Milton Friedman, that inflation is caused by excessive growth of the money supply and that governments should keep monetary growth steady."],["Behavioural economics","A branch of economics that uses insights from psychology to explain why people do not always act rationally."],["Circular economy","An economic system that eliminates waste, keeps products and materials in use and regenerates natural systems."],["Doughnut economics","Kate Raworth's model in which economies should meet everyone's basic needs (the social foundation) without exceeding the planet's ecological limits (the ecological ceiling)."]],"topic":"t1-2","html":"<div class=\"tbl\"><table><thead><tr><th>Period<\/th><th>Thinkers and ideas<\/th><th>Context<\/th><\/tr><\/thead><tbody><tr><td>1500s–1700s<\/td><td><strong>Mercantilism<\/strong>: wealth = gold; run trade surpluses, protect industry<\/td><td>Rise of European nation states and colonial empires<\/td><\/tr><tr><td>1776<\/td><td><strong>Adam Smith<\/strong>, <em>The Wealth of Nations<\/em>: division of labour, the invisible hand, laissez-faire, free trade<\/td><td>Start of the Industrial Revolution; reaction against mercantilism<\/td><\/tr><tr><td>1817<\/td><td><strong>David Ricardo<\/strong>: comparative advantage<\/td><td>Debate over the Corn Laws<\/td><\/tr><tr><td>1803<\/td><td><strong>Jean-Baptiste Say<\/strong>: Say's law, \"supply creates its own demand\"<\/td><td>Classical macroeconomics: markets self-correct<\/td><\/tr><tr><td>1867<\/td><td><strong>Karl Marx<\/strong>, <em>Das Kapital<\/em>: capitalism exploits labour, creates inequality, will collapse into revolution<\/td><td>Harsh factory conditions; growing inequality<\/td><\/tr><tr><td>1870s<\/td><td><strong>Marginal revolution<\/strong> (Jevons, Menger, Walras; later Marshall): value comes from utility at the margin; demand and supply diagrams<\/td><td>Mathematical economics<\/td><\/tr><tr><td>1936<\/td><td><strong>John Maynard Keynes<\/strong>, <em>The General Theory<\/em>: demand-deficient unemployment can persist; government should spend in a slump<\/td><td>Great Depression; Say's law seemed to fail<\/td><\/tr><tr><td>1970s–80s<\/td><td><strong>Milton Friedman<\/strong> and the monetarist/new classical counter-revolution: control money supply, free markets, supply-side policies, privatisation<\/td><td>Stagflation after oil shocks; Thatcher and Reagan governments<\/td><\/tr><tr><td>2000s–<\/td><td><strong>Behavioural economics<\/strong> (Kahneman, Thaler), renewed Keynesian policy after the 2008 crisis, <strong>Doughnut economics<\/strong> (Raworth), the <strong>circular economy<\/strong><\/td><td>Global financial crisis, Covid-19, climate change, inequality<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Why it matters for exams<\/h4>\n<p>Many evaluation points come down to this history: <strong>Keynesians vs new classical economists<\/strong> on whether the economy self-corrects (AD–AS, <a class=\"xref\" href=\"#t3-2\">3.2<\/a>), the shape of AS, the effectiveness of fiscal vs monetary policy, and the role of government. Knowing who argued what lets you present balanced perspectives.<\/p>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: Doughnut economics in Amsterdam<\/div><p>In 2020 Amsterdam became the first city to adopt the Doughnut model as the basis for policy, using it to guide housing, circular-economy building rules and reductions in material use. It is a real example of an alternative to targeting GDP growth alone.<\/p><\/div>","text":"Period Thinkers and ideas Context 1500s–1700s Mercantilism : wealth = gold; run trade surpluses, protect industry Rise of European nation states and colonial empires 1776 Adam Smith , The Wealth of Nations : division of labour, the invisible hand, laissez-faire, free trade Start of the Industrial Revolution; reaction against mercantilism 1817 David Ricardo : comparative advantage Debate over the Corn Laws 1803 Jean-Baptiste Say : Say's law, \"supply creates its own demand\" Classical macroeconomics: markets self-correct 1867 Karl Marx , Das Kapital : capitalism exploits labour, creates inequality, will collapse into revolution Harsh factory conditions; growing inequality 1870s Marginal revolution (Jevons, Menger, Walras; later Marshall): value comes from utility at the margin; demand and supply diagrams Mathematical economics 1936 John Maynard Keynes , The General Theory : demand-deficient unemployment can persist; government should spend in a slump Great Depression; Say's law seemed to fail 1970s–80s Milton Friedman and the monetarist/new classical counter-revolution: control money supply, free markets, supply-side policies, privatisation Stagflation after oil shocks; Thatcher and Reagan governments 2000s– Behavioural economics (Kahneman, Thaler), renewed Keynesian policy after the 2008 crisis, Doughnut economics (Raworth), the circular economy Global financial crisis, Covid-19, climate change, inequality Why it matters for exams Many evaluation points come down to this history: Keynesians vs new classical economists on whether the economy self-corrects (AD–AS, 3.2 ), the shape of AS, the effectiveness of fiscal vs monetary policy, and the role of government. Knowing who argued what lets you present balanced perspectives. Real-world example: Doughnut economics in Amsterdam In 2020 Amsterdam became the first city to adopt the Doughnut model as the basis for policy, using it to guide housing, circular-economy building rules and reductions in material use. It is a real example of an alternative to targeting GDP growth alone.","dias":[]}]}]},{"id":"u2","title":"Microeconomics","blurb":"How markets work, why they fail, and what governments do about it: demand and supply, elasticity, intervention, market failure and market power.","topics":[{"id":"t2-1","num":"2.1","title":"Demand","level":"SL","blurb":"The law of demand, what shifts the demand curve, and (HL) why demand slopes down and linear demand functions.","entries":[{"id":"e-demand-law","title":"The law of demand and the demand curve","hl":false,"terms":[["Demand","The quantity of a good or service that consumers are willing and able to buy at each possible price, in a given time period, ceteris paribus."],["Effective demand","Desire for a good backed by the ability to pay for it."],["Law of demand","There is an inverse relationship between the price of a good and the quantity demanded, ceteris paribus."],["Market demand","The sum of all individual consumers' demand for a good at each price (horizontal summation)."],["Quantity demanded","The amount consumers will buy at one particular price."],["Extension in demand","An increase in quantity demanded caused by a fall in the good's own price: a movement down the demand curve."],["Contraction in demand","A decrease in quantity demanded caused by a rise in the good's own price: a movement up the demand curve."]],"topic":"t2-1","html":"<p>Demand needs both <strong>willingness and ability<\/strong> to pay. A demand curve plots the quantity demanded at each price; economists draw it as a straight line for convenience.<\/p>\n<p><strong>Market demand<\/strong> is found by adding individual demands <strong>horizontally<\/strong>: if at $10 the boys' swimwear demand is 500 and girls' is 400, market demand at $10 is 900.<\/p>\n<h4>Movement along vs shift<\/h4>\n<div class=\"dslot\" data-d=\"demand-move\"><\/div>\n<p>A change in the <strong>good's own price<\/strong> causes a <strong>movement along<\/strong> the curve: a contraction (price up) or an extension (price down) in <strong>quantity demanded<\/strong>. Anything else that changes demand <strong>shifts<\/strong> the curve (see next note).<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Use precise language. Own-price change → \"quantity demanded changes\" (movement). Non-price determinant → \"demand changes\" (shift). Examiners deduct marks for mixing them up.<\/p><\/div>","text":"Demand needs both willingness and ability to pay. A demand curve plots the quantity demanded at each price; economists draw it as a straight line for convenience. Market demand is found by adding individual demands horizontally : if at $10 the boys' swimwear demand is 500 and girls' is 400, market demand at $10 is 900. Movement along vs shift A change in the good's own price causes a movement along the curve: a contraction (price up) or an extension (price down) in quantity demanded . Anything else that changes demand shifts the curve (see next note). Exam tip Use precise language. Own-price change → \"quantity demanded changes\" (movement). Non-price determinant → \"demand changes\" (shift). Examiners deduct marks for mixing them up.","dias":["demand-move"]},{"id":"e-demand-determinants","title":"Non-price determinants of demand","hl":false,"terms":[["Normal good","A good for which demand rises when income rises (positive YED)."],["Inferior good","A good for which demand falls when income rises (negative YED), e.g. bus travel, discount supermarket brands."],["Substitutes","Goods that can be used in place of each other; a rise in the price of one increases demand for the other."],["Complements","Goods used together; a rise in the price of one decreases demand for the other."]],"topic":"t2-1","html":"<div class=\"dslot\" data-d=\"demand-shift\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Determinant<\/th><th>Increase in demand (shift right) when…<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><strong>Income<\/strong><\/td><td>Income rises (normal good) or falls (inferior good)<\/td><td>Rising incomes in India raise demand for cars; fall in demand for bicycles<\/td><\/tr><tr><td><strong>Tastes and preferences<\/strong><\/td><td>Fashion, advertising or health information favour the good<\/td><td>Plant-based milk after health campaigns; demand for a product endorsed by an influencer<\/td><\/tr><tr><td><strong>Price of substitutes<\/strong><\/td><td>A substitute becomes dearer<\/td><td>Higher Coca-Cola price raises demand for Pepsi<\/td><\/tr><tr><td><strong>Price of complements<\/strong><\/td><td>A complement becomes cheaper<\/td><td>Cheaper games consoles raise demand for games<\/td><\/tr><tr><td><strong>Number of consumers<\/strong><\/td><td>Population grows, or market opens to new buyers<\/td><td>Ageing populations raise demand for healthcare<\/td><\/tr><tr><td><strong>Expectations of future prices<\/strong><\/td><td>Consumers expect prices to rise<\/td><td>Panic buying of fuel before an expected price rise<\/td><\/tr><tr><td><strong>Other<\/strong><\/td><td>Seasons, interest rates (for goods bought on credit), government policy<\/td><td>Demand for umbrellas in the monsoon<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box warn\"><div class=\"box-h\">Common mistakes<\/div><ul><li>Saying a change in price \"shifts the demand curve\".<\/li><li>Forgetting that demand for an inferior good falls when income rises.<\/li><li>Shifting supply when consumer tastes change; tastes affect demand only.<\/li><\/ul><\/div>","text":"Determinant Increase in demand (shift right) when… Example Income Income rises (normal good) or falls (inferior good) Rising incomes in India raise demand for cars; fall in demand for bicycles Tastes and preferences Fashion, advertising or health information favour the good Plant-based milk after health campaigns; demand for a product endorsed by an influencer Price of substitutes A substitute becomes dearer Higher Coca-Cola price raises demand for Pepsi Price of complements A complement becomes cheaper Cheaper games consoles raise demand for games Number of consumers Population grows, or market opens to new buyers Ageing populations raise demand for healthcare Expectations of future prices Consumers expect prices to rise Panic buying of fuel before an expected price rise Other Seasons, interest rates (for goods bought on credit), government policy Demand for umbrellas in the monsoon Common mistakes Saying a change in price \"shifts the demand curve\". Forgetting that demand for an inferior good falls when income rises. Shifting supply when consumer tastes change; tastes affect demand only.","dias":["demand-shift"]},{"id":"e-demand-hl","title":"Why demand slopes down and linear demand functions","hl":true,"terms":[["Income effect","When a good's price falls, consumers' real income (purchasing power) rises, so they can buy more of it."],["Substitution effect","When a good's price falls it becomes cheaper relative to substitutes, so consumers switch towards it."],["Marginal utility","The additional satisfaction gained from consuming one more unit of a good."],["Law of diminishing marginal utility","As a person consumes more units of a good, the extra satisfaction from each additional unit falls."],["Linear demand function","An equation of the form Qd = a − bP, where a is the quantity demanded at a price of zero and b shows how much Qd changes for each $1 change in price."]],"topic":"t2-1","html":"<h4>Three explanations of the law of demand<\/h4>\n<ol><li><strong>Income effect<\/strong>: a lower price raises real income, so more is bought.<\/li><li><strong>Substitution effect<\/strong>: a lower price makes the good relatively cheaper than its substitutes.<\/li><li><strong>Diminishing marginal utility<\/strong>: each extra unit gives less satisfaction, so consumers will only buy more if the price falls. A hungry student gets great satisfaction from the first slice of pizza, less from the fourth.<\/li><\/ol>\n<h4>Linear demand functions: Qd = a − bP<\/h4>\n<ul><li><strong>a<\/strong> is the horizontal (Q-axis) intercept: quantity demanded when P = 0. A change in a non-price determinant changes <strong>a<\/strong> and <strong>shifts<\/strong> the curve (a rises → shift right).<\/li><li><strong>b<\/strong> is the slope parameter: each $1 rise in price reduces Qd by b units. A larger <strong>b<\/strong> makes the curve flatter on a P–Q diagram. A change in b <strong>pivots<\/strong> the curve.<\/li><li>The price at which Qd = 0 (vertical intercept) is a ÷ b.<\/li><\/ul>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Plotting Qd = 60 − 4P<\/div><div class=\"tbl\"><table><thead><tr><th>Price ($)<\/th><th>0<\/th><th>3<\/th><th>6<\/th><th>9<\/th><th>12<\/th><th>15<\/th><\/tr><\/thead><tbody><tr><td>Qd<\/td><td>60<\/td><td>48<\/td><td>36<\/td><td>24<\/td><td>12<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Price intercept: 60 ÷ 4 = $15. If incomes rise and the function becomes Qd = 80 − 4P, the curve shifts right by 20 units at every price, parallel to the old one.<\/p><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Paper 3 often asks you to plot a demand function from a schedule, then shift it. Always label the intercepts and use a ruler.<\/p><\/div>","text":"Three explanations of the law of demand Income effect : a lower price raises real income, so more is bought. Substitution effect : a lower price makes the good relatively cheaper than its substitutes. Diminishing marginal utility : each extra unit gives less satisfaction, so consumers will only buy more if the price falls. A hungry student gets great satisfaction from the first slice of pizza, less from the fourth. Linear demand functions: Qd = a − bP a is the horizontal (Q-axis) intercept: quantity demanded when P = 0. A change in a non-price determinant changes a and shifts the curve (a rises → shift right). b is the slope parameter: each $1 rise in price reduces Qd by b units. A larger b makes the curve flatter on a P–Q diagram. A change in b pivots the curve. The price at which Qd = 0 (vertical intercept) is a ÷ b. Worked example: Plotting Qd = 60 − 4P Price ($) 0 3 6 9 12 15 Qd 60 48 36 24 12 0 Price intercept: 60 ÷ 4 = $15. If incomes rise and the function becomes Qd = 80 − 4P, the curve shifts right by 20 units at every price, parallel to the old one. Exam tip Paper 3 often asks you to plot a demand function from a schedule, then shift it. Always label the intercepts and use a ruler.","dias":[]}]},{"id":"t2-2","num":"2.2","title":"Supply","level":"SL","blurb":"The law of supply, what shifts supply, and (HL) marginal cost and linear supply functions.","entries":[{"id":"e-supply-law","title":"The law of supply and the supply curve","hl":false,"terms":[["Supply","The quantity of a good or service that producers are willing and able to offer for sale at each price, in a given time
