yle=\"italic\">expansion<\/text>\n<text class=\"dg-note dg-tk\" x=\"266.4\" y=\"48.7\" text-anchor=\"middle\" font-size=\"10\">+ output gap<\/text>\n<text class=\"dg-note dg-tk\" x=\"271.1\" y=\"151.7\" text-anchor=\"middle\" font-size=\"10\">− output gap<\/text><\/g><\/svg>"},{"id":"ad-curve","title":"Aggregate demand: movements and shifts","topic":"t3-2","hl":false,"steps":["Label axes Price level (PL) and Real GDP (Y).","Draw AD sloping down.","Show a shift right (AD₁ → AD₂) when C, I, G or (X − M) rise."],"explain":"AD = C + I + G + (X − M). It slopes down because of the wealth effect (a lower price level raises the real value of wealth), the interest rate effect (a lower price level reduces demand for money and lowers interest rates, raising C and I) and the international trade effect (domestic goods become relatively cheaper, raising X and lowering M). Changes in any component other than the price level shift the curve: consumer confidence, wealth, interest rates, income taxes, household debt, business confidence, technology, government spending, foreign incomes, exchange rates and trade policies.","watch":"A change in the price level moves along AD; it never shifts it.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Real GDP (Y)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M120.1,49.4 L290.0,217.9\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">AD<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"294.0\" y=\"221.9\" text-anchor=\"start\">AD<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-arr dg-k\" d=\"M172.0,129.0 L205.0,129.0 M198.7,132.0 L205.0,129.0 L198.7,125.9\"/><\/g><\/svg>"},{"id":"sras","title":"Short-run aggregate supply (SRAS)","topic":"t3-2","hl":false,"steps":["Draw SRAS sloping upward.","Show a leftward shift (SRAS₁ → SRAS₂) after a rise in costs, e.g. oil prices or wages."],"explain":"In the short run, factor prices (especially money wages) are fixed by contracts, so a higher price level raises profitability and firms supply more. SRAS shifts with changes in costs of production: wages, raw material and energy prices, indirect business taxes and subsidies, and supply shocks (bad weather, war, pandemics, a depreciation raising import costs).","watch":"A rise in costs shifts SRAS left (up), not right.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Real GDP (Y)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M54.0,199.2 L219.2,35.4\"/>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">SRAS<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"193.2\" y=\"27.4\" text-anchor=\"start\">SRAS<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-arr dg-k\" d=\"M181.4,138.3 L148.4,138.3 M154.7,135.3 L148.4,138.3 L154.7,141.4\"/><\/g><\/svg>"},{"id":"nc-lras","title":"New classical model: LRAS and long-run equilibrium","topic":"t3-2","hl":false,"steps":["Draw a vertical LRAS at the full employment level of output (Yf), also called potential output.","Draw AD and SRAS crossing on the LRAS.","This is long-run equilibrium: unemployment is at its natural rate."],"explain":"New classical economists argue that in the long run wages and prices are fully flexible, so the economy returns to potential output whatever the level of AD. LRAS is vertical: output depends only on the quantity and quality of factors of production and technology. Any rise in AD only raises the price level in the long run.","watch":"Yf is not zero unemployment: there is still natural (frictional and structural) unemployment.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Real GDP (Y)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M172.0,248.3 L172.0,37.7\"/>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,208.5 L252.2,35.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,129.0 L157.8,129.0\"/>\n<path class=\"dg-drop\" d=\"M157.8,129.0 L157.8,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"158.0\" y=\"33.7\" text-anchor=\"start\">LRAS<\/text>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">AD<\/text>\n<text class=\"dg-lab dg-ts\" x=\"238.2\" y=\"27.4\" text-anchor=\"start\">SRAS<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"133.0\" text-anchor=\"end\">PL<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"157.8\" y=\"277.0\" text-anchor=\"middle\">Y<tspan dy=\"0.32em\" font-size=\"72%\">f<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"157.8\" cy=\"129.0\" r=\"3.6\"/><\/g><\/svg>"},{"id":"nc-gaps","title":"Recessionary (deflationary) and inflationary gaps","topic":"t3-2","hl":false,"steps":["Draw LRAS at Yf.","Left: AD crosses SRAS to the left of LRAS: real GDP Y₁ < Yf, a recessionary gap.","Right: AD crosses SRAS to the right of LRAS: Y₁ > Yf, an inflationary gap."],"explain":"A recessionary (deflationary) gap means actual output is below potential, with cyclical unemployment. An inflationary gap means output is above potential: resources are over-used, and labour shortages push up wages and prices. Keynesians stress that recessionary gaps can last a long time because wages are sticky downward; new classical economists expect wages to adjust and close the gap on their own.","watch":"Use \"output gap\" language and say which side of Yf the economy is on.","svg":"<svg class=\"dg\" viewBox=\"0 0 618 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Recessionary gap<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Real GDP (Y)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M142.0,249.0 L142.0,51.0\"/>\n<path class=\"dg-ln dg-d\" d=\"M43.4,62.0 L184.2,238.0\"/>\n<path class=\"dg-ln dg-s\" d=\"M71.6,211.6 L201.8,48.8\"/>\n<path class=\"dg-drop\" d=\"M54.0,154.4 L117.4,154.4\"/>\n<path class=\"dg-drop\" d=\"M117.4,154.4 L117.4,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"128.0\" y=\"47.0\" text-anchor=\"start\">LRAS<\/text>\n<text class=\"dg-lab dg-td\" x=\"160.2\" y=\"248.0\" text-anchor=\"start\">AD<\/text>\n<text class=\"dg-lab dg-ts\" x=\"179.8\" y=\"40.8\" text-anchor=\"start\">SRAS<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"158.4\" text-anchor=\"end\">PL<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"117.4\" y=\"277.0\" text-anchor=\"middle\">Y<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"142.0\" y=\"277.0\" text-anchor=\"middle\">Y<tspan dy=\"0.32em\" font-size=\"72%\">f<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"117.4\" cy=\"154.4\" r=\"3.6\"/><\/g>\n<g transform=\"translate(318,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Inflationary gap<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Real GDP (Y)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M142.0,249.0 L142.0,51.0\"/>\n<path class=\"dg-ln dg-d\" d=\"M99.8,62.0 L240.6,238.0\"/>\n<path class=\"dg-ln dg-s\" d=\"M71.6,211.6 L201.8,48.8\"/>\n<path class=\"dg-drop\" d=\"M54.0,119.2 L145.5,119.2\"/>\n<path class=\"dg-drop\" d=\"M145.5,119.2 L145.5,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"128.0\" y=\"47.0\" text-anchor=\"start\">LRAS<\/text>\n<text class=\"dg-lab dg-td\" x=\"216.6\" y=\"248.0\" text-anchor=\"start\">AD<\/text>\n<text class=\"dg-lab dg-ts\" x=\"179.8\" y=\"40.8\" text-anchor=\"start\">SRAS<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"123.2\" text-anchor=\"end\">PL<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"145.5\" y=\"277.0\" text-anchor=\"middle\">Y<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"145.5\" cy=\"119.2\" r=\"3.6\"/><\/g><\/svg>"},{"id":"keynes-as","title":"Keynesian AS model","topic":"t3-2","hl":false,"steps":["Draw an AS curve in three sections: horizontal at low output, then upward-sloping, then vertical at Yf.","Draw AD₁ in the horizontal section (deep recession), AD₂ in the middle, AD₃ in the vertical section."],"explain":"Keynesians argue that in a deep recession there is so much spare capacity that output can rise with no rise in the price level (section 1): firms can hire idle workers without raising wages, and wages are sticky downward so the price level does not fall either. As the economy approaches full employment, bottlenecks appear and costs rise (section 2). At Yf output cannot rise further and extra AD only causes inflation (section 3). Implication: the economy can be stuck in a deflationary gap, so government intervention (expansionary fiscal policy) is needed.","watch":"The horizontal section shows no inflation while output rises, which is the key Keynesian claim.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" ved demand), so unemployment rises above the natural rate."],"explain":"Cyclical unemployment is caused by a fall in AD during a recession. Labour demand is derived from the demand for goods, so falling output means job losses. Keynesians recommend expansionary fiscal and monetary policy to restore AD.","watch":"This is distinct from structural and frictional unemployment, which remain at Yf (the natural rate).","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Real GDP (Y)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M195.6,248.3 L195.6,37.7\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,231.9 L261.7,49.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M101.2,26.0 L290.0,213.2\"/>\n<path class=\"dg-ln dg-d\" d=\"M54.0,63.4 L242.8,250.6\"/>\n<path class=\"dg-drop\" d=\"M54.0,117.3 L193.2,117.3\"/>\n<path class=\"dg-drop\" d=\"M193.2,117.3 L193.2,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,159.4 L150.8,159.4\"/>\n<path class=\"dg-drop\" d=\"M150.8,159.4 L150.8,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"181.6\" y=\"33.7\" text-anchor=\"start\">LRAS<\/text>\n<text class=\"dg-lab dg-ts\" x=\"265.7\" y=\"53.4\" text-anchor=\"start\">SRAS<\/text>\n<text class=\"dg-lab dg-td\" x=\"294.0\" y=\"217.2\" text-anchor=\"start\">AD<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"246.8\" y=\"254.6\" text-anchor=\"start\">AD<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"d ,"steps":["Draw the labour market for one industry (e.g. coal mining).","Shift labour demand left (D₁ → D₂) as demand for the product falls or technology replaces workers.","Employment falls from L₁ to L₂; the displaced workers lack the skills or location for jobs elsewhere."],"explain":"Structural unemployment comes from changes in the structure of the economy: changing demand, technological change (automation), globalisation moving production abroad. It is long-term because of occupational immobility (wrong skills) and geographical immobility (wrong place, housing costs, family ties). Policies: retraining, education, relocation subsidies, regional policy, labour market flexibility.","watch":"Structural unemployment is part of the natural rate, so demand-side policy does not cure it.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Wage rate<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity of labour<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M54.0,82.2 L223.9,250.6\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,171.1 L143.7,171.1\"/>\n<path class=\"dg-drop\" d=\"M143.7,171.1 L143.7,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">L<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y= C is at the NRU with higher inflation, not lower unemployment.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Inflation rate (%)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Unemployment rate (%)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M172.0,253.0 L172.0,35.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M87.0,44.7 L88.3,49.0 L89.8,54.5 L91.5,61.0 L93.4,68.4 L95.5,76.3 L97.8,84.6 L100.2,93.2 L102.7,101.7 L105.2,109.9 L107.8,117.8 L110.4,125.0 L113.0,131.3 L115.6,137.0 L118.2,142.5 L120.9,147.7 L123.7,152.6 L126.5,157.4 L129.4,161.9 L132.3,166.2 L135.4,170.3 L138.5,174.2 L141.7,178.0 L145.0,181.6 L148.4,185.1 L151.8,188.4 L155.3,191.4 L158.8,194.2 L162.4,196.7 L166.0,199.1 L169.8,201.4 L173.7,203.5 L177.7,205.5 L181.9,207.4 L186.2,209.4 L190.8,211.3 L195.6,213.2 L200.9,215.1 L206.9,217.1 L213.3,219.0 L220.1,220.8 L227.0,222.6 L233.9,224.3 L240.7,225.9 L247.2,227.4 L253.1,228.8 L258.4,230.0 L262.9,231.0 L266.4,231.9\"/>\n<path class=\"dg-ln dg-d\" d=\"M87.0,26.0 L88.7,29.5 L90.7,34.0 L93.1,39.4 L95.8,45.4 L98.7,51.9 L101.8,58.8 L105.0,65.7 L108.2,72.6 L111.4,79.3 L114.5,85.6 L117.4,91.3 L120.1,96.2 L122.5,100.5 L124.9,104.4 L127.0,108.0 L129.2,111.3 L131.3,114.4 L133.4,117.3 L135.5,120.0 L137.7,122.7 L140.1,125.4 L142.6,128.1 L145.4,130.8 L148.4,133.6 L151.6,136.6 L154.9,139.5 L158.3,142.4 L161.9,145.3 L165.5,148.2 L169.3,151.0 L173.3,153.8 L177.4,156.5 L181.7,159.1 L186.1,161.7 L190.8,164.1 L195.6,166.4 L200.9,168.6 L206.9,170.8 L213.3,173.0 L220.1,175.1 L227.0,177.1 L233.9,179.0 L240.7,180.8 L247.2,182.4 L253.1,183.9 L258.4,185.3 L2 ity.","watch":"The poorest are on the left; plot cumulative shares, not each group's share.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-agov\" points=\"54.0,260.0 54.0,260.0 56.3,259.5 59.1,258.8 62.5,258.1 66.2,257.3 70.3,256.4 74.7,255.5 79.1,254.4 83.7,253.3 88.3,252.2 92.8,250.9 97.1,249.6 101.2,248.3 105.1,246.9 109.1,245.5 113.0,244.0 116.9,242.4 120.9,240.8 124.8,239.1 128.7,237.3 132.7,235.5 136.6,233.5 140.5,231.5 144.5,229.4 148.4,227.2 152.3,225.0 156.3,222.7 160.2,220.3 164.1,217.9 168.1,215.4 172.0,212.8 175.9,210.0 179.9,207.2 183.8,204.3 187.7,201.2 191.7,197.9 195.6,194.5 199.5,191.1 203.5,187.7 207.4,184.5 211.3,181.1 215.3,177.7 219.2,174.0 223.1,170.0 227.1,165.7 231.0,160.9 234.9,155.6 238.9,149.6 242.8,143.0 246.9,135.2 251.2,125.9 255.7,115.6 260.3,104.5 264.9,93.0 269.4,81.3 273.7,69.8 277.8,58.8 281.5,48.6 284.9,39.5 287.7,31.9 290.0,26.0 290.0,26.0\"/>\n<polygon class=\"dg-a dg-acs\" points=\"54.0,260.0 56.3,259.5 59.1,258.8 62.5,258.1 66.2,257.3 70.3,256.4 74.7,255.5 79.1,254.4 83.7,253.3 88.3,252.2 92.8,250.9 97.1,249.6 101.2,248.3 105.1,246.9 109.1,245.5 113.0,244.0 116.9,242.4 120.9,240.8 124.8,239.1 128.7,237.3 132.7,235.5 136.6,233.5 140.5,231.5 144.5,229.4 148.4,227.2 152.3,225.0 156.3,222.7 160.2,220.3 164.1,217.9 168.1,215.4 172.0,212.8 175.9,210.0 179.9,207.2 183.8,204.3 187.7,201.2 191.7,197.9 195.6,194.5 199.5,191.1 203.5,187.7 207.4,184.5 211.3,181.1 215.3,177.7 219.2,174.0 223.1,170.0 227.1,165.7 231.0,160.9 234.9,155.6 238.9,149.6 242.8,143.0 246.9,135.2 251.2,125.9 255.7,115.6 260.3,104.5 264.9,93.0 269.4,81.3 273.7,69.8 277.8,58.8 281.5,48.6 284.9,39.5 287.7,31.9 290.0,26.0 290.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"1 egressive in effect, because lower-income households spend a larger share of their income.","watch":"Classify by the average rate, not by the amount paid.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Average tax rate (%)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Income<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-g\" d=\"M65.8,246.0 L68.6,244.9 L72.1,243.6 L76.1,242.1 L80.7,240.4 L85.6,238.6 L90.9,236.6 L96.4,234.5 L102.1,232.3 L107.8,229.9 L113.6,227.5 L119.3,225.1 L124.8,222.6 L130.2,219.9 L135.8,217.0 L141.4,214.0 L147.1,210.8 L152.9,207.5 L158.7,204.1 L164.7,200.8 L170.7,197.4 L176.8,194.2 L183.0,191.0 L189.2,188.0 L195.6,185.1 L202.3,182.4 L209.6,179.6 L217.4,176.8 L225.3,174.0 L233.4,171.3 L241.3,168.7 L249.0,166.3 L256.3,164.0 L263.1,161.9 L269.1,160.0 L274.2,158.4 L278.2,157.0\"/>\n<path class=\"dg-ln dg-k\" d=\"M65.8,199.2 L278.2,199.2\"/>\n<path class=\"dg-ln dg-d\" d=\"M65.8,147.7 L68.6,149.8 L72.1,152.4 L76.1,155.6 L80.7,159.1 L85.6,163.0 L90.9,167.0 L96.4,171.1 L102.1,175.2 L107.8,179.3 L113.6,183.1 L119.3,186.6 L124.8,189.8 L130.2,192.7 L135.8,195.4 L141.4,198.1 L147.1,200.6 L152.9,203.1 L158.7,205.4 L164.7,207.7 L170.7,209.9 L176.8,212.0 L183.0,214.0 L189.2,216.0 L195.6,217.9 L202.3,219.7 L209.6,221.5 L217.4,223.2 L225.3,224.8 L233.4,226.4 L241.3,227.8 L249.0,229.2 L256.3,230.4 L263.1,231.6 L269.1,232.6 L274.2,233.5 L278.2,234.3\"/>\n<text class=\"dg-lab dg-tg\" x=\"198.2\" y=\"149.0\" text-anchor=\"start\">progressive<\/text>\n<text class=\"dg-lab dg-tk\" x=\"204.2\" y=\"193.2\" text-anchor=\"start\">proportional<\/text>\n<text class=\"dg-lab dg-td\" x=\"210.2\" y=\"252.3\" text-anchor=\"start\">regressive<\/text><\/g><\/svg>"},{"id":"money-market","title":"The money market and interest rates","topic":"t3-5","hl":false,"steps":["Label axes Interest rate (i) and Quantity of money.","Draw money supply (Sm) vertical, set by the central bank.","Draw money demand (Dm) sloping down: higher interest rates raise the opportunity cost of holding money.","Show an increase in money supply from Sm₁ to Sm₂ lowering the equilibrium interest rate."],"explain":"The central bank sets the supply of money (or targets the interest rate by adjusting it). People hold money for transactions, precautionary and speculative reasons; the interest rate is the opportunity cost of holding money rather than bonds. Expansionary monetary policy (raising Sm) lowers the interest rate; contractionary policy raises it.","watch":"Money supply is vertical because it is fixed by the central bank, not by the interest rate.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Interest rate (i)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity of money<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M160.2,248.3 L160.2,37.7\"/>\n<path class=\"dg-ln dg-s\" d=\"M200.3,248.3 L200.3,37.7\"/>\n<path class=\"dg-drop\" d=\"M54.0,131.3 L160.2,131.3\"/>\n<path class=\"dg-drop\" d=\"M160.2,131.3 L160.2,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,171.1 L200.3,171.1\"/>\n<path class=\"dg-drop\" d=\"M200.3,171.1 L200.3,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">m<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"146.2\" y=\"33.7\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">m1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"194.3\" y=\"33.7\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">m2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"135.3\" text-anchor=\"end\">i<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"160.2\" y=\"277.0\" text-anchor=\"middle\">M<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"160.2\" cy=\"131.3\" r=\"3.6\"/>\n<text class=\"dg-tick\" x=\"48.0\" y=\"175.1\" text-anchor=\"end\">i<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"200.3\" y=\"277.0\" text-anchor=\"middle\">M<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"200.3\" cy=\"171.1\" r=\"3.6\"/>\n<path class=\"dg-arr dg-k\" d=\"M167.3,84.5 L193.2,84.5 M186.9,87.5 L193.2,84.5 L186.9,81.5\"/><\/g><\/svg>"},{"id":"multiplier","title":"The Keynesian multiplier","topic":"t3-6","hl":false,"steps":["Draw Keynesian AS with AD₁ in the horizontal or rising section.","Show the initial injection (e.g. a rise in G) shifting AD₁ to AD₂.","Show the further rise in consumption from rounds of re-spending shifting AD to AD₃.","The total rise in real GDP (Y₁ → Y₃) is larger than the initial injection."],"explain":"An injection raises someone's income; part of that income is spent again (the marginal propensity to consume), creating income for others, and so on. Multiplier k = 1/(1 − MPC) = 1/MPW, where MPW = MPS + MPT + MPM. For example, if MPC = 0.8, k = 5 and a $10bn rise in G raises real GDP by up to $50bn. Leakages at each round make the process smaller: higher taxes, saving and imports mean a smaller multiplier.","watch":"The multiplier works both ways: a fall in injections causes a multiplied fall in GDP.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price level (PL)<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Real GDP (Y)<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M54.0,199.2 L58.0,199.2 L63.3,199.2 L69.6,199.3 L76.7,199.3 L84.4,199.4 L92.3,199.5 L100.4,199.5 L108.4,199.5 L116.0,199.5 L122.9,199.4 L129.1,199.3 L134.2,199.2 L138.4,199.0 L142.0,198.8 L145.0,198.6 L147.5,198.5 L149.7,198.3 L151.6,198.0 L153.4,197.7 L155.0,197.3 L156.7,196.7 L158.4,196.1 L160.4,195.4 L162.6,194.5 L164.9,193.5 L167.3,192.4 L169.8,191.2 L172.2,190.0 L174.6,188.6 L177.0,187.2 L179.4,185.6 L181.8,183.9 L184.1,182.1 L186.4,180.1 L188.7,178.0 L190.9,175.8 L193.1,173.3 L195.3,170.7 L197.4,167.9 L199.6,165.0 L201.8,162.0 L203.9,158.8 L205.9,155.5 L207.8,152.2 L209.7,148.8 L211.4,145.3 L213.0,141.8 L214.5,138.3 L215.8,134.8 L217.0,131.1 L218.0,127.4 L218.9,123.7 L219.8,119.8 L220.5,115.9 L221.2,112.0 L221.8,108.0 L222.4,103.9 L222.9,99.8 L223.4,95.7 L223.9,91.5 L224.4,87.1 L224.8,82.3 L225.1,77.3 L225.3,72.1 L225.5,66.9 L225.7,61.7 L225.8,56.7 L225.9,51.9 L226.0,47.5 L226.1,43.6 L226.2,40.3 L226.3,37.7\"/>\n<path class=\"dg-ln dg-d\" d=\"M54.0,100.9 L157.8,255.3\"/>\n<path class=\"dg-ln dg-d\" d=\"M87.0,100.9 L190.9,255.3\"/>\n<path class=\"dg-ln dg-d\" d=\"M134.2,100.9 L238.1,255.3\"/>\n<text class=\"dg-lab dg-ts\" x=\"218.3\" y=\"33.7\" text-anchor=\"start\">AS<\/text>\n<text class=\"dg-lab dg-td\" x=\"145.8\" y=\"257.3\" text-anchor=\"start\">AD<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"178.9\" y=\"257.3\" text-anchor=\"start\">AD<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"226.1\" y=\"257.3\" text-anchor=\"start\">AD<tspan dy=\"0.32em\" font-size=\"72%\">3<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-arr dg-k\" d=\"M105.9,175.8 L134.2,175.8 M127.9,178.8 L134.2,175.8 L127.9,172.7\"/>\n<path class=\"dg-arr dg-k\" d=\"M143.7,175.8 L183.8,175.8 M177.5,178.8 L183.8,175.8 L177.5,172.7\"/>\n<text class=\"dg-note dg-tk\" x=\"120.1\" y=\"161.0\" text-anchor=\"middle\" font-size=\"11\">ΔG<\/text>\n<text class=\"dg-note dg-tk\" x=\"167.3\" y=\"161.0\" text-anchor=\"middle\" font-size=\"11\">multiplied ΔC<\/text><\/g><\/svg>"},{"id":"crowding-out","title":"Crowding out in the loanable funds market","topic":"t3-6","hl":false,"steps":["Label axes Real interest rate and Quantity of loanable funds.","Draw supply of loanable funds (savings) upward and demand (borrowing) downward.","Government borrowing to fund a deficit shifts demand right, raising the interest rate from r₁ to r₂.","Private borrowing for investment falls: it is crowded out."],"explain":"When the government borrows to finance expansionary fiscal policy, it competes with firms for loanable funds. Higher interest rates reduce private investment and interest-sensitive consumption, partly offsetting the rise in AD. Keynesians argue crowding out is small in a recession because savings are high and investment demand is weak.","watch":"Show the reduced private quantity of funds, not only the higher interest rate.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Real interest rate<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity of loanable funds<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M120.1,49.4 L290.0,217.9\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,121.9 L193.2,121.9\"/>\n<path class=\"dg-drop\" d=\"M193.2,121.9 L193.2,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"210.4\" y=\"41.4\" text-anchor=\"start\">S (savings)<\/text>\n<text class=\"dg-lab dg-td\" x=\"260.4\" y=\"250.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"276.0\" y=\"235.9\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">r<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"125.9\" text-anchor=\"end\">r<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"193.2\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"193.2\" cy=\"121.9\" r=\"3.6\"/><\/g><\/svg>"},{"id":"comp-adv","title":"Absolute and comparative advantage (two-country PPCs)","topic":"t4-1","hl":true,"steps":["Put one good on each axis.","Draw a straight-line PPC for each country (constant opportunity cost).","The country with the flatter or steeper curve relative to the other has the lower opportunity cost in one good: that is its comparative advantage.","Mark a trading point outside each country's own PPC to show gains from trade."],"explain":"A country has an absolute advantage if it can produce more of a good with the same resources. It has a comparative advantage if it has a lower opportunity cost. Example: Country A can make 60 wheat or 30 cloth (1 cloth costs 2 wheat); Country B can make 40 wheat or 40 cloth (1 cloth costs 1 wheat). B has a comparative advantage in cloth, A in wheat. If each specialises and they trade at a rate between 1 and 2 wheat per cloth, both can consume beyond their PPCs.","watch":"Comparative advantage is about opportunity cost, not who produces more.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Wheat<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Cloth<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M54.0,49.4 L160.2,260.0\"/>\n<path class=\"dg-ln dg-s\" d=\"M54.0,119.6 L195.6,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"164.2\" y=\"258.0\" text-anchor=\"start\">A<\/text>\n<text class=\"dg-lab dg-ts\" x=\"199.6\" y=\"258.0\" text-anchor=\"start\">B<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"53.4\" text-anchor=\"end\">60<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"123.6\" text-anchor=\"end\">40<\/text>\n<text class=\"dg-tick\" x=\"160.2\" y=\"277.0\" text-anchor=\"middle\">30<\/text>\n<text class=\"dg-tick\" x=\"195.6\" y=\"277.0\" text-anchor=\"middle\">40<\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"110.6\" cy=\"133.6\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"116.6\" y=\"131.6\" text-anchor=\"start\">A after trade<\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"110.6\" cy=\"147.7\" r=\"3.6\"/><\/g><\/svg>"},{"id":"free-trade","title":"Free trade: domestic market with imports","topic":"t4-1","hl":false,"steps":["Draw domestic D and S with equilibrium Pd, Qe.","Draw the world price Pw below Pd: the world supply is perfectly elastic at Pw for a small country.","Domestic firms supply Q₁; consumers buy Q₂; imports = Q₂ − Q₁."],"explain":"With free trade a small country can import as much as it wants at the world price. Consumers gain (lower price, more choice); domestic producers lose sales and some may exit. The gain in consumer surplus exceeds the loss of producer surplus, so society gains overall. Other benefits: lower costs, economies of scale for exporters, competition and efficiency, access to resources, technology transfer.","watch":"Imports are read horizontally at Pw, between the supply and demand curves.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-drop\" d=\"M172.0,143.0 L172.0,260.0\"/>\n<path class=\"dg-ln dg-k\" d=\"M54.0,189.8 L285.3,189.8\"/>\n<path class=\"dg-drop\" d=\"M124.8,189.8 L124.8,260.0\"/>\n<path class=\"dg-drop\" d=\"M219.2,189.8 L219.2,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">d<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"172.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"257.3\" y=\"183.8\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">world<\/tspan><tspan dy=\"-0.32em\"> <\/tspan> = P<tspan dy=\"0.32em\" font-size=\"72%\">w<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"124.8\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"219.2\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-brace\" d=\"M124.8,189.8 l0,5 L219.2,194.8 l0,-5\"/>\n<text class=\"dg-note\" x=\"172.0\" y=\"209.8\" text-anchor=\"middle\">imports<\/text><\/g><\/svg>"},{"id":"tariff","title":"Tariff: price, quantity and welfare effects","topic":"t4-2","hl":true,"steps":["Start from free trade at Pw (domestic supply Q₁, demand Q₂).","Add the tariff: the world supply line rises to Pw + t.","Domestic supply extends to Q₃, demand contracts to Q₄; imports fall to Q₄ − Q₃.","Shade government revenue (t × imports), and the two welfare loss triangles (production inefficiency and consumption loss)."],"explain":"A tariff is a tax on imports. Effects: higher domestic price, lower consumption, more domestic production, fewer imports, tariff revenue for the government. Stakeholders: consumers lose consumer surplus; domestic producers gain producer surplus and jobs; the government gains revenue; foreign producers lose sales. The left triangle is a production inefficiency (higher-cost domestic firms replace cheaper imports); the right triangle is lost consumer surplus with no gain to anyone. Example: US tariffs on Chinese goods (2018–) and on steel and aluminium; retaliation followed.","watch":"Government revenue = tariff per unit × imports after the tariff (Q₄ − Q₃).","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-agov\" points=\"148.4,199.2 148.4,166.4 195.6,166.4 195.6,199.2\"/>\n<polygon class=\"dg-a dg-adwl\" points=\"115.4,199.2 148.4,166.4 148.4,199.2\"/>\n<polygon class=\"dg-a dg-adwl\" points=\"195.6,199.2 195.6,166.4 228.6,199.2\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-k\" d=\"M54.0,199.2 L285.3,199.2\"/>\n<path class=\"dg-ln dg-g\" d=\"M54.0,166.4 L285.3,166.4\"/>\n<path class=\"dg-drop\" d=\"M115.4,199.2 L115.4,260.0\"/>\n<path class=\"dg-drop\" d=\"M148.4,199.2 L148.4,260.0\"/>\n<path class=\"dg-drop\" d=\"M195.6,199.2 L195.6,260.0\"/>\n<path class=\"dg-drop\" d=\"M228.6,199.2 L228.6,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-alab\" x=\"172.0\" y=\"186.8\" text-anchor=\"middle\">revenue<\/text>\n<text class=\"dg-lab dg-tk\" x=\"263.3\" y=\"215.2\" text-anchor=\"start\">P<tspan dy=\"0.32em\" font-size=\"72%\">w<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-tg\" x=\"215.3\" y=\"160.4\" text-anchor=\"start\">P<tspan dy=\"0.32em\" font-size=\"72%\">w<\/tspan><tspan dy=\"-0.32em\"> <\/tspan> + tariff<\/text>\n<text class=\"dg-tick\" x=\"115.4\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"148.4\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">3<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"195.6\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">4<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"228.6\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text><\/g><\/svg>"},{"id":"quota","title":"Import quota","topic":"t4-2","hl":true,"steps":["Start from free trade at Pw.","Add the quota amount horizontally to domestic supply above Pw: S + quota.","The new price Pq is where S + quota meets D.","The area (Pq − Pw) × quota is extra revenue for importers or foreign firms holding licences (quota rent), not the government."],"explain":"A quota is a physical limit on the quantity of imports. Like a tariff it raises the domestic price, reduces consumption, increases domestic output and reduces imports. Unlike a tariff, the government earns no revenue unless it auctions import licences; the gain goes to whoever holds the licences. The welfare loss is therefore larger than with an equivalent tariff.","watch":"The S + quota line is parallel to S, shifted right by the quota amount, starting at Pw.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-agov\" points=\"148.4,199.2 148.4,166.4 195.6,166.4 195.6,199.2\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M162.6,199.2 L290.0,72.8\" stroke-dasharray=\"6 5\"/>\n<path class=\"dg-ln dg-k\" d=\"M54.0,199.2 L285.3,199.2\"/>\n<path class=\"dg-drop\" d=\"M54.0,166.4 L195.6,166.4\"/>\n<path class=\"dg-drop\" d=\"M148.4,166.4 L148.4,260.0\"/>\n<path class=\"dg-drop\" d=\"M195.6,166.4 L195.6,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"230.0\" y=\"70.8\" text-anchor=\"start\">S + quota<\/text>\n<text class=\"dg-alab\" x=\"172.0\" y=\"186.8\" text-anchor=\"middle\">quota rent<\/text>\n<text class=\"dg-lab dg-tk\" x=\"263.3\" y=\"215.2\" text-anchor=\"start\">P<tspan dy=\"0.32em\" font-size=\"72%\">w<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"170.4\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">q<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"195.6\" cy=\"166.4\" r=\"3.6\"/>\n<text class=\"dg-tick\" x=\"148.4\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">3<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"195.6\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">4<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text><\/g><\/svg>"},{"id":"prod-subsidy-trade","title":"Production subsidy to domestic firms","topic":"t4-2","hl":true,"steps":["Start from free trade at Pw.","Shift domestic supply right to S + subsidy.","Domestic output rises from Q₁ to Q₃; consumers still pay Pw and buy Q₂; imports shrink to Q₂ − Q₃.","Government cost = subsidy per unit × Q₃."],"explain":"Subsidies protect domestic producers without raising the consumer price. Domestic firms produce more and imports fall. The cost falls on taxpayers (opportunity cost of government spending). There is a welfare loss from inefficient, higher-cost domestic production. Examples: US and EU agricultural subsidies; subsidies for semiconductor and green-tech industries (US CHIPS Act, Inflation Reduction Act).","watch":"The price to consumers stays at Pw, so consumption does not change.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><polygon class=\"dg-a dg-agov\" points=\"54.0,189.8 54.0,152.4 162.6,152.4 162.6,189.8\"/>\n<path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-s\" d=\"M115.4,236.6 L290.0,63.4\"/>\n<path class=\"dg-ln dg-k\" d=\"M54.0,189.8 L285.3,189.8\"/>\n<path class=\"dg-drop\" d=\"M124.8,189.8 L124.8,260.0\"/>\n<path class=\"dg-drop\" d=\"M162.6,189.8 L162.6,260.0\"/>\n<path class=\"dg-drop\" d=\"M219.2,189.8 L219.2,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"220.0\" y=\"79.4\" text-anchor=\"start\">S + subsidy<\/text>\n<text class=\"dg-lab dg-tk\" x=\"263.3\" y=\"183.8\" text-anchor=\"start\">P<tspan dy=\"0.32em\" font-size=\"72%\">w<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"124.8\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"162.6\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">3<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"219.2\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-alab\" x=\"108.3\" y=\"175.1\" text-anchor=\"middle\">gov. cost<\/text><\/g><\/svg>"},{"id":"export-subsidy","title":"Export subsidy","topic":"t4-2","hl":true,"steps":["Draw a domestic market with Pw above the domestic equilibrium: the country exports Q₂ − Q₁ at Pw.","An export subsidy raises the price exporters receive to Pw + s, so they divert sales abroad.","Domestic price rises to Pw + s: domestic consumption falls and output rises, so exports grow."],"explain":"Export subsidies raise the revenue firms earn on each unit exported, so exports rise. Domestic consumers pay more; taxpayers fund the subsidy; foreign producers face unfair competition, and WTO rules generally prohibit such subsidies. It can lead to dumping of surpluses (e.g. historical EU agricultural export refunds).","watch":"Here Pw is above domestic equilibrium, because the country is an exporter.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Price<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-k\" d=\"M54.0,114.9 L285.3,114.9\"/>\n<path class=\"dg-ln dg-g\" d=\"M54.0,86.8 L285.3,86.8\"/>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<tspan dy=\"0.32em\" font-size=\"72%\">dom<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"118.9\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">w<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"90.8\" text-anchor=\"end\">P<tspan dy=\"0.32em\" font-size=\"72%\">w+s<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<path class=\"dg-brace\" d=\"M143.7,114.9 l0,5 L200.3,119.9 l0,-5\"/>\n<text class=\"dg-note\" x=\"172.0\" y=\"134.9\" text-anchor=\"middle\">exports<\/text>\n<path class=\"dg-brace\" d=\"M115.4,86.8 l0,-5 L228.6,81.8 l0,5\"/>\n<text class=\"dg-note\" x=\"172.0\" y=\"74.8\" text-anchor=\"middle\">exports with subsidy<\/text><\/g><\/svg>"},{"id":"forex","title":"Floating exchange rate: appreciation and depreciation","topic":"t4-5","hl":false,"steps":["Label axes Price of currency X (e.g. US$ per €) and Quantity of currency X.","Demand for the currency comes from foreigners buying exports, investing in the country (FDI, portfolio), and speculators.","Supply of the currency comes from residents buying imports and investing abroad.","Left: demand rises → appreciation. Right: supply rises → depreciation."],"explain":"In a floating system the exchange rate is set by demand and supply. Demand for a currency rises with higher foreign demand for exports, higher relative interest rates (hot money), inward investment, speculation that it will rise, and central bank buying. Supply rises with higher imports, outward investment, lower relative interest rates and speculation that it will fall. Appreciation makes exports dearer and imports cheaper; depreciation does the opposite.","watch":"Always say which currency the axes refer to, and express the price in another currency.","svg":"<svg class=\"dg\" viewBox=\"0 0 618 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Rise in demand → appreciation<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">US$ per €<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Quantity of €<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M71.6,238.0 L212.4,62.0\"/>\n<path class=\"dg-ln dg-d\" d=\"M71.6,62.0 L212.4,238.0\"/>\n<path class=\"dg-ln dg-d\" d=\"M99.8,62.0 L230.0,224.8\"/>\n<path class=\"dg-drop\" d=\"M54.0,150.0 L142.0,150.0\"/>\n<path class=\"dg-drop\" d=\"M142.0,150.0 L142.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,132.4 L156.1,132.4\"/>\n<path class=\"dg-drop\" d=\"M156.1,132.4 L156.1,260.0\"/>\n<text class=\"dg-lab dg-ts\" x=\"216.4\" y=\"66.0\" text-anchor=\"start\">S_€<\/text>\n<text class=\"dg-lab dg-td\" x=\"188.4\" y=\"250.0\" text-anchor=\"start\">D_€1<\/text>\n<text class=\"dg-lab dg-td\" x=\"206.0\" y=\"222.8\" text-anchor=\"start\">D_€2<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"154.0\" text-anchor=\"end\">ER<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"142.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"136.4\" text-anchor=\"end\">ER<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"156.1\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"142.0\" cy=\"150.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"156.1\" cy=\"132.4\" r=\"3.6\"/><\/g>\n<g transform=\"translate(318,0)\"><text class=\"dg-ptitle\" x=\"142.0\" y=\"18\" text-anchor=\"middle\">Rise in supply → depreciation<\/text>\n<path class=\"dg-axis\" d=\"M54.0,34.0 L54.0,260.0 M54.0,260.0 L236.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,38.0 L54.0,32.0 L58.0,38.0 M232.0,256.0 L238.0,260.0 L232.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"28.0\" text-anchor=\"start\">US$ per €<\/text>\n<text class=\"dg-axlab\" x=\"238.0\" y=\"290.0\" text-anchor=\"end\">Quantity of €<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-d\" d=\"M71.6,62.0 L212.4,238.0\"/>\n<path class=\"dg-ln dg-s\" d=\"M71.6,238.0 L212.4,62.0\"/>\n<path class=\"dg-ln dg-s\" d=\"M99.8,238.0 L230.0,75.2\"/>\n<path class=\"dg-drop\" d=\"M54.0,150.0 L142.0,150.0\"/>\n<path class=\"dg-drop\" d=\"M142.0,150.0 L142.0,260.0\"/>\n<path class=\"dg-drop\" d=\"M54.0,167.6 L156.1,167.6\"/>\n<path class=\"dg-drop\" d=\"M156.1,167.6 L156.1,260.0\"/>\n<text class=\"dg-lab dg-td\" x=\"216.4\" y=\"242.0\" text-anchor=\"start\">D_€<\/text>\n<text class=\"dg-lab dg-ts\" x=\"176.4\" y=\"66.0\" text-anchor=\"start\">S_€1<\/text>\n<text class=\"dg-lab dg-ts\" x=\"234.0\" y=\"79.2\" text-anchor=\"start\">S_€2<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"154.0\" text-anchor=\"end\">ER<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"142.0\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"171.6\" text-anchor=\"end\">ER<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"156.1\" y=\"277.0\" text-anchor=\"middle\">Q<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"142.0\" cy=\"150.0\" r=\"3.6\"/>\n<circle class=\"dg-dot dg-fk\" cx=\"156.1\" cy=\"167.6\" r=\"3.6\"/><\/g><\/svg>"},{"id":"fixed-er","title":"Maintaining a fixed exchange rate","topic":"t4-5","hl":false,"steps":["Draw D and S for the currency with a fixed rate ER* above the market equilibrium.","At ER* there is excess supply of the currency.","The central bank buys the excess using foreign currency reserves (shifting D right to D₂), or raises interest rates to attract capital inflows."],"explain":"Under a fixed (pegged) system the government or central bank commits to a rate against another currency (e.g. the Hong Kong dollar against the US dollar, the Danish krone against the euro). To hold the peg when the currency is under downward pressure, the central bank sells foreign reserves to buy its own currency or raises interest rates; under upward pressure it sells its own currency and builds reserves. Devaluation/revaluation are deliberate changes to the peg.","watch":"Use devaluation/revaluation for fixed systems and depreciation/appreciation for floating ones.","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,260.0 L296.0,260.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,256.0 L298.0,260.0 L292.0,264.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Exchange rate<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"290.0\" text-anchor=\"end\">Quantity of currency<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"275.0\" text-anchor=\"end\">0<\/text>\n<path class=\"dg-ln dg-s\" d=\"M77.6,236.6 L266.4,49.4\"/>\n<path class=\"dg-ln dg-d\" d=\"M77.6,49.4 L266.4,236.6\"/>\n<path class=\"dg-ln dg-d\" d=\"M124.8,49.4 L290.0,213.2\"/>\n<path class=\"dg-drop\" d=\"M54.0,143.0 L172.0,143.0\"/>\n<path class=\"dg-ln dg-g\" d=\"M54.0,110.2 L285.3,110.2\"/>\n<text class=\"dg-lab dg-ts\" x=\"270.4\" y=\"53.4\" text-anchor=\"start\">S<\/text>\n<text class=\"dg-lab dg-td\" x=\"270.4\" y=\"240.6\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">1<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-lab dg-td\" x=\"280.0\" y=\"231.2\" text-anchor=\"start\">D<tspan dy=\"0.32em\" font-size=\"72%\">2<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"147.0\" text-anchor=\"end\">ER<tspan dy=\"0.32em\" font-size=\"72%\">e<\/tspan><tspan dy=\"-0.32em\"> <\/tspan><\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"172.0\" cy=\"143.0\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tg\" x=\"235.3\" y=\"104.2\" text-anchor=\"start\">ER* (peg)<\/text>\n<path class=\"dg-brace\" d=\"M139.0,110.2 l0,5 L205.0,115.2 l0,-5\"/>\n<text class=\"dg-note\" x=\"172.0\" y=\"130.2\" text-anchor=\"middle\">excess supply<\/text><\/g><\/svg>"},{"id":"j-curve","title":"The J-curve","topic":"t4-6","hl":true,"steps":["Label axes Time and Current account balance (with zero in the middle).","Start with a deficit; mark the depreciation.","The deficit first gets worse, then improves and moves into surplus: the shape of a J."],"explain":"After a depreciation, import and export volumes take time to respond (existing contracts, habits, time to find new suppliers), so in the short run demand is price inelastic: the country pays more for the same imports and the current account worsens. Over time, as the Marshall–Lerner condition (PEDx + PEDm > 1) is met, export volumes rise and imports fall, so the balance improves.","watch":"The vertical axis must allow negative values (deficit below zero).","svg":"<svg class=\"dg\" viewBox=\"0 0 360 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,0)\"><path class=\"dg-axis\" d=\"M54.0,20.0 L54.0,260.0 M54.0,143.0 L296.0,143.0\"/>\n<path class=\"dg-axis\" d=\"M50.0,24.0 L54.0,18.0 L58.0,24.0 M292.0,139.0 L298.0,143.0 L292.0,147.0\"/>\n<text class=\"dg-axlab\" x=\"46.0\" y=\"14.0\" text-anchor=\"start\">Current account balance<\/text>\n<text class=\"dg-axlab\" x=\"298.0\" y=\"173.0\" text-anchor=\"end\">Time<\/text>\n<path class=\"dg-ln dg-d\" d=\"M54.0,161.7 L55.7,161.6 L58.0,161.4 L60.6,161.2 L63.6,160.9 L66.8,160.5 L70.2,160.3 L73.7,160.1 L77.2,160.0 L80.5,160.1 L83.8,160.4 L86.8,160.9 L89.4,161.7 L91.8,162.9 L93.9,164.4 L96.0,166.3 L97.9,168.3 L99.7,170.5 L101.5,172.8 L103.3,175.2 L105.0,177.5 L106.9,179.7 L108.8,181.8 L110.8,183.6 L113.0,185.1 L115.3,186.5 L117.6,187.9 L120.0,189.3 L122.4,190.7 L124.8,191.9 L127.3,193.0 L129.9,193.9 L132.5,194.7 L135.2,195.1 L137.9,195.2 L140.8,195.1 L143.7,194.5 L146.7,193.5 L149.7,192.2 L152.9,190.6 L156.1,188.8 L159.4,186.6 L162.7,184.2 L166.1,181.7 L169.6,178.9 L173.1,175.9 L176.6,172.9 L180.2,169.7 L183.8,166.4 L187.5,162.9 L191.2,159.1 L195.0,155.0 L198.9,150.6 L202.8,146.1 L206.8,141.5 L210.8,136.9 L214.8,132.3 L218.9,127.7 L222.9,123.2 L227.0,119.0 L231.0,114.9 L235.2,110.9 L239.7,106.9 L244.4,102.7 L249.2,98.6 L254.0,94.6 L258.7,90.6 L263.3,86.9 L267.6,83.4 L271.6,80.1 L275.1,77.3 L278.2,74.8 L280.6,72.8\"/>\n<text class=\"dg-lab dg-td\" x=\"220.6\" y=\"64.8\" text-anchor=\"start\">J-curve<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"100.2\" text-anchor=\"end\">surplus<\/text>\n<text class=\"dg-tick\" x=\"48.0\" y=\"193.8\" text-anchor=\"end\">deficit<\/text>\n<circle class=\"dg-dot dg-fk\" cx=\"89.4\" cy=\"161.7\" r=\"3.6\"/>\n<text class=\"dg-lab dg-tk\" x=\"59.4\" y=\"187.7\" text-anchor=\"start\">depreciation<\/text><\/g><\/svg>"},{"id":"poverty-cycle","title":"The poverty cycle (trap)","topic":"t4-9","hl":false,"steps":["Draw a loop of boxes: low income → low savings → low investment (physical, human and natural capital) → low productivity → low income.","Add arrows showing each step causing the next.","Show where policies (aid, FDI, microfinance, education spending) could break the cycle."],"explain":"Low incomes mean households spend almost everything on necessities, so savings are low. Low savings mean little investment in physical capital, education and health. Without capital, productivity stays low, which keeps incomes low. The cycle passes from one generation to the next. Breaking it needs an injection from outside: aid, FDI, remittances, microcredit, government investment in human capital or infrastructure.","watch":"Name the forms of capital: physical, human, natural and (sometimes) social.","svg":"<svg class=\"dg fl\" viewBox=\"0 0 560 330\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"fl-box fl-d\" x=\"200\" y=\"18\" width=\"160\" height=\"50\" rx=\"6\"/>\n<text class=\"fl-t\" x=\"280.0\" y=\"48.0\" text-anchor=\"middle\">Low income<\/text>\n<rect class=\"fl-box fl-k\" x=\"380\" y=\"140\" width=\"160\" height=\"50\" rx=\"6\"/>\n<text class=\"fl-t\" x=\"460.0\" y=\"170.0\" text-anchor=\"middle\">Low savings<\/text>\n<rect class=\"fl-box fl-s\" x=\"200\" y=\"262\" width=\"160\" height=\"50\" rx=\"6\"/>\n<text class=\"fl-t\" x=\"280.0\" y=\"284.0\" text-anchor=\"middle\">Low investment<\/text>\n<text class=\"fl-t\" x=\"280.0\" y=\"300.0\" text-anchor=\"middle\">in capital<\/text>\n<rect class=\"fl-box fl-k\" x=\"20\" y=\"140\" width=\"160\" height=\"50\" rx=\"6\"/>\n<text class=\"fl-t\" x=\"100.0\" y=\"170.0\" text-anchor=\"middle\">Low productivity<\/text>\n<path class=\"fl-arr fl-k\" d=\"M360.0,50.0 L450.0,50.0 L450.0,140.0 M446.7,132.7 L450.0,140.0 L453.3,132.7\"/>\n<path class=\"fl-arr fl-k\" d=\"M460.0,190.0 L460.0,287.0 L360.0,287.0 M367.3,283.7 L360.0,287.0 L367.3,290.3\"/>\n<path class=\"fl-arr fl-k\" d=\"M200.0,287.0 L100.0,287.0 L100.0,190.0 M103.3,197.3 L100.0,190.0 L96.7,197.3\"/>\n<path class=\"fl-arr fl-k\" d=\"M100.0,140.0 L100.0,43.0 L200.0,43.0 M192.7,46.3 L200.0,43.0 L192.7,39.7\"/>\n<text class=\"fl-n fl-tc\" x=\"280\" y=\"152\" text-anchor=\"middle\">break the cycle:<\/text>\n<text class=\"fl-n fl-tc\" x=\"280\" y=\"170\" text-anchor=\"middle\">aid · FDI · microfinance<\/text>\n<text class=\"fl-n fl-tc\" x=\"280\" y=\"188\" text-anchor=\"middle\">education · health<\/text>\n<text class=\"fl-n fl-tc\" x=\"280\" y=\"206\" text-anchor=\"middle\">infrastructure<\/text><\/svg>"}],"mcq":[],"essays":[]}</script>
<script>(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => String(h).replace(/<[^>]+>/g, '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
const view = $('#view');

// ---------- indexes ----------
const ALLUNITS = [...D.units, ...D.exam, ...D.formulas];
const UNIT = {}, TOPIC = {}, ENTRY = {}, DIA = {}, TOPIC_SEQ = [];
ALLUNITS.forEach(u => { UNIT[u.id] = u; u.topics.forEach(t => { t.unit = u; TOPIC[t.id] = t; TOPIC_SEQ.push(t); t.entries.forEach(e => { e.topicObj = t; ENTRY[e.id] = e; }); }); });
D.dias.forEach(d => DIA[d.id] = d);
const SYL_TOPICS = D.units.flatMap(u => u.topics);
const SYL_ENTRIES = SYL_TOPICS.flatMap(t => t.entries);
const UNIT_HUE = {u1:'Introduction', u2:'Microeconomics', u3:'Macroeconomics', u4:'The global economy'};
const unitLabel = u => u.id.match(/^u\d/) ? `Unit ${u.id.slice(1)}` : u.title;
const unitOfTopic = tid => TOPIC[tid] ? TOPIC[tid].unit : null;

// ---------- storage & progress ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let P = Object.assign({learnt:{}, flash:{}, quiz:{n:0, c:0}, calc:{n:0, c:0}, last:null, updatedAt:0}, store.get('econ-progress', {}));
let progDoc = null, saveT = null, applyingRemote = false;
function saveP(){
  P.updatedAt = Date.now(); store.set('econ-progress', P);
  if (progDoc && !applyingRemote){ clearTimeout(saveT); saveT = setTimeout(() => { progDoc.set(JSON.parse(JSON.stringify(P))).catch(()=>{}); }, 1200); }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    progDoc = db.doc('data/users/' + id + '/progress');
    let first = true;
    progDoc.onSnapshot(snap => {
      const r = snap.exists ? snap.data() : null;
      if (r && (r.updatedAt || 0) > (P.updatedAt || 0)){
        applyingRemote = true; P = Object.assign({learnt:{}, flash:{}, quiz:{n:0,c:0}, calc:{n:0,c:0}}, r); store.set('econ-progress', P); applyingRemote = false;
        renderRail(); if (['home'].includes(curRoute()) || TOPIC[curRoute()] || UNIT[curRoute()]) route();
      } else if (first && (!r || (P.updatedAt || 0) > (r.updatedAt || 0)) && P.updatedAt){ progDoc.set(JSON.parse(JSON.stringify(P))).catch(()=>{}); }
      first = false;
      $('#syncNote').textContent = 'Progress syncs to your account.';
    }, () => {});
  } catch(e){}
})();
const learntIn = list => list.filter(e => P.learnt[e.id]).length;
function pct(list){ return list.length ? Math.round(100 * learntIn(list) / list.length) : 0; }

// ---------- level & theme ----------
let SL = store.get('econ-sl', false);
function applyLevel(){ document.body.classList.toggle('sl', SL); $('#lvHL').setAttribute('aria-pressed', String(!SL)); $('#lvSL').setAttribute('aria-pressed', String(SL)); }
$('#lvHL').onclick = () => { SL = false; store.set('econ-sl', SL); applyLevel(); };
$('#lvSL').onclick = () => { SL = true; store.set('econ-sl', SL); applyLevel(); toast('SL view: HL-only material hidden'); };
applyLevel();
function applyTheme(t){
  if (t === 'auto'){ document.documentElement.removeAttribute('data-theme'); try{ localStorage.removeItem('econ-theme'); }catch(e){} }
  else { document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('econ-theme', t); }catch(e){} }
  $$('[data-th]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.th === t)));
}
$$('[data-th]').forEach(b => b.onclick = () => applyTheme(b.dataset.th));
applyTheme(document.documentElement.getAttribute('data-theme') || 'auto');
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

// ---------- diagrams ----------
const isWide = d => { const m = d.svg.match(/viewBox="0 0 (\d+)/); return m && +m[1] > 430; };
function figHTML(id){
  const d = DIA[id]; if (!d) return '';
  return `<figure class="fig ${isWide(d)?'wide':''} ${d.hl?'hl-only':''}" id="fig-${id}"><div class="svgwrap">${d.svg}</div>
    <figcaption>${esc(d.title)} ${d.hl?'<span class="badge hl">HL</span>':''}<a href="#d-${id}">Open diagram →</a></figcaption>
    <details><summary>How to draw it and what it shows</summary><ol>${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p>${esc(d.explain)}</p>${d.watch?`<p class="watch"><b>Watch out:</b> ${esc(d.watch)}</p>`:''}</details></figure>`;
}
const LEGEND = `<div class="legend"><span><i style="background:var(--c-d)"></i>demand side</span><span><i style="background:var(--c-s)"></i>supply side</span><span><i style="background:var(--c-c)"></i>costs</span><span><i style="background:var(--c-m)"></i>marginal revenue</span><span><i style="background:var(--c-g)"></i>government</span></div>`;

// ---------- rail ----------
function renderRail(){
  const r = curRoute(); const t = TOPIC[r] || (ENTRY[r] && ENTRY[r].topicObj); const u = UNIT[r] || (t && t.unit);
  let h = `<a href="#home" class="${r==='home'?'on':''}"><span>Home</span></a><div class="grp">Syllabus</div>`;
  D.units.forEach(U => {
    const ents = U.topics.flatMap(x => x.entries);
    h += `<a href="#${U.id}" class="${u===U && !t?'on':''}"><span class="num">${U.id.slice(1)}</span><span>${esc(U.title)}</span><span class="n">${pct(ents)}%</span></a>`;
    if (u === U){
      h += '<div class="sub">' + U.topics.map(T => `<a href="#${T.id}" class="${t===T?'on':''} ${T.level==='HL'?'hl-only':''}"><span class="num">${T.num}</span><span>${esc(T.title)}</span>${T.level==='HL'?'<span class="n">HL</span>':''}</a>` +
        (t === T ? '<div class="toc">' + T.entries.map(e => `<a href="#${e.id}" data-toc="${e.id}" class="${e.hl?'hl-only':''}">${esc(e.title)}</a>`).join('') + '</div>' : '')).join('') + '</div>';
    }
  });
  h += `<div class="grp">Toolkit</div>
    <a href="#diagrams" class="${r==='diagrams'||r.startsWith('d-')?'on':''}"><span>Diagrams</span><span class="n">${D.dias.length}</span></a>
    <a href="#formulas" class="${u&&u.id==='f'?'on':''}"><span>Formulas &amp; calculations</span></a>

let pendingScroll = null;
const curRoute = () => decodeURIComponent((location.hash || '#home').slice(1)) || 'home';
function route(){
  const r = curRoute();

  let scrollTo = null;
  if (r === 'home') view.innerHTML = homeHTML();
  else if (UNIT[r] && r.match(/^u\d/)) view.innerHTML = unitHTML(UNIT[r]);

  else if (r === 'diagrams') view.innerHTML = diagramsHTML();

  else if (r === 'glossary') { view.innerHTML = glossaryHTML(); bindGlossary(); }
  else if (r === 'practice') view.innerHTML = practiceHTML();

  else if (r === 'quiz') { view.innerHTML = '<div id="pv"></div>'; quizSetup(); }
  else if (r === 'drills') { view.innerHTML = '<div id="pv"></div>'; drillSetup(); }
  else if (r === 'diagram-drill') { view.innerHTML = '<div id="pv"></div>'; ddrillStart(); }
  else if (r === 'essays') { view.innerHTML = '<div id="pv"></div>'; essaysRender(); }
  else if (r === 'missing') view.innerHTML = missingHTML();
  else if (r === 'search') view.innerHTML = searchPageHTML(lastQuery);
  else view.innerHTML = `<div class="phead"><h1>Page not found</h1><p class="lede">That link doesn't match anything in the guide. <a href="#home">Go to the start page</a>.</p></div>`;
  fillDiagrams();

  if (scrollTo){ const el = document.getElementById(scrollTo); if (el){ el.scrollIntoView({block:'start'}); el.classList.remove('flashme'); void el.offsetWidth; el.classList.add('flashme'); } }
  else if (pendingScroll !== null){ window.scrollTo(0, pendingScroll); pendingScroll = null; }

// ---------- search ----------
const IDX = [];
SYL_TOPICS.concat(D.exam.flatMap(u=>u.topics), D.formulas.flatMap(u=>u.topics)).forEach(t => {
  IDX.push({k:'Topic', title:(t.num ? t.num + ' ' : '') + t.title, body:(t.blurb||'').toLowerCase(), href:'#'+t.id, snip:t.blurb||'', w:3});
  t.entries.forEach(e => IDX.push({k: t.num ? t.num + ' · note' : t.unit.title, title:e.title, body:(e.text + ' ' + e.terms.map(x=>x[0]).join(' ')).toLowerCase(), raw:e.text, href:'#'+e.id, w:2}));
});
D.dias.forEach(d => IDX.push({k:'Diagram', title:d.title, body:(d.explain + ' ' + d.steps.join(' ')).toLowerCase(), raw:d.explain, href:'#d-'+d.id, w:2}));
D.glossary.forEach(g => IDX.push({k:'Key term', title:g.t, body:strip(g.d).toLowerCase(), raw:strip(g.d), href:'#glossary', term:g.t.toLowerCase(), w:4}));
IDX.forEach(x => x.tl = x.title.toLowerCase());
function search(q){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean); if (!toks.length) return [];
  const out = [];
  for (const x of IDX){
    let s = 0, ok = true;
    for (const t of toks){ const inT = x.tl.includes(t); const inB = x.body.includes(t); if (!inT && !inB){ ok = false; break; } s += inT ? 6 : 1; if (inT && x.tl.startsWith(t)) s += 2; }
    if (!ok) continue;
    if (x.tl === q.toLowerCase()) s += 12;
    out.push([s * x.w, x]);
  }
  return out.sort((a, b) => b[0] - a[0]).map(a => a[1]);
}
function snippet(x, q){
  const raw = x.raw || x.snip || ''; const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  let i = -1; for (const t of toks){ i = raw.toLowerCase().indexOf(t); if (i >= 0) break; }
  let s = i < 0 ? raw.slice(0, 140) : (i > 60 ? '…' : '') + raw.slice(Math.max(0, i - 60), i + 110) + '…';
  s = esc(s); toks.forEach(t => { s = s.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
  return s;
}

});
qi.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ const q = qi.value.trim(); if (q.length > 1){ lastQuery = q; if (curRoute() === 'search') route(); else location.hash = 'search'; } } if (ev.key === 'Escape'){ qi.value = ''; closeResults(); } });
function closeResults(){ res.hidden = true; }

}

// ---------- flashcards ----------
let FL = {unit: store.get('econ-flunit', 'all'), rev: false, card: null, shown: false};
function flashDeck(){ return D.glossary.filter(g => (FL.unit === 'all' || g.u === FL.unit) && (!SL || !g.hl) && g.u.match(/^u\d/)); }
function flashNext(){
  const deck = flashDeck(); if (!deck.length){ FL.card = null; return; }
  const w = deck.map(g => { const b = P.flash[g.t] || 0; return [g, b === 0 ? 4 : Math.max(0.3, 5 - b)]; });
  let tot = w.reduce((s, x) => s + x[1], 0), r = Math.random() * tot;
  for (const [g, x] of w){ r -= x; if (r <= 0){ if (g !== FL.card || deck.length === 1){ FL.card = g; break; } } }
  if (!FL.card || !deck.includes(FL.card)) FL.card = deck[Math.floor(Math.random() * deck.length)];
  FL.shown = false;
}
function flashStart(){ flashNext(); flashRender(); }
function flashRender(){
  const deck = flashDeck(); const c = FL.card; const pv = $('#pv'); if (!pv) return;
  const counts = [0,0,0,0,0,0]; deck.forEach(g => counts[P.flash[g.t] || 0]++);
  pv.innerHTML = `<div class="phead"><div class="eyebrow"><a href="#practice">Practice</a><span>${deck.length} cards</span></div><h1>Flashcards</h1>
    <p class="lede">Say the definition out loud, flip, then be honest. Cards you get right move up a box and come back less often.</p></div>
    <div class="gtools">${unitFilterHTML(FL.unit, 'fl')}<button class="btn ghost" id="flRev">${FL.rev ? 'Show term first' : 'Show definition first'}</button></div>
    ${c ? `<div class="pcard flash-card" id="flCard" tabindex="0" role="button" aria-label="Flip card">
      <span class="fh">${FL.shown ? (FL.rev ? 'Term' : 'Definition') : (FL.rev ? 'Which term is this?' : 'Define')}${TOPIC[c.topic] ? ' · ' + TOPIC[c.topic].num : ''}</span>
      ${FL.rev ? (FL.shown ? `<div class="ft">${esc(c.t)}</div><div class="fd">${c.d}</div>` : `<div class="fd">${c.d.replace(new RegExp(c.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig'), '___')}</div>`)
               : (FL.shown ? `<div class="ft">${esc(c.t)}</div><div class="fd">${c.d}</div>` : `<div class="ft">${esc(c.t)}</div>`)}
      ${FL.shown ? '' : '<span class="fh">Tap or press space to flip</span>'}</div>
    <div class="prow">${FL.shown ? `<button class="btn ghost" id="flAgain">Again (1)</button><button class="btn" id="flGot">Got it (2)</button><a href="#${c.e}" style="font-size:14px">Read the note →</a>` : `<button class="btn" id="flFlip">Flip</button>`}
      <span class="sp"></span><span class="boxes" title="Cards in each box">${counts.map((n, i) => `<span>${i === 0 ? 'new' : 'box ' + i} ${n}</span>`).join('')}</span></div>`
    : '<div class="empty">No cards in this filter.</div>'}`;
  const flip = () => { FL.shown = true; flashRender(); };
  $('#flCard') && ($('#flCard').onclick = () => { if (!FL.shown) flip(); });
  $('#flFlip') && ($('#flFlip').onclick = flip);
  $('#flAgain') && ($('#flAgain').onclick = () => { P.flash[c.t] = 1; saveP(); flashNext(); flashRender(); });
  $('#flGot') && ($('#flGot').onclick = () => { P.flash[c.t] = Math.min(5, (P.flash[c.t] || 0) + 1); saveP(); flashNext(); flashRender(); });
  $('#flRev').onclick = () => { FL.rev = !FL.rev; FL.shown = false; flashRender(); };
  pv.querySelector('[data-uf]').onclick = ev => { const b = ev.target.closest('[data-u]'); if (!b) return; FL.unit = b.dataset.u; store.set('econ-flunit', FL.unit); flashNext(); flashRender(); };
}
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,textarea')) return;

  if (r === 'quiz' && QZ.qs && /^[1-4]$/.test(ev.key)) $$('.qopts button')[+ev.key - 1]?.click();
});

function quizRender(){
  const q = QZ.qs[QZ.i]; const t = TOPIC[q.t];
  $('#pv').innerHTML = `<div class="phead"><div class="eyebrow"><a href="#practice">Practice</a><a href="#quiz">Quiz</a></div><h1>Quiz</h1></div>
    <div class="pcard"><div class="qmeta"><span>Question ${QZ.i + 1} of ${QZ.qs.length}</span><span>${t ? t.num + ' ' + esc(t.title) : ''}</span><span>Score ${QZ.score}</span></div>
    <div class="qq">${q.q}</div><div class="qopts">${q.order.map((oi, k) => `<button data-oi="${oi}"><b>${k + 1}.</b> ${q.a[oi]}</button>`).join('')}</div>
    <div id="qx"></div></div>`;
  $$('.qopts button').forEach(b => b.onclick = () => {
    if (QZ.answered) return; QZ.answered = true;
    const ok = +b.dataset.oi === q.c; if (ok) QZ.score++;
    P.quiz.n++; if (ok) P.quiz.c++; saveP();
    $$('.qopts button').forEach(x => { x.disabled = true; if (+x.dataset.oi === q.c) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    $('#qx').innerHTML = `<div class="qx"><p class="verdict ${ok?'ok':'bad'}">${ok ? 'Correct' : 'Not quite'}</p>${q.x ? `<p>${q.x}</p>` : ''}${t ? `<p><a href="#${t.id}">Revise ${t.num} ${esc(t.title)} →</a></p>` : ''}
      <div class="prow"><button class="btn" id="qzNext">${QZ.i + 1 < QZ.qs.length ? 'Next question' : 'See score'}</button></div></div>`;
