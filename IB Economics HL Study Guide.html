ns<\/strong><\/td><td>Stronger property rights, less corruption, competition, deregulation, better infrastructure<\/td><\/tr><tr><td><strong>Reductions in the natural rate of unemployment<\/strong><\/td><td>Better job matching, retraining, labour market flexibility<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>SRAS factors (costs) shift SRAS; LRAS factors (capacity) shift LRAS and the PPC. Do not explain a rise in oil prices as a shift in LRAS.<\/p><\/div>","text":"Factor Example Quantity of factors Immigration, higher labour force participation (more women in work), discovery of resources, investment in capital Quality of factors Education and training (human capital), better health, better capital equipment Technology Automation, AI, the internet, improvements in agriculture Efficiency and institutions Stronger property rights, less corruption, competition, deregulation, better infrastructure Reductions in the natural rate of unemployment Better job matching, retraining, labour market flexibility Exam tip SRAS factors (costs) shift SRAS; LRAS factors (capacity) shift LRAS and the PPC. Do not explain a rise in oil prices as a shift in LRAS.","dias":["lras-shift"]}]},{"id":"t3-3","num":"3.3","title":"Macroeconomic objectives","level":"SL","blurb":"Growth, unemployment, inflation and deflation, conflicts between objectives (HL: Phillips curves), and sustainable government debt.","entries":[{"id":"e-growth","title":"Economic growth","hl":false,"terms":[["Economic growth","An increase in real GDP (or real GDP per capita) over time, usually measured as an annual percentage change."],["Short-term growth","Growth from using existing resources more fully, caused by higher AD; a move towards the PPC."],["Long-term growth","Growth in potential output, caused by an increase in the quantity or quality of factors of production; an outward shift of the PPC and LRAS."]],"topic":"t3-3","html":"<div class=\"box formula\"><div class=\"box-h\">Growth rate<\/div><div class=\"fx\"><div class=\"fx-eq\">Growth rate = \\frac{real GDP<sub>year 2<\/sub> − real GDP<sub>year 1<\/sub>}{real GDP<sub>year 1<\/sub>} × 100<\/div><\/div><\/div>\n<ul><li><strong>Short-term growth<\/strong>: AD rises (e.g. a fall in interest rates), the economy moves towards full capacity: on an AD–AS diagram, a rightward shift of AD along SRAS; on a PPC, a move from inside to the curve.<\/li><li><strong>Long-term growth<\/strong>: LRAS shifts right; the PPC shifts out.<\/li><\/ul>\n<h4>Consequences<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Positive<\/th><th>Negative<\/th><\/tr><\/thead><tbody><tr><td>Higher incomes and living standards; more jobs<\/td><td>Inflation if AD outpaces AS<\/td><\/tr><tr><td>More tax revenue for public services without raising tax rates<\/td><td><strong>Environmental damage<\/strong>: pollution, resource depletion, climate change<\/td><\/tr><tr><td>Lower poverty (absolute)<\/td><td><strong>Inequality<\/strong> can widen if gains go to the top<\/td><\/tr><tr><td>Firms invest more; virtuous cycle<\/td><td>Current account deficits as imports rise<\/td><\/tr><tr><td><\/td><td>Stress, longer working hours, loss of traditional ways of life<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>A rise in the growth rate does not automatically mean inflation: if LRAS shifts right, the economy can grow with stable or falling prices.<\/p><\/div>","text":"Growth rate Growth rate = \\frac{real GDP year 2 − real GDP year 1 }{real GDP year 1 } × 100 Short-term growth : AD rises (e.g. a fall in interest rates), the economy moves towards full capacity: on an AD–AS diagram, a rightward shift of AD along SRAS; on a PPC, a move from inside to the curve. Long-term growth : LRAS shifts right; the PPC shifts out. Consequences Positive Negative Higher incomes and living standards; more jobs Inflation if AD outpaces AS More tax revenue for public services without raising tax rates Environmental damage : pollution, resource depletion, climate change Lower poverty (absolute) Inequality can widen if gains go to the top Firms invest more; virtuous cycle Current account deficits as imports rise Stress, longer working hours, loss of traditional ways of life Exam tip A rise in the growth rate does not automatically mean inflation: if LRAS shifts right, the economy can grow with stable or falling prices.","dias":[]},{"id":"e-unemployment","title":"Unemployment: measurement, types and costs","hl":false,"terms":[["Unemployment","People of working age who are without a job, available for work and actively seeking work."],["Unemployment rate","The number of unemployed people as a percentage of the labour force."],["Labour force","All people of working age who are either employed or unemployed (actively seeking work)."],["Underemployment","When people work fewer hours than they want, or in jobs below their skill level."],["Hidden unemployment","People who want work but are not counted as unemployed, e.g. discouraged workers who have stopped looking or people on disability benefits."],["Frictional unemployment","Short-term unemployment of people between jobs."],["Seasonal unemployment","Unemployment caused by seasonal changes in demand, e.g. ski instructors in summer."],["Structural unemployment","Long-term unemployment caused by changes in the structure of the economy (demand, technology, location), leaving workers with the wrong skills or in the wrong place."],["Cyclical unemployment","Unemployment caused by a fall in aggregate demand during a downturn (demand-deficient unemployment)."],["Natural rate of unemployment (NRU)","The rate of unemployment when the economy is at full employment: frictional + structural + seasonal unemployment."]],"topic":"t3-3","html":"<div class=\"box formula\"><div class=\"box-h\">Unemployment rate<\/div><div class=\"fx\"><div class=\"fx-eq\">Unemployment rate = <span class=\"fr\"><span>number unemployed<\/span><span>labour force<\/span><\/span> × 100<\/div><\/div><div class=\"fx\"><div class=\"fx-eq\">Labour force = employed + unemployed<\/div><\/div><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Unemployment rate<\/div><p>Employed = 31.2m, unemployed = 1.3m. Labour force = 32.5m. Rate = 1.3 ÷ 32.5 × 100 = <strong>4%<\/strong>.<\/p><\/div>\n<p><strong>Measurement problems<\/strong>: hidden unemployment (discouraged workers), underemployment (part-time workers wanting full-time), the informal economy, regional and group disparities hidden by averages (youth unemployment in Spain above 25%), and differences between the claimant count and the ILO labour force survey.<\/p>\n<h4>Types and causes<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Type<\/th><th>Cause<\/th><th>Policy<\/th><\/tr><\/thead><tbody><tr><td><strong>Frictional<\/strong><\/td><td>Time spent searching between jobs<\/td><td>Better information: job centres, online matching<\/td><\/tr><tr><td><strong>Seasonal<\/strong><\/td><td>Demand varies by season<\/td><td>Hard to remove; diversify the local economy<\/td><\/tr><tr><td><strong>Structural<\/strong><\/td><td>Changing demand, technology, globalisation; occupational and geographical immobility<\/td><td>Retraining, education, relocation help, regional policy<\/td><\/tr><tr><td><strong>Cyclical<\/strong><\/td><td>Fall in AD<\/td><td>Expansionary fiscal and monetary policy<\/td><\/tr><tr><td><strong>Real-wage<\/strong><\/td><td>Wages held above equilibrium<\/td><td>Labour market reforms (contested)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"dslot\" data-d=\"cyclical-unemp\"><\/div>\n<div class=\"dslot\" data-d=\"structural-unemp\"><\/div>\n<div class=\"dslot\" data-d=\"real-wage-unemp\"><\/div>\n<h4>Costs of unemployment<\/h4>\n<ul><li><strong>Individuals<\/strong>: lost income, stress and poor health, loss of skills (making future jobs harder), family breakdown.<\/li><li><strong>Society<\/strong>: crime, social exclusion, regional decline.<\/li><li><strong>Economy<\/strong>: lost output (inside the PPC), lower tax revenue and higher benefit spending (worse budget balance), greater inequality and poverty, possible <strong>hysteresis<\/strong> (long-term unemployment raises the natural rate).<\/li><\/ul>","text":"Unemployment rate Unemployment rate = number unemployed labour force × 100 Labour force = employed + unemployed Worked example: Unemployment rate Employed = 31.2m, unemployed = 1.3m. Labour force = 32.5m. Rate = 1.3 ÷ 32.5 × 100 = 4% . Measurement problems : hidden unemployment (discouraged workers), underemployment (part-time workers wanting full-time), the informal economy, regional and group disparities hidden by averages (youth unemployment in Spain above 25%), and differences between the claimant count and the ILO labour force survey. Types and causes Type Cause Policy Frictional Time spent searching between jobs Better information: job centres, online matching Seasonal Demand varies by season Hard to remove; diversify the local economy Structural Changing demand, technology, globalisation; occupational and geographical immobility Retraining, education, relocation help, regional policy Cyclical Fall in AD Expansionary fiscal and monetary policy Real-wage Wages held above equilibrium Labour market reforms (contested) Costs of unemployment Individuals : lost income, stress and poor health, loss of skills (making future jobs harder), family breakdown. Society : crime, social exclusion, regional decline. Economy : lost output (inside the PPC), lower tax revenue and higher benefit spending (worse budget balance), greater inequality and poverty, possible hysteresis (long-term unemployment raises the natural rate).","dias":["cyclical-unemp","structural-unemp","real-wage-unemp"]},{"id":"e-inflation","title":"Inflation, disinflation and deflation","hl":false,"terms":[["Inflation","A sustained increase in the average price level in an economy over a period of time."],["Disinflation","A fall in the rate of inflation: prices are still rising, but more slowly."],["Deflation","A sustained decrease in the average price level in an economy."],["Consumer price index (CPI)","An index of the average prices of a representative basket of goods and services bought by a typical household, weighted by their share in spending."],["Demand-pull inflation","Inflation caused by aggregate demand growing faster than aggregate supply."],["Cost-push inflation","Inflation caused by rising costs of production shifting SRAS left."],["Stagflation","Rising inflation combined with stagnant or falling output and rising unemployment."],["Core inflation","An inflation measure that excludes volatile items such as food and energy."],["Producer price index (PPI)","An index measuring changes in the prices firms pay for inputs or receive for output; an early signal of consumer price inflation."]],"topic":"t3-3","html":"<h4>Measuring inflation<\/h4>\n<p>A <strong>basket<\/strong> of typical goods and services is priced each month; each item is <strong>weighted<\/strong> by its share of household spending. The CPI compares the cost of the basket with a base year (= 100).<\/p>\n<div class=\"box formula\"><div class=\"box-h\">Inflation from a price index<\/div><div class=\"fx\"><div class=\"fx-eq\">Inflation rate = \\frac{CPI<sub>this year<\/sub> − CPI<sub>last year<\/sub>}{CPI<sub>last year<\/sub>} × 100<\/div><\/div><div class=\"fx\"><div class=\"fx-eq\">Price index = <span class=\"fr\"><span>cost of basket in current year<\/span><span>cost of basket in base year<\/span><\/span> × 100<\/div><\/div><\/div>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Constructing a weighted price index<\/div><div class=\"tbl\"><table><thead><tr><th>Item<\/th><th>Weight<\/th><th>Price index (base = 100)<\/th><th>Weight × index<\/th><\/tr><\/thead><tbody><tr><td>Food<\/td><td>0.30<\/td><td>108<\/td><td>32.4<\/td><\/tr><tr><td>Housing<\/td><td>0.40<\/td><td>104<\/td><td>41.6<\/td><\/tr><tr><td>Transport<\/td><td>0.20<\/td><td>95<\/td><td>19.0<\/td><\/tr><tr><td>Other<\/td><td>0.10<\/td><td>110<\/td><td>11.0<\/td><\/tr><tr><td><strong>Total<\/strong><\/td><td>1.00<\/td><td><\/td><td><strong>104.0<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Weighted index = 104.0 → prices have risen by <strong>4%<\/strong> since the base year. Steps: (1) find each item's price index, (2) multiply by its weight, (3) add.<\/p><\/div>\n<p><strong>Limitations of the CPI<\/strong>: the basket may not match individual households (pensioners, students); weights are out of date as habits change; quality improvements and new products are hard to capture; substitution bias (people switch to cheaper goods); differences between regions and income groups. Economists also watch <strong>core inflation<\/strong> and the <strong>PPI<\/strong>.<\/p>\n<h4>Causes<\/h4>\n<div class=\"dslot\" data-d=\"inflation-types\"><\/div>\n<h4>Costs of inflation<\/h4>\n<ul><li><strong>Reduces purchasing power<\/strong>, especially for people on fixed incomes (pensioners, benefits not index-linked).<\/li><li><strong>Uncertainty<\/strong>: firms delay investment.<\/li><li><strong>Redistribution<\/strong>: from lenders and savers to borrowers when real interest rates are negative.<\/li><li><strong>International competitiveness<\/strong>: exports become dearer than rivals' (if inflation is higher than abroad).<\/li><li><strong>Menu and shoe-leather costs<\/strong>; <strong>fiscal drag<\/strong> (people pushed into higher tax brackets).<\/li><li><strong>Inflationary expectations<\/strong> can become self-fulfilling (wage-price spiral).<\/li><li>Very high inflation (hyperinflation in Zimbabwe 2008, Venezuela 2018) destroys the use of money.<\/li><\/ul>\n<p>A <strong>low, stable<\/strong> rate (central bank targets around <strong>2%<\/strong>) is better than zero: it gives a buffer against deflation, lets real wages adjust and reflects quality improvements that the CPI misses.<\/p>\n<h4>Deflation<\/h4>\n<div class=\"dslot\" data-d=\"deflation-types\"><\/div>\n<p><strong>Costs of (demand-side) deflation<\/strong>: consumers delay purchases (expecting lower prices), the real value of debt rises (debt deflation), firms cut output and jobs, real interest rates rise even at zero nominal rates, and monetary policy becomes ineffective (Japan, 1990s–2010s).<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Always state the <strong>size<\/strong> and the <strong>cause<\/strong>. 2% inflation is a target, not a problem. Cost-push and demand-pull need different policies; supply-side deflation can be a good thing.<\/p><\/div>","text":"Measuring inflation A basket of typical goods and services is priced each month; each item is weighted by its share of household spending. The CPI compares the cost of the basket with a base year (= 100). Inflation from a price index Inflation rate = \\frac{CPI this year − CPI last year }{CPI last year } × 100 Price index = cost of basket in current year cost of basket in base year × 100 HL only · Constructing a weighted price index Item Weight Price index (base = 100) Weight × index Food 0.30 108 32.4 Housing 0.40 104 41.6 Transport 0.20 95 19.0 Other 0.10 110 11.0 Total 1.00 104.0 Weighted index = 104.0 → prices have risen by 4% since the base year. Steps: (1) find each item's price index, (2) multiply by its weight, (3) add. Limitations of the CPI : the basket may not match individual households (pensioners, students); weights are out of date as habits change; quality improvements and new products are hard to capture; substitution bias (people switch to cheaper goods); differences between regions and income groups. Economists also watch core inflation and the PPI . Causes Costs of inflation Reduces purchasing power , especially for people on fixed incomes (pensioners, benefits not index-linked). Uncertainty : firms delay investment. Redistribution : from lenders and savers to borrowers when real interest rates are negative. International competitiveness : exports become dearer than rivals' (if inflation is higher than abroad). Menu and shoe-leather costs ; fiscal drag (people pushed into higher tax brackets). Inflationary expectations can become self-fulfilling (wage-price spiral). Very high inflation (hyperinflation in Zimbabwe 2008, Venezuela 2018) destroys the use of money. A low, stable rate (central bank targets around 2% ) is better than zero: it gives a buffer against deflation, lets real wages adjust and reflects quality improvements that the CPI misses. Deflation Costs of (demand-side) deflation : consumers delay purchases (expecting lower prices), the real value of debt rises (debt deflation), firms cut output and jobs, real interest rates rise even at zero nominal rates, and monetary policy becomes ineffective (Japan, 1990s–2010s). Exam tip Always state the size and the cause . 2% inflation is a target, not a problem. Cost-push and demand-pull need different policies; supply-side deflation can be a good thing.","dias":["inflation-types","deflation-types"]},{"id":"e-conflicts","title":"Conflicts between macroeconomic objectives","hl":false,"terms":[["Phillips curve","A curve showing an inverse relationship between the inflation rate and the unemployment rate in the short run."],["Short-run Phillips curve (SRPC)","A downward-sloping curve showing a trade-off between inflation and unemployment for a given level of expected inflation."],["Long-run Phillips curve (LRPC)","A vertical line at the natural rate of unemployment, showing no long-run trade-off between inflation and unemployment."],["Expectations-augmented Phillips curve","The idea that the SRPC shifts up when people expect higher inflation, so attempts to keep unemployment below the NRU only raise inflation."]],"topic":"t3-3","html":"<div class=\"tbl\"><table><thead><tr><th>Conflict<\/th><th>Explanation<\/th><\/tr><\/thead><tbody><tr><td><strong>Low unemployment vs low inflation<\/strong><\/td><td>Rising AD cuts unemployment but raises inflation (demand-pull)<\/td><\/tr><tr><td><strong>Growth vs environment<\/strong><\/td><td>Growth raises output, pollution and resource use (sustainability)<\/td><\/tr><tr><td><strong>Growth vs current account<\/strong><\/td><td>Rising incomes raise imports, worsening the current account<\/td><\/tr><tr><td><strong>Growth vs equity<\/strong><\/td><td>Growth may benefit capital owners and high-skilled workers most<\/td><\/tr><tr><td><strong>Low inflation vs growth<\/strong><\/td><td>Contractionary policy to cut inflation slows growth (the 2022–23 rate rises)<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Short-run and long-run Phillips curves<\/div><div class=\"dslot\" data-d=\"phillips\"><\/div>\n<p><strong>The SRPC<\/strong> (A. W. Phillips, 1958, UK data 1861–1957) suggested governments could choose a combination of inflation and unemployment. <strong>Stagflation in the 1970s<\/strong> (oil shocks: high inflation and high unemployment together) broke the stable relationship. <strong>The expectations-augmented view<\/strong> (Friedman, Phelps): if the government expands AD to push unemployment below the NRU (A → B), workers soon expect higher inflation and demand higher wages; SRAS shifts left and unemployment returns to the NRU at a higher inflation rate (B → C). The <strong>LRPC is vertical<\/strong> at the NRU. The only way to lower unemployment permanently is to reduce the NRU through <strong>supply-side policies<\/strong>. The reverse also applies: a contractionary policy raises unemployment above the NRU in the short run; as expectations of inflation fall, the SRPC shifts down and unemployment returns to the NRU at lower inflation.<\/p><\/div>","text":"Conflict Explanation Low unemployment vs low inflation Rising AD cuts unemployment but raises inflation (demand-pull) Growth vs environment Growth raises output, pollution and resource use (sustainability) Growth vs current account Rising incomes raise imports, worsening the current account Growth vs equity Growth may benefit capital owners and high-skilled workers most Low inflation vs growth Contractionary policy to cut inflation slows growth (the 2022–23 rate rises) HL only · Short-run and long-run Phillips curves The SRPC (A. W. Phillips, 1958, UK data 1861–1957) suggested governments could choose a combination of inflation and unemployment. Stagflation in the 1970s (oil shocks: high inflation and high unemployment together) broke the stable relationship. The expectations-augmented view (Friedman, Phelps): if the government expands AD to push unemployment below the NRU (A → B), workers soon expect higher inflation and demand higher wages; SRAS shifts left and unemployment returns to the NRU at a higher inflation rate (B → C). The LRPC is vertical at the NRU. The only way to lower unemployment permanently is to reduce the NRU through supply-side policies . The reverse also applies: a contractionary policy raises unemployment above the NRU in the short run; as expectations of inflation fall, the SRPC shifts down and unemployment returns to the NRU at lower inflation.","dias":["phillips"]},{"id":"e-govt-debt","title":"Sustainable levels of government debt","hl":false,"terms":[["Budget deficit","When government spending is greater than government revenue in a year."],["Budget surplus","When government revenue is greater than government spending in a year."],["Government (national) debt","The total amount the government owes: the accumulation of past budget deficits minus surpluses."],["Debt-to-GDP ratio","Government debt as a percentage of GDP; a measure of the sustainability of debt."],["Debt servicing","The interest payments a government must make on its debt."],["Credit rating","An assessment by agencies (S&P, Moody's, Fitch) of a borrower's ability to repay; a lower rating raises borrowing costs."]],"topic":"t3-3","html":"<p>A <strong>deficit<\/strong> is a flow (one year); the <strong>debt<\/strong> is a stock (accumulated). Running deficits adds to debt.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Country (approx., 2024)<\/th><th>Debt as % of GDP<\/th><\/tr><\/thead><tbody><tr><td>Japan<\/td><td>~250%<\/td><\/tr><tr><td>Italy<\/td><td>~135%<\/td><\/tr><tr><td>USA<\/td><td>~120%<\/td><\/tr><tr><td>UK<\/td><td>~100%<\/td><\/tr><tr><td>Germany<\/td><td>~63%<\/td><\/tr><tr><td>Saudi Arabia<\/td><td>~26%<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>Why debt can be a problem<\/h4>\n<ul><li><strong>Debt servicing costs<\/strong> have an opportunity cost: interest paid instead of schools and hospitals.<\/li><li>Higher debt may raise interest rates (crowding out of private investment).<\/li><li><strong>Credit rating downgrades<\/strong> raise the cost of borrowing (Greece 2010–12; UK gilt crisis after the September 2022 mini-budget).<\/li><li>Future generations face <strong>higher taxes<\/strong> or spending cuts.<\/li><li>Debt in foreign currency is especially risky for developing economies (Sri Lanka's default in 2022; Zambia 2020).<\/li><li>Less room for fiscal policy in the next recession.<\/li><\/ul>\n<p><strong>When is debt sustainable?<\/strong> When the economy grows faster than the interest rate on debt (r &lt; g), the debt-to-GDP ratio can fall even with small deficits; when debt is held domestically in the country's own currency (Japan); and when markets trust the government.<\/p>","text":"A deficit is a flow (one year); the debt is a stock (accumulated). Running deficits adds to debt. Country (approx., 2024) Debt as % of GDP Japan ~250% Italy ~135% USA ~120% UK ~100% Germany ~63% Saudi Arabia ~26% Why debt can be a problem Debt servicing costs have an opportunity cost: interest paid instead of schools and hospitals. Higher debt may raise interest rates (crowding out of private investment). Credit rating downgrades raise the cost of borrowing (Greece 2010–12; UK gilt crisis after the September 2022 mini-budget). Future generations face higher taxes or spending cuts. Debt in foreign currency is especially risky for developing economies (Sri Lanka's default in 2022; Zambia 2020). Less room for fiscal policy in the next recession. When is debt sustainable? When the economy grows faster than the interest rate on debt (r < g), the debt-to-GDP ratio can fall even with small deficits; when debt is held domestically in the country's own currency (Japan); and when markets trust the government.","dias":[]}]},{"id":"t3-4","num":"3.4","title":"Economics of inequality and poverty","level":"SL","blurb":"Measuring inequality and poverty, their causes and costs, and policies including taxation and transfers.","entries":[{"id":"e-measuring-inequality","title":"Measuring inequality and poverty","hl":false,"terms":[["Income inequality","Unequal distribution of income among individuals or households."],["Wealth inequality","Unequal distribution of assets (property, shares, savings) among individuals or households; usually greater than income inequality."],["Lorenz curve","A graph showing the cumulative percentage of income earned by the cumulative percentage of the population, ranked from poorest to richest."],["Gini coefficient","A measure of inequality from 0 (perfect equality) to 1 (perfect inequality), equal to the area between the line of equality and the Lorenz curve divided by the total area under the line of equality."],["Absolute poverty","Income below the level needed to meet basic needs; the World Bank's international poverty line is $3.00 a day (2021 PPP, updated in 2025)."],["Relative poverty","Income below a set proportion of the typical income in a country, e.g. below 60% of median income."],["Multidimensional Poverty Index (MPI)","A UNDP/Oxford measure of poverty using ten indicators across health, education and living standards."]],"topic":"t3-4","html":"<div class=\"dslot\" data-d=\"lorenz\"><\/div>\n<h4>Constructing a Lorenz curve from quintile data<\/h4>\n<div class=\"tbl\"><table><thead><tr><th>Quintile<\/th><th>Share of income (%)<\/th><th>Cumulative (%)<\/th><\/tr><\/thead><tbody><tr><td>Poorest 20%<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>Second 20%<\/td><td>9<\/td><td>13<\/td><\/tr><tr><td>Third 20%<\/td><td>14<\/td><td>27<\/td><\/tr><tr><td>Fourth 20%<\/td><td>22<\/td><td>49<\/td><\/tr><tr><td>Richest 20%<\/td><td>51<\/td><td>100<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Plot (20, 4), (40, 13), (60, 27), (80, 49), (100, 100). A country whose curve lies closer to the diagonal is more equal.<\/p>\n<p><strong>Gini examples (income, approx.)<\/strong>: Slovakia 0.24, Norway 0.27, UK 0.33, USA 0.39–0.41, Brazil 0.52, South Africa 0.63 (the world's highest).<\/p>\n<h4>Measuring poverty<\/h4>\n<ul><li><strong>Absolute poverty line<\/strong>: the World Bank's <strong>$3.00 a day<\/strong> (2021 PPP), updated from $2.15 in 2025; about 800 million people lived below it.<\/li><li><strong>Relative poverty<\/strong>: used in rich countries (60% of median income).<\/li><li><strong>MPI<\/strong>: 10 indicators: nutrition, child mortality (health); years of schooling, school attendance (education); cooking fuel, sanitation, drinking water, electricity, housing, assets (living standards). Someone deprived in a third or more of the weighted indicators is multidimensionally poor.<\/li><\/ul>\n<p><strong>Difficulties<\/strong>: choice of poverty line is arbitrary; differences in cost of living; informal income; data collection in conflict zones and remote areas; household surveys miss inequality within households.<\/p>","text":"Constructing a Lorenz curve from quintile data Quintile Share of income (%) Cumulative (%) Poorest 20% 4 4 Second 20% 9 13 Third 20% 14 27 Fourth 20% 22 49 Richest 20% 51 100 Plot (20, 4), (40, 13), (60, 27), (80, 49), (100, 100). A country whose curve lies closer to the diagonal is more equal. Gini examples (income, approx.) : Slovakia 0.24, Norway 0.27, UK 0.33, USA 0.39–0.41, Brazil 0.52, South Africa 0.63 (the world's highest). Measuring poverty Absolute poverty line : the World Bank's $3.00 a day (2021 PPP), updated from $2.15 in 2025; about 800 million people lived below it. Relative poverty : used in rich countries (60% of median income). MPI : 10 indicators: nutrition, child mortality (health); years of schooling, school attendance (education); cooking fuel, sanitation, drinking water, electricity, housing, assets (living standards). Someone deprived in a third or more of the weighted indicators is multidimensionally poor. Difficulties : choice of poverty line is arbitrary; differences in cost of living; informal income; data collection in conflict zones and remote areas; household surveys miss inequality within households.","dias":["lorenz"]},{"id":"e-inequality-causes","title":"Causes and consequences of inequality and poverty","hl":false,"terms":[["Social mobility","The ability of people to move between social or income groups, e.g. children earning more than their parents."],["Intergenerational poverty","Poverty passed from one generation to the next."]],"topic":"t3-4","html":"<h4>Causes<\/h4>\n<ul><li><strong>Inequality of opportunity<\/strong>: unequal access to education, healthcare and finance.<\/li><li><strong>Different levels of human capital<\/strong>; <strong>discrimination<\/strong> (gender pay gap, caste, ethnicity).<\/li><li><strong>Unequal wealth ownership and inheritance<\/strong>; returns on wealth exceed wage growth.<\/li><li><strong>Technological change and globalisation<\/strong>: rewards skills; low-skill jobs automated or offshored.<\/li><li><strong>Tax and benefit systems<\/strong>: regressive taxes, limited welfare.<\/li><li><strong>Market power<\/strong> of firms and declining union power.<\/li><li><strong>Geography<\/strong>: rural vs urban, regional decline.<\/li><li><strong>Poverty traps<\/strong> (<a class=\"xref\" href=\"#e-barriers\">4.9<\/a>).<\/li><\/ul>\n<h4>Consequences<\/h4>\n<ul><li><strong>Lower economic growth<\/strong> (the poor cannot invest in education; IMF research links high inequality to slower, less durable growth).<\/li><li><strong>Lower social mobility<\/strong>, intergenerational poverty.<\/li><li><strong>Social problems<\/strong>: crime, poorer health and shorter lives, lower trust, political instability.<\/li><li><strong>Unequal political power<\/strong>; populism.<\/li><li><strong>Lower aggregate demand<\/strong> (the rich have a lower MPC).<\/li><\/ul>","text":"Causes Inequality of opportunity : unequal access to education, healthcare and finance. Different levels of human capital ; discrimination (gender pay gap, caste, ethnicity). Unequal wealth ownership and inheritance ; returns on wealth exceed wage growth. Technological change and globalisation : rewards skills; low-skill jobs automated or offshored. Tax and benefit systems : regressive taxes, limited welfare. Market power of firms and declining union power. Geography : rural vs urban, regional decline. Poverty traps ( 4.9 ). Consequences Lower economic growth (the poor cannot invest in education; IMF research links high inequality to slower, less durable growth). Lower social mobility , intergenerational poverty. Social problems : crime, poorer health and shorter lives, lower trust, political instability. Unequal political power ; populism. Lower aggregate demand (the rich have a lower MPC).","dias":[]},{"id":"e-tax-policy","title":"Taxation to reduce inequality","hl":false,"terms":[["Direct tax","A tax on income or wealth paid directly to the government by the person or firm, e.g. income tax, corporation tax, wealth tax."],["Progressive tax","A tax where the average tax rate rises as income rises, so higher earners pay a larger proportion of their income."],["Proportional tax","A tax where the average tax rate is the same at all incomes (a flat tax)."],["Regressive tax","A tax where the average tax rate falls as income rises, so lower earners pay a larger proportion of their income."],["Average tax rate","Total tax paid divided by total income."],["Marginal tax rate","The tax rate paid on the last (extra) dollar of income."],["Wealth tax","A tax on the value of assets owned."],["Capital gains tax","A tax on the profit from selling an asset that has risen in value."]],"topic":"t3-4","html":"<div class=\"dslot\" data-d=\"tax-systems\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Tax<\/th><th>Type<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>Personal income tax<\/td><td>Direct, progressive<\/td><td>UK 0% / 20% / 40% / 45% bands<\/td><\/tr><tr><td>Corporation tax<\/td><td>Direct<\/td><td>UK 25%, Ireland 12.5% → 15% minimum (OECD global deal)<\/td><\/tr><tr><td>VAT / GST / sales taxes<\/td><td>Indirect, regressive in effect<\/td><td>UK VAT 20%, Singapore GST 9%<\/td><\/tr><tr><td>Excise taxes<\/td><td>Indirect, regressive<\/td><td>Tobacco, alcohol, fuel<\/td><\/tr><tr><td>Wealth, property, inheritance, capital gains taxes<\/td><td>Direct<\/td><td>Norway, Spain, Switzerland have wealth taxes<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Average and marginal tax rate calculation<\/div><p>Tax bands: 0% on the first $10,000; 20% on $10,001–$40,000; 40% above $40,000. Income = $55,000. Tax = 0 + 20% × 30,000 + 40% × 15,000 = 6,000 + 6,000 = <strong>$12,000<\/strong>. Average tax rate = 12,000 ÷ 55,000 × 100 = <strong>21.82%<\/strong>. Marginal tax rate = <strong>40%<\/strong>. In a progressive system the marginal rate is above the average rate.<\/p><\/div>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Progressive taxes<\/h5><ul><li>Reduce inequality; fund transfers and public services.<\/li><li>Based on ability to pay (vertical equity).<\/li><\/ul><\/div><div><h5>Concerns<\/h5><ul><li>High marginal rates may reduce incentives to work, save and invest.<\/li><li>Encourage tax avoidance and evasion; skilled workers and capital may move abroad.<\/li><li>The <strong>Laffer curve<\/strong> argument: very high rates may raise less revenue.<\/li><\/ul><\/div><\/div><\/div>","text":"Tax Type Example Personal income tax Direct, progressive UK 0% / 20% / 40% / 45% bands Corporation tax Direct UK 25%, Ireland 12.5% → 15% minimum (OECD global deal) VAT / GST / sales taxes Indirect, regressive in effect UK VAT 20%, Singapore GST 9% Excise taxes Indirect, regressive Tobacco, alcohol, fuel Wealth, property, inheritance, capital gains taxes Direct Norway, Spain, Switzerland have wealth taxes HL only · Average and marginal tax rate calculation Tax bands: 0% on the first $10,000; 20% on $10,001–$40,000; 40% above $40,000. Income = $55,000. Tax = 0 + 20% × 30,000 + 40% × 15,000 = 6,000 + 6,000 = $12,000 . Average tax rate = 12,000 ÷ 55,000 × 100 = 21.82% . Marginal tax rate = 40% . In a progressive system the marginal rate is above the average rate. Evaluation Progressive taxes Reduce inequality; fund transfers and public services. Based on ability to pay (vertical equity). Concerns High marginal rates may reduce incentives to work, save and invest. Encourage tax avoidance and evasion; skilled workers and capital may move abroad. The Laffer curve argument: very high rates may raise less revenue.","dias":["tax-systems"]},{"id":"e-other-policies","title":"Other policies to reduce inequality and poverty","hl":false,"terms":[["Transfer payments","Payments from the government to individuals for which no good or service is produced in return, e.g. pensions, unemployment benefits, child benefits."],["Universal basic income (UBI)","A regular, unconditional cash payment from the government to every adult, regardless of income or employment."],["Means-tested benefit","A benefit paid only to people whose income or wealth is below a certain level."],["Conditional cash transfer","Cash given to poor households on condition that they meet requirements, such as keeping children in school or attending health check-ups."]],"topic":"t3-4","html":"<div class=\"tbl\"><table><thead><tr><th>Policy<\/th><th>Examples<\/th><th>Evaluation<\/th><\/tr><\/thead><tbody><tr><td><strong>Investment in human capital<\/strong> (education, health)<\/td><td>Free schooling, school meals, public healthcare<\/td><td>Long-run, tackles causes; costly and slow<\/td><\/tr><tr><td><strong>Transfer payments<\/strong><\/td><td>Pensions, unemployment and child benefits<\/td><td>Immediate; may reduce work incentives (poverty trap); cost<\/td><\/tr><tr><td><strong>Conditional cash transfers<\/strong><\/td><td>Brazil's Bolsa Família; Mexico's Prospera<\/td><td>Raise school attendance and health; administrative costs<\/td><\/tr><tr><td><strong>Universal basic income<\/strong><\/td><td>Pilots in Finland (2017–18), Kenya (GiveDirectly)<\/td><td>Simple, no stigma; very costly; may reduce work<\/td><\/tr><tr><td><strong>Minimum wage<\/strong><\/td><td>UK National Living Wage, Germany (2015)<\/td><td>Raises low pay; possible job losses<\/td><\/tr><tr><td><strong>Labour market and anti-discrimination policies<\/strong><\/td><td>Equal pay laws, quotas, affirmative action<\/td><td>Address discrimination; enforcement<\/td><\/tr><tr><td><strong>Policies for wealth<\/strong><\/td><td>Inheritance tax, property tax, wealth tax<\/td><td>Target wealth inequality; avoidance, capital flight<\/td><\/tr><tr><td><strong>Universal public services<\/strong><\/td><td>Free healthcare (NHS), subsidised housing and transport<\/td><td>\"Social wage\" benefits low-income households most<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Equity vs efficiency is the classic trade-off: redistribution improves equity but may reduce incentives. Evaluate with evidence: Nordic countries combine high taxes, low inequality and high productivity.<\/p><\/div>","text":"Policy Examples Evaluation Investment in human capital (education, health) Free schooling, school meals, public healthcare Long-run, tackles causes; costly and slow Transfer payments Pensions, unemployment and child benefits Immediate; may reduce work incentives (poverty trap); cost Conditional cash transfers Brazil's Bolsa Família; Mexico's Prospera Raise school attendance and health; administrative costs Universal basic income Pilots in Finland (2017–18), Kenya (GiveDirectly) Simple, no stigma; very costly; may reduce work Minimum wage UK National Living Wage, Germany (2015) Raises low pay; possible job losses Labour market and anti-discrimination policies Equal pay laws, quotas, affirmative action Address discrimination; enforcement Policies for wealth Inheritance tax, property tax, wealth tax Target wealth inequality; avoidance, capital flight Universal public services Free healthcare (NHS), subsidised housing and transport \"Social wage\" benefits low-income households most Exam tip Equity vs efficiency is the classic trade-off: redistribution improves equity but may reduce incentives. Evaluate with evidence: Nordic countries combine high taxes, low inequality and high productivity.","dias":[]}]},{"id":"t3-5","num":"3.5","title":"Demand management (demand-side policies): monetary policy","level":"SL","blurb":"Central banks, interest rates, the money market, tools (including QE), and the strengths and limits of monetary policy.","entries":[{"id":"e-monetary-overview","title":"Goals of monetary policy and how it works","hl":false,"terms":[["Monetary policy","The use of interest rates, the money supply and credit conditions by a central bank to influence aggregate demand and achieve macroeconomic objectives."],["Central bank","The institution responsible for a country's monetary policy, e.g. the Federal Reserve, the European Central Bank, the Bank of England."],["Inflation targeting","A policy in which the central bank publicly commits to keeping inflation at a target rate, usually around 2%."],["Expansionary monetary policy","Lowering interest rates or increasing the money supply to raise AD (also called loose monetary policy)."],["Contractionary monetary policy","Raising interest rates or reducing the money supply to reduce AD (also called tight monetary policy)."],["Nominal interest rate","The interest rate stated on a loan or deposit, not adjusted for inflation."],["Real interest rate","The nominal interest rate minus the rate of inflation."],["Money supply","The total amount of money (cash and bank deposits) in an economy."]],"topic":"t3-5","html":"<p><strong>Goals<\/strong>: low and stable inflation (usually a <strong>2% target<\/strong>: Bank of England, ECB \"2% over the medium term\", Fed), low unemployment, stable economic growth, a stable exchange rate, and, in some countries, financial stability.<\/p>\n<div class=\"box formula\"><div class=\"box-h\">Real interest rate<\/div><div class=\"fx\"><div class=\"fx-eq\">Real interest rate = nominal interest rate − inflation rate<\/div><\/div><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Real interest rate<\/div><p>In 2022 the UK base rate reached 3.5% while CPI inflation was about 10.5%: real rate ≈ 3.5 − 10.5 = <strong>−7%<\/strong>. Savers lost purchasing power and borrowing was very cheap in real terms.<\/p><\/div>\n<h4>Interest rate determination: the money market<\/h4>\n<div class=\"dslot\" data-d=\"money-market\"><\/div>\n<h4>Transmission: how a rate cut raises AD<\/h4>\n<ol><li>Borrowing becomes cheaper → <strong>consumption<\/strong> on credit (cars, houses) and <strong>investment<\/strong> rise.<\/li><li>Saving is less attractive → consumption rises.<\/li><li>Mortgage payments fall → disposable income rises.<\/li><li>Asset prices (houses, shares) rise → <strong>wealth effect<\/strong>.<\/li><li>The currency tends to <strong>depreciate<\/strong> (hot money leaves) → exports cheaper, imports dearer → <strong>(X − M)<\/strong> rises.<\/li><\/ol>\n<div class=\"dslot\" data-d=\"ad-curve\"><\/div>\n<p>Contractionary policy works in reverse: the 2022–23 rate rises (Fed to 5.25–5.5%, Bank of England to 5.25%) were aimed at the post-pandemic inflation surge.<\/p>","text":"Goals : low and stable inflation (usually a 2% target : Bank of England, ECB \"2% over the medium term\", Fed), low unemployment, stable economic growth, a stable exchange rate, and, in some countries, financial stability. Real interest rate Real interest rate = nominal interest rate − inflation rate Worked example: Real interest rate In 2022 the UK base rate reached 3.5% while CPI inflation was about 10.5%: real rate ≈ 3.5 − 10.5 = −7% . Savers lost purchasing power and borrowing was very cheap in real terms. Interest rate determination: the money market Transmission: how a rate cut raises AD Borrowing becomes cheaper → consumption on credit (cars, houses) and investment rise. Saving is less attractive → consumption rises. Mortgage payments fall → disposable income rises. Asset prices (houses, shares) rise → wealth effect . The currency tends to depreciate (hot money leaves) → exports cheaper, imports dearer → (X − M) rises. Contractionary policy works in reverse: the 2022–23 rate rises (Fed to 5.25–5.5%, Bank of England to 5.25%) were aimed at the post-pandemic inflation surge.","dias":["money-market","ad-curve"]},{"id":"e-monetary-tools","title":"Tools of monetary policy and money creation","hl":false,"terms":[["Commercial bank","A private bank that accepts deposits and makes loans."],["Fractional reserve banking","A system in which banks keep only a fraction of deposits as reserves and lend out the rest, creating new money."],["Reserve requirement","The minimum percentage of deposits a commercial bank must hold as reserves with the central bank."],["Open market operations","The buying and selling of government bonds by the central bank to change the money supply and interest rates."],["Base rate (policy rate)","The interest rate the central bank charges commercial banks on loans, which influences all other interest rates."],["Quantitative easing (QE)","When a central bank creates new money electronically to buy large quantities of financial assets, such as government bonds, to increase the money supply and lower long-term interest rates."]],"topic":"t3-5","html":"<h4>How commercial banks create money<\/h4>\n<p>With a 10% reserve requirement, a $1,000 deposit lets the bank lend $900; that $900 is deposited in another bank, which lends $810, and so on. The maximum total new deposits = initial deposit × <strong>1 ÷ reserve ratio<\/strong> = 1,000 × 10 = <strong>$10,000<\/strong>. In practice banks hold excess reserves and lending depends on demand, so the money multiplier is smaller.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Tool<\/th><th>Expansionary<\/th><th>Contractionary<\/th><\/tr><\/thead><tbody><tr><td><strong>Base (policy) rate<\/strong><\/td><td>Cut the rate; commercial rates follow<\/td><td>Raise the rate<\/td><\/tr><tr><td><strong>Open market operations<\/strong><\/td><td>Central bank <strong>buys<\/strong> bonds → banks' reserves rise → more lending<\/td><td>Central bank <strong>sells<\/strong> bonds<\/td><\/tr><tr><td><strong>Reserve requirements<\/strong><\/td><td>Lower the ratio → banks can lend more<\/td><td>Raise the ratio (China's PBoC uses this actively)<\/td><\/tr><tr><td><strong>Quantitative easing (QE)<\/strong><\/td><td>Create money to buy bonds on a massive scale → bond prices up, long-term yields down<\/td><td><strong>Quantitative tightening<\/strong> (QT): selling bonds or not replacing them<\/td><\/tr><\/tbody><\/table><\/div>\n<p>QE was used after 2008 and in 2020 when rates were already near zero (Fed, ECB, Bank of England, Bank of Japan). Critics argue it inflated asset prices and wealth inequality.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>QE and open market operations look similar. The difference: in QE the central bank <strong>creates new money<\/strong> to buy assets on a very large scale when interest rates are already near zero.<\/p><\/div>","text":"How commercial banks create money With a 10% reserve requirement, a $1,000 deposit lets the bank lend $900; that $900 is deposited in another bank, which lends $810, and so on. The maximum total new deposits = initial deposit × 1 ÷ reserve ratio = 1,000 × 10 = $10,000 . In practice banks hold excess reserves and lending depends on demand, so the money multiplier is smaller. Tool Expansionary Contractionary Base (policy) rate Cut the rate; commercial rates follow Raise the rate Open market operations Central bank buys bonds → banks' reserves rise → more lending Central bank sells bonds Reserve requirements Lower the ratio → banks can lend more Raise the ratio (China's PBoC uses this actively) Quantitative easing (QE) Create money to buy bonds on a massive scale → bond prices up, long-term yields down Quantitative tightening (QT): selling bonds or not replacing them QE was used after 2008 and in 2020 when rates were already near zero (Fed, ECB, Bank of England, Bank of Japan). Critics argue it inflated asset prices and wealth inequality. Exam tip QE and open market operations look similar. The difference: in QE the central bank creates new money to buy assets on a very large scale when interest rates are already near zero.","dias":[]},{"id":"e-monetary-eval","title":"Evaluation of monetary policy","hl":false,"terms":[["Zero lower bound","The limit on cutting nominal interest rates much below zero, which restricts conventional monetary policy in a deep recession."],["Liquidity trap","A situation where interest rates are so low that further cuts or increases in the money supply fail to raise spending."],["Central bank independence","When the central bank sets monetary policy free from political control."]],"topic":"t3-5","html":"<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Strengths<\/h5><ul><li><strong>Independent<\/strong> central banks avoid political short-termism; credible inflation targets anchor expectations.<\/li><li><strong>Flexible and fast<\/strong>: rates can be changed at each meeting (8 times a year).<\/li><li>Small, incremental changes; no direct effect on the budget deficit.<\/li><li>Effective at reducing demand-pull inflation.<\/li><\/ul><\/div><div><h5>Weaknesses<\/h5><ul><li><strong>Time lags<\/strong>: 18–24 months for the full effect.<\/li><li><strong>Zero lower bound / liquidity trap<\/strong>: in a deep recession, low rates may not revive spending if confidence is weak (Japan; 2009).<\/li><li>Weak against <strong>cost-push<\/strong> inflation: higher rates cut output further.<\/li><li>Blunt instrument: affects all regions and sectors (hurts mortgage holders, helps savers).<\/li><li>Depends on banks passing rates on and being willing to lend.<\/li><li>Exchange rate effects may conflict with other goals.<\/li><\/ul><\/div><\/div><\/div>","text":"Evaluation Strengths Independent central banks avoid political short-termism; credible inflation targets anchor expectations. Flexible and fast : rates can be changed at each meeting (8 times a year). Small, incremental changes; no direct effect on the budget deficit. Effective at reducing demand-pull inflation. Weaknesses Time lags : 18–24 months for the full effect. Zero lower bound / liquidity trap : in a deep recession, low rates may not revive spending if confidence is weak (Japan; 2009). Weak against cost-push inflation: higher rates cut output further. Blunt instrument: affects all regions and sectors (hurts mortgage holders, helps savers). Depends on banks passing rates on and being willing to lend. Exchange rate effects may conflict with other goals.","dias":[]}]},{"id":"t3-6","num":"3.6","title":"Demand management: fiscal policy","level":"SL","blurb":"Government revenue and spending, expansionary and contractionary fiscal policy, automatic stabilisers, the multiplier (HL) and the limits of fiscal policy.","entries":[{"id":"e-fiscal-overview","title":"Fiscal policy: revenue, spending and goals","hl":false,"terms":[["Fiscal policy","The use of government spending and taxation to influence aggregate demand and achieve macroeconomic objectives."],["Current expenditure","Government spending on day-to-day items, such as wages of public sector workers and supplies."],["Capital expenditure","Government spending on long-term investment, such as roads, schools and hospitals."],["Expansionary fiscal policy","Increasing government spending and/or cutting taxes to raise AD."],["Contractionary fiscal policy","Cutting government spending and/or raising taxes to reduce AD."],["Automatic stabilisers","Changes in tax revenue and government spending that happen automatically with the business cycle and reduce its fluctuations, e.g. rising unemployment benefits and falling tax revenue in a recession."],["Discretionary fiscal policy","Deliberate changes in government spending or tax rates."],["Austerity","Sustained cuts in government spending and/or tax increases to reduce a budget deficit."]],"topic":"t3-6","html":"<h4>Sources of government revenue<\/h4>\n<p>Direct taxes (income, corporation, wealth); indirect taxes (VAT, excise); sale of goods and services (state-owned enterprises, fees); sale of government assets (privatisation).<\/p>\n<h4>Types of government spending<\/h4>\n<p><strong>Current<\/strong> (salaries, supplies), <strong>capital<\/strong> (infrastructure, schools) and <strong>transfer payments<\/strong> (pensions, benefits; not counted in G for GDP).<\/p>\n<h4>Goals<\/h4>\n<p>Stable growth and low unemployment; low inflation; equitable income distribution; stable business environment; promote potential growth (capital spending).<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Expansionary (to close a recessionary gap)<\/th><th>Contractionary (to close an inflationary gap)<\/th><\/tr><\/thead><tbody><tr><td>↑ G (infrastructure, public services)<\/td><td>↓ G<\/td><\/tr><tr><td>↓ income tax → ↑ disposable income → ↑ C<\/td><td>↑ income tax → ↓ C<\/td><\/tr><tr><td>↓ corporation tax → ↑ I<\/td><td>↑ corporation tax<\/td><\/tr><tr><td>AD shifts right: real GDP ↑, unemployment ↓, price level ↑<\/td><td>AD shifts left: inflation ↓, but unemployment ↑<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Automatic stabilisers<\/strong>: in a recession, tax revenues fall and unemployment benefits rise automatically, cushioning AD without any new decision. In a boom they work the other way.<\/p>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: Covid-19 response<\/div><p>In 2020 governments ran huge deficits: the US CARES Act ($2.2tn) and later packages; the UK furlough scheme paid up to 80% of wages for 11 million jobs. Budget deficits rose to around 15% of GDP in the US and the UK, preventing a deeper collapse in AD.<\/p><\/div>","text":"Sources of government revenue Direct taxes (income, corporation, wealth); indirect taxes (VAT, excise); sale of goods and services (state-owned enterprises, fees); sale of government assets (privatisation). Types of government spending Current (salaries, supplies), capital (infrastructure, schools) and transfer payments (pensions, benefits; not counted in G for GDP). Goals Stable growth and low unemployment; low inflation; equitable income distribution; stable business environment; promote potential growth (capital spending). Expansionary (to close a recessionary gap) Contractionary (to close an inflationary gap) ↑ G (infrastructure, public services) ↓ G ↓ income tax → ↑ disposable income → ↑ C ↑ income tax → ↓ C ↓ corporation tax → ↑ I ↑ corporation tax AD shifts right: real GDP ↑, unemployment ↓, price level ↑ AD shifts left: inflation ↓, but unemployment ↑ Automatic stabilisers : in a recession, tax revenues fall and unemployment benefits rise automatically, cushioning AD without any new decision. In a boom they work the other way. Real-world example: Covid-19 response In 2020 governments ran huge deficits: the US CARES Act ($2.2tn) and later packages; the UK furlough scheme paid up to 80% of wages for 11 million jobs. Budget deficits rose to around 15% of GDP in the US and the UK, preventing a deeper collapse in AD.","dias":[]},{"id":"e-multiplier","title":"The Keynesian multiplier","hl":true,"terms":[["Multiplier","The ratio of the final change in real GDP to the initial change in an injection: an injection causes a larger final change in national income."],["Marginal propensity to consume (MPC)","The proportion of an extra dollar of income that is spent on consumption."],["Marginal propensity to save (MPS)","The proportion of an extra dollar of income that is saved."],["Marginal propensity to tax (MPT)","The proportion of an extra dollar of income that is paid in tax."],["Marginal propensity to import (MPM)","The proportion of an extra dollar of income that is spent on imports."],["Marginal propensity to withdraw (MPW)","MPS + MPT + MPM: the proportion of extra income that leaks out of the circular flow."]],"topic":"t3-6","html":"<div class=\"dslot\" data-d=\"multiplier\"><\/div>\n<div class=\"box formula\"><div class=\"box-h\">The multiplier<\/div><div class=\"fx\"><div class=\"fx-eq\">k = <span class=\"fr\"><span>1<\/span><span>1 − MPC<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>MPW<\/span><\/span><\/div><\/div><div class=\"fx\"><div class=\"fx-eq\">MPW = MPS + MPT + MPM<\/div><div class=\"fx-n\">and MPC + MPW = 1 (for domestic spending)<\/div><\/div><div class=\"fx\"><div class=\"fx-eq\">ΔY = k × ΔJ<\/div><div class=\"fx-n\">where ΔJ is the change in an injection (I, G or X)<\/div><\/div><\/div>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Multiplier<\/div><p>MPS = 0.15, MPT = 0.20, MPM = 0.15 → MPW = 0.5 → k = 1 ÷ 0.5 = <strong>2<\/strong>. A $10bn rise in G raises real GDP by up to <strong>$20bn<\/strong>. <strong>Closing a gap<\/strong>: an economy has a $22bn recessionary gap and MPC = 0.6. k = 1 ÷ 0.4 = 2.5. Required ΔG = 22 ÷ 2.5 = <strong>$8.8bn<\/strong>.<\/p><\/div>\n<p><strong>Significance<\/strong>: a small injection can have a large effect, which strengthens the case for fiscal policy. But the multiplier is smaller in open economies with high imports (MPM), high tax rates and high saving; it takes time (lags); and the value is uncertain, so governments can over- or under-shoot. Multipliers on infrastructure spending in a recession tend to be higher than on tax cuts.<\/p>","text":"The multiplier k = 1 1 − MPC = 1 MPW MPW = MPS + MPT + MPM and MPC + MPW = 1 (for domestic spending) ΔY = k × ΔJ where ΔJ is the change in an injection (I, G or X) Worked example: Multiplier MPS = 0.15, MPT = 0.20, MPM = 0.15 → MPW = 0.5 → k = 1 ÷ 0.5 = 2 . A $10bn rise in G raises real GDP by up to $20bn . Closing a gap : an economy has a $22bn recessionary gap and MPC = 0.6. k = 1 ÷ 0.4 = 2.5. Required ΔG = 22 ÷ 2.5 = $8.8bn . Significance : a small injection can have a large effect, which strengthens the case for fiscal policy. But the multiplier is smaller in open economies with high imports (MPM), high tax rates and high saving; it takes time (lags); and the value is uncertain, so governments can over- or under-shoot. Multipliers on infrastructure spending in a recession tend to be higher than on tax cuts.","dias":["multiplier"]},{"id":"e-fiscal-eval","title":"Evaluation of fiscal policy","hl":false,"terms":[["Crowding out","When increased government borrowing raises interest rates and reduces private sector investment and consumption."],["Time lags","Delays between identifying a problem, deciding on a policy, implementing it and the policy having its full effect."]],"topic":"t3-6","html":"<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Strengths<\/h5><ul><li><strong>Effective in deep recessions<\/strong> when monetary policy is stuck at the zero lower bound.<\/li><li>Can <strong>target<\/strong> specific sectors, regions and groups (equity).<\/li><li>Capital spending raises <strong>potential output<\/strong> (supply-side effect).<\/li><li>Automatic stabilisers act immediately.<\/li><li>The multiplier magnifies its effect.<\/li><\/ul><\/div><div><h5>Weaknesses<\/h5><ul><li><strong>Time lags<\/strong>: recognition, decision (political process, annual budget), implementation (infrastructure takes years).<\/li><li><strong>Crowding out<\/strong> of private investment (new classical view).<\/li><li><strong>Political pressures<\/strong>: hard to reverse spending or raise taxes; spending timed for elections.<\/li><li><strong>Sustainability of debt<\/strong>: high debt limits room for expansion; markets may react badly (UK 2022).<\/li><li>Possible inflation if the economy is near full capacity.<\/li><li>Ricardian equivalence: people may save tax cuts expecting future tax rises.<\/li><\/ul><\/div><\/div><\/div>\n<div class=\"dslot\" data-d=\"crowding-out\"><\/div>","text":"Evaluation Strengths Effective in deep recessions when monetary policy is stuck at the zero lower bound. Can target specific sectors, regions and groups (equity). Capital spending raises potential output (supply-side effect). Automatic stabilisers act immediately. The multiplier magnifies its effect. Weaknesses Time lags : recognition, decision (political process, annual budget), implementation (infrastructure takes years). Crowding out of private investment (new classical view). Political pressures : hard to reverse spending or raise taxes; spending timed for elections. Sustainability of debt : high debt limits room for expansion; markets may react badly (UK 2022). Possible inflation if the economy is near full capacity. Ricardian equivalence: people may save tax cuts expecting future tax rises.","dias":["crowding-out"]}]},{"id":"t3-7","num":"3.7","title":"Supply-side policies","level":"SL","blurb":"Market-based and interventionist policies to raise potential output, their demand-side effects and an evaluation.","entries":[{"id":"e-supply-side","title":"Market-based and interventionist supply-side policies","hl":false,"terms":[["Supply-side policies","Policies designed to increase the productive capacity (potential output) of the economy by improving the quantity and quality of factors of production and the efficiency of markets."],["Market-based supply-side policies","Policies that reduce government intervention and increase competition and incentives, e.g. deregulation, privatisation, tax cuts, labour market reforms."],["Interventionist supply-side policies","Policies in which the government actively invests or intervenes to raise potential output, e.g. education, healthcare, infrastructure, R&D and industrial policy."],["Privatisation","The transfer of ownership of a firm or industry from the public sector to the private sector."],["Deregulation","The removal of rules and regulations, to increase competition and reduce costs."],["Labour market flexibility","The ease with which employers can hire, fire and change working conditions, and with which wages adjust."],["Industrial policy","Government policies to support particular industries, e.g. subsidies, tax credits and targeted investment."]],"topic":"t3-7","html":"<p><strong>Goals<\/strong>: long-term growth (shift LRAS right), lower natural unemployment, lower inflationary pressure, improved international competitiveness, and higher productivity.<\/p>\n<div class=\"dslot\" data-d=\"lras-shift\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Market-based<\/th><th>Interventionist<\/th><\/tr><\/thead><tbody><tr><td><strong>Competition policy<\/strong>: anti-monopoly law, deregulation of markets (airlines, telecoms)<\/td><td><strong>Investment in human capital<\/strong>: education, training, apprenticeships, healthcare<\/td><\/tr><tr><td><strong>Privatisation<\/strong> (UK 1980s: BT, British Gas; airport and rail privatisations elsewhere)<\/td><td><strong>Investment in infrastructure<\/strong>: transport, broadband, energy (China's high-speed rail; India's highways)<\/td><\/tr><tr><td><strong>Labour market reforms<\/strong>: weaker union power, lower or no minimum wage, cuts in unemployment benefits, easier hiring and firing<\/td><td><strong>Investment in R&amp;D and new technology<\/strong>: grants, tax credits, research funding<\/td><\/tr><tr><td><strong>Incentive-related tax cuts<\/strong>: lower income tax (work incentives), lower corporation tax (investment)<\/td><td><strong>Industrial policies<\/strong>: support for strategic sectors (US CHIPS and Science Act 2022, Inflation Reduction Act 2022; EU Green Deal Industrial Plan)<\/td><\/tr><tr><td><strong>Trade liberalisation<\/strong>: lower tariffs, more competition<\/td><td><strong>Labour market policies<\/strong>: job centres, retraining, childcare to raise participation<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Essays often ask you to compare the two types. Remember private firms also invest to raise capacity because of the profit incentive; supply-side policy is not only government's job.<\/p><\/div>","text":"Goals : long-term growth (shift LRAS right), lower natural unemployment, lower inflationary pressure, improved international competitiveness, and higher productivity. Market-based Interventionist Competition policy : anti-monopoly law, deregulation of markets (airlines, telecoms) Investment in human capital : education, training, apprenticeships, healthcare Privatisation (UK 1980s: BT, British Gas; airport and rail privatisations elsewhere) Investment in infrastructure : transport, broadband, energy (China's high-speed rail; India's highways) Labour market reforms : weaker union power, lower or no minimum wage, cuts in unemployment benefits, easier hiring and firing Investment in R&D and new technology : grants, tax credits, research funding Incentive-related tax cuts : lower income tax (work incentives), lower corporation tax (investment) Industrial policies : support for strategic sectors (US CHIPS and Science Act 2022, Inflation Reduction Act 2022; EU Green Deal Industrial Plan) Trade liberalisation : lower tariffs, more competition Labour market policies : job centres, retraining, childcare to raise participation Exam tip Essays often ask you to compare the two types. Remember private firms also invest to raise capacity because of the profit incentive; supply-side policy is not only government's job.","dias":["lras-shift"]},{"id":"e-supply-side-eval","title":"Effectiveness of supply-side policies","hl":false,"terms":[["Productivity gap","The difference in output per worker or per hour between countries or regions."]],"topic":"t3-7","html":"<h4>Demand-side effects of supply-side policies<\/h4>\n<p>Many supply-side policies also raise AD in the short run: infrastructure spending raises G; tax cuts raise C and I; education spending raises G. So they can shift both AD and LRAS.<\/p>\n<h4>Supply-side effects of fiscal policy<\/h4>\n<p>Capital spending on infrastructure, education and health raises potential output; tax incentives for investment raise the capital stock. The line between fiscal policy and supply-side policy is not sharp.<\/p>\n<div class=\"box eval\"><div class=\"box-h\">Evaluation<\/div><div class=\"evcols\"><div><h5>Strengths<\/h5><ul><li>Raise potential output: growth <strong>without<\/strong> inflation.<\/li><li>Lower the natural rate of unemployment; reduce structural unemployment.<\/li><li>Improve international competitiveness and the current account in the long run.<\/li><li>Market-based policies often have low direct cost.<\/li><\/ul><\/div><div><h5>Weaknesses<\/h5><ul><li><strong>Long time lags<\/strong>: education and infrastructure take years to pay off.<\/li><li><strong>Costly<\/strong> for government budgets (interventionist).<\/li><li><strong>Equity concerns<\/strong>: tax cuts favour high earners; weaker labour protection increases inequality and job insecurity.<\/li><li><strong>Environmental costs<\/strong> of growth and deregulation.<\/li><li>Uncertain effects: tax cuts may not raise work effort (UK 2022 mini-budget showed market risks); privatised monopolies may still need regulation (UK water companies' sewage pollution and debt).<\/li><li>Do not help in a recession caused by low AD.<\/li><\/ul><\/div><\/div><\/div>","text":"Demand-side effects of supply-side policies Many supply-side policies also raise AD in the short run: infrastructure spending raises G; tax cuts raise C and I; education spending raises G. So they can shift both AD and LRAS. Supply-side effects of fiscal policy Capital spending on infrastructure, education and health raises potential output; tax incentives for investment raise the capital stock. The line between fiscal policy and supply-side policy is not sharp. Evaluation Strengths Raise potential output: growth without inflation. Lower the natural rate of unemployment; reduce structural unemployment. Improve international competitiveness and the current account in the long run. Market-based policies often have low direct cost. Weaknesses Long time lags : education and infrastructure take years to pay off. Costly for government budgets (interventionist). Equity concerns : tax cuts favour high earners; weaker labour protection increases inequality and job insecurity. Environmental costs of growth and deregulation. Uncertain effects: tax cuts may not raise work effort (UK 2022 mini-budget showed market risks); privatised monopolies may still need regulation (UK water companies' sewage pollution and debt). Do not help in a recession caused by low AD.","dias":[]}]}]},{"id":"u4","title":"The global economy","blurb":"Trade and protection, integration, exchange rates and the balance of payments, then sustainable development, its measurement, barriers and strategies.","topics":[{"id":"t4-1","num":"4.1","title":"Benefits of international trade","level":"SL","blurb":"Why countries trade, gains from trade, and (HL) absolute and comparative advantage.","entries":[{"id":"e-trade-benefits","title":"The benefits of international trade","hl":false,"terms":[["International trade","The exchange of goods and services between countries."],["Free trade","International trade without government restrictions such as tariffs, quotas or subsidies."],["World price","The price at which a good is traded on world markets; a small country takes it as given."],["Globalisation","The growing integration and interdependence of the world's economies through trade, investment, migration, technology and culture."]],"topic":"t4-1","html":"<h4>Why countries trade<\/h4>\n<ul><li><strong>Lower prices and greater choice<\/strong> for consumers.<\/li><li><strong>Access to resources<\/strong> a country lacks (oil, rare earth metals, tropical fruit).<\/li><li><strong>Economies of scale<\/strong>: exporters sell to a world market, lowering average costs.<\/li><li><strong>Increased competition<\/strong>: domestic firms become more efficient, innovate and cut prices.<\/li><li><strong>Specialisation and efficiency<\/strong>: resources move to what each country does best (comparative advantage).<\/li><li><strong>Source of foreign exchange<\/strong> to buy imports and repay debt.<\/li><li><strong>Technology transfer and ideas<\/strong>; <strong>closer political ties<\/strong> (trade as a force for peace).<\/li><li><strong>Higher growth and employment<\/strong> in export industries.<\/li><\/ul>\n<div class=\"dslot\" data-d=\"free-trade\"><\/div>\n<p>When the world price is <strong>below<\/strong> the domestic price, the country imports: consumers gain more than domestic producers lose. When the world price is <strong>above<\/strong> the domestic price (e.g. Ukraine's grain), the country exports: domestic producers gain more than domestic consumers lose. Either way, <strong>social surplus rises<\/strong> with trade.<\/p>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>Free trade creates <strong>winners and losers<\/strong> within each country: consumers and exporters gain, import-competing firms and their workers lose. That is the starting point for evaluating protection.<\/p><\/div>","text":"Why countries trade Lower prices and greater choice for consumers. Access to resources a country lacks (oil, rare earth metals, tropical fruit). Economies of scale : exporters sell to a world market, lowering average costs. Increased competition : domestic firms become more efficient, innovate and cut prices. Specialisation and efficiency : resources move to what each country does best (comparative advantage). Source of foreign exchange to buy imports and repay debt. Technology transfer and ideas ; closer political ties (trade as a force for peace). Higher growth and employment in export industries. When the world price is below the domestic price, the country imports: consumers gain more than domestic producers lose. When the world price is above the domestic price (e.g. Ukraine's grain), the country exports: domestic producers gain more than domestic consumers lose. Either way, social surplus rises with trade. Exam tip Free trade creates winners and losers within each country: consumers and exporters gain, import-competing firms and their workers lose. That is the starting point for evaluating protection.","dias":["free-trade"]},{"id":"e-comparative-advantage","title":"Absolute and comparative advantage","hl":true,"terms":[["Absolute advantage","When a country can produce more of a good than another country with the same resources (or the same output with fewer resources)."],["Comparative advantage","When a country can produce a good at a lower opportunity cost than another country."],["Specialisation","Concentrating production on a narrow range of goods in which a country (or person) has a comparative advantage."],["Terms of trade (in comparative advantage)","The rate at which one good is exchanged for another in trade between two countries."]],"topic":"t4-1","html":"<p><strong>Ricardo (1817)<\/strong>: even if one country is better at producing everything (absolute advantage in both goods), both gain if each specialises in the good with the <strong>lower opportunity cost<\/strong> and trades.<\/p>\n<div class=\"box calc\"><div class=\"box-h\">Worked example: Comparative advantage from a table<\/div><div class=\"tbl\"><table><thead><tr><th><\/th><th>T-shirts (per worker)<\/th><th>Computer chips (per worker)<\/th><\/tr><\/thead><tbody><tr><td>Country A<\/td><td>40<\/td><td>10<\/td><\/tr><tr><td>Country B<\/td><td>20<\/td><td>20<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Absolute advantage<\/strong>: A in T-shirts (40 &gt; 20); B in chips (20 &gt; 10). <strong>Opportunity costs<\/strong>: in A, 1 chip costs 4 T-shirts, 1 T-shirt costs 0.25 chips. In B, 1 chip costs 1 T-shirt, 1 T-shirt costs 1 chip. A has the lower opportunity cost of T-shirts (0.25 &lt; 1) → <strong>A specialises in T-shirts<\/strong>. B has the lower opportunity cost of chips (1 &lt; 4) → <strong>B specialises in chips<\/strong>. Any trading rate between 1 and 4 T-shirts per chip benefits both.<\/p><\/div>\n<div class=\"dslot\" data-d=\"comp-adv\"><\/div>\n<p>Each country's straight-line PPC shows its constant opportunity cost; the slopes differ, so both can consume outside their own PPC after specialising and trading.<\/p>\n<h4>Sources of comparative advantage<\/h4>\n<p>Factor endowments (land, climate, natural resources, labour), the quality of human capital, technology, capital intensity, institutions and infrastructure. Comparative advantage can change over time (South Korea moved from textiles to electronics).<\/p>\n<h4>Limitations of the theory<\/h4>\n<ul><li>Assumes <strong>constant costs<\/strong>, no transport costs and no trade barriers.<\/li><li>Assumes <strong>perfect factor mobility<\/strong> within a country: in reality, workers in shrinking industries become structurally unemployed.<\/li><li>Ignores <strong>economies of scale<\/strong>, quality and product differentiation.<\/li><li><strong>Over-specialisation<\/strong> creates risk (dependence on one commodity whose price is volatile).<\/li><li>Static: developing countries may never build higher-value industries if they stay specialised in primary goods.<\/li><li>Assumes full employment and that gains are shared fairly.<\/li><\/ul>","text":"Ricardo (1817) : even if one country is better at producing everything (absolute advantage in both goods), both gain if each specialises in the good with the lower opportunity cost and trades. Worked example: Comparative advantage from a table T-shirts (per worker) Computer chips (per worker) Country A 40 10 Country B 20 20 Absolute advantage : A in T-shirts (40 > 20); B in chips (20 > 10). Opportunity costs : in A, 1 chip costs 4 T-shirts, 1 T-shirt costs 0.25 chips. In B, 1 chip costs 1 T-shirt, 1 T-shirt costs 1 chip. A has the lower opportunity cost of T-shirts (0.25 < 1) → A specialises in T-shirts . B has the lower opportunity cost of chips (1 < 4) → B specialises in chips . Any trading rate between 1 and 4 T-shirts per chip benefits both. Each country's straight-line PPC shows its constant opportunity cost; the slopes differ, so both can consume outside their own PPC after specialising and trading. Sources of comparative advantage Factor endowments (land, climate, natural resources, labour), the quality of human capital, technology, capital intensity, institutions and infrastructure. Comparative advantage can change over time (South Korea moved from textiles to electronics). Limitations of the theory Assumes constant costs , no transport costs and no trade barriers. Assumes perfect factor mobility within a country: in reality, workers in shrinking industries become structurally unemployed. Ignores economies of scale , quality and product differentiation. Over-specialisation creates risk (dependence on one commodity whose price is volatile). Static: developing countries may never build higher-value industries if they stay specialised in primary goods. Assumes full employment and that gains are shared fairly.","dias":["comp-adv"]}]},{"id":"t4-2","num":"4.2","title":"Types of trade protection","level":"SL","blurb":"Tariffs, quotas, production and export subsidies, and administrative barriers, with HL welfare calculations.","entries":[{"id":"e-tariffs","title":"Tariffs","hl":false,"terms":[["Trade protection (protectionism)","Government measures that restrict free trade to protect domestic producers from foreign competition."],["Tariff","A tax on imported goods."]],"topic":"t4-2","html":"<div class=\"dslot\" data-d=\"tariff\"><\/div>\n<div class=\"tbl\"><table><thead><tr><th>Stakeholder<\/th><th>Effect of a tariff<\/th><\/tr><\/thead><tbody><tr><td>Domestic consumers<\/td><td>Pay a higher price, consume less: lose consumer surplus<\/td><\/tr><tr><td>Domestic producers<\/td><td>Higher price, sell more: gain producer surplus; jobs protected<\/td><\/tr><tr><td>Government<\/td><td>Gains tariff revenue = tariff × imports<\/td><\/tr><tr><td>Foreign producers<\/td><td>Sell less: lose revenue; may face unemployment<\/td><\/tr><tr><td>Society / world<\/td><td>Welfare losses: inefficient domestic production replaces cheaper imports; lost consumption<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"box hlbox\"><div class=\"box-h\">HL only · Tariff calculation<\/div><p>World price $6/kg; a 20% tariff → price rises to $7.20/kg. Before: domestic supply 20m kg, demand 80m kg, imports 60m kg. After: domestic supply 30m kg, demand 70m kg, imports 40m kg.<\/p>\n<ul><li>Tariff revenue = 1.20 × 40m = <strong>$48m<\/strong><\/li><li>Fall in imports = 60m − 40m = <strong>20m kg<\/strong><\/li><li>Increase in domestic producer revenue = (7.20 × 30m) − (6 × 20m) = 216 − 120 = <strong>$96m<\/strong><\/li><li>Change in consumer expenditure = (7.20 × 70m) − (6 × 80m) = 504 − 480 = <strong>+$24m<\/strong><\/li><li>Welfare loss = ½ × 1.20 × (30m − 20m) + ½ × 1.20 × (80m − 70m) = 6 + 6 = <strong>$12m<\/strong><\/li><\/ul><\/div>\n<div class=\"box ex\"><div class=\"box-h\">Real-world example: Tariffs in practice<\/div><p>US tariffs on Chinese goods (2018–19) and on steel and aluminium; China retaliated on soybeans, hurting US farmers (who then received subsidies). In 2025 the US raised tariffs on most trading partners, triggering retaliation and trade negotiations. Studies of the 2018 tariffs found US consumers and firms bore most of the cost.<\/p><\/div>\n<div class=\"box tip\"><div class=\"box-h\">Exam tip<\/div><p>When evaluating a tariff, compare the <strong>jobs protected<\/strong> in the targeted industry with the <strong>jobs lost<\/strong> in industries that use the product as an input, and the cost per job saved.<\/p><\/div>","text":"Stakeholder Effect of a tariff Domestic consumers Pay a higher price, consume less: lose consumer surplus Domestic producers Higher price, sell more: gain producer surplus; jobs protected Government Gains tariff revenue = tariff × imports Foreign producers Sell less: lose revenue; may face unemployment Society / world Welfare losses: inefficient domestic production replaces cheaper imports; lost consumption HL only · Tariff calculation World price $6/kg; a 20% tariff → price rises to $7.20/kg. Before: domestic supply 20m kg, demand 80m kg, imports 60m kg. After: domestic supply 30m kg, demand 70m kg, imports 40m kg. Tariff revenue = 1.20 × 40m = $48m Fall in imports = 60m − 40m = 20m kg Increase in domestic producer revenue = (7.20 × 30m) − (6 × 20m) = 216 − 120 = $96m Change in consumer expenditure = (7.20 × 70m) − (6 × 80m) = 504 − 480 = +$24m Welfare loss = ½ × 1.20 × (30m − 20m) + ½ × 1.20 × (80m − 70m) = 6 + 6 = $12m Real-world example: Tariffs in practice US tariffs on Chinese goods (2018–19) and on steel and aluminium; China retaliated on soybeans, hurting US farmers (who then received subsidies). In 2025 the US raised tariffs on most trading partners, triggering retaliation and trade negotiations. Studies of the 2018 tariffs found US consumers and firms bore most of the cost. Exam tip When evaluating a tariff, compare the jobs protected in the targeted industry with the jobs lost in industries that use the product as an input, and the cost per job saved.","dias":["tariff"]},{"id":"e-quotas","title":"Import quotas","hl":false,"terms":[["Quo
