<title>Econ Lock-In</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('econ-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/*CSS*/</style>
<div class="topbar" id="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Open contents" aria-expanded="false" aria-controls="rail"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
  <a class="tb-brand" href="#home">Econ Lock-In</a>
  <button class="iconbtn" id="searchBtn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Contents">
    <a class="brand" href="#home"><b>Econ Lock-In</b><span>IB Economics · Higher Level</span></a>
    <div class="search">
      <label class="vh" for="q">Search the guide</label>
      <input id="q" type="search" placeholder="Search terms, topics, diagrams…" autocomplete="off" spellcheck="false">
      <div class="results" id="results" hidden></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <div class="seg" role="group" aria-label="Course level">
        <button id="lvHL" aria-pressed="true">HL view</button><button id="lvSL" aria-pressed="false">SL view</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button data-th="light" aria-pressed="false">Light</button><button data-th="auto" aria-pressed="true">Auto</button><button data-th="dark" aria-pressed="false">Dark</button>
      </div>
      <p class="sync" id="syncNote">Progress saves in this browser.</p>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1"><div id="view" class="view"></div></main>
</div>
<button class="fab" id="mfab" aria-expanded="false" aria-controls="mpanel">Missing? <span id="mcount" class="mcount"></span></button>
<div class="mpanel" id="mpanel" hidden role="dialog" aria-labelledby="mpT">
  <h2 id="mpT">Something missing or wrong?</h2>
  <p class="mctx">Reading: <b id="mctxT"></b></p>
  <div class="kinds" role="group" aria-label="Kind of note">
    <button data-kind="missing" aria-pressed="false">Missing topic</button><button data-kind="unclear" aria-pressed="false">Unclear</button><button data-kind="error" aria-pressed="false">Looks wrong</button><button data-kind="diagram" aria-pressed="false">Diagram</button>
  </div>
  <label class="vh" for="mtext">Your note</label>
  <textarea id="mtext" rows="4" placeholder="e.g. Add a worked example on the Marshall–Lerner condition"></textarea>
  <p class="mstat" id="mstat"></p>
  <div class="mrow"><a href="#missing" id="mlistLink">See the list</a><span class="sp"></span><button class="btn ghost" id="mcancel">Cancel</button><button class="btn" id="msave">Save note</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>/*APP*/</script>
